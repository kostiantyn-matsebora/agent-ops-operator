<title>Console Conversations</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --brand:#0d7d76;--brand-strong:#0a615c;--brand-soft:#d3ece9;--accent:#6b4bd6;--accent-soft:#e8e2fb;
  --success:#1f7a4d;--warning:#8f5400;--danger:#c5281c;--crit:#c5281c;--neutral:#6a7178;
  --surface:#fff;--surface-alt:#f3f5f6;--canvas:#eef1f2;--border:#d5dbdf;--border-strong:#9aa4ab;
  --text:#16191c;--subtle:#5c656d;--warn-soft:#fbefd9;--danger-soft:#f9e1e5;--ok-soft:#dcf1e5;--on-brand:#fff;--mine:#d8ece9;--sig:#e8edf5;--sig-edge:#8da2c4;--on-mine:#12302d;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#43c9bd;--brand-strong:#7fded5;--brand-soft:#123b39;--accent:#a996f5;--accent-soft:#2b2447;
  --success:#55c98a;--warning:#e0a63c;--danger:#f25f5c;--crit:#d92d20;--neutral:#9aa4ab;
  --surface:#1b1f22;--surface-alt:#23282c;--canvas:#14171a;--border:#363d42;--border-strong:#5c666d;
  --text:#e8ecee;--subtle:#a5b0b7;--warn-soft:#352a12;--danger-soft:#3d1a22;--ok-soft:#163a28;--on-brand:#0b1f1d;--mine:#1d3f3d;--sig:#1f2733;--sig-edge:#5c7396;--on-mine:#e1efed;color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#43c9bd;--brand-strong:#7fded5;--brand-soft:#123b39;--accent:#a996f5;--accent-soft:#2b2447;
  --success:#55c98a;--warning:#e0a63c;--danger:#f25f5c;--crit:#d92d20;--neutral:#9aa4ab;
  --surface:#1b1f22;--surface-alt:#23282c;--canvas:#14171a;--border:#363d42;--border-strong:#5c666d;
  --text:#e8ecee;--subtle:#a5b0b7;--warn-soft:#352a12;--danger-soft:#3d1a22;--ok-soft:#163a28;--on-brand:#0b1f1d;--mine:#1d3f3d;--sig:#1f2733;--sig-edge:#5c7396;--on-mine:#e1efed;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--text);font:400 14px/1.45 var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
code{font-family:var(--mono);font-size:inherit;background:color-mix(in srgb,var(--text) 7%,transparent);padding:0 .25em;border-radius:4px;overflow-wrap:anywhere}
.app{height:100%;display:flex;flex-direction:column;padding-block:12px}
.top{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.brand{font-weight:600;font-size:16px}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--ok-soft);color:var(--success);white-space:nowrap}
.chip[hidden]{display:none}.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.live i{animation:pulse 2s infinite}.chip.off{background:var(--warn-soft);color:var(--warning)}.chip.flight{background:var(--brand-soft);color:var(--brand-strong)}
.btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--text);border-radius:6px;padding:5px 12px;min-height:32px}
.btn:hover{background:var(--surface-alt)}.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,var(--border))}.btn:disabled{opacity:.5;cursor:default}
.btn.link{border:0;background:none;color:var(--brand-strong);padding:0 4px;min-height:0;font-weight:600}
.spin{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;display:inline-block}
.num{font-variant-numeric:tabular-nums}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:var(--inboxw,240px) 12px var(--listw,340px) 12px minmax(0,1fr);gap:0}
.pane{background:var(--surface);border:1px solid var(--border);border-radius:10px;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.side{padding:10px 8px;overflow-y:auto}
.side h3{margin:12px 8px 4px;font-size:12px;font-weight:600;color:var(--subtle);letter-spacing:.06em;text-transform:uppercase}.side h3:first-child{margin-top:2px}
.nv{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;border-radius:6px;padding:7px 10px}
.nv:hover{background:var(--surface-alt)}.nv.on{background:var(--brand-soft);color:var(--brand-strong);font-weight:600}
.nv b{font-size:12px;font-weight:600;color:var(--subtle)}.nv.on b{color:inherit}
.ph{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border)}
.ph h2{margin:0;font-size:16px;font-weight:600;flex:1}
.start,.tools{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap}
.start input,.compose textarea,.q input{flex:1;min-width:0;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);border-radius:6px;padding:6px 10px;font:inherit;min-height:32px}
.tools label{display:flex;gap:6px;align-items:center;color:var(--subtle)}
.chips{display:none;gap:6px;padding:8px 14px;overflow-x:auto;border-bottom:1px solid var(--border)}
.chips button{flex:none;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:600;color:var(--subtle)}
.chips button.on{background:var(--brand-soft);border-color:transparent;color:var(--brand-strong)}
.rows{overflow-y:auto;flex:1;position:relative}
.bulk{display:none;gap:8px;align-items:center;padding:8px 14px;background:var(--surface-alt);border-bottom:1px solid var(--border);flex-wrap:wrap}.bulk.on{display:flex}
.track{height:6px;border-radius:3px;background:var(--border);overflow:hidden;flex-basis:100%}.track i{display:block;height:100%;width:0;background:var(--brand);transition:width .5s}
.track.warn i{background:var(--warning)}
.row{position:relative;display:grid;grid-template-columns:auto 36px minmax(0,1fr) auto;gap:0 10px;padding:10px 14px 10px 10px;border-bottom:1px solid var(--border);cursor:pointer;overflow:hidden;transition:background .6s}
.row:hover{background:var(--surface-alt)}.row.sel{background:var(--brand-soft)}.row.mem{padding-left:34px}.row.flash{background:var(--brand-soft);transition:none}
.row.closed .name,.row.closed .l2{color:var(--subtle)}
.row.busy::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:40%;background:linear-gradient(90deg,transparent,var(--brand),transparent);animation:slide 1.2s linear infinite}
.row.fail{box-shadow:inset 3px 0 0 var(--danger)}
.exp{width:18px;border:0;background:none;color:var(--subtle);padding:0;align-self:start;margin-top:8px;min-height:0}
.av{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);position:relative;font-size:16px}
.av.signal{background:var(--danger-soft);color:var(--danger)}.av.agent{background:var(--brand-soft);color:var(--brand-strong)}.av.you{background:var(--accent);color:#fff;font-weight:600;font-size:14px}.av svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}.chev{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
.av .d{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;border:2px solid var(--surface);background:var(--neutral)}
.av .d.Idle{background:var(--success)}.av .d.Working,.av .d.Running{background:var(--brand)}.av .d.Pending,.av .d.Starting,.av .d.Queued{background:var(--warning)}.av .d.needs{background:var(--warning)}
.l1{display:flex;gap:8px;justify-content:space-between;min-width:0}.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:12px;color:var(--subtle);flex:none}.l2{color:var(--subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l3{font-size:12px;color:var(--subtle);display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center}
.st{grid-column:4;grid-row:1/4;display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:150px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;background:var(--surface-alt);color:var(--subtle);white-space:nowrap}
.pill.working{background:var(--brand-soft);color:var(--brand-strong)}.pill.warn{background:var(--warn-soft);color:var(--warning)}.pill.bad{background:var(--danger-soft);color:var(--danger)}.pill.ok{background:var(--ok-soft);color:var(--success)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.errtxt{color:var(--danger);font-size:12px;text-align:right}
.strip{display:inline-flex;gap:3px}.strip s{display:block;width:18px;height:4px;border-radius:2px;background:var(--border);text-decoration:none}.strip s.on{background:var(--brand)}.strip s.cur{background:var(--brand);animation:pulse 1.4s infinite}
.menu{position:absolute;z-index:6;right:12px;background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:4px;min-width:170px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px}.menu button:hover{background:var(--surface-alt)}
.kb{border:0;background:none;color:var(--subtle);padding:0 6px;min-height:0;font-size:16px;font-weight:600}
/* thread */
.th{padding:10px 14px 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.th .back{display:none;border:0;background:none;font-size:16px;font-weight:600;padding:0 6px}
.th h2{margin:0;font-size:16px;font-weight:600;min-width:0;flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .crumb{font-size:12px;color:var(--subtle);flex-basis:100%}
.th .acts{display:flex;gap:8px;align-items:center;margin-left:auto}
.brief{padding:0 14px 8px;color:var(--subtle)}
.meta{padding:0 14px 8px;display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12px;color:var(--subtle)}
.tabs{display:flex;gap:6px;padding:6px 14px 10px;border-bottom:1px solid var(--border);overflow-x:auto}
.tabs button{flex:none;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 14px;color:var(--subtle)}
.tabs button.on{background:var(--brand-soft);border-color:transparent;color:var(--brand-strong);font-weight:600}
.body{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;position:relative}
.dv{display:flex;align-items:center;gap:10px;color:var(--subtle);font-size:12px}.dv::before,.dv::after{content:"";height:1px;background:var(--border);flex:1}
.dv.esc{color:var(--warning);font-weight:600}.dv.esc::before,.dv.esc::after{background:color-mix(in srgb,var(--warning) 50%,var(--border))}
.dv .new{background:var(--danger);color:#fff;border-radius:999px;padding:0 8px;font-weight:600}
.opened{font-size:12px;color:var(--subtle)}
.ent{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px}
.ent .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.ent .who{font-weight:600}.ent .at{font-size:12px;color:var(--subtle)}
.ent .ttl{font-weight:600;font-size:15px;line-height:1.35;margin:2px 0 4px;text-wrap:balance}
.sec{margin-top:8px}.sec>b{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);margin-bottom:2px}
.sec ul{margin:0;padding-left:18px}.sec p{margin:0}
.q{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warning) 35%,var(--border));border-radius:12px;padding:12px 14px}
.opt{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:6px 0;flex-wrap:wrap}.opt>span{flex:1;min-width:200px}
.fold{border:0;background:none;color:var(--subtle);padding:0;display:flex;gap:6px;align-items:center;min-height:0;margin-top:6px}
.fold .c{transition:transform .2s;display:inline-block}.fold.open .c{transform:rotate(90deg)}
.sig .sev{margin-left:6px}.tbl2{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12px;color:var(--subtle);margin-top:4px}
.mrow{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface-alt);border-radius:8px;padding:6px 10px;margin-top:8px;flex-wrap:wrap}
.mrow:hover{border-color:var(--border-strong)}.mrow .n{font-weight:600;color:var(--accent)}.mrow .m{font-size:12px;color:var(--subtle);flex:1}
.ran{font-size:12px;color:var(--subtle);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.toollist{font-family:var(--mono);font-size:12px;color:var(--subtle);margin:4px 0 0;display:grid;gap:2px;grid-template-columns:1fr auto}
.msg{max-width:88%;padding:8px 12px;border-radius:12px;overflow-wrap:anywhere}
.msg.own{align-self:flex-end;background:var(--mine);color:var(--on-mine);border-bottom-right-radius:3px;transition:opacity .3s}.msg.own.pending{opacity:.6}
.msg small{display:block;font-size:12px;opacity:.85;margin-top:2px}
.ev{align-self:flex-start;font-family:var(--mono);font-size:12px;color:var(--subtle)}.ev::before{content:"▸ ";color:var(--brand)}
.wk{align-self:flex-start;display:flex;flex-direction:column;gap:6px;width:min(88%,360px);padding:10px 12px;border:1px dashed var(--border-strong);border-radius:12px}
.wk .l1x{display:flex;justify-content:space-between;font-weight:600;color:var(--brand-strong)}.wk .l2x{font-family:var(--mono);font-size:12px;color:var(--subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shimmer{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--border) 0,var(--brand) 50%,var(--border) 100%) 0/200% 100%;animation:shim 1.4s linear infinite}
.errbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:8px 12px}
.waiting{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warning) 35%,var(--border));border-radius:10px;padding:6px 12px;margin:0 14px 10px;color:var(--text)}
.waiting b{color:var(--warning)}
.compose{display:grid;grid-template-columns:1fr auto;gap:6px 8px;padding:10px 14px;border-top:1px solid var(--border)}
.compose textarea{resize:none;grid-column:1/3;min-height:64px}
.compose .h{grid-column:1;color:var(--subtle);font-size:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
kbd{font-family:var(--mono);border:1px solid var(--border-strong);border-radius:4px;padding:0 6px;font-size:12px}
.foot{padding:10px 14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;color:var(--subtle)}
.card{border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.card h4{margin:0 0 6px;font-size:14px;font-weight:600}
.tbl{width:100%;border-collapse:collapse}.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--subtle);padding:6px 8px;border-bottom:1px solid var(--border)}.tbl td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 12px}.kv dt{color:var(--subtle)}.kv dd{margin:0}
.pre{font-family:var(--mono);white-space:pre-wrap;margin:0;overflow-wrap:anywhere}
.result{font-family:var(--mono);white-space:pre-wrap;background:var(--surface-alt);border-radius:8px;padding:10px;overflow-wrap:anywhere}
.gwrap{border:1px solid var(--border);border-radius:10px;overflow:auto;background:var(--surface-alt)}
.slider{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.slider input{flex:1;min-width:160px}

@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.35}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}@keyframes shim{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:1180px){.cols{grid-template-columns:var(--listw,340px) 12px minmax(0,1fr)}.spl1{display:none}.chips{display:flex}}
@media (max-width:900px){
  body{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}.app{padding-block:8px}
  .top .hide-s,.top .brand,.top .sp{display:none}.top{flex-wrap:wrap;padding:6px 8px}.top .btn{white-space:nowrap;padding:5px 10px}.top #resetBtn{margin-left:auto}.meta,.brief{display:none}.th .acts .btn{min-width:0}
  .cols{grid-template-columns:minmax(0,1fr)}.spl{display:none}.scrim[hidden]{display:none}.cols[data-view="list"] .tp{display:none}.cols[data-view="thread"] .lp{display:none}
  .th .back{display:inline-block}
  .btn,.start input,.compose textarea,.tabs button,.chips button,.th .back,.mrow,.nv,.fold,.kb,.exp,.menu button{min-height:44px}
  .exp,.kb{min-width:44px}.th .acts{flex-basis:100%;margin-left:0}.th .acts .btn{flex:1}
  .msg{max-width:94%}.ent{grid-template-columns:28px minmax(0,1fr);gap:8px}.av{width:28px;height:28px;font-size:14px}
  .row{grid-template-columns:auto 36px minmax(0,1fr) auto}
}

.it{display:contents}.enter>*{animation:enter .3s}
.rm{font-size:12px;color:var(--subtle);display:flex;gap:6px;align-items:center;padding-left:14px;position:relative}.rm::before{content:"";width:10px;height:1px;background:var(--border-strong);position:absolute;left:0}
.lnk{border:0;background:none;color:var(--brand-strong);padding:0;min-height:0;text-decoration:underline dotted;font-size:12px}
.newdv{display:flex;align-items:center;gap:10px;color:var(--brand-strong);font-size:12px;font-weight:600}.newdv::before,.newdv::after{content:"";height:1px;background:var(--brand);flex:1}
.lp{position:relative}
.menu{position:absolute;z-index:8;background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:4px;min-width:180px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 0}.menu .dg{color:var(--danger)}
.ovl{position:fixed;inset:0;background:rgba(10,14,16,.55);display:grid;place-items:center;z-index:20;padding:16px}.ovl[hidden]{display:none}
.dlg{background:var(--surface);color:var(--text);border-radius:12px;width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--border)}
.dlg.sm{width:min(460px,100%)}.dlg h3{margin:0;font-size:16px;font-weight:600;flex:1}
.dh{display:flex;align-items:center;gap:8px}.xb{border:0;background:var(--surface-alt);border-radius:6px;width:44px;height:36px;font-size:16px}
.fg>b{display:block;font-weight:600;margin-bottom:6px}
.dest{display:flex;flex-direction:column;gap:6px}
.card2{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:44px}
.card2[aria-checked="true"]{border-color:var(--brand);background:var(--brand-soft)}
.card2 .t{flex:1;min-width:0}.card2 .t b{display:block}.card2 .t span{font-size:12px;color:var(--subtle)}
.tag{font-size:12px;border:1px solid var(--border-strong);border-radius:999px;padding:0 8px;color:var(--subtle)}.tag.co{border-color:var(--accent);color:var(--accent)}
.note{font-size:12px;color:var(--subtle)}
.dlg textarea,.dlg input[type=text]{width:100%;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);border-radius:6px;padding:8px 10px;font:inherit}
.dlg textarea{min-height:110px;resize:vertical}
.dfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ok{background:var(--ok-soft);color:var(--success);border-radius:8px;padding:8px 12px;display:flex;gap:10px;justify-content:space-between;align-items:center}
.simp{position:absolute;right:12px;top:54px;z-index:9;background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:8px;display:grid;gap:6px;min-width:190px}.simp[hidden]{display:none}

ator\nNamespace\nagent-ops\nHealth\nreports none\nConditions\nreports none\nCreated\n11/14/2026, 10:55:26 AM (3h ago)\nLabels\napp.kubernetes.io/managed-by=Helm\napp.kubernetes.io/name=agentops-coordinator\nhelm.sh/chart=agent-ops-operator-18.0.1\nAnnotations\nmeta.helm.sh/release-name=agent-ops\nmeta.helm.sh/release-namespace=agent-ops\nUID\n13acd41d-83cb-4686-bfd4-69021f5f4fd0\nResource version\n1705973\nConditions\nThis kind reports no conditions\nNothing writes conditions here, so there is nothing to wait for.\nUsed by\ncoordinators/agentops-coordinator (profileRef)","yaml":"1\napiVersion: agentops.dev/v1alpha1\n2\nkind: AgentProfile\n3\nmetadata:\n4\n  annotations:\n5\n    meta.helm.sh/release-name: agent-ops\n6\n    meta.helm.sh/release-namespace: agent-ops\n7\n  creationTimestamp: \"2026-11-14T08:55:26Z\"\n8\n  labels:\n9\n    app.kubernetes.io/managed-by: Helm\n10\n    app.kubernetes.io/name: agentops-coordinator\n11\n    helm.sh/chart: agent-ops-operator-18.0.1\n12\n  name: agentops-coordinator\n13\n  namespace: agent-ops\n14\n  resourceVersion: \"1705973\"\n15\n  uid: 13acd41d-83cb-4686-bfd4-69021f5f4fd0\n16\nspec:\n17\n  maxTurns: 20\n18\n  outputFormat: blocks\n19\n  systemPrompt: |-\n20\n    You are the coordinating agent for this install — an orchestrator, not a\n21\n    specialist. A conversation of yours opens when a signal arrives on a\n22\n    source you claim, or when a person addresses you by name with a question\n23\n    or an instruction. You produce no domain evidence yourself: every fact\n24\n    you report comes from what arrived or from an invoked agent's report.\n25\n    \n26\n    YOUR TOOLS ARE THE AGENTS, AND THE FIRST TOOL CALL OF EVERY CONVERSATION\n27\n    IS `list_agents` — before any command, any file, any view of what is\n28\n    possible. What this install can do is that roster's fact, never your\n29\n    toolbox's. Each entry describes what the agent is, what it can do, what\n30\n    it cannot, and what to hand it. Anything a listed agent can do, you can\n31\n    have done by invoking it. If `list_agents` is not among your tools,\n32\n    your coordination path is broken — report exactly that, never that the\n33\n    install has no agents.\n34\n    \n35\n    Your runtime may also hand you generic utilities — a shell, scheduling,\n36\n    web access. They are housekeeping around delegation, never the way to\n37\n    evidence. Finding that they reach no domain system is expected and\n38\n    proves nothing: reaching systems is what the roster is for. So\n39\n    never answer that you have no tools or cannot act — noticing a missing\n40\n    tool, credential or checkout IS the signal to invoke the agent whose\n41\n    description covers what you lack.\n42\n    \n43\n    Work every input in three steps:\n44\n    \n45\n    1. Analyse. Read what arrived and state what would settle it: a\n46\n       question to answer, a cause to find, an action to take, or a\n47\n       sequence — find the cause first, then act on it.\n48\n    2. Delegate. Choose from `list_agents` the agent whose purpose covers\n49\n       each step, and `invoke` it with a specific task in plain words: the\n50\n       object, its namespace or location, what to do or find out, and what\n51\n       to report back. A matter that needs two agents is two invokes, in\n52\n       the order the result of one informs the next.\n53\n    3. Decide. Each result reaches you later as an ordinary input. Read\n54\n       it, then answer the person from it, invoke the next agent, or\n55\n       `escalate` to a person when the matter needs one.\n56\n    \n57\n    This loop never expires. A follow-up twenty inputs in is delegated\n58\n    exactly as the first input was — when deciding who answers it, re-read\n59\n    the roster, never your own recent attempts.\n60\n    \n61\n    Authorisation follows from WHO asked for an action:\n62\n    \n63\n    - A person's direct instruction to act — \"restart the sonarr pod\",\n64\n      \"scale the api to three\" — IS the authorisation. Hand it to the\n65\n      acting agent as the task it is. Do not ask the person to confirm what\n66\n      they just told you to do, and do not reroute an instruction to an\n67\n      observing agent — only a question goes there.\n68\n    - A change YOU conclude is worth making — from an investigation you\n69\n      ran, or from a signal nobody asked about — is proposed, not made.\n70\n      State it in your own words and wait. Only after a person says yes do\n71\n      you write the acting task, and it then says exactly what was approved\n72\n      and nothing more.\n73\n    \n74\n    An acting agent keeps its own judgement about what is safe to change,\n75\n    and may describe a change and stop instead of making it. When it does,\n76\n    relay that to the person as the answer — it is the agent's caution, not\n77\n    a refusal of yours.\n78\n    \n79\n    An observing agent running out of evidence is not a dead end. If it\n80\n    reports it could not find something because a tool or capability it\n81\n    lacks would be needed — not because there is nothing to find — hand the\n82\n    same task to that domain's acting counterpart before you conclude or\n83\n    escalate to a person. Reading more deeply through an acting agent is\n84\n    not a change and needs no approval, even though that agent could also\n85\n    write.\n86\n    \n87\n    You may tell a person something cannot be checked or done in only two\n88\n    cases: the covering agent tried and reported why it failed, or no\n89\n    roster entry covers it — then say which kind of agent\n90\n    this install does not list, never that nothing can be done.\n91\n    Your own lack of access is never evidence. Before any answer saying\n92\n    impossible, unknown or not answerable live, check the conversation: no\n93\n    agent invoked on the matter means the answer is premature — go back to\n94\n    the roster."},"/config/agentprofiles/k8s-engineer":{"dls":[[]],"text":"Configuration\nagentprofiles\nk8s-engineer\nk8s-engineer\nreports none\nOverview\nYAML\nMetadata\nName\nk8s-engineer\nNamespace\nagent-ops\nHealth\nreports none\nConditions\nreports none\nCreated\n11/14/2026, 10:55:26 AM (3h ago)\nLabels\napp.kubernetes.io/managed-by=Helm\napp.kubernetes.io/name=agentops-kubernetes\nhelm.sh/chart=kubernetes-0.4.1\nAnnotations\nmeta.helm.sh/release-name=agent-ops\nmeta.helm.sh/release-namespace=agent-ops\nUID\n3f27c9bc-2228-4075-a932-e3f4fd0d46b8\nResource version\n1705942\nConditions\nThis kind reports no conditions\nNothing writes conditions here, so there is nothing to wait for.\nUsed by\npipelines/\nk8s-observe-pipeline\n (profileRef)","yaml":"1\napiVersion: agentops.dev/v1alpha1\n2\nkind: AgentProfile\n3\nmetadata:\n4\n  annotations:\n5\n    meta.helm.sh/release-name: agent-ops\n6\n    meta.helm.sh/release-namespace: agent-ops\n7\n  creationTimestamp: \"2026-11-14T08:55:26Z\"\n8\n  labels:\n9\n    app.kubernetes.io/managed-by: Helm\n10\n    app.kubernetes.io/name: agentops-kubernetes\n11\n    helm.sh/chart: kubernetes-0.4.1\n12\n  name: k8s-engineer\n13\n  namespace: agent-ops\n14\n  resourceVersion: \"1705942\"\n15\n  uid: 3f27c9bc-2228-4075-a932-e3f4fd0d46b8\n16\nspec:\n17\n  maxTurns: 40\n18\n  outputFormat: blocks\n19\n  systemPrompt: |-\n20\n    You are a Kubernetes site reliability engineer operating a live cluster.\n21\n    \n22\n    The mcp__kubernetes__* tools are how you reach the cluster. The runtime\n23\n    image ships no Kubernetes CLI of its own — if a tool for something is\n24\n    not in your allowlist, say so plainly instead of trying to improvise\n25\n    one. Whether `pods_exec`/`pods_run` are in that allowlist depends on\n26\n    this install, stated below.\n27\n    \n28\n    Those tools return kubectl-shaped tables and cannot filter server-side, so\n29\n    ask for the narrowest scope you can (a namespace rather than the cluster)\n30\n    and read what comes back rather than fetching everything twice.\n31\n    \n32\n    When a cluster event opens this conversation, investigate before you act: identify\n33\n    the failing object, read its recent events and logs, and state the likely\n34\n    cause. Make a change only when you are confident it is correct and its blast\n35\n    radius is bounded, and say plainly what you changed. Prefer the narrowest\n36\n    action that fixes the problem.\n37\n    \n38\n    Never delete or mutate anything in kube-system, and never touch a resource\n39\n    you were not asked about and did not diagnose. If a fix is risky, ambiguous,\n40\n    or would affect the control plane, describe what you would do and stop.\n41\n    \n42\n    Answer briefly. Lead with the finding, then the evidence.\n43\n    \n44\n    This install allows pod execution: `pods_exec` and `pods_run` are real,\n45\n    not advertised-but-refused. When a workload has no dedicated API or MCP\n46\n    tool of its own — its own database, a config only its local CLI can\n47\n    read, a cache only reachable from inside the pod — exec into its pod and\n48\n    run that workload's own tooling (psql, sqlite3, a local curl) rather\n49\n    than reporting that nothing can be done. This is not improvising a tool\n50\n    you lack; it is the tool this install granted you for exactly this case.\n51\n    The same caution rules still apply: investigate before you act, and\n52\n    describe a risky or irreversible change instead of making it. The value\n53\n    that decides this is global.agentops.runtimeDefaults.allowPodExecution.\n54\n    \n55\n    If a thread is bound to this conversation and you judge the problem it is\n56\n    about to be resolved, you may end it yourself by replying with `/close` as\n57\n    your message — the same command a person uses to end a conversation. Only do\n58\n    this once you are confident: closing drops it from any further follow-up on\n59\n    this incident. If no thread is bound here, this instruction does nothing —\n60\n    leave ending the conversation to whatever invoked you.\n61\n    \n62\n    Your task names exactly what you may do. Asked to investigate or report,\n63\n    stay read-only — propose a fix, never perform it, even one you are certain\n64\n    is safe. Only a task that explicitly authorizes a specific change is your\n65\n    license to make it, and only that change, nothing broader it reminds you of\n66\n    along the way.\n67\n    \n68\n    If a thread is bound to this conversation, a reply there confirming it —\n69\n    \"yes\", \"do it\", \"go ahead\" — is that authorization. Do exactly what you\n70\n    described, once, and never ask twice.\n71\n    \n72\n    If no thread is bound, you have nobody to ask directly: describe what you\n73\n    would do and end your turn there. Whoever invoked you decides what happens\n74\n    next, and tells you so directly, as your next task, if they authorize it.\n75\n    Never read a later message as authorization unless it says so plainly."},"/config/agentprofiles/pulse-observer":{"dls":[[]],"text":"Configuration\nagentprofiles\npulse-observer\npulse-observer\nreports none\nOverview\nYAML\nMetadata\nName\npulse-observer\nNamespace\nagent-ops\nHealth\nreports none\nConditions\nreports none\nCreated\n11/14/2026, 10:55:26 AM (3h ago)\nLabels\napp.kubernetes.io/managed-by=Helm\napp.kubernetes.io/name=agentops-pulse\nhelm.sh/chart=pulse-0.2.0\nAnnotations\nmeta.helm.sh/release-name=agent-ops\nmeta.helm.sh/release-namespace=agent-ops\nUID\n31386cc5-2ec9-414c-9211-c2ff9371d66c\nResource version\n1705954\nConditions\nThis kind reports no conditions\nNothing writes conditions here, so there is nothing to wait for.\nUsed by\nNothing references this\nNo other object points at it.","yaml":"1\napiVersion: agentops.dev/v1alpha1\n2\nkind: AgentProfile\n3\nmetadata:\n4\n  annotations:\n5\n    meta.helm.sh/release-name: agent-ops\n6\n    meta.helm.sh/release-namespace: agent-ops\n7\n  creationTimestamp: \"2026-11-14T08:55:26Z\"\n8\n  labels:\n9\n    app.kubernetes.io/managed-by: Helm\n10\n    app.kubernetes.io/name: agentops-pulse\n11\n    helm.sh/chart: pulse-0.2.0\n12\n  name: pulse-observer\n13\n  namespace: agent-ops\n14\n  resourceVersion: \"1705954\"\n15\n  uid: 31386cc5-2ec9-414c-9211-c2ff9371d66c\n16\nspec:\n17\n  maxTurns: 30\n18\n  outputFormat: blocks\n19\n  systemPrompt: |-\n20\n    You are an on-call engineer investigating a Pulse alert (rcourtman/pulse,\n21\n    monitoring Proxmox/Docker/Kubernetes/TrueNAS).\n22\n    \n23\n    Your mcp__pulse__* tools — get_resources, get_metrics, get_alerts,\n24\n    get_storage_history — are read-only, and they are your only source of\n25\n    evidence. If a tool you need is not in your allowlist, say so plainly\n26\n    rather than guessing.\n27\n    \n28\n    Investigate before you conclude. An alert tells you a rule fired, not\n29\n    why. Look at the alert's resource, check whether it is still firing now,\n30\n    and pull enough history to tell a spike from a trend before you commit to\n31\n    a cause.\n32\n    \n33\n    PULSE'S GOVERNED-ACTION FLOW — PLAN, APPROVE, EXECUTE A FIX — IS A\n34\n    PRO-TIER FEATURE AND IS OUT OF REACH ON THIS COMMUNITY-EDITION INSTALL.\n35\n    You cannot act, and you must never describe yourself as having applied a\n36\n    fix. State the likely cause and the evidence that supports it, and say\n37\n    what you would recommend instead of doing it.\n38\n    \n39\n    If the situation calls for an operator-state annotation rather than\n40\n    silence — a maintenance window, a criticality tag — say so and name the\n41\n    other agent: `/pulse-operator <task>`.\n42\n    \n43\n    Answer briefly. Lead with the finding, then the evidence.\n44\n    \n45\n    If a thread is bound to this conversation and you judge the problem it is\n46\n    about to be resolved, you may end it yourself by replying with `/close` as\n47\n    your message — the same command a person uses to end a conversation. Only do\n48\n    this once you are confident: closing drops it from any further follow-up on\n49\n    this incident. If no thread is bound here, this instruction does nothing —\n50\n    leave ending the conversation to whatever invoked you.\n51\n    \n52\n    Your task names exactly what you may do. Asked to investigate or report,\n53\n    stay read-only — propose a fix, never perform it, even one you are certain\n54\n    is safe. Only a task that explicitly authorizes a specific change is your\n55\n    license to make it, and only that change, nothing broader it reminds you of\n56\n    along the way.\n57\n    \n58\n    If a thread is bound to this conversation, a reply there confirming it —\n59\n    \"yes\", \"do it\", \"go ahead\" — is that authorization. Do exactly what you\n60\n    described, once, and never ask twice.\n61\n    \n62\n    If no thread is bound, you have nobody to ask directly: describe what you\n63\n    would do and end your turn there. Whoever invoked you decides what happens\n64\n    next, and tells you so directly, as your next task, if they authorize it.\n65\n    Never read a later message as authorization unless it says so plainly."},"/config/agentprofiles/pulse-operator":{"dls":[[]],"text":"Configuration\nagentprofiles\npulse-operator\npulse-operator\nreports none\nOverview\nYAML\nMetadata\nName\npulse-operator\nNamespace\nagent-ops\nHealth\nreports none\nConditions\nreports none\nCreated\n11/14/2026, 10:55:26 AM (3h ago)\nLabels\napp.kubernetes.io/managed-by=Helm\napp.kubernetes.io/name=agentops-pulse\nhelm.sh/chart=pulse-0.2.0\nAnnotations\nmeta.helm.sh/release-name=agent-ops\nmeta.helm.sh/release-namespace=agent-ops\nUID\nbe5cbc80-008c-4125-8d3e-48b98fa28f95\nResource version\n1705965\nConditions\nThis kind reports no conditions\nNothing writes conditions here, so there is nothing to wait for.\nUsed by\nNothing references this\nNo other object points at it.","yaml":"1\napiVersion: agentops.dev/v1alpha1\n2\nkind: AgentProfile\n3\nmetadata:\n4\n  annotations:\n5\n    meta.helm.sh/release-name: agent-ops\n6\n    meta.helm.sh/release-namespace: agent-ops\n7\n  creationTimestamp: \"2026-11-14T08:55:26Z\"\n8\n  labels:\n9\n    app.kubernetes.io/managed-by: Helm\n10\n    app.kubernetes.io/name: agentops-pulse\n11\n    helm.sh/chart: pulse-0.2.0\n12\n  name: pulse-operator\n13\n  namespace: agent-ops\n14\n  resourceVersion: \"1705965\"\n15\n  uid: be5cbc80-008c-4125-8d3e-48b98fa28f95\n16\nspec:\n17\n  maxTurns: 30\n18\n  outputFormat: blocks\n19\n  systemPrompt: |-\n20\n    You are the Pulse operator-state agent for a Community-edition install of\n21\n    Pulse (rcourtman/pulse).\n22\n    \n23\n    PULSE'S GOVERNED-ACTION FLOW — PLAN, APPROVE, EXECUTE A FIX — IS\n24\n    PRO-GATED AND OUT OF REACH HERE. You cannot plan, approve or execute a\n25\n    Pulse action, and you must never describe yourself as having fixed\n26\n    anything.\n27\n    \n28\n    What you CAN do, through mcp__pulse__set_maintenance_window and\n29\n    mcp__pulse__set_criticality_tag, is record operator-state annotations: a\n30\n    maintenance window so other alerts expect the disruption, or a\n31\n    criticality tag recording your own judgement of a resource's\n32\n    importance. These are notes for a human or for Pulse's own alerting —\n33\n    never a substitute for fixing anything, and you must say so when you use\n34\n    either.\n35\n    \n36\n    You also have every read tool pulse-observer has — get_resources,\n37\n    get_metrics, get_alerts, get_storage_history — to investigate before you\n38\n    annotate.\n39\n    \n40\n    When a situation needs an actual fix, say so plainly and that a human\n41\n    must act on Pulse directly, or through its Pro-tier governed-action flow.\n42\n    \n43\n    Answer briefly. Lead with what you found and what you recorded, then the\n44\n    evidence.\n45\n    \n46\n    If a thread is bound to this conversation and you judge the problem it is\n47\n    about to be resolved, you may end it yourself by replying with `/close` as\n48\n    your message — the same command a person uses to end a conversation. Only do\n49\n    this once you are confident: closing drops it from any further follow-up on\n50\n    this incident. If no thread is bound here, this instruction does nothing —\n51\n    leave ending the conversation to whatever invoked you.\n52\n    \n53\n    Your task names exactly what you may do. Asked to investigate or report,\n54\n    stay read-only — propose a fix, never perform it, even one you are certain\n55\n    is safe. Only a task that explicitly authorizes a specific change is your\n56\n    license to make it, and only that change, nothing broader it reminds you of\n57\n    along the way.\n58\n    \n59\n    If a thread is bound to this conversation, a reply there confirming it —\n60\n    \"yes\", \"do it\", \"go ahead\" — is that authorization. Do exactly what you\n61\n    described, once, and never ask twice.\n62\n    \n63\n    If no thread is bound, you have nobody to ask directly: describe what you\n64\n    would do and end your turn there. Whoever invoked you decides what happens\n65\n    next, and tells you so directly, as your next task, if they authorize it.\n66\n    Never read a later message as authorization unless it says so plainly."},"/config/agentruntimes/claude":{"dls":[[]],"text":"Configuration\nagentruntimes\nclaude\nclaude\nreports none\nOverview\nYAML\nMetadata\nName\nclaude\nNamespace\nagent-ops\nHealth\nreports none\nConditions\nreports none\nCreated\n11/14/2026, 10:55:26 AM (3h ago)\nLabels\napp.kubernetes.io/managed-by=Helm\napp.kubernetes.io/name=agentops-runtime\nAnnotations\nmeta.helm.sh/release-name=agent-ops\nmeta.helm.sh/release-namespace=agent-ops\nUID\nbbd0ffa1-a721-40cb-9b1a-46f3577d28b1\nResource version\n1705976\nConditions\nThis kind reports no conditions\nNothing writes conditions here, so there is nothing to wait for.\nUsed by\nNothing references this\nNo other object points at it.","yaml":"1\napiVersion: agentops.dev/v1alpha1\n2\nkind: AgentRuntime\n3\nmetadata:\n4\n  meta.helm.sh/release-namespace: agent-ops\n8\n  creationTimestamp: \"2026-11-14T08:55:26Z\"\n9\n  labels:\n10\n    app.kubernetes.io/managed-by: Helm\n11\n    app.kubernetes.io/name: agentops-runtime\n12\n  name: default\n13\n  namespace: agent-ops\n14\n  resourceVersion: \"1705978\"\n15\n  uid: b09b9437-de0d-4ca6-99d7-65693f47287f\n16\nspec:\n17\n  contextStorage: volume\n18\n  contextSync:\n19\n    interval: 2m\n20\n    paths:\n21\n      - \".claude/projects/-data-workspace/**\"\n22\n    retain: 3\n23\n  egressMediation:\n24\n    port: 15001\n25\n  env:\n26\n    - name: CLAUDE_CODE_OAUTH_TOKEN\n27\n      valueFrom:\n28\n        secretKeyRef:\n29\n          key: oauthToken\n30\n          name: agentops-claude\n31\n  idleTtlMinutes: 1\n32\n  image: \"ghcr.io/kostiantyn-matsebora/agentops-runtime-claude:0.12.0\"\n33\n  resources:\n34\n    limits:\n35\n      cpu: \"1\"\n36\n      memory: 1536Mi\n37\n    requests:\n38\n      cpu: 100m\n39\n      memory: 256Mi\n40\n  serviceAccountName: agentops-runtime"},"/config/channels/console":{"dls":[[]],"text":"Configuration\nchannels\nconsole\nconsole\nok\nOverview\nYAML\nMetadata\nName\nconsole\nNamespace\nagent-ops\nHealth\nok\nConditions\nServed\nConfigValid\nReady\nCreated\n11/14/2026, 10:55:26 AM (3h ago)\nLabels\napp.kubernetes.io/managed-by=Helm\napp.kubernetes.io/name=agentops-console\nAnnotations\nmeta.helm.sh/release-name=agent-ops\nmeta.helm.sh/release-namespace=agent-ops\nUID\n8081b120-5229-4edf-934c-1b5076d78f73\nResource version\n1706131\nConditions\nType\tStatus\tReason\tMessage\tSince\nServed\t\nTrue\n\tAdapterReady\tserved by ChannelAdapter \"console\"\t3h\nConfigValid\t\nTrue\n\tSchemaValidated\tspec.config conforms to the schema declared by \"console\"\t3h\nReady\t\nTrue\n\tAdapterReady\tserved by the agent-ops console\t3h\nUsed by\ncoordinators/agentops-coordinator (channelRefs)\npipelines/\nk8s-observe-pipeline\n (channelRefs)","yaml":"1\napiVersion: agentops.dev/v1alpha1\n2\nkind: Channel\n3\nmetadata:\n4\n  annotations:\n5\n    meta.helm.sh/release-name: agent-ops\n6\n    meta.helm.sh/release-namespace: agent-ops\n7\n  creationTimestamp: \"2026-11-14T08:55:26Z\"\n8\n  labels:\n9\n    app.kubernetes.io/managed-by: Helm\n10\n    app.kubernetes.io/name: agentops-console\n11\n  name: console\n12\n  namespace: agent-ops\n13\n  resourceVersion: \"1706131\"\n14\n  uid: 8081b120-5229-4edf-934c-1b5076d78f73\n15\nspec:\n16\n  adapter: console\n17\n  config:\n18\n    authEnabled: true\n19\n    displayName: agent-ops console\n20\n    signalSource: console\n21\n    writeEnabled: true\n22\n  credentialsSecretRef:\n23\n    name: agentops-console-console\n24\nstatus:\n25\n  conditions:\n26\n    - status: \"True\"\n27\n      lastTransitionTime: \"2026-11-14T08:55:48Z\"\n28\n      message: \"served by ChannelAdapter \\\"console\\\"\"\n29\n      reason: AdapterReady\n30\n      type: Served\n31\n    - status: \"True\"\n32\n      lastTransitionTime: \"2026-11-14T08:55:47Z\"\n33\n      message: \"spec.config conforms to the schema declared by \\\"console\\\"\"\n34\n      reason: SchemaValidated\n35\n      type: ConfigValid\n36\n    - status: \"True\"\n37\n      lastTransitionTime: \"2026-11-14T08:55:49Z\"\n38\n      message: served by the agent-ops console\n39\n      reason: AdapterReady\n40\n      type: Ready"},"/config/channeladapters/console":{"dls":[[]],"text":"Configuration\nchanneladapters\nconsole\nconsole\nok\nOverview\nYAML\nMetadata\nName\nconsole\nNamespace\nagent-ops\nHealth\nok\nConditions\nSchemaValid\nDeployed\nReady\nCreated\n11/14/2026, 10:55:26 AM (3h ago)\nLabels\napp.kubernetes.io/managed-by=Helm\napp.kubernetes.io/name=agentops-console\nAnnotations\nmeta.helm.sh/release-name=agent-ops\nmeta.helm.sh/release-namespace=agent-ops\nUID\n9b7bc416-96fb-46b3-b56c-1fade1bcddb5\nResource version\n1706119\nConditions\nType\tStatus\tReason\tMessage\tSince\nSchemaValid\t\nTrue\n\tSchemaCompiled\tspec.configSchema compiles; served CRs are validated against it\t3h\nDeployed\t\nTrue escription: \"Bearer token the browser signs in with. Projected into the console pod by the reconciler as AGENTOPS_CRED_<CHANNEL>_uiToken; anyone holding it sees everything the console's ServiceAccount can read.\"\n39\n      key: uiToken\n40\n      required: true\n41\n    - description: \"Salts the hash that turns a viewer's identity into the opaque read-state key stored on a Conversation, so read marks can be per person while no address reaches etcd. Absent means read state stays per CHANNEL — every viewer shares one watermark. Never rotate it casually: a new salt orphans every stored key and silently resets everyone to the channel-wide mark.\"\n42\n      key: readerSalt\n43\n      required: false\n44\n  echoesOwnMessages: false\n45\n  externals:\n46\n    - kind: sender\n47\n      name: Browser\n48\n    - kind: kubernetes\n49\n      name: Kubernetes API\n50\n  image: \"ghcr.io/kostiantyn-matsebora/agentops-console:0.40.0\"\n51\n  port: 8080\n52\n  serviceAccountName: agentops-adapter-console\n53\n  singleton: true\n54\nstatus:\n55\n  conditions:\n56\n    - status: \"True\"\n57\n      lastTransitionTime: \"2026-11-14T08:55:47Z\"\n58\n      message: spec.configSchema compiles; served CRs are validated against it\n59\n      reason: SchemaCompiled\n60\n      type: SchemaValid\n61\n    - status: \"True\"\n62\n      lastTransitionTime: \"2026-11-14T08:55:47Z\"\n63\n      message: \"\"\n64\n      reason: WorkloadRendered\n65\n      type: Deployed\n66\n    - status: \"True\"\n67\n      lastTransitionTime: \"2026-11-14T08:55:48Z\"\n68\n      message: serving 1 channel(s)\n69\n      reason: WorkloadAvailable\n70\n      type: Ready\n71\n  servedChannels: 1"},"/config/conversations/member-k8s-observe":{"dls":[[]],"text":"Configuration\nconversations\nmember-k8s-observe\nmember-k8s-observe\nreports none\nOverview\nYAML\nMetadata\nName\nmember-k8s-observe\nNamespace\nagent-ops\nHealth\nreports none\nConditions\nToolingResolved\nEgressMediated\nCreated\n11/14/2026, 10:59:27 AM (3 ace agent-ops. Both are absent.\n34\n  conditions:\n35\n    - status: \"True\"\n36\n      lastTransitionTime: \"2026-11-14T08:59:27Z\"\n37\n      message: \"\"\n38\n      reason: Resolved\n39\n      type: ToolingResolved\n40\n    - status: \"True\"\n41\n      lastTransitionTime: \"2026-11-14T08:59:27Z\"\n42\n      message: 1 bound MCP server(s) enforced by the egress proxy\n43\n      reason: AllEndpointsMediated\n44\n      type: EgressMediated\n45\n  contextCheckpoint:\n46\n    at: \"2026-11-14T09:03:54Z\"\n47\n    bytes: 262882\n48\n    quiesced: true\n49\n  lastActivity: \"2026-11-14T09:03:54Z\"\n50\n  phase: Idle\n51\n  processedInputIds:\n52\n    - in-dmut6ndc6u7h\n53\n    - in-dmut9xoixtu0\n54\n  runs:\n55\n    - status: succeeded\n56\n      deliveryTracked: true\n57\n      finishedAt: \"2026-11-14T08:59:53Z\"\n58\n      inputs:\n59\n        - id: in-dmut6ndc6u7h\n60\n          origin: member\n61\n          receivedAt: \"2026-11-14T08:59:27Z\"\n62\n          text: \"Read-only investigation of local-path storage growth. (1) List all PVCs in all namespaces with size, storageClass, status, and the node (local-path PVs have node affinity); rank by requested capacity and, if actual usage is obtainable (kubelet stats / node logs / metrics), by real usage. (2) For each large PVC, name the workloads (pods/owners) mounting it. (3) List PVs in Released/Failed state or orphaned (no bound PVC) and say whether the local-path-provisioner cleans up released volumes: check the StorageClass reclaimPolicy, the local-path-provisioner deployment in its namespace (likely local-path-storage or kube-system), its logs for delete/cleanup errors, and its ConfigMap local-path-config (paths, nodePathMap, helperPod setup/teardown). (4) Report all storage settings: StorageClasses (default, reclaimPolicy, volumeBindingMode, allowVolumeExpansion), provisioner config, and node disk pressure/ephemeral-storage conditions and events. Make no changes. Report back concisely with numbers.\"\n63\n 8:58:27Z the two current PVs were created. All 3 `agent-ops` PVC create/delete cycles in the log succeeded.\n92\n        - The provisioner pod has restarted 25 times (last 3d11h ago). I did not look into why.\n93\n        <\/cleanup>\n94\n        \n95\n        <settings>\n96\n        - StorageClass `local-path` (default): provisioner `rancher.example/local-path`, `Delete`, `WaitForFirstConsumer`, `allowVolumeExpansion=false`. It is the only class.\n97\n        - Confi\n98\n      routedToParent: true\n99\n      runId: 2026-11-14T08-59-30-000Z\n100\n      startedAt: \"2026-11-14T08:59:30Z\"\n101\n    - status: succeeded\n102\n      deliveryTracked: true\n103\n      finishedAt: \"2026-11-14T09:03:54Z\"\n104\n      inputs:\n105\n        - id: in-dmut9xoixtu0\n106\n          origin: member\n107\n          receivedAt: \"2026-11-14T09:03:45Z\"\n108\n          text: \"In namespace agent-ops, list pods and report whether the one-off pods `disk-audit-tmp` and `disk-audit-tmp2` still exist, and their phase/state (e.g. Terminating). Report back names, status and age only.\"\n109\n          type: task\n110\n      result: |-\n111\n        <title>\n112\n        ✅ disk-audit-tmp and disk-audit-tmp2 do not exist in agent-ops\n113\n        <\/title>\n114\n        \n115\n        <summary>\n116\n        - `disk-audit-tmp`: not found (no pod, not Terminating)\n117\n        - `disk-audit-tmp2`: not found (no pod, not Terminating)\n118\n        <\/summary>\n119\n        \n120\n        <details>\n121\n        The `agent-ops` pod list returned 9 pods, all Running. None is named `disk-audit-tmp*`:\n122\n        \n123\n        | Name | Status | Age |\n124\n        |---|---|---|\n125\n        | agentops-adapter-console-695fc44db9-nnnsl | Running | 8m3s |\n126\n        | agentops-conv-member-k8s-observe | Running | 5s |\n127\n        | agentops-conv-member-k8s-ops | Running | 3m51s |\n128\n        | agentops-conv-task-agentops-coordinator | Running | 13s |\n129\n        | agentops-manager-6fd49 : ContextCheckpointQuiesced\n53\n  contextCheckpoint:\n54\n    at: \"2026-11-14T09:03:37Z\"\n55\n    bytes: 519031\n56\n    quiesced: true\n57\n  lastActivity: \"2026-11-14T09:03:37Z\"\n58\n  phase: Idle\n59\n  processedInputIds:\n60\n    - in-dmut721axzke\n61\n    - in-dmut7ilksprk\n62\n  runs:\n63\n    - status: succeeded\n64\n      deliveryTracked: true\n65\n      finishedAt: \"2026-11-14T09:00:31Z\"\n66\n      inputs:\n67\n        - id: in-dmut721axzke\n68\n          origin: member\n69\n          receivedAt: \"2026-11-14T08:59:59Z\"\n70\n          text: \"READ-ONLY task, make no changes of any kind. Node lima-rancher-desktop is ~80% full (83.8 GB of 105 GB used) but kubelet-tracked pods only account for ~8 GB. Find where the space is. (1) Using exec into an existing pod or a one-off pod with a hostPath mount of /var/lib/rancher/k3s (read-only mount; delete the one-off pod afterwards), run `du -xsh` on /var/lib/rancher/k3s/storage/* (the local-path PVC directories for agent-ops PVCs agentops-workspace and agentops-context; map each pvc-<uid> dir to its PVC name) and report their real sizes. (2) Run `du -xh --max-depth=2` for /var/lib/rancher/k3s and /var/log on the node to find the top 10 consumers (containerd snapshots/images, logs, etc). (3) Also report the full local-path-provisioner ConfigMap `local-path-config` (config.json paths/nodePathMap, setup/teardown scripts) and why the provisioner pod restarted 25 times (previous container logs / last termination reason). If exec or a hostPath pod is not permitted, say exactly which and stop. Report concisely with numbers.\"\n71\n          type: task\n72\n      result: |-\n73\n        <title>\n74\n        🔍 lima-rancher-desktop disk: k3s dir is only 285 MB, so the 78 GB is elsewhere\n75\n        <\/title>\n76\n        \n77\n        <finding>\n78\n        - PVC dirs are tiny, and `/var/lib/rancher/k3s` totals 285 MB. `/var/log` is 344 MB, on a 3.9 GB tmpfs.\n79\n        - Node root `/dev/vda1` is 97.9 GB with 78.1 GB and, where this install allows pod execution, exec into a pod or run a one-off pod. It can also look things up on the web. It investigates before it acts and describes a risky change instead of making it. Cannot touch kube-system or the control plane. Hand it an instruction to change something — \\\"restart X\\\", \\\"scale Y to N\\\", \\\"fix the Z ConfigMap\\\" — or a known cause that needs a fix.\"\n25\n      name: k8s-ops\n26\n    - capabilityRef:\n27\n        name: pulse-observer\n28\n      description: \"A Pulse monitoring investigator (rcourtman/pulse — Proxmox, Docker, Kubernetes, TrueNAS). Can read live and historical resource state, metrics, alerts and storage history. Cannot change anything — Pulse's governed-action flow is Pro-gated and out of reach on this Community install. Hand it a firing Pulse alert, or any question about the monitored estate's current state.\"\n29\n      name: pulse-observer\n30\n    - capabilityRef:\n31\n        name: pulse-operator\n32\n      description: \"The Pulse operator-state agent (rcourtman/pulse). Investigates the same way pulse-observer does, and can additionally record a maintenance window or tag a resource's criticality — the only two mutating actions Community edition exposes outside Pulse's Pro-gated governed-action flow. Cannot plan, approve or execute an actual fix. Hand it an alert that needs a maintenance window logged or a criticality judgement recorded.\"\n33\n      name: pulse-operator\n34\n  channelRefs:\n35\n    - name: console\n36\n  mcpConfigs:\n37\n    refs:\n38\n      - name: aops-coordinate\n39\n  profileRef:\n40\n    name: agentops-coordinator\n41\n  signalSourceRefs:\n42\n    - name: pulse-alerts\n43\n    - name: console\n44\n  toolsets:\n45\n    mode: merge\n46\n    refs:\n47\n      - name: agentops-coordinate\n48\nstatus:\n49\n  conditions:\n50\n    - status: \"True\"\n51\n      lastTransitionTime: \"2026-11-14T08:57:18Z\"\n52\n      message: \"\"\n53\n      reason: WiringValid\n54\n      type: Rea   const cr=[...condTxt.matchAll(/^(\w+)\t\s*\n?(True|False|Unknown)\n?\t(\w*)\t(.*?)\t(\S+)$/gm)];
  const cond=cr.length?'<div class="tw"><table class="tbl"><tr><th>Type</th><th>Status</th><th>Reason</th><th>Message</th><th>Since</th></tr>'+cr.map(m=>'<tr><td>'+m[1]+'</td><td><span class="pill '+(m[2]==='True'?'ok':'warn')+'">'+m[2]+'</span></td><td>'+m[3]+'</td><td>'+esc(m[4])+'</td><td>'+m[5]+'</td></tr>').join('')+'</table></div>':'<div class="empty"><b>This kind reports no conditions</b>Nothing writes conditions here, so there is nothing to wait for.</div>';
  const used=ub>=0?rest.slice(ub+1).filter(Boolean):[];
  const body=S.cfg.tab==='yaml'?'<div class="pcard"><pre class="yaml">'+esc(d.yaml.split('\n').filter(l=>!/^\d+$/.test(l)).join('\n'))+'</pre></div>':
   '<div class="pcard"><h3>Metadata</h3><dl style="grid-template-columns:130px minmax(0,1fr);gap:8px 14px">'+meta.map(m=>'<dt style="font-size:13px;color:var(--text)">'+m[0]+'</dt><dd style="margin:0">'+mv(m)+'</dd>').join('')+'</dl></div><div class="pcard"><h3>Conditions</h3>'+cond+'</div>'+(used.length?'<div class="pcard"><h3>Used by</h3>'+used.map(u=>'<span class="lab" style="max-width:none">'+esc(u)+'</span>').join('')+'</div>':'');
  return crumb([['Configuration','data-cfgk=""'],[k,'data-cfgk="'+k+'"'],[sName]])+'<h1 class="pt" style="font-size:22px;font-weight:600;margin:0">'+esc(sName)+' <span class="pill '+(health==='ok'?'ok':'')+'" style="font-size:13px">'+esc(health)+'</span></h1><div class="ptabs" role="tablist"><button type="button" class="'+(S.cfg.tab!=='yaml'?'on':'')+'" data-ctab="overview">Overview</button><button type="button" class="'+(S.cfg.tab==='yaml'?'on':'')+'" data-ctab="yaml">YAML</button></div>'+body;
}
function topoHTML(){
  const ev=C.flatMap(c=>c.events||[]).sort((a,b)=>T(a.ts)-T(b.ts)),pc={events:ev};
  const keep=S.replay;S.replay=ev.length?ev.length-1:0;const svg=ev.length?gcanvas(pc):'';S.replay=keep;
  const gd=ev.length?gdata(pc):{nodes:new Map()},nn=gd.nodes.size;
  const fold=(k,t,body)=>'<div class="pcard"><button class="fold-h" data-pfold="'+k+'" aria-expanded="'+S.open.has(k)+'" type="button"><span>'+(S.open.has(k)?'⌃':'⌄')+'</span>'+t+'</button>'+(S.open.has(k)?body:'')+'</div>';
  const last=ev.slice(-12).reverse(),nm=x=>x&&x.name?x.name:(x&&x.kind)||'';
  const hops='<div class="hoplist">'+last.map(e=>'<div><span class="t">'+T(e.ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'})+'</span><b>'+esc(e.kind)+'</b><span class="sub">'+esc(nm(e.from))+' → '+esc(nm(e.to))+'</span></div>').join('')+'</div>';
  const sel=(l,o)=>'<select aria-label="'+l+'">'+o.map(x=>'<option>'+x+'</option>').join('')+'</select>';
  return crumb([['Topology']])+
  '<div class="ttool"><div class="seg" role="group" aria-label="Graph view">'+Object.keys(GN).map(k=>'<button type="button" data-gview="'+k+'" class="'+(S.gview===k?'on':'')+'" aria-pressed="'+(S.gview===k)+'">'+GN[k]+'</button>').join('')+'</div>'+sel('Pipelines',['Pipelines: all','agentops-coordinator','k8s-observe-pipeline'])+sel('Detail',['Full model','Hide tools'])+sel('Grouping',['Box by bundle','No boxes'])+sel('Layout',['Cola','Dagre'])+'</div>'+
  '<div class="ttool"><input placeholder="Find… e.g. name…" aria-label="Find"><input placeholder="Hide… e.g. idle" aria-label="Hide">'+sel('Window',['Last 5m','Last 15m','Last 1h'])+'<div class="seg"><button class="on" type="button">Live</button><button type="button">Replay</button></div></div>'+
  '<div class="tsplit"><div class="tcanvas"><div class="tchips"><span class="pill ok">'+nn+' ok</span><span class="pill">0 failing</span><span class="pill warn">0 unknown</span></div>'+svg+'</div><div style="display:grid;gap:14px">'+
  fold('pg:display','Display','<div style="margin-top:8px;color:var(--subtle)">Labels, edge weights and node sizes follow the display options of the real console.</div>')+
  '<div class="pcard"><h3>Hops, live</h3>'+hops+'<h3 style="margin-top:12px">Conversations in window</h3><div class="sub">'+C.filter(c=>!c.parent).map(c=>esc(c.rowTitle)).join(', ')+'</div></div></div></div>'+
  fold('pg:history','History','<div class="sub" style="margin-top:8px">Pick a past window to replay it on the graph.</div>');
}
function paintPage(){
  const p=$('page'),k=S.page;
  p.hidden=k==='conv';$('cols').dataset.page=k;
  if(k==='conv')return;
  const h={overview:ovHTML,queues:qHTML,config:cfgHTML,topo:topoHTML}[k]();
  if(p._h!==h){const st=p.scrollTop;p.innerHTML=h;p._h=h;p.scrollTop=st}
}
(()=>{const op=paint;paint=function(){op();paintPage()}})();
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-page],[data-cfgk],[data-cfgn],[data-ctab],[data-pfold],#side [data-scope],#side [data-feed],#side [data-pipe],#rows .row,[data-go],#newBtn');if(!t)return;
  const d=t.dataset;
  if(d.page){S.page=d.page;if(d.page==='config')S.cfg={kind:null,name:null,tab:'overview'};if(mqd.matches){S.nav='hidden';applyL()}paint();return}
  if(d.cfgk!==undefined){S.cfg={kind:d.cfgk||null,name:null,tab:'overview'};paint();return}
  if(d.cfgn){S.cfg.name=d.cfgn;S.cfg.tab='overview';paint();$('page').scrollTop=0;return}
  if(d.ctab){S.cfg.tab=d.ctab;paint();return}
  if(d.pfold){S.open.has(d.pfold)?S.open.delete(d.pfold):S.open.add(d.pfold);paintPage();return}
  if(S.page!=='conv'){S.page='conv';$('cols').dataset.page='conv';$('page').hidden=true}
},true);

seed();applyL();paint();
})();
</script>

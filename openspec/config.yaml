schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# ---------------------------------------------------------------------------
# THESE RULES ARE INJECTED WHEN THE ARTIFACT IS WRITTEN.
#
# That is the point of putting them here rather than only in CLAUDE.md: a rule
# in a context file is read at launch and may be compacted away, while these
# reach the model at the exact moment it is generating the file they govern.
# ---------------------------------------------------------------------------

rules:
  proposal:
    - >-
      The Impact section MUST name every document the change makes untrue, in
      BOTH halves: the reference docs (docs/concepts.md, docs/contracts.md, a
      bundle page, CHANGELOG.md) AND the adopter site (the landing page,
      introduction.md, getting-started.md, installation.md, docs/guides/*).
      They are skipped independently, so they are listed independently.

  design:
    - >-
      If the approach was settled against a PROTOTYPE — a mockup, a sketch, a
      rendering — that prototype MUST be committed inside the change and
      referenced BY PATH. Never by an external or account-scoped URL: it is the
      one artifact that does not survive archiving, another reader, or next
      month.
    - >-
      State the split it creates: the prototype is the reference for
      COMPOSITION and the specs are the reference for BEHAVIOUR. The numbers a
      prototype settles — geometry, timings, spacing, wording — are exactly the
      ones a spec should not carry, and they are then written down nowhere else.
    - >-
      Name the places the prototype is deliberately NOT the target, because a
      standalone artifact always differs from the thing it models somewhere.
      Unnamed, each of those differences ships.

  tasks:
    - >-
      THE TWO SECTIONS BEFORE THE LAST ONE MUST BE TESTS, in this order: a
      dedicated UNIT TESTS section, then a dedicated E2E TESTS section. Each is
      its own numbered section, not a bullet under the task it verifies — a
      test line appended to "implement X" is ticked with X and never written.
    - >-
      The unit-test section covers what the change did: `go test ./...` in
      every module it touched, `node --test` in a Node runtime, the chart's
      render tests for a template, the script suite for a workflow script.
    - >-
      The e2e-test section is owed EVEN WHERE IT DOES NOT APPLY. Where a
      cluster decides something the change touched — the kubelet, RBAC, an
      informer, a pod's lifecycle, context continuity — the section adds or
      extends a lane in platform/manager/test/e2e/ and runs the pack. Where
      nothing a cluster decides changed, the section holds ONE task stating
      why, and it is ticked. An absent section and a forgotten one look
      identical; a stated "not applicable" is a claim a reviewer can dispute.
    - >-
      THE LAST SECTION MUST BE A DEDICATED DOCUMENTATION SECTION. Not a bullet
      inside another task, not a follow-up, not "docs later" — its own numbered
      section, and the final one before the change is finished.
    - >-
      That documentation section MUST list the reference docs and the ADOPTER
      SITE as separate subsections. The adopter site is the half that gets
      skipped, because a behaviour change feels done once concepts.md is right
      and the adopter never reads concepts.md.
    - >-
      Documentation goes LAST because it documents what the change ACTUALLY
      did, which is routinely not what the proposal said it would.
    - >-
      If a change alters a CRD field, a chart value or an api doc comment, the
      documentation section MUST include re-running
      `python3 .github/scripts/docs-generate.py` — every generated block and
      docs/cr-reference.md is build output and CI fails on a stale one.
    - >-
      If a change alters the console UI, the documentation section MUST include
      re-running BOTH `npm run screenshots` and `npm run demo` in
      platform/console/ui.
    - >-
      Where a change carries a committed prototype, the tasks MUST say PORT
      from it and name it, and a task list MUST NOT merely restate the specs.
      An implementer who re-derives an agreed design arrives somewhere else,
      which is the whole cost the prototype was committed to avoid.
    - >-
      THIS CHANGE WILL BE DELIVERED ON ITS OWN BRANCH, `change/<name>`, from its
      own git worktree, as ONE pull request — see
      .claude/rules/worktree-delivery.md. A task list MUST NOT instruct
      committing to the default branch, and MUST NOT restate the delivery
      mechanism as work: creating the worktree, opening the tracking issue and
      opening the pull request are the opsx commands' own steps, not tasks.
    - >-
      WHERE A TASK'S VERIFICATION IS A DEPLOY OR A BUILD, it MUST say that it
      runs against the WORKTREE's tree rather than the default branch's. Both
      the build container and the GitOps deploy resolve a fixed path by
      default, so a verification run without the override silently tests master
      and reports success.

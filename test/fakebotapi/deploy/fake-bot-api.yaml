# The fake Bot API, in-cluster: the components under test resolve it by
# cluster DNS, so it runs beside them rather than on the runner. Applied by the
# e2e pack into the release namespace; the telegram bundle is pointed at it
# with `telegram.apiBase: http://agentops-test-fake-bot-api:8081`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops-test-fake-bot-api
  labels:
    app.kubernetes.io/name: agentops-test-fake-bot-api
    agentops.dev/test-double: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentops-test-fake-bot-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentops-test-fake-bot-api
        agentops.dev/test-double: "true"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: fake
          image: agentops-test-fake-bot-api:e2e
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: agentops-test-fake-bot-api
  labels:
    app.kubernetes.io/name: agentops-test-fake-bot-api
spec:
  selector:
    app.kubernetes.io/name: agentops-test-fake-bot-api
  ports:
    - port: 8081
      targetPort: 8081

{{- /*
VM Alertmanager component: the webhook-receiving signal adapter. The chart
renders the SignalAdapter CR ONLY — pure implementation. The operator's
reconciler owns the workload AND the connectivity: spec.port makes it render
the Service agentops-signal-<name> and inject LISTEN_ADDR. Gated on the
bundle flag alone: demo mode never enables this bundle.

With registration enabled the adapter also configures the SENDER (it writes a
VMAlertmanagerConfig pointing at its own webhook), so the permissions for that
are rendered here — by the chart, never by the operator.
*/ -}}
{{- if and .Values.enabled .Values.alertmanager.enabled }}
{{- $name := .Values.alertmanager.name }}
{{- $reg := .Values.alertmanager.registration }}
{{- /* default the registration namespace to the release's own: no cross-namespace grant */ -}}
{{- $regNS := default .Release.Namespace $reg.namespace }}
# Webhook entry point (Service owned by the SignalAdapter reconciler):
#   http://agentops-signal-{{ $name }}.{{ .Release.Namespace }}.svc:8080/webhook/<source>
apiVersion: agentops.dev/v1alpha1
kind: SignalAdapter
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-signal-vmalertmanager
spec:
  image: "{{ .Values.alertmanager.image.repository }}:{{ .Values.alertmanager.image.tag }}"
  port: 8080
  singleton: true
  # The config contract for SignalSources with `adapter: {{ $name }}` — this is
  # the richest config in the system, so it is the one most worth declaring.
  # Mirrors registerSpec in signal-vmalertmanager/register.go; bump both in one
  # diff. Advisory only: violations surface as ConfigValid, never block ingest.
  configSchema:
    type: object
    properties:
      register:
        type: object
        description: >-
          Sender-side routing this source owns. The adapter writes a
          VMAlertmanagerConfig from it; omit the block to configure the sender
          by hand.
        properties:
          namespace:
            type: string
            description: >-
              Namespace to write the VMAlertmanagerConfig into. Empty = the
              adapter's own, which needs no cross-namespace RBAC.
          matchers:
            type: array
            items:
              type: string
            description: Alertmanager matchers selecting which alerts arrive here.
          groupWait:
            type: string
            pattern: '^[0-9]+(ms|s|m|h)$'
          groupInterval:
            type: string
            pattern: '^[0-9]+(ms|s|m|h)$'
          repeatInterval:
            type: string
            pattern: '^[0-9]+(ms|s|m|h)$'
          maxAlerts:
            type: integer
            minimum: 0
            description: Cap alerts per webhook post (0 = Alertmanager default).
          sendResolved:
            type: boolean
        # a typo'd key silently changes routing, so name unknown fields
        additionalProperties: false
    additionalProperties: false
  {{- if $reg.enabled }}
  # self-registration talks to the Kubernetes API: mount the SA token. The
  # operator grants nothing — the Role below does.
  kubernetesAccess: true
  {{- end }}
  {{- with .Values.alertmanager.resources }}
  resources:
{{ toYaml . | indent 4 }}
  {{- end }}
{{- if $reg.enabled }}
---
# Least privilege for self-registration: VMAlertmanagerConfig only, in the
# namespace the config is written to, bound to the adapter's deterministic SA.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentops-signal-{{ $name }}-register
  namespace: {{ $regNS }}
  labels:
    app.kubernetes.io/name: agentops-signal-vmalertmanager
rules:
  - apiGroups: ["operator.victoriametrics.com"]
    resources: ["vmalertmanagerconfigs"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentops-signal-{{ $name }}-register
  namespace: {{ $regNS }}
  labels:
    app.kubernetes.io/name: agentops-signal-vmalertmanager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentops-signal-{{ $name }}-register
subjects:
  - kind: ServiceAccount
    # the SignalAdapter reconciler's deterministic SA name
    name: agentops-signal-{{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.alertmanager.defaultSource.enabled }}
{{- $src := .Values.alertmanager.defaultSource }}
{{- $profileRef := $src.profileRef }}
{{- if not $profileRef }}
{{- fail "vm-bundle: alertmanager.defaultSource.profileRef is required when defaultSource.enabled=true (the Pipeline claiming the source needs an operator-owned profile — unwired sources drop signals)" }}
{{- end }}
---
apiVersion: agentops.dev/v1alpha1
kind: SignalSource
metadata:
  name: {{ $src.name }}
  namespace: {{ .Release.Namespace }}
spec:
  # names the implementation serving this source: the SignalAdapter above
  adapter: {{ $name }}
  {{- with $src.grouping }}
  grouping:
{{ toYaml . | indent 4 }}
  {{- end }}
  {{- if $reg.enabled }}
  # opaque to the operator; the adapter reads `register` and writes the
  # VMAlertmanagerConfig that makes Alertmanager push here
  config:
    register:
      {{- with $reg.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with $reg.matchers }}
      matchers:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with $reg.groupWait }}
      groupWait: {{ . | quote }}
      {{- end }}
      {{- with $reg.groupInterval }}
      groupInterval: {{ . | quote }}
      {{- end }}
      {{- with $reg.repeatInterval }}
      repeatInterval: {{ . | quote }}
      {{- end }}
      {{- if gt (int $reg.maxAlerts) 0 }}
      maxAlerts: {{ int $reg.maxAlerts }}
      {{- end }}
      sendResolved: {{ $reg.sendResolved }}
  {{- end }}
---
# Wiring is pipeline-only: this Pipeline claims the source so its signals
# route (Wired=True) to the configured profile and channels.
apiVersion: agentops.dev/v1alpha1
kind: Pipeline
metadata:
  name: {{ $src.name }}
  namespace: {{ .Release.Namespace }}
spec:
  signalSourceRefs:
    - name: {{ $src.name }}
  {{- with $src.channels }}
  channelRefs:
    {{- range . }}
    - name: {{ . }}
    {{- end }}
  {{- end }}
  profileRef:
    name: {{ $profileRef }}
  {{- /* Declared, not inherited: nothing supplies a default, so a Pipeline
  without these stanzas hands every alert conversation an empty allowlist. The
  built-ins come from the parent chart (global. is the only scope a subchart
  reads); the vm tools come from this bundle's own components. */}}
  {{- $bt := (.Values.global | default dict).builtinToolsets | default dict }}
  {{- $tools := list }}
  {{- if $bt.enabled }}
  {{- $tools = append $tools $bt.observe.name }}
  {{- $tools = append $tools $bt.shell.name }}
  {{- end }}
  {{- if or .Values.mcp.vmlogs.enabled .Values.mcp.vmmetrics.enabled }}
  {{- $tools = append $tools .Values.mcp.toolset.name }}
  {{- end }}
  {{- range $src.extraToolsets }}{{ $tools = append $tools . }}{{ end }}
  {{- if $tools }}
  toolsets:
    refs:
      {{- range $tools }}
      - name: {{ . }}
      {{- end }}
  {{- end }}
  {{- $cfgs := list }}
  {{- if .Values.mcp.vmlogs.enabled }}{{ $cfgs = append $cfgs .Values.mcp.vmlogs.name }}{{ end }}
  {{- if .Values.mcp.vmmetrics.enabled }}{{ $cfgs = append $cfgs .Values.mcp.vmmetrics.name }}{{ end }}
  {{- range $src.extraMCPConfigs }}{{ $cfgs = append $cfgs . }}{{ end }}
  {{- if $cfgs }}
  mcpConfigs:
    refs:
      {{- range $cfgs }}
      - name: {{ . }}
      {{- end }}
  {{- end }}
{{- end }}
{{- end }}

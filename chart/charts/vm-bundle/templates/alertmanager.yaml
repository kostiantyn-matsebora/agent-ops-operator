{{- /*
VM Alertmanager component: the webhook-receiving signal adapter. The chart
renders the SignalAdapter CR ONLY — pure implementation. The operator's
reconciler owns the workload AND the connectivity: spec.port makes it render
the Service agentops-signal-<name> and inject LISTEN_ADDR. Gated on the
bundle flag alone: demo mode never enables this bundle.
*/ -}}
{{- if and .Values.enabled .Values.alertmanager.enabled }}
{{- $name := .Values.alertmanager.name }}
# Webhook entry point (Service owned by the SignalAdapter reconciler):
#   http://agentops-signal-{{ $name }}.{{ .Release.Namespace }}.svc:8080/webhook/<source>
apiVersion: agentops.dev/v1alpha1
kind: SignalAdapter
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-signal-vmalertmanager
spec:
  image: "{{ .Values.alertmanager.image.repository }}:{{ .Values.alertmanager.image.tag }}"
  port: 8080
  singleton: true
  {{- with .Values.alertmanager.resources }}
  resources:
{{ toYaml . | indent 4 }}
  {{- end }}
{{- if .Values.alertmanager.defaultSource.enabled }}
{{- $src := .Values.alertmanager.defaultSource }}
{{- $profileRef := $src.profileRef }}
{{- if not $profileRef }}
{{- fail "vm-bundle: alertmanager.defaultSource.profileRef is required when defaultSource.enabled=true (the Pipeline claiming the source needs an operator-owned profile — unwired sources drop signals)" }}
{{- end }}
---
apiVersion: agentops.dev/v1alpha1
kind: SignalSource
metadata:
  name: {{ $src.name }}
  namespace: {{ .Release.Namespace }}
spec:
  # the source names its implementation: the SignalAdapter CR above
  type: {{ $name }}
  {{- with $src.grouping }}
  grouping:
{{ toYaml . | indent 4 }}
  {{- end }}
---
# Wiring is pipeline-only: this Pipeline claims the source so its signals
# route (Wired=True) to the configured profile and channels.
apiVersion: agentops.dev/v1alpha1
kind: Pipeline
metadata:
  name: {{ $src.name }}
  namespace: {{ .Release.Namespace }}
spec:
  signalSourceRefs:
    - name: {{ $src.name }}
  {{- with $src.channels }}
  channelRefs:
    {{- range . }}
    - name: {{ . }}
    {{- end }}
  {{- end }}
  profileRef:
    name: {{ $profileRef }}
{{- end }}
{{- end }}

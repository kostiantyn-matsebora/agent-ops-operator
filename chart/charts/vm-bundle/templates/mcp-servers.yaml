{{- /*
mcpServers component: the MCP server WORKLOADS (upstream VictoriaMetrics MCP
images in SSE mode), decoupled from the MCPConfig CRs in mcp.yaml. Service
names are fixed (agentops-mcp-vmlogs / agentops-mcp-vmmetrics) — mcp.yaml
defaults empty MCPConfig URLs onto them.
*/ -}}
{{- if and .Values.enabled .Values.mcpServers.enabled .Values.mcpServers.vmlogs.enabled }}
{{- $s := .Values.mcpServers.vmlogs }}
{{- if not $s.backend }}
{{- fail "vm-bundle: mcpServers.vmlogs.backend is required (the VictoriaLogs instance URL the MCP server queries)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops-mcp-vmlogs
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-mcp-vmlogs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentops-mcp-vmlogs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentops-mcp-vmlogs
    spec:
      containers:
        - name: mcp
          image: "{{ $s.image.repository }}:{{ $s.image.tag }}"
          env:
            - name: MCP_SERVER_MODE
              value: sse
            - name: MCP_LISTEN_ADDR
              value: ":{{ $s.port }}"
            - name: VL_INSTANCE_ENTRYPOINT
              value: {{ $s.backend | quote }}
            {{- with $s.env }}
{{ toYaml . | indent 12 }}
            {{- end }}
          ports:
            - containerPort: {{ $s.port }}
          {{- with $s.resources }}
          resources:
{{ toYaml . | indent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: agentops-mcp-vmlogs
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-mcp-vmlogs
spec:
  selector:
    app.kubernetes.io/name: agentops-mcp-vmlogs
  ports:
    - name: sse
      port: {{ $s.port }}
      targetPort: {{ $s.port }}
{{- end }}
{{- if and .Values.enabled .Values.mcpServers.enabled .Values.mcpServers.vmmetrics.enabled }}
{{- $s := .Values.mcpServers.vmmetrics }}
{{- if not $s.backend }}
{{- fail "vm-bundle: mcpServers.vmmetrics.backend is required (the VictoriaMetrics instance URL the MCP server queries)" }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops-mcp-vmmetrics
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-mcp-vmmetrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentops-mcp-vmmetrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentops-mcp-vmmetrics
    spec:
      containers:
        - name: mcp
          image: "{{ $s.image.repository }}:{{ $s.image.tag }}"
          env:
            - name: MCP_SERVER_MODE
              value: sse
            - name: MCP_LISTEN_ADDR
              value: ":{{ $s.port }}"
            - name: VM_INSTANCE_ENTRYPOINT
              value: {{ $s.backend | quote }}
            {{- with $s.env }}
{{ toYaml . | indent 12 }}
            {{- end }}
          ports:
            - containerPort: {{ $s.port }}
          {{- with $s.resources }}
          resources:
{{ toYaml . | indent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: agentops-mcp-vmmetrics
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-mcp-vmmetrics
spec:
  selector:
    app.kubernetes.io/name: agentops-mcp-vmmetrics
  ports:
    - name: sse
      port: {{ $s.port }}
      targetPort: {{ $s.port }}
{{- end }}

{{- /*
mcpServers sub-component: the MCP server WORKLOAD, decoupled from the CRs in
mcp.yaml (which point at it, or at an endpoint you already run).

Everything here exists for one reason: the server authenticates to the API as
its OWN ServiceAccount. That SA's RBAC is what MCP tools can reach — reviewable
on its own, revocable on its own, and unrelated to the runtime SA that Bash +
kubectl authenticate as. Two identities is the whole point; a chart that reused
the runtime SA here would be a strictly worse kubectl.

The Deployment/Service name is fixed (agentops-mcp-k8s) because mcp.yaml
defaults an empty MCPConfig URL onto this Service.
*/ -}}
{{- if and (include "k8s-bundle.active" .) .Values.mcpServers.enabled }}
{{- $s := .Values.mcpServers }}
{{- $name := include "k8s-bundle.mcpServerName" . }}
{{- $sa := include "k8s-bundle.mcpServerServiceAccount" . }}
{{- $readOnly := include "k8s-bundle.mcpServerReadOnly" . }}
{{- $rbacMode := include "k8s-bundle.mcpServerRbacMode" . }}
{{- if eq $sa (include "agentops.runtimeServiceAccount" .) }}
{{- fail "k8s-bundle: mcpServers.serviceAccountName must differ from global.agentops.runtime.serviceAccountName — the MCP server's separate identity is the reason this component exists; sharing the runtime SA collapses the two walls into one" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
    spec:
      serviceAccountName: {{ $sa }}
      # The token IS the credential — this server holds no kubeconfig and reads
      # the cluster as this SA. Left at the default (true) on purpose.
      containers:
        - name: mcp
          image: {{ printf "%s:%s" $s.image.repository (toString $s.image.tag) | quote }}
          args:
            # --port puts the server in HTTP mode: streamable HTTP on /mcp and
            # SSE on /sse, both from this one port.
            - --port={{ $s.port }}
            {{- if $readOnly }}
            # Filters at REGISTRATION, not at listing: a mutating tool is never
            # added to the server, so it cannot be called by a client that
            # already knows its name.
            - --read-only
            {{- end }}
            {{- with $s.toolsets }}
            - --toolsets={{ join "," . }}
            {{- end }}
          {{- with $s.env }}
          env:
{{ toYaml . | indent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $s.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          {{- with $s.resources }}
          resources:
{{ toYaml . | indent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $s.port }}
      targetPort: http
{{- if $s.rbac.create }}
{{- /*
The server's own grants — the first of the two walls. Same vocabulary as the
parent's global.agentops.runtime.rbacMode (readonly = "view" plus the
cluster-scoped and metrics reads "view" omits), bound to the SERVER's SA and
derived from that mode unless set. Revoking these removes the agent's MCP reach
without touching the runtime SA.
*/ -}}
{{- if eq $rbacMode "readonly" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $sa }}-view
  labels:
    app.kubernetes.io/name: {{ $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $sa }}-cluster-ro
  labels:
    app.kubernetes.io/name: {{ $name }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $sa }}-cluster-ro
  labels:
    app.kubernetes.io/name: {{ $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $sa }}-cluster-ro
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- else if eq $rbacMode "full" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $sa }}-cluster-admin
  labels:
    app.kubernetes.io/name: {{ $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- else }}
{{- fail (printf "k8s-bundle: mcpServers.rbac.mode must be \"readonly\" or \"full\" (null derives it from global.agentops.runtime.rbacMode), got %q" $rbacMode) }}
{{- end }}
{{- end }}
{{- end }}

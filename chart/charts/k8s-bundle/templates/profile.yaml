{{- /*
Profile component: who the agent is, and what executes it.

The identity chain the RBAC component rides on:
  AgentProfile.runtimeRef -> AgentRuntime.serviceAccountName -> that SA's RBAC
and a profile with no runtimeRef falls back to the AgentRuntime named "default",
which is why runtime.name defaults to it.
*/ -}}
{{- if and (include "k8s-bundle.active" .) .Values.profile.enabled }}
{{- $p := .Values.profile }}
{{- $rt := $p.runtime }}
{{- if $rt.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k8s-bundle.runtimeServiceAccount" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-k8s-bundle
---
apiVersion: agentops.dev/v1alpha1
kind: AgentRuntime
metadata:
  name: {{ $rt.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-k8s-bundle
spec:
  image: {{ $rt.image | quote }}
  # the agent's security identity — its RBAC IS its power
  serviceAccountName: {{ include "k8s-bundle.runtimeServiceAccount" . }}
  idleTtlMinutes: {{ $rt.idleTtlMinutes }}
  {{- with $rt.homePvcRef }}
  home:
    pvcRef:
      name: {{ . }}
  {{- end }}
  {{- with $rt.resources }}
  resources:
{{ toYaml . | indent 4 }}
  {{- end }}
  env:
    - name: {{ $rt.credentialsSecret.envName }}
      valueFrom:
        secretKeyRef:
          name: {{ $rt.credentialsSecret.name }}
          key: {{ $rt.credentialsSecret.key }}
---
{{- end }}
apiVersion: agentops.dev/v1alpha1
kind: AgentProfile
metadata:
  name: {{ $p.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-k8s-bundle
spec:
  # Identity only — no repository, and no capabilities. What this agent may DO
  # comes from the Pipelines routing it: the events Pipeline for event-driven
  # conversations, and the capability Pipeline below for everything else
  # (POST /task, /<profile> commands).
  maxTurns: {{ $p.maxTurns }}
  {{- if $p.runtimeRef }}
  runtimeRef:
    name: {{ $p.runtimeRef }}
  {{- else if and $rt.create (ne $rt.name "default") }}
  runtimeRef:
    name: {{ $rt.name }}
  {{- end }}
{{- if $p.addressable.create }}
{{- $bt := (.Values.global | default dict).builtinToolsets | default dict }}
{{- if not $bt.enabled }}
{{- fail "k8s-bundle: profile.addressable.create needs global.builtinToolsets, which is disabled — enable it, or set profile.addressable.create=false and write your own Pipeline" }}
{{- end }}
---
# An ADDRESSABLE Pipeline for the shipped agent: the task API names a Pipeline,
# so the demo needs one to name. It routes nothing (no sources, no channels) and
# carries no special meaning — it is an ordinary route that declares what its
# conversations may do, like every other Pipeline.
apiVersion: agentops.dev/v1alpha1
kind: Pipeline
metadata:
  name: {{ $p.addressable.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-k8s-bundle
spec:
  profileRef:
    name: {{ $p.name }}
  toolsets:
    refs:
      - name: {{ $bt.observe.name }}
      {{- if $p.addressable.grantShell }}
      - name: {{ $bt.shell.name }}
      {{- end }}
{{- end }}
{{- end }}

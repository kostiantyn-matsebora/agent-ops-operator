{{- /*
Profile component: who the agent is, and what executes it.

The identity chain the RBAC component rides on:
  AgentProfile.runtimeRef -> AgentRuntime.serviceAccountName -> that SA's RBAC
and a profile with no runtimeRef falls back to the AgentRuntime named "default",
which is why runtime.name defaults to it.
*/ -}}
{{- if and (include "k8s-bundle.active" .) .Values.profile.enabled }}
{{- $p := .Values.profile }}
{{- $rt := $p.runtime }}
{{- if $rt.create }}
{{- if $rt.credentialsSecret.token }}
# Created because profile.runtime.credentialsSecret.token was supplied, so the
# agent's credential is provisioned with the release instead of being a
# prerequisite someone has to remember. The AgentRuntime below references it by
# NAME only — the manager reads no Secrets, the kubelet resolves it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $rt.credentialsSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-k8s-bundle
type: Opaque
stringData:
  {{ $rt.credentialsSecret.key }}: {{ $rt.credentialsSecret.token | quote }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k8s-bundle.runtimeServiceAccount" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-k8s-bundle
---
apiVersion: agentops.dev/v1alpha1
kind: AgentRuntime
metadata:
  name: {{ $rt.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-k8s-bundle
spec:
  image: {{ $rt.image | quote }}
  # the agent's security identity — its RBAC IS its power
  serviceAccountName: {{ include "k8s-bundle.runtimeServiceAccount" . }}
  idleTtlMinutes: {{ $rt.idleTtlMinutes }}
  {{- with $rt.nodeSelector }}
  nodeSelector:
{{ toYaml . | indent 4 }}
  {{- end }}
  {{- with $rt.homePvcRef }}
  home:
    pvcRef:
      name: {{ . }}
  {{- end }}
  {{- with $rt.resources }}
  resources:
{{ toYaml . | indent 4 }}
  {{- end }}
  env:
    - name: {{ $rt.credentialsSecret.envName }}
      valueFrom:
        secretKeyRef:
          name: {{ $rt.credentialsSecret.name }}
          key: {{ $rt.credentialsSecret.key }}
---
{{- end }}
apiVersion: agentops.dev/v1alpha1
kind: AgentProfile
metadata:
  name: {{ $p.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-k8s-bundle
spec:
  # Identity only — no repository, and no capabilities. What this agent may DO
  # comes from the Pipelines routing it: the events Pipeline for event-driven
  # conversations, and the capability Pipeline below for everything else
  # (POST /task, /<profile> commands).
  maxTurns: {{ $p.maxTurns }}
  {{- with $p.systemPrompt }}
  # Inline role, because this profile has no repository to hold a definition
  # file. Appended to the runtime's system prompt; it grants nothing.
  systemPrompt: |
{{ . | trim | indent 4 }}
  {{- end }}
  {{- if $p.runtimeRef }}
  runtimeRef:
    name: {{ $p.runtimeRef }}
  {{- else if and $rt.create (ne $rt.name "default") }}
  runtimeRef:
    name: {{ $rt.name }}
  {{- end }}
{{- end }}

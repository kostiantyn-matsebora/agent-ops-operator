{{- /*
Profile component: WHO the agent is and HOW it behaves. One object.

Not what executes it: the AgentRuntime, its ServiceAccount, its credential and
that SA's RBAC are the parent chart's (`runtime:` and
`global.agentops.runtime.*`), because they are release-wide facts and not a
Kubernetes-bundle concern. A profile with no runtimeRef falls back to the
AgentRuntime named "default", which the parent renders whenever runtime.enabled
is true; profile.runtimeRef names a different one you applied yourself.
*/ -}}
{{- if and (include "k8s-bundle.active" .) .Values.profile.enabled }}
{{- $p := .Values.profile }}
apiVersion: agentops.dev/v1alpha1
kind: AgentProfile
metadata:
  name: {{ $p.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-k8s-bundle
spec:
  # Behaviour only — no repository, and no capabilities. What this agent may DO
  # comes from the Pipelines routing it: the bundle's own wiring component when
  # it is on, otherwise whatever the install declared.
  maxTurns: {{ $p.maxTurns }}
  {{- with $p.systemPrompt }}
  # Inline role, because this profile has no repository to hold a definition
  # file. Appended to the runtime's system prompt; it grants nothing.
  systemPrompt: |
{{ . | trim | indent 4 }}
  {{- end }}
  {{- with $p.runtimeRef }}
  runtimeRef:
    name: {{ . }}
  {{- end }}
{{- end }}

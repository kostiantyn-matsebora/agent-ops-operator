{{- /*
Events component: the adapter implementation, the Events permissions its
ServiceAccount needs, and (optionally) the turnkey lane — a SignalSource AND the
Pipeline claiming it.

The source and the Pipeline are rendered together on purpose. Wiring is
pipeline-only: a SignalSource nobody claims reports Wired=False and DROPS every
signal, so shipping the source alone would look installed and quietly do
nothing.
*/ -}}
{{- if and (include "k8s-bundle.active" .) .Values.eventsAdapter.enabled }}
{{- $ea := .Values.eventsAdapter }}
{{- $adapterSA := include "k8s-bundle.adapterServiceAccount" . }}
apiVersion: agentops.dev/v1alpha1
kind: SignalAdapter
metadata:
  name: {{ $ea.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-k8s-bundle
spec:
  image: {{ printf "%s:%s" $ea.image.repository (toString $ea.image.tag) | quote }}
  # This adapter's DATA SOURCE is the Kubernetes API, so it mounts its own SA
  # token. That grants nothing by itself — the RBAC below does, bound by this
  # chart to the adapter's deterministic SA name.
  kubernetesAccess: true
  # Two watchers would post every event twice.
  singleton: true
  {{- with $ea.resources }}
  resources:
{{ toYaml . | indent 4 }}
  {{- end }}
  # Interface metadata: makes `kubectl get signaladapter` answer "what goes in
  # spec.config?" without reading adapter source.
  configSchema:
    type: object
    properties:
      severities:
        type: array
        description: 'Event type values to act on (default ["Warning"]).'
        items:
          type: string
          enum: ["Normal", "Warning"]
      namespaces:
        type: array
        description: Namespaces to watch; empty = all the RBAC allows.
        items:
          type: string
      includeReasons:
        type: array
        description: When non-empty, only these Event reasons produce signals.
        items:
          type: string
      excludeReasons:
        type: array
        description: >-
          Event reasons to drop, applied after includeReasons. Superseded by
          rules; translated into leading drop rules for compatibility.
        items:
          type: string
      includeOwnNamespace:
        type: boolean
        description: >-
          Stop excluding the operator's own namespace wholesale. Relaxes ONLY
          that mechanism — events about agent-ops' own pods are still dropped
          by name prefix and by owner, and no configuration can re-admit them.
      rules:
        type: array
        description: >-
          Ordered, first-match-wins suppression policy. Each rule selects with
          Alertmanager matchers and either drops or holds for `for`, after
          which the involved object is re-checked before emitting.
        items:
          type: object
          properties:
            matchers:
              type: array
              description: >-
                Alertmanager matcher syntax over the signal's labels
                (=, !=, =~, !~). `reason` is available as an alias for
                alertname. Empty = catch-all.
              items:
                type: string
            for:
              type: string
              description: >-
                Dwell before re-checking, e.g. "5m". "0" emits immediately —
                required for reasons describing something that ALREADY
                happened (OOMKilling, Evicted), where a re-check would find
                the healthy replacement and erase the incident.
            action:
              type: string
              description: '"drop" suppresses outright; absent means dwell and verify.'
              enum: ["drop"]
            escalateAfterObjects:
              type: integer
              description: >-
                Emit early once this many distinct objects of one workload are
                pending, so a long dwell cannot hide a whole-workload outage.
      route:
        type: object
        description: The Alertmanager half of the policy.
        properties:
          inhibitRules:
            type: array
            items:
              type: object
              properties:
                sourceMatchers:
                  type: array
                  items:
                    type: string
                targetMatchers:
                  type: array
                  items:
                    type: string
                equal:
                  type: array
                  description: Labels that must be equal on cause and target.
                  items:
                    type: string
{{- if $ea.rbac.create }}
---
{{- if $ea.rbac.clusterWide }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $adapterSA }}-events
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # Read-only pods/replicasets: the adapter resolves an event's WORKLOAD through
  # owner references (Pod -> ReplicaSet -> Deployment) and re-checks whether the
  # involved object is still unhealthy before emitting. Without this grant it
  # reports Ready=False naming the missing permission rather than silently
  # emitting per-pod signals again.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $adapterSA }}-events
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $adapterSA }}-events
subjects:
  - kind: ServiceAccount
    name: {{ $adapterSA }}
    namespace: {{ .Release.Namespace }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $adapterSA }}-events
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # Namespaced identically to the events grant on purpose: the adapter scopes
  # its pod/replicaset watches to the same namespaces it watches events in, so
  # a broader grant would be unused and a narrower one would 403.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $adapterSA }}-events
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $adapterSA }}-events
subjects:
  - kind: ServiceAccount
    name: {{ $adapterSA }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
{{- if $ea.source.create }}
{{- $src := $ea.source }}
---
apiVersion: agentops.dev/v1alpha1
kind: SignalSource
metadata:
  name: {{ $src.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-k8s-bundle
spec:
  # a REFERENCE to the SignalAdapter CR above — its implementation defines the
  # schema of the config below
  adapter: {{ $ea.name }}
  {{- with $src.grouping }}
  grouping:
{{ toYaml . | indent 4 }}
  {{- end }}
  {{- /* Built as a map so an all-empty config omits the key entirely: emitting
  a bare `config:` would set spec.config to null rather than leave it unset. */}}
  {{- $cfg := dict }}
  {{- with $src.severities }}{{ $_ := set $cfg "severities" . }}{{ end }}
  {{- with $src.namespaces }}{{ $_ := set $cfg "namespaces" . }}{{ end }}
  {{- with $src.includeReasons }}{{ $_ := set $cfg "includeReasons" . }}{{ end }}
  {{- with $src.excludeReasons }}{{ $_ := set $cfg "excludeReasons" . }}{{ end }}
  {{- with $src.rules }}{{ $_ := set $cfg "rules" . }}{{ end }}
  {{- with $src.route }}{{ $_ := set $cfg "route" . }}{{ end }}
  {{- if $src.includeOwnNamespace }}{{ $_ := set $cfg "includeOwnNamespace" true }}{{ end }}
  {{- if $cfg }}
  config:
{{ toYaml $cfg | indent 4 }}
  {{- end }}
{{- end }}
{{- end }}

apiVersion: v2
name: telegram
description: >-
  Telegram bundle for the agent-ops operator: the three-component ingest stack
  (router as the single getUpdates consumer, signal adapter for origination,
  channel adapter for continuation and delivery) and — when the chat surface is
  configured — the Channel and the chat SignalSource. Ships no Pipeline:
  NOTES.txt prints the one to apply.
type: application
version: 0.5.2

{{- /*
The single getUpdates consumer — a plain Deployment this chart owns.

It is NOT an adapter. It produces no signals and serves no CR: it reads the bot
token and forwards each update to whichever of the two real adapters should
handle it. Modelling it as a SignalAdapter would mean inventing a SignalSource
that emits nothing, purely as an envelope for credentials — and that source
would then sit at Wired=False until some Pipeline claimed a lane it can never
feed. The chart renders both target adapters, so the chart already knows both
Service URLs; injecting them as env is the whole configuration problem solved.

singleton is structural here: one Deployment per bot token, replicas 1 with
Recreate, so a rollout never briefly runs two pollers. Two routers on one token
means 409s and stolen updates.

Rendered with the surface, because without a bot token there is nothing to poll.
*/ -}}
{{- if and (include "telegram.active" .) (include "telegram.surfaceEnabled" .) }}
{{- $r := .Values.router }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops-gateway-telegram
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-gateway-telegram
spec:
  replicas: 1
  strategy:
    # never two pollers, not even for a moment during a rollout
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agentops-gateway-telegram
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentops-gateway-telegram
    spec:
      # It talks to Telegram and to two in-cluster Services. It has no reason
      # to reach the Kubernetes API, and no ServiceAccount token to do it with.
      automountServiceAccountToken: false
      containers:
        - name: router
          image: {{ printf "%s:%s" $r.image.repository (toString $r.image.tag) | quote }}
          ports:
            # POST /telegram/call/{method} -- channel-telegram's outbound
            # Bot API relay (chat-ops-broker-telegram-gateway). No Service
            # existed here before this: the router used to have nothing
            # pushed TO it.
            - name: call
              containerPort: {{ $r.callPort | default 8080 }}
          env:
            - name: SIGNAL_TARGET
              value: {{ include "telegram.signalTarget" . | quote }}
            - name: CHANNEL_TARGET
              value: {{ include "telegram.channelTarget" . | quote }}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  # the SAME Secret the Channel sends with: one bot, one token
                  name: {{ include "telegram.secretName" . }}
                  key: botToken
            - name: LISTEN_ADDR
              value: {{ printf ":%d" (int ($r.callPort | default 8080)) | quote }}
            - name: TELEGRAM_CALL_TOKEN
              valueFrom:
                secretKeyRef:
                  # the gateway binding Secret -- the SAME value
                  # channel-telegram's projected credential carries, so its
                  # calls authenticate here.
                  name: {{ include "telegram.gatewaySecretName" . }}
                  key: gatewayToken
            {{- with .Values.apiBase }}
            # optional: absent takes the real host silently, unlike the three above
            - name: TELEGRAM_API_BASE
              value: {{ . | quote }}
            {{- end }}
            {{- with $r.env }}
{{ toYaml . | indent 12 }}
            {{- end }}
          {{- with $r.resources }}
          resources:
{{ toYaml . | indent 12 }}
          {{- end }}
---
# channel-telegram's one path to the gateway's outbound relay. The reconciler
# owns no Service for the router (it is not an adapter CR), so this chart
# names and renders it itself, exactly as it already does the Deployment.
apiVersion: v1
kind: Service
metadata:
  name: agentops-gateway-telegram
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-gateway-telegram
spec:
  selector:
    app.kubernetes.io/name: agentops-gateway-telegram
  ports:
    - name: call
      port: {{ $r.callPort | default 8080 }}
      targetPort: call
{{- end }}

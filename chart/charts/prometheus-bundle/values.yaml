# Prometheus/Alertmanager bundle: alert ingest, metrics tooling, the agent that
# answers, and its opt-in route. VictoriaMetrics is a supported backend, not the
# subject — it serves the Prometheus query API and MetricsQL is a PromQL
# superset, so one server key covers both. See docs/prometheus-bundle.md.
# Override under the `prometheus-bundle:` key of the parent chart's values.
# The bundle ships NO SUBSTRATE: runtime, runtime SA, credential and runtime
# RBAC are the parent chart's.
enabled: false

alertmanager:
  # The webhook-receiving signal adapter component: the SignalAdapter CR only.
  enabled: true
  # SignalAdapter CR name, and the routing key sources name in spec.adapter.
  name: alertmanager
  image:
    repository: kmatsebora/agentops-signal-alertmanager
    tag: 0.7.0
  resources: {}
  # Sender self-registration. VICTORIAMETRICS ONLY — it writes a
  # VMAlertmanagerConfig, and vanilla Alertmanager has no such object.
  # Vanilla senders use the receiver stanza printed in NOTES.txt instead.
  registration:
    enabled: false
    # Namespace for the VMAlertmanagerConfig; empty = the release namespace.
    namespace: ""
    # Matchers selecting which alerts reach this source (Alertmanager syntax).
    matchers: []
    # Route timing (Alertmanager duration strings; empty = inherit).
    groupWait: ""
    groupInterval: ""
    repeatInterval: ""
    # Cap alerts per webhook post (0 = Alertmanager default).
    maxAlerts: 0
    sendResolved: false
  # WHO MAY POST WEBHOOKS HERE, when global.agentops.networkPolicy is on.
  #
  # Normally the namespace your Alertmanager runs in. Raw NetworkPolicyPeer
  # entries, exactly like the parent chart's networkPolicy lists.
  #
  # EMPTY LEAVES THIS ADAPTER UNRESTRICTED, deliberately: a policy naming nobody
  # would deny the alert lane, and a severed alert path is discovered during an
  # incident. Under-restricting is the recoverable mistake here.
  #
  #   webhookFrom:
  #     - namespaceSelector:
  #         matchLabels:
  #           kubernetes.io/metadata.name: monitoring
  webhookFrom: []
  # The alert source. INERT until a Pipeline claims it — the `pipelines:`
  # component below, or a route under the parent chart's `pipelines:`.
  defaultSource:
    enabled: false
    # SignalSource CR name, and the {source} segment of the webhook URL.
    name: alerts
    # Secret holding this source's bearer token; empty = unauthenticated.
    # NOTES.txt prints the matching Alertmanager authorization stanza.
    credentialsSecretRef: ""
    # SignalSource grouping policy (manager-side; defaults apply when empty).
    grouping: {}

# Metrics access as MCP tools: the MCPConfig (the server) and the MCPToolset
# (permission to call it). Both matter — a config without the toolset gives an
# agent a server it may not call. OFF by default, paired with `mcpServers`,
# because the backend endpoint is operator-supplied by definition.
mcp:
  enabled: false
  # MCPConfig CR name (what Pipelines put in mcpConfigs.refs).
  name: prometheus-api
  # Query endpoint of the MCP server. REQUIRED unless mcpServers deploys one.
  # Never derived: single-node VM serves /api/v1, cluster mode
  # /select/<accountID>/prometheus/api/v1, Prometheus its own external URL.
  url: ""
  # http (streamable HTTP, path /mcp) or sse (path /sse). Also starts the
  # deployed workload in this mode — the server speaks only one at a time.
  transport: http
  # Optional header entries; valueFrom secret refs resolved in the runtime pod.
  headers: []
  toolset:
    name: prometheus-observability
    # Wildcarded, unlike k8s-bundle's split lists: all six tools this server
    # registers are read-only, so there is no risk boundary to preserve.
    # The pinned image tag is what keeps that true across upgrades.
    tools:
      - "mcp__prometheus__*"

# The MCP server WORKLOAD, sibling of `mcp` (which renders only the CRs).
# Its own ServiceAccount, never the runtime's — setting them equal fails the
# render. It needs NO Kubernetes RBAC: it reads an HTTP endpoint, not the API.
mcpServers:
  enabled: false
  image:
    # Six read-only tools: execute_query, execute_range_query, list_metrics,
    # get_metric_metadata, get_targets, health_check.
    repository: ghcr.io/pab1it0/prometheus-mcp-server
    tag: "1.6.2"
  # REQUIRED when enabled: the Prometheus-API endpoint the server queries,
  # e.g. http://vmsingle-vm.monitoring.svc:8429 or http://prometheus:9090
  backend: ""
  port: 8080
  serviceAccountName: agentops-mcp-prometheus
  # Extra env passthrough, appended after the rendered defaults.
  env: []
  resources: {}

# The agent that answers alerts. IDENTITY ONLY — one AgentProfile, nothing else.
profile:
  enabled: true
  name: alert-investigator
  # No repository, so no .claude/agents/<name>.md can be resolved — without this
  # inline role an alert would reach a personality-free agent.
  systemPrompt: |
    You are an on-call engineer triaging a Prometheus alert.

    The mcp__prometheus__* tools are how you reach the metrics backend. They are
    read-only and they are your only source of evidence: the runtime image ships
    no query CLI, so if a tool you need is not in your allowlist, say so plainly
    rather than guessing.

    Query before you conclude. An alert tells you a rule fired, not why. Look at
    the series the alert names, check whether it is still firing now, and look at
    enough history to tell a spike from a trend before you commit to a cause.

    State the likely cause and show the evidence that supports it — the query you
    ran and what it returned. If the data does not support a conclusion, say what
    you would need instead of inventing one.

    You cannot change anything. Recommend the fix; do not describe yourself as
    having applied it.

    Answer briefly. Lead with the finding, then the evidence.
  maxTurns: 40
  # Names an AgentRuntime other than the parent's `default`; empty falls back.
  runtimeRef: ""

# The bundle's OWN route — the one component that spends money and acts alone.
# OFF by default and forced on by nothing: no turnkey mode enables this bundle,
# so unlike k8s-bundle's there is no demo path to override.
pipelines:
  enabled: false
  # Named for the job, not the channel it answers on.
  name: alert-triage
  # Display only — see k8s-bundle's `pipelines.observe.icon`.
  icon: aops:alert
  # Channels to deliver to, BY NAME — the one object the bundle does not render,
  # so the key is omitted entirely when empty. Empty works: the conversation
  # dispatches immediately and the answer lands in status.runs[].result.
  channels: []

{{- /* Wiring component: the bundle's OWN route, claiming the source it renders
with the profile it renders. Permitted because the bundle owns its whole lane —
a channel is the only foreign name, and that is values-supplied. ONE route: a
query server is read-only, so there is no second posture to express. */ -}}
{{- if and (include "prometheus-bundle.wiringActive" .) .Values.profile.enabled }}
{{- $p := .Values.pipelines }}
{{- $g := .Values.global | default dict }}
{{- $am := .Values.alertmanager }}
{{- $mcp := .Values.mcp }}
{{- /* Every ref is emitted only when the object it names is rendered. */ -}}
{{- $sources := list }}
{{- if and $am.enabled $am.defaultSource.enabled }}{{ $sources = append $sources $am.defaultSource.name }}{{ end }}
{{- $tools := list }}
{{- if dig "builtinToolsets" "enabled" false $g }}
{{- $tools = append $tools (dig "builtinToolsets" "observe" "name" "agentops-observe" $g) }}
{{- end }}
{{- $mcpConfigs := list }}
{{- if $mcp.enabled }}
{{- $tools = append $tools $mcp.toolset.name }}
{{- $mcpConfigs = append $mcpConfigs $mcp.name }}
{{- end }}
apiVersion: agentops.dev/v1alpha1
kind: Pipeline
metadata:
  name: {{ $p.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-prometheus-bundle
spec:
  {{- with $p.icon }}
  # Display only: how this route is recognised in a chat command menu or the
  # console's typeahead. Nothing routes on it.
  icon: {{ . | quote }}
  {{- end }}
  profileRef:
    name: {{ .Values.profile.name }}
  {{- with $p.runtimeRef }}
  # WHAT EXECUTES this route. Unset resolves the AgentRuntime named `default`,
  # which the PARENT renders — no bundle renders a runtime, an identity or a
  # credential, and naming one here creates nothing.
  runtimeRef:
    name: {{ . }}
  {{- end }}
  {{- with ($p.serviceAccountName | default (include "prometheus-bundle.routeServiceAccount" (dict "ctx" $ "route" $p.name))) }}
  # UNDER WHOSE IDENTITY, overriding the runtime's own. The same decision as the
  # toolsets below — which tools, and with whose credentials — which is why both
  # are on this one object.
  #
  # The account is the PARENT's to render (`rbac.runtime.serviceAccounts`) or
  # yours to grant. This bundle renders no ServiceAccount.
  serviceAccountName: {{ . }}
  {{- end }}
  {{- with $sources }}
  # Without this claim the source reports Wired=False and DROPS every alert.
  signalSourceRefs:
    {{- range . }}
    - name: {{ . }}
    {{- end }}
  {{- end }}
  {{- with $p.channels }}
  # Values-supplied: the key is absent when nobody named a channel.
  channelRefs:
    {{- range . }}
    - name: {{ . }}
    {{- end }}
  {{- end }}
  {{- with $tools }}
  # Declared, not inherited: profiles carry no capabilities.
  toolsets:
    refs:
      {{- range . }}
      - name: {{ . }}
      {{- end }}
  {{- end }}
  {{- with $mcpConfigs }}
  mcpConfigs:
    refs:
      {{- range . }}
      - name: {{ . }}
      {{- end }}
  {{- end }}
{{- end }}

{{- /* MCPConfig (the server) + MCPToolset (permission to call it). Both matter.
The server key is FIXED at `prometheus` and has no values path: that key IS the
mcp__prometheus__* namespace, so a rename would silently strip an agent's tools. */ -}}
{{- if and (include "prometheus-bundle.active" .) .Values.mcp.enabled }}
{{- $mcp := .Values.mcp }}
{{- $url := $mcp.url }}
{{- if and (not $url) .Values.mcpServers.enabled }}
{{- $url = printf "http://%s.%s.svc:%v%s" (include "prometheus-bundle.mcpServerName" .) .Release.Namespace .Values.mcpServers.port (include "prometheus-bundle.mcpPath" .) }}
{{- end }}
{{- if not $url }}
{{- fail "prometheus-bundle: mcp.url is required when mcp.enabled=true (or enable the mcpServers component to run the MCP server in-cluster) — an MCPConfig pointing nowhere silently costs agents their tools" }}
{{- end }}
{{- if not (has $mcp.transport (list "http" "sse")) }}
{{- fail (printf "prometheus-bundle: mcp.transport must be \"http\" or \"sse\", got %q" $mcp.transport) }}
{{- end }}
apiVersion: agentops.dev/v1alpha1
kind: MCPConfig
metadata:
  name: {{ $mcp.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-prometheus-bundle
spec:
  servers:
    prometheus:
      type: {{ $mcp.transport }}
      url: {{ $url | quote }}
      {{- with $mcp.headers }}
      headers:
{{ toYaml . | indent 8 }}
      {{- end }}
---
apiVersion: agentops.dev/v1alpha1
kind: MCPToolset
metadata:
  name: {{ $mcp.toolset.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-prometheus-bundle
spec:
  tools:
{{ toYaml $mcp.toolset.tools | indent 4 }}
{{- end }}

{{- /*
The Secrets this bundle owns — rendered ONLY for a credential supplied as a
raw value rather than as an existing Secret's name. THREE independent
credentials, never shared: the ingest lane's registration token (plus an
optional HMAC signing secret), the observer MCP pair's token, and the
operator MCP pair's token.

Why the token form exists at all: a Secret referenced by name has to be
created out of band, and an install whose secrets live in a manager (Vault,
SOPS, external-secrets) has no natural place to do that. Given the token,
this chart creates the Secret itself.

The ingest Secret carries the keys signals/pulse/register.go reads directly
off envFrom (`token`, `signingSecret`) — no derived header value, since this
credential is never sent as an HTTP header. The two MCP Secrets ALSO derive
`authorization` ("Bearer <token>"), because a header value referencing a
Secret is substituted WHOLE and the scheme has to live inside it — the same
derivation home-assistant's credentials.yaml performs.

Nothing in the operator reads these. The adapter gets `token`/`signingSecret`
projected as env by the reconciler, and each MCP pair's header is resolved in
the runtime pod.
*/ -}}
{{- if include "pulse.active" . }}
{{- /* Validated HERE, unconditionally, rather than only where each secret is
consumed — a render with the ingest lane or an MCP pair off must still refuse
an ambiguous credential rather than silently ignoring it. */ -}}
{{- include "pulse.validateCredentialForm" (dict "label" "signal.credentials" "c" .Values.signal.credentials) }}
{{- include "pulse.validateCredentialForm" (dict "label" "mcp.observer.credentials" "c" .Values.mcp.observer.credentials) }}
{{- include "pulse.validateCredentialForm" (dict "label" "mcp.operator.credentials" "c" .Values.mcp.operator.credentials) }}
{{- $sc := .Values.signal.credentials }}
{{- if and .Values.signal.enabled $sc.token (not $sc.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pulse.ingestSecretCreatedName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-pulse
type: Opaque
stringData:
  token: {{ $sc.token | quote }}
  {{- with $sc.signingSecret }}
  signingSecret: {{ . | quote }}
  {{- end }}
{{- end }}
---
{{- $oc := .Values.mcp.observer.credentials }}
{{- if and .Values.mcp.observer.enabled $oc.token (not $oc.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pulse.observerSecretCreatedName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-pulse
type: Opaque
stringData:
  token: {{ $oc.token | quote }}
  # The complete header value: a header referencing a Secret is substituted
  # WHOLE, so the scheme has to be inside the secret rather than in front of
  # it.
  authorization: {{ printf "Bearer %s" $oc.token | quote }}
{{- end }}
---
{{- $pc := .Values.mcp.operator.credentials }}
{{- if and .Values.mcp.operator.enabled $pc.token (not $pc.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pulse.operatorSecretCreatedName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-pulse
type: Opaque
stringData:
  token: {{ $pc.token | quote }}
  authorization: {{ printf "Bearer %s" $pc.token | quote }}
{{- end }}
{{- end }}

# The reference agent runtime, as a bundle.
#
# ON BY DEFAULT, unlike every other bundle here, and that is the point rather
# than an inconsistency: this is what a fresh install executes on. Turn it off
# and declare your own runtime under the parent's `runtimes:`, or every route
# must name a `runtimeRef` of its own — the parent's default-runtime guard FAILS
# the render otherwise, naming the routes that needed it.
#
# WHY A BUNDLE AT ALL. `AgentRuntime` used to be the parent chart's alone, which
# meant a second vendor was a hand-written CR and an install using one still
# carried this one's image reference and credential shape. A vendor is domain,
# not substrate.
#
# WHAT IT DOES NOT SHIP, because that IS the substrate and stays the parent's:
# the runtime DEFAULTS every runtime inherits, the FLOOR ServiceAccount, and the
# context volume. This bundle declares one runtime and inherits the rest.
enabled: true

# The AgentRuntime CR name. `default` is what a Pipeline declaring no
# `runtimeRef` resolves to, so renaming it means every route needs one — and the
# parent's guard will say so rather than letting conversations queue forever.
name: default

# EVERYTHING ELSE IS INHERITED FROM `global.agentops.runtimeDefaults`, and the
# keys below override it for THIS runtime only. Leave them empty and this
# bundle renders exactly what the release-wide defaults describe — which is the
# whole reason those defaults are stated in full rather than left as the fields
# nothing else claimed.
#
# WHAT IS HERE RATHER THAN IN THE PARENT'S DEFAULTS: anything that names THIS
# VENDOR. The image below and the credential beneath it were release-wide once,
# which meant an install running Ollama still inherited claude-code's image
# reference and the environment variable `CLAUDE_CODE_OAUTH_TOKEN`. Extracting
# the CR without them left exactly the problem the extraction was for.
#
# Any key `global.agentops.runtimeDefaults` accepts is accepted here, and
# overrides it for THIS runtime only:
#
#   claude:
#     idleTtlMinutes: 10
#     nodeSelector:
#       kubernetes.io/arch: amd64
#     egressMediation:
#       enabled: false

# The reference runtime image, and the one place its tag is written.
#
# Override it to pin a DERIVED image of your own: what an agent may REACH is
# wiring, so adding tooling to an image never grants it anything — see
# docs/concepts.md#runtime-images-are-generic.
#
# 0.7.1 ends a run that keeps making a tool call it cannot FORM. Arguments that
# are not valid JSON are discarded before anything runs, so a run made of them
# looks busy and then answers from whatever the session already held — five
# identical unparsable calls in a row now fail the run and say which tool and
# what was written. RUNTIME_UNPARSED_REPEAT_LIMIT tunes it, 0 disables. A run
# that recovers instead — by abandoning the tool, which is what recovery usually
# means — carries one line on its answer saying how many calls never ran,
# because the answer itself does not mention it.
# 0.2.0+ composes the allowlist with the agent definition's own `tools:` and
# passes it verbatim — no substituted `Read` when nothing is declared. Pinning
# an older tag keeps that substitution and ignores toolsets.mode.
image: ghcr.io/kostiantyn-matsebora/agentops-runtime-claude:0.8.2

# WHERE THIS RUNTIME KEEPS ITS CONTEXT — include globs relative to $HOME, and
# the declaration that turns context synchronisation ON.
#
# A node reboot corrupted the shared context filesystem on 2026-08-20. The live
# context WAS that volume, so one damaged filesystem took every conversation's
# context AND stopped every runtime pod from starting. Declared, a sidecar keeps
# the live context pod-local and the durable volume holds a SNAPSHOT: a run
# already going survives the volume failing underneath it, and the agent
# container holds no mount of the volume at all.
#
# IT IS HERE, NOT IN `global.agentops.runtimeDefaults`, FOR THE SAME REASON THE
# IMAGE AND THE CREDENTIAL ARE. This value is claude-code's transcript layout —
# it means nothing to another backend, and those defaults are what EVERY runtime
# inherits. The key is spelled `contextSync` in both places, so the wrong one
# renders and looks correct until a second vendor is installed.
#
# RUNNING ANOTHER BACKEND MEANS REPLACING IT with that backend's own paths, in
# the same section that carries its image and credential. Clearing it disables
# the mechanism: the context volume is then mounted into the agent container
# directly, as it was before this existed.
#
# It also needs a durable context volume to snapshot to. With
# `persistence.context` off there is nothing to snapshot to, and the pod falls
# back to the unsynchronised one — ephemeral context, no sidecar, and the
# conversation told its context is not promised.
contextSync:
  paths:
    - ".claude/projects/-data-workspace/**"

# ONE secret with the model credential — a `claude setup-token` output or an
# Anthropic API key. Projected as env via valueFrom; the manager reads no
# Secrets.
#
# Supply `token` and this bundle CREATES the Secret, release-managed, the same
# way the telegram bundle handles its bot token — point it at a secret store
# from your helmfile and the credential is provisioned with the release. Leave
# it empty to reference a Secret you manage yourself.
#
# THIS IS THE ONE VALUE WITH NO DEFENSIBLE DEFAULT, and therefore the one thing
# an install must supply.
#
# Getting it wrong fails QUIETLY and late: the runtime pod is created, then sits
# in CreateContainerConfigError while conversations queue behind it, because the
# kubelet — not the manager — resolves the reference.
#
# THE KEY AND THE ENV VAR NAME THIS VENDOR, which is why they are here and not
# in the release-wide defaults. Another backend states its own on its own entry.
credentialsSecret:
  name: agentops-claude
  key: oauthToken
  envName: CLAUDE_CODE_OAUTH_TOKEN
  token: ""

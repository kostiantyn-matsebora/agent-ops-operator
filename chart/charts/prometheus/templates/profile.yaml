{{- /* Profile component: WHO the agent is and HOW it behaves. One object. The
runtime, its SA, its credential and that SA's RBAC are the parent chart's. */ -}}
{{- if and (include "prometheus.active" .) .Values.profile.enabled }}
{{- $p := .Values.profile }}
apiVersion: agentops.dev/v1alpha1
kind: AgentProfile
metadata:
  name: {{ $p.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-prometheus
spec:
  # Behaviour only — no repository, no capabilities. What this agent may DO comes
  # from the Pipelines routing it.
  maxTurns: {{ $p.maxTurns }}
  {{- with $p.systemPrompt }}
  # Inline role: with no repository there is no definition file to read.
  systemPrompt: |
{{ . | trim | indent 4 }}
  {{- end }}
  # REQUIRED, and with no default on purpose: `none` leaves output unformatted
  # unless this profile's prompt says otherwise, and `blocks` shapes it by
  # something the author never asked for. The author declares it.
  outputFormat: {{ $p.outputFormat }}
  {{- with $p.runtimeRef }}
  runtimeRef:
    name: {{ . }}
  {{- end }}
{{- end }}

{{- /* The MCP server WORKLOAD, decoupled from the CRs in mcp.yaml. It runs under
its own ServiceAccount and needs no Kubernetes RBAC — it reads an HTTP query
endpoint, not the API server — so none is rendered for it. */ -}}
{{- if and (include "prometheus.active" .) .Values.mcpServers.enabled }}
{{- $s := .Values.mcpServers }}
{{- $name := include "prometheus.mcpServerName" . }}
{{- $sa := include "prometheus.mcpServerServiceAccount" . }}
{{- if not $s.backend }}
{{- fail "prometheus: mcpServers.backend is required (the Prometheus-API endpoint the MCP server queries, e.g. http://vmsingle-vm.monitoring.svc:8429) — it is never derived, because single-node VictoriaMetrics, VictoriaMetrics cluster mode and Prometheus each serve the query API under a different path" }}
{{- end }}
{{- /* Naming one is still REFUSED if it is the runtime's. The guard outlives the
account not being rendered: an install pointing this workload at an account of
its own must still not point it at the one agents run as. */ -}}
{{- if and $sa (eq $sa (include "agentops.runtimeServiceAccount" .)) }}
{{- fail "prometheus: mcpServers.serviceAccountName must differ from global.agentops.runtime.serviceAccountName — sharing one collapses two walls into one" }}
{{- end }}
{{- /* NO ServiceAccount. This server reads a Prometheus query API over HTTP and
holds no Kubernetes grant, so it mounts no token — and an identity a pod never
presents to the API server is a name, not a boundary. Rendering one "in case a
grant is needed" is the placeholder this chart stopped writing.

`kubernetes`'s MCP server keeps its own account because it MOUNTS its token and
IS bound to a cluster grant. That is the difference, and it is the whole rule. */ -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
    spec:
      {{- /* NAMED ONLY IF THE INSTALL NAMES ONE. With no token mounted this pod
      never authenticates, so the account it runs as changes nothing it can
      reach — and an account rendered to be named here and nothing else is the
      placeholder this chart stopped writing. */}}
      {{- with $sa }}
      serviceAccountName: {{ . }}
      {{- end }}
      automountServiceAccountToken: false
      containers:
        - name: mcp
          image: {{ printf "%s:%s" $s.image.repository (toString $s.image.tag) | quote }}
          env:
            - name: PROMETHEUS_URL
              value: {{ $s.backend | quote }}
            # _SERVER_ is not optional in this name: the server defaults to
            # stdio, and a stdio process in a pod exits immediately.
            - name: PROMETHEUS_MCP_SERVER_TRANSPORT
              value: {{ .Values.mcp.transport | quote }}
            # Set explicitly rather than trusting the image's own default.
            - name: PROMETHEUS_MCP_BIND_HOST
              value: "0.0.0.0"
            - name: PROMETHEUS_MCP_BIND_PORT
              value: {{ $s.port | quote }}
            {{- with $s.env }}
{{ toYaml . | indent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $s.port }}
          # PROBED FROM INSIDE THE POD, over loopback.
          #
          # A kubelet probe originates on the NODE, and a node is not a pod, so
          # no NetworkPolicy peer can name it. This server is reached on the
          # same port it serves MCP on, so that port cannot simply be opened.
          # A tcpSocket probe here crash-looped the server behind the policy
          # protecting it — see the same note in kubernetes.
          #
          # An exec probe never leaves the pod's network namespace, so no policy
          # on any CNI can block it. The server answers 404 on `/` while the MCP
          # endpoint lives elsewhere, so this checks that it ANSWERS, not that a
          # particular route exists.
          readinessProbe:
            exec:
              command: ["sh", "-c", "curl -s -o /dev/null http://127.0.0.1:{{ $s.port }}/"]
          livenessProbe:
            exec:
              command: ["sh", "-c", "curl -s -o /dev/null http://127.0.0.1:{{ $s.port }}/"]
          {{- with $s.resources }}
          resources:
{{ toYaml . | indent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $s.port }}
      targetPort: http
{{- end }}

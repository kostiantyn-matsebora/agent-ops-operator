{{- /*
ONE RUNTIME IDENTITY PER ROUTE THIS BUNDLE SHIPS.

A bundle that ships Pipelines ships the accounts those Pipelines run as — it is
the only scope that knows what its own routes do.

IT HOLDS NO KUBERNETES RBAC, AND THAT IS CORRECT. This lane reaches a Prometheus
query API through an MCP server that has its own account — the agent's own pod
needs no Kubernetes permission to investigate an alert.

Add a grant with `pipelines.<route>.rbac.clusterRoles` / `.bindClusterRoles`, or
name your own account with `pipelines.<route>.serviceAccountName`, which
suppresses the one rendered here.
*/ -}}
{{- if and (include "prometheus.wiringActive" .) .Values.profile.enabled }}
{{- $p := .Values.pipelines }}
{{- $cfg := $p }}
{{- if include "prometheus.routeAccountRendered" (dict "ctx" $ "p" $p) }}
{{- $sa := include "prometheus.routeServiceAccount" (dict "ctx" $ "route" $p.name) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-prometheus
{{- $rbac := $cfg.rbac | default dict }}
{{- range $rbac.clusterRoles | default list }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $sa }}-{{ .name }}-{{ $.Release.Namespace }}
rules:
{{ toYaml .rules | indent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $sa }}-{{ .name }}-{{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $sa }}-{{ .name }}-{{ $.Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- range $rbac.bindClusterRoles | default list }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $sa }}-{{ . }}-{{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ . }}-{{ $.Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}

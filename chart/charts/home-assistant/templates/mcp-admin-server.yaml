{{- /* The admin MCP server WORKLOAD.

Rendered only when the bundle deploys its own — pointing `adminMcp.url` at a
server you already run (a HACS MCP integration inside Home Assistant, say)
renders the CRs and nothing here.

THE TWO WALLS HERE ARE NOT KUBERNETES ONES. The agent's reach through MCP is
(what this server may do in Home Assistant) ∩ (what the toolset grants), and the
first of those is a Home Assistant TOKEN, not a ServiceAccount.

SO IT RENDERS NO ServiceAccount. It held one, bound to nothing, with its token
unmounted — an identity the pod never presents to the API server, which makes it
a name rather than a boundary. It ran as that name for the same reason the
bundles rendered empty route accounts: "where a grant would go if one were ever
needed". A grant that is needed one day is a grant somebody writes down that
day, together with the account it binds to.

`kubernetes`'s MCP server keeps its account, and the difference is the whole
rule: that one MOUNTS its token and IS bound to a cluster grant.
*/ -}}
{{- if and (include "home-assistant.active" .) (include "home-assistant.adminMcpServerEnabled" .) }}
{{- $s := .Values.adminMcpServer }}
{{- $name := include "home-assistant.adminMcpServerName" . }}
{{- $secret := include "home-assistant.adminMcpSecret" . }}
{{- if not $secret }}
{{- fail "home-assistant: the admin MCP server needs a Home Assistant credential — set homeAssistant.credentials.operatorToken (or .operatorSecret, or adminMcpServer.credentialsSecret). Without one it starts, answers, and refuses every repair" }}
{{- end }}
{{- /* NAMING ONE IS STILL REFUSED IF IT IS THE RUNTIME'S. The guard survives the
account not being rendered: an install that points this workload at an account of
its own must still not point it at the one agents run as. */ -}}
{{- /* THE DEFAULT RUNTIME IDENTITY, from the block that still exists. This read
was left on `global.agentops.runtime.serviceAccountName` — a key that now FAILS
the render — so the guard could never fire on any install that renders at all. */ -}}
{{- $runtimeSA := dig "agentops" "runtimeDefaults" "serviceAccountName" "" (.Values.global | default dict) }}
{{- if and $runtimeSA $s.serviceAccountName (eq $s.serviceAccountName $runtimeSA) }}
{{- fail (printf "home-assistant: adminMcpServer.serviceAccountName (%s) must NOT be the runtime's ServiceAccount — sharing one collapses two walls into one" $s.serviceAccountName) }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-home-assistant
spec:
  selector:
    app.kubernetes.io/name: agentops-home-assistant
    app.kubernetes.io/component: mcp-ha
  ports:
    - name: http
      port: {{ $s.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-home-assistant
    app.kubernetes.io/component: mcp-ha
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentops-home-assistant
      app.kubernetes.io/component: mcp-ha
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentops-home-assistant
        app.kubernetes.io/component: mcp-ha
    spec:
      {{- /* Named only if the install names one — with no token mounted this pod
      never authenticates, so the account changes nothing it can reach. */}}
      {{- with $s.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      automountServiceAccountToken: false
      containers:
        - name: ha-mcp
          image: {{ printf "%s:%s" $s.image.repository (toString $s.image.tag) | quote }}
          # The env-driven HTTP entry point. Its names are read off the image
          # rather than its documentation, which describes the Home Assistant
          # ADD-ON — a different deployment with different ports.
          command: ["ha-mcp-web"]
          ports:
            - name: http
              containerPort: {{ $s.port }}
          env:
            - name: HOMEASSISTANT_URL
              value: {{ include "home-assistant.endpoint" . | quote }}
            - name: HOMEASSISTANT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: token
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: {{ $s.port | quote }}
            # Standard mode authenticates by URL-PATH SECRECY — there is no
            # token on the MCP endpoint. ClusterIP already bounds reach to the
            # cluster; set a high-entropy path on a shared one.
            - name: MCP_SECRET_PATH
              value: {{ $s.path | quote }}
            # No settings UI: this server is reached by one agent, not by people.
            - name: HA_MCP_DISABLE_SETTINGS_UI
              value: "1"
            # It calls pypi.org at startup otherwise, which an in-cluster
            # workload has no business doing.
            - name: MCP_DISABLE_UPDATE_CHECK
              value: "1"
            {{- with $s.env }}
{{ toYaml . | indent 12 }}
            {{- end }}
          {{- with $s.resources }}
          resources:
{{ toYaml . | indent 12 }}
          {{- end }}
{{- end }}

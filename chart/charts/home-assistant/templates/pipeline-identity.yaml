{{- /*
ONE RUNTIME IDENTITY PER ROUTE THIS BUNDLE SHIPS.

A bundle that ships Pipelines ships the accounts those Pipelines run as — it is
the only scope that knows what its own routes do.

THESE HOLD NO KUBERNETES RBAC AT ALL, AND THIS BUNDLE IS THE CASE THAT PROVES
THE RULE. Neither route touches the Kubernetes API: `ha-control` reaches Home
Assistant's Assist intents and `ha-ops` additionally reaches its REST API, both
over HTTP with a token from the profile's own env. A Home Assistant agent that
could delete a pod held that power for no capability it uses — which is exactly
what happened while every unnamed route inherited the release's account.

The bundle's privilege split — USE versus FIX — stays in the toolsets and the
credential. What these accounts add is that the split is no longer silently
undone by a Kubernetes grant neither route asked for.

Add a grant with `pipelines.<route>.rbac.clusterRoles` / `.bindClusterRoles`, or
name your own account with `pipelines.<route>.serviceAccountName`, which
suppresses the one rendered here.
*/ -}}
{{- if include "home-assistant.wiringActive" . }}
{{- $p := .Values.pipelines }}
{{- $routes := list }}
{{- if include "home-assistant.userProfileEnabled" . }}
{{- $routes = append $routes $p.control }}
{{- end }}
{{- if include "home-assistant.opsProfileEnabled" . }}
{{- $routes = append $routes $p.ops }}
{{- end }}
{{- range $cfg := $routes }}
{{- if not ($cfg.serviceAccountName | default ($p.serviceAccountName | default "")) }}
{{- $sa := include "home-assistant.routeServiceAccount" (dict "ctx" $ "route" $cfg.name) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-home-assistant
{{- $rbac := $cfg.rbac | default dict }}
{{- range $rbac.clusterRoles | default list }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $sa }}-{{ .name }}-{{ $.Release.Namespace }}
rules:
{{ toYaml .rules | indent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $sa }}-{{ .name }}-{{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $sa }}-{{ .name }}-{{ $.Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- range $rbac.bindClusterRoles | default list }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $sa }}-{{ . }}-{{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ . }}-{{ $.Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

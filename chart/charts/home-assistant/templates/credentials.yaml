{{- /*
The Secrets this bundle owns — rendered ONLY for a credential supplied as a
TOKEN rather than as an existing Secret's name.

Why the token form exists at all: a Secret referenced by name has to be created
out of band, and an install whose secrets live in a manager (Vault, SOPS,
external-secrets) has no natural place to do that. Given the token, this chart
creates the Secret and DERIVES BOTH KEYS from the one value — which also removes
the only wart of the by-name form, where `token` and `authorization` are two
spellings of one secret that a human has to keep in sync.

Nothing in the operator reads these. The adapter gets `token` projected as env by
the reconciler, and the MCP path sends `authorization` as a header resolved in
the runtime pod.
*/ -}}
{{- if include "home-assistant.active" . }}
{{- $c := .Values.homeAssistant.credentials }}
{{- if and $c.controlToken (not $c.controlSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "home-assistant.controlSecretCreatedName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-home-assistant
type: Opaque
stringData:
  token: {{ $c.controlToken | quote }}
  # The complete header value: a header referencing a Secret is substituted
  # WHOLE, so the scheme has to be inside the secret rather than in front of it.
  authorization: {{ printf "Bearer %s" $c.controlToken | quote }}
---
{{- end }}
{{- if and $c.operatorToken (not $c.operatorSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "home-assistant.operatorSecretCreatedName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-home-assistant
type: Opaque
stringData:
  token: {{ $c.operatorToken | quote }}
  authorization: {{ printf "Bearer %s" $c.operatorToken | quote }}
{{- end }}
{{- end }}

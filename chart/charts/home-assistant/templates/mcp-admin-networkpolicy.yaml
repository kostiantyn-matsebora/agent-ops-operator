{{- $np := (.Values.global.agentops).networkPolicy | default dict }}
{{- if and (include "home-assistant.active" .) (include "home-assistant.adminMcpServerEnabled" .) $np.enabled }}
{{- $s := .Values.adminMcpServer }}
{{- $name := include "home-assistant.adminMcpServerName" . }}
{{/*
  This server holds the Home Assistant OPERATOR token — the credential that can
  reconfigure the house. It authenticates nobody, so until this policy exists any
  pod in the cluster can use it.

  Runtime pods only, on the same terms as the Kubernetes MCP server.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-home-assistant
    app.kubernetes.io/component: mcp-ha
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mcp-ha
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agentops-runtime
        {{- with $np.probesFrom }}
        # The kubelet's probe, which reaches this server on the SAME port it
        # serves MCP on — so it cannot be opened to everyone the way the
        # manager's dedicated probe port can. Without it, on a CNI that does not
        # exempt host traffic, liveness fails and this server crash-loops.
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $s.port }}
{{- end }}

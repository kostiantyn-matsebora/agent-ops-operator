{{- /*
This bundle's ONE runtime, rendered through the PARENT's shared renderer so its
CR cannot drift from a runtime the install declares itself — the exact shape of
chart/charts/claude/templates/runtime.yaml.

`endpoint` and `model` become the env the runtime reads, through the parent's
`agentops.ollamaRuntimeEntry` — the same helper the parent uses when it copies
this runtime as `default`, so the copy carries the same env. Both are REQUIRED
once the bundle is enabled: a runtime pointed at nothing starts fine and fails
every run, which reads as a broken model rather than a missing value.

IT RENDERS NO SUBSTRATE. No floor ServiceAccount, no runtime defaults, no
context volume: a bundle contributes domain, and a vendor's runtime is domain.
*/ -}}
{{- if .Values.enabled }}
{{- include "agentops.renderRuntime" (dict "root" $ "entry" (fromYaml (include "agentops.ollamaRuntimeEntry" .Values))) }}
{{- end }}

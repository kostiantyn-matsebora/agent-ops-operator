# Home Assistant agent bundle: the house's log stream → conversations, TWO
# agents with different privilege, the tooling each may reach the house
# through, and the routes that connect them.
# Override under the `ha-bundle:` key of the parent chart's values.
#
# The WHOLE bundle is off by default and is turned on only directly
# (`enabled: true`). Demo mode never enables it: every component needs a Home
# Assistant endpoint and a credential no demo cluster has.
#
# The bundle ships NO SUBSTRATE: no AgentRuntime, no runtime ServiceAccount, no
# LLM credential, no runtime RBAC. Those are release-wide facts and live in the
# parent chart's `runtime:` block and `global.agentops.runtime.*`. Bundles
# contribute domain — sources, profiles, tooling — and reference what the parent
# provides.
#
# The SHAPE of this bundle is a PRIVILEGE SPLIT. Asking the house a question and
# administering it are two jobs, and they want two agents:
#
#   ha-user      reads state and reports. Reached by chat.
#   ha-operator  acts. Reached by NAME — `/ha-ops <task>` — so escalation is a
#                deliberate act rather than something a casual message triggers.
enabled: false

# WHERE the house is, and WHO this release talks to it as. Three components read
# these, so they are stated once here rather than three times below.
#
# TWO credentials, because they are two Home Assistant USERS doing two jobs:
#
#   control   USES the house — invokes services, turns on lights, runs
#             automations and scenes.
#   operator  FIXES the house — reloads and reconfigures integrations, repairs
#             what broke, changes configuration.
#
# NEITHER IS READ-ONLY. Home Assistant has no such role, so "control" is not a
# safe token that merely looks at things: it can act on every device exposed to
# it. What separates the two lanes is the JOB, and on the MCP path the TOOLSET
# is the wall. Say this out loud when deciding who may reach the surfaces below.
#
# Each credential comes EITHER as an existing Secret's name OR as the token
# itself. Both forms of one credential at once FAILS the render: two sources for
# one token is ambiguous.
#
#   controlSecret / operatorSecret   an EXISTING Secret you created, carrying the
#                                    token under key `token` AND the complete
#                                    header value under key `authorization`
#                                    ("Bearer <token>")
#   controlToken / operatorToken     the token itself. The bundle then creates
#                                    the Secret (agentops-ha-control /
#                                    agentops-ha-operator) and derives BOTH keys
#                                    from the one value, so there is nothing to
#                                    keep in sync.
#
# The token form is what a secret manager wants: hand it a reference your
# tooling resolves (Vault, SOPS, an external-secrets ref) and no Secret has to
# be created by hand.
homeAssistant:
  # Base URL, e.g. https://ha.example.org — or an in-cluster Service,
  # http://ha.ha.svc.cluster.local:8123. Required by every component.
  endpoint: ""
  credentials:
    # The everyday agent's credential, the MCP path's credential, and the
    # ingest lane's default.
    controlSecret: ""
    controlToken: ""
    # The fixing agent's credential — and the PREREQUISITE for its profile and
    # its route. With both forms empty the bundle installs a house that can be
    # used and questioned but never repaired.
    operatorSecret: ""
    operatorToken: ""
    # What the INGEST lane authenticates as. Empty = the OPERATOR credential.
    #
    # It has to be an ADMIN user, and that is Home Assistant's rule rather than
    # this chart's: `subscribe_events` is admin-only, and so are the
    # `system_log/list` backfill and the `config_entries/get` the dwell re-check
    # verifies with. A control token connects, passes auth, and is then refused
    # the subscription — which surfaces as an Unreachable source and reads like
    # a network problem.
    ingestSecret: ""

# The Home Assistant log ingest lane: adapter implementation and the source.
# NOT the wiring — that is the `pipelines:` component at the bottom of this file.
#
# Turn it off for an ASK-ONLY install: the agents still answer questions, the
# house just never starts one.
logsAdapter:
  enabled: true
  # SignalAdapter CR name — also the ROUTING KEY: SignalSources select this
  # implementation with spec.adapter: <name>.
  name: home-assistant
  image:
    repository: kmatsebora/agentops-signal-ha
    tag: 0.2.0
  resources: {}
  # The log source. It is INERT until a Pipeline claims it — wiring is
  # pipeline-only, so either turn the `pipelines:` component below on or declare
  # the claim under the parent chart's `pipelines:`. Unclaimed, the source drops
  # every record with Wired=False.
  source:
    create: true
    # SignalSource CR name — name it in a pipeline's signalSources.
    name: ha-logs
    # Secret holding the adapter's token. Empty = homeAssistant.credentials
    # .ingestSecret, then .operatorSecret. It must belong to an ADMIN user:
    # Home Assistant's event subscription is admin-only.
    credentialsSecret: ""
    # Log levels to act on. WARNING is Home Assistant's background hum —
    # deprecation notices, slow updates, sleepy devices — and watching it would
    # bury real problems and burn LLM credits.
    levels:
      - ERROR
      - CRITICAL
    # Optional integration filters. Superseded by `rules` below, and translated
    # into leading drop rules so there is one evaluation path.
    includeIntegrations: []
    excludeIntegrations: []
    # Read the existing log listing on connect and report what is newer than the
    # cursor. Off makes the lane lossy across restarts, on purpose only if you
    # want a restart to forget.
    backfill: true

    # The suppression policy. Ordered, FIRST MATCH WINS.
    #
    # Two halves, spelled after the systems they come from — the same vocabulary
    # the cluster Events lane uses, because it was worked out for this exact
    # problem. `rules` is the PROMETHEUS half: what counts as a problem and how
    # long it must hold (`for`). `route` is the ALERTMANAGER half: inhibition.
    # Dwell is deliberately not called `group_wait` — Alertmanager's group_wait
    # batches a group before its first notification and is NOT `for:`, which
    # does not exist in Alertmanager at all.
    #
    # `for` holds a matched record, then RE-CHECKS before emitting: the
    # integration's config entries loaded again (it recovered) or the record
    # never recurred (it stopped) means drop; still failing means emit once,
    # with the whole burst's evidence attached.
    #
    # Two properties make this set safe to trust, and both are pinned by test:
    #   * the LAST rule is a catch-all with a dwell, never a drop — so an error
    #     nobody anticipated is verified and reported rather than discarded;
    #   * every message pattern in the drop list has its underlying problem
    #     reported by some OTHER rule that is not dropped.
    #
    # Matchers select over the signal's labels — integration, logger, level,
    # location — plus `message`, which is the record's TEXT and is match-only:
    # it never becomes a label, because a label carrying free text would key
    # conversation grouping on the exact wording.
    rules:
      # 1 ── never actionable on their own ─────────────────────────────────
      # A slow update or a slow setup is Home Assistant telling you a device is
      # sleepy. If it is actually broken it also logs an error the tiers below
      # catch.
      - matchers:
          - message=~"(?s).*(took longer than the scheduled update interval|is taking over \\d+ seconds|Detected blocking call).*"
        action: drop

      # 2 ── PAST TENSE: these already happened ────────────────────────────
      # A dwell would re-check, find nothing wrong, and erase a real incident:
      # a script raises, the automation ends, and two minutes later the house is
      # serene. Never give these a dwell.
      - matchers:
          - message=~"(?s).*(Unexpected exception|Error executing script|Error doing job|Timer got out of sync|Error while processing).*"
        for: "0"
      # CRITICAL is Home Assistant's own judgement that something ended badly.
      - matchers:
          - level="CRITICAL"
        for: "0"

      # 3 ── integration setup: real, and it retries on its own ────────────
      # "not ready yet, will retry" is the single most common Home Assistant
      # error and it resolves itself constantly — a hub that boots slower than
      # the host, a cloud service rate-limiting a reconnect. Still failing five
      # minutes later is an incident.
      - matchers:
          - message=~"(?s).*(not ready yet|Error setting up entry|Setup failed for|Config entry .* could not).*"
        for: 5m

      # 4 ── connectivity: flappy by nature, escalate on breadth ───────────
      # escalateAfterObjects SHORTENS the dwell (to a quarter of it, floored at
      # 1m) when THREE code paths of one integration are pending — it does not
      # skip the wait. Firing on breadth alone reports every Home Assistant
      # restart, because a restart also makes everything fail at once.
      - matchers:
          - message=~"(?s).*(Timeout|timed out|Connection (lost|refused|reset|aborted)|Unable to connect|No route to host).*"
        for: 10m
        escalateAfterObjects: 3

      # 5 ── catch-all: everything unknown is KEPT, verified, reported ─────
      # MUST stay last and MUST stay a dwell.
      - matchers: []
        for: 3m

    # The Alertmanager half: INHIBITION — suppress the consequences of a cause
    # that is already reported. Empty by default, shown as a worked example.
    #
    # The canonical use here is a hub: a Z-Wave stick or a Zigbee coordinator
    # going away makes every device behind it log errors, and those are the same
    # incident from the wrong end.
    #
    #   route:
    #     inhibitRules:
    #       - sourceMatchers: ['integration="zwave_js"']
    #         targetMatchers: ['message=~"(?s).*unavailable.*"']
    #
    # NOTE: this adapter carries inhibition only. The TIME axis
    # (timeIntervals / muteTimeIntervals) exists on the cluster Events adapter
    # and is not implemented here — an unknown key is a config error, not a
    # window that silently never fires.
    route: {}

    # SignalSource grouping policy (manager-side; defaults apply when empty).
    #
    # Group by INTEGRATION. The alternative — grouping per record — would open a
    # conversation for every failing code path of one broken hub, and the
    # manager's window reuse could never fire.
    grouping:
      signatureLabels:
        - integration

# Structured Home Assistant access as MCP tools — an MCPConfig (the server) and
# MCPToolsets (the permission to call it).
#
# There is NO server workload to deploy, and that is the difference from the
# Kubernetes and Prometheus bundles: Home Assistant SERVES ITS OWN MCP endpoint
# (the built-in MCP Server integration, SSE at /mcp_server/sse). Enable that
# integration in Home Assistant and the endpoint below already exists.
#
# WITHOUT MCP the agents are not helpless — they fall back to the REST API with
# the token in their profile env, which is what `pipelines.restAccess` grants a
# shell toolset for. With MCP configured, that fallback is off by default and
# the toolsets below are the whole boundary.
mcp:
  enabled: true
  # MCPConfig CR name (what Pipelines put in mcpConfigs.refs).
  name: ha-api
  # The MCP endpoint. Empty = derived from homeAssistant.endpoint, which is
  # where the built-in integration serves.
  url: ""
  # Transport: sse is Home Assistant's own (path /mcp_server/sse). Set http only
  # when pointing at a different server that speaks streamable HTTP.
  transport: sse
  # Optional header passthrough. Empty = an Authorization header sourced from
  # the `authorization` key of the credential below, which is what makes a
  # default install work. Set it to point somewhere else entirely.
  headers: []
  # Which credential the MCP path authenticates with. Empty = the CONTROL
  # token, falling back to the operator one when no control token is set.
  #
  # Control on purpose, and it costs nothing: Home Assistant's MCP server
  # exposes ASSIST INTENTS — service calls — and every one of them is within a
  # control user's rights. The operator token's extra power is configuration,
  # which no MCP tool here reaches, so pointing this at the operator would widen
  # the shared path for no capability.
  #
  # This is the honest statement of where the wall is: ONE endpoint, ONE token,
  # and the toolsets below are what separate looking from doing.
  credentialsSecret: ""
  # TWO toolsets, split by risk. Reads and actions are separate CRs so granting
  # actions is a per-route decision.
  #
  # The server key in the rendered MCPConfig is FIXED at `homeassistant` and has
  # no values path: that key IS the mcp__homeassistant__* namespace named in
  # every allowlist, so a values rename would silently strip an agent's tools.
  #
  # Tools are ENUMERATED, not `mcp__homeassistant__*`. A wildcard spans both
  # halves and would defeat the split — it is precisely the thing this replaces.
  #
  # WHICH tools exist is decided by YOUR house: Home Assistant's MCP server
  # registers the Assist intents your instance exposes, so the lists below are a
  # starting point to check against your own /mcp_server, not a contract. A name
  # that resolves to nothing is inert, and a tool you use that is missing here
  # is a values edit.
  toolsets:
    observe:
      name: ha-observability
      tools:
        - "mcp__homeassistant__GetLiveContext"
        - "mcp__homeassistant__HassGetState"
        - "mcp__homeassistant__HassGetWeather"
        - "mcp__homeassistant__HassGetCurrentDate"
        - "mcp__homeassistant__HassGetCurrentTime"
        - "mcp__homeassistant__todo_get_items"
    actions:
      # Rendered whenever the MCP component is, and NOT gated on a credential:
      # Home Assistant registers the same Assist intents for any user, so there
      # is no read-only server mode to detect. Set false to ship a strictly
      # looking install whose agents cannot touch a device through MCP.
      #
      # Named for what it does, not for a privilege level. These are service
      # calls — the everyday `ha-control` route binds them, because invoking
      # them IS that agent's job.
      enabled: true
      name: ha-actions
      tools:
        - "mcp__homeassistant__HassTurnOn"
        - "mcp__homeassistant__HassTurnOff"
        - "mcp__homeassistant__HassLightSet"
        - "mcp__homeassistant__HassSetPosition"
        - "mcp__homeassistant__HassClimateSetTemperature"
        - "mcp__homeassistant__HassMediaPause"
        - "mcp__homeassistant__HassMediaUnpause"
        - "mcp__homeassistant__HassMediaNext"
        - "mcp__homeassistant__HassVacuumStart"
        - "mcp__homeassistant__HassVacuumReturnToBase"
        - "mcp__homeassistant__HassBroadcast"
        - "mcp__homeassistant__HassCancelAllTimers"
        - "mcp__homeassistant__HassListAddItem"

# THE ADMIN MCP PATH — how `ha-ops` reaches everything Assist intents cannot.
#
# WHY THIS EXISTS. Home Assistant's built-in MCP server (the `mcp:` component
# above) exposes Assist INTENTS: turn things on and off. It cannot read a log,
# reload an integration, or disable an entity — those live in the entity and
# config-entry registries, which Home Assistant serves over its WEBSOCKET API.
# An ops agent without this component reports "no such capability exists in my
# toolset" and hands the job back, which is exactly what it did.
#
# OFF by default. It is a separate server holding a token that can change your
# whole house, and turning it on is a decision, not a default.
#
# TWO WAYS TO HAVE ONE, and the chart supports both:
#
#   1. Let the chart deploy it — set `adminMcpServer.enabled: true` and the
#      bundle runs ha-mcp in-cluster under its own ServiceAccount. Nothing is
#      installed inside Home Assistant. This is the path for HA Core.
#   2. Point at one you already run — set `url` to an existing server, such as
#      a HACS custom integration serving MCP inside Home Assistant itself. The
#      bundle then renders only the CRs.
#
# Enabling this with NEITHER a url NOR the server component FAILS the render: an
# MCPConfig pointing nowhere costs the agent its tools and looks installed.
adminMcp:
  enabled: false
  # MCPConfig CR name (what the ops Pipeline puts in mcpConfigs.refs).
  name: ha-admin-api
  # The endpoint. Empty = the deployed server below. Set it to use your own —
  # for a HACS component that is your Home Assistant's own URL and its MCP path.
  url: ""
  # http (streamable) or sse. ha-mcp serves streamable HTTP.
  transport: http
  # Optional header passthrough for a server you run yourself — valueFrom secret
  # refs supported, resolved in the runtime pod. The DEPLOYED server needs none:
  # it authenticates by URL-path secrecy (see adminMcpServer.path).
  headers: []
  # ONE toolset, ENUMERATED from the server's real tool list rather than
  # wildcarded. `mcp__homeassistant_admin__*` would grant restarting Home
  # Assistant, deleting registry objects and installing HACS packages in one
  # line, which is the whole thing the enumeration prevents.
  #
  # Verified against ha-mcp 8.3.0: 78 tools, of which these 52 ship.
  toolset:
    name: ha-admin
    tools:
      - "mcp__homeassistant_admin__ha_bulk_control"
      - "mcp__homeassistant_admin__ha_call_event"
      - "mcp__homeassistant_admin__ha_call_service"
      - "mcp__homeassistant_admin__ha_config_get_automation"
      - "mcp__homeassistant_admin__ha_config_get_calendar_events"
      - "mcp__homeassistant_admin__ha_config_get_category"
      - "mcp__homeassistant_admin__ha_config_get_dashboard"
      - "mcp__homeassistant_admin__ha_config_get_label"
      - "mcp__homeassistant_admin__ha_config_get_scene"
      - "mcp__homeassistant_admin__ha_config_get_script"
      - "mcp__homeassistant_admin__ha_config_list_dashboard_resources"
      - "mcp__homeassistant_admin__ha_config_list_groups"
      - "mcp__homeassistant_admin__ha_config_list_helpers"
      - "mcp__homeassistant_admin__ha_config_set_automation"
      - "mcp__homeassistant_admin__ha_config_set_calendar_event"
      - "mcp__homeassistant_admin__ha_config_set_category"
      - "mcp__homeassistant_admin__ha_config_set_dashboard"
      - "mcp__homeassistant_admin__ha_config_set_dashboard_resource"
      - "mcp__homeassistant_admin__ha_config_set_group"
      - "mcp__homeassistant_admin__ha_config_set_helper"
      - "mcp__homeassistant_admin__ha_config_set_label"
      - "mcp__homeassistant_admin__ha_config_set_scene"
      - "mcp__homeassistant_admin__ha_config_set_script"
      - "mcp__homeassistant_admin__ha_eval_template"
      - "mcp__homeassistant_admin__ha_get_app"
      - "mcp__homeassistant_admin__ha_get_automation_traces"
      - "mcp__homeassistant_admin__ha_get_blueprint"
      - "mcp__homeassistant_admin__ha_get_camera_image"
      - "mcp__homeassistant_admin__ha_get_device"
      - "mcp__homeassistant_admin__ha_get_entity"
      - "mcp__homeassistant_admin__ha_get_entity_exposure"
      - "mcp__homeassistant_admin__ha_get_hacs_info"
      - "mcp__homeassistant_admin__ha_get_history"
      - "mcp__homeassistant_admin__ha_get_integration"
      - "mcp__homeassistant_admin__ha_get_logs"
      - "mcp__homeassistant_admin__ha_get_operation_status"
      - "mcp__homeassistant_admin__ha_get_overview"
      - "mcp__homeassistant_admin__ha_get_skill_guide"
      - "mcp__homeassistant_admin__ha_get_state"
      - "mcp__homeassistant_admin__ha_get_system_health"
      - "mcp__homeassistant_admin__ha_get_todo"
      - "mcp__homeassistant_admin__ha_get_zone"
      - "mcp__homeassistant_admin__ha_list_floors_areas"
      - "mcp__homeassistant_admin__ha_list_services"
      - "mcp__homeassistant_admin__ha_reload_core"
      - "mcp__homeassistant_admin__ha_search"
      - "mcp__homeassistant_admin__ha_set_area_or_floor"
      - "mcp__homeassistant_admin__ha_set_device"
      - "mcp__homeassistant_admin__ha_set_entity"
      - "mcp__homeassistant_admin__ha_set_integration"
      - "mcp__homeassistant_admin__ha_set_todo_item"
      - "mcp__homeassistant_admin__ha_set_zone"
  # NOT SHIPPED, and each for a reason: they restart Home Assistant, delete
  # registry objects, manage backups, or install software. Add the ones you want
  # by appending to `toolset.tools` above — Helm replaces lists rather than
  # merging them, so restate the whole list.
  #
  #   - "mcp__homeassistant_admin__ha_config_delete_dashboard"
  #   - "mcp__homeassistant_admin__ha_config_delete_dashboard_resource"
  #   - "mcp__homeassistant_admin__ha_config_remove_automation"
  #   - "mcp__homeassistant_admin__ha_config_remove_calendar_event"
  #   - "mcp__homeassistant_admin__ha_config_remove_category"
  #   - "mcp__homeassistant_admin__ha_config_remove_group"
  #   - "mcp__homeassistant_admin__ha_config_remove_label"
  #   - "mcp__homeassistant_admin__ha_config_remove_scene"
  #   - "mcp__homeassistant_admin__ha_config_remove_script"

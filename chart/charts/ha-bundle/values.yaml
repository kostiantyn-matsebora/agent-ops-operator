  #   - "mcp__homeassistant_admin__ha_remove_device"
  #   - "mcp__homeassistant_admin__ha_remove_entity"
  #   - "mcp__homeassistant_admin__ha_remove_helpers_integrations"
  #   - "mcp__homeassistant_admin__ha_remove_todo_item"
  #   - "mcp__homeassistant_admin__ha_remove_zone"
  #   - "mcp__homeassistant_admin__ha_report_issue"
  #   - "mcp__homeassistant_admin__ha_restart"

# The admin MCP server WORKLOAD — a sibling of `adminMcp`, which renders only
# the CRs. Runs ha-mcp in-cluster when you do not already have a server.
#
# It holds the OPERATOR credential and reaches your entire house. It runs under
# its OWN ServiceAccount, never the runtime's, for the same reason k8s-bundle's
# MCP server does: the agent's reach through MCP is then (what this server may
# do) ∩ (what the toolset grants), two walls rather than one.
adminMcpServer:
  enabled: false
  image:
    repository: ghcr.io/homeassistant-ai/ha-mcp
    # PINNED, and the pin is load-bearing: the toolset above enumerates tool
    # NAMES, so a server that renames or adds tools changes what the allowlist
    # means without anything failing.
    tag: 8.3.0
  port: 8086
  # MCP_SECRET_PATH. ha-mcp's standard mode authenticates BY URL-PATH SECRECY —
  # there is no token on the MCP endpoint itself. The Service is ClusterIP, so
  # reach is already limited to the cluster, but on a shared cluster set a
  # high-entropy path here (e.g. /private_<random>) and the URL follows it.
  path: /mcp
  # Which credential the server authenticates to Home Assistant with. Empty =
  # the operator token, which is what makes registry writes possible at all.
  credentialsSecret: ""
  # Distinct from the runtime's ServiceAccount ON PURPOSE. Setting them equal
  # FAILS the render.
  serviceAccountName: agentops-mcp-ha
  # Extra env passthrough. The chart already sets HOMEASSISTANT_URL,
  # HOMEASSISTANT_TOKEN, MCP_HOST, MCP_PORT, MCP_SECRET_PATH,
  # HA_MCP_DISABLE_SETTINGS_UI and MCP_DISABLE_UPDATE_CHECK — the last because
  # the server otherwise calls pypi.org at startup, which an in-cluster
  # workload has no business doing.
  env: []
  resources: {}

# The two agents. IDENTITY ONLY — an AgentProfile carries no capabilities: no
# allowedTools, no MCP servers. What each may DO comes from the Pipeline routing
# it, which is why the same two prompts under two routes are the whole split.
#
# The split is USE versus FIX, not read versus act. Both agents act.
#
# Both carry CONNECTIVITY env (HA_URL and HA_TOKEN, the latter via valueFrom so
# the manager never reads a Secret). That env is the REST path, and it is wider
# than the toolset split: a route that also binds a shell toolset reaches the
# whole Home Assistant API for that user, whatever the toolsets allow. That is
# exactly how `ha-operator` fixes things, and exactly why `ha-user` is not given
# one. See docs/ha-bundle.md.
profiles:
  user:
    # Rendered when EITHER the MCP component renders OR a control credential is
    # configured — a profile with no way to reach the house is furniture.
    enabled: true
    name: ha-user
    # The agent's OUTPUT CONTRACT. `blocks` appends the operator's shared
    # output-format specification — the block grammar, the fold, the markdown
    # subset and a default section set — so a long answer opens with its
    # conclusion and folds the detail away on every surface. `none` appends
    # nothing and this profile's own prompt owns formatting.
    #
    # REQUIRED on the CR, with no default: both candidate defaults are wrong, so
    # the author declares it.
    outputFormat: blocks

    # Appended to the runtime's own system prompt, never replacing it. Identity,
    # not capability: nothing here widens the allowlist.
    systemPrompt: |
      You are the household's assistant for a Home Assistant installation. Real
      lights, heating, media and people are on the other end of what you do.

      You USE the house and you ANSWER QUESTIONS ABOUT IT. Turning things on and
      off, setting lights and temperature, running scenes and automations, and
      reporting what is going on are all yours to do.

      You do NOT fix the house. Reloading or reconfiguring an integration,
      editing configuration, repairing something that is broken, or anything
      Home Assistant itself is reporting as an error belongs to another agent.
      Say so plainly and tell them to ask with `/ha-ops <what they want>`.

      Act on what was asked and nothing beside it. Confirm the current state
      before changing it, make the narrowest change that does the job, and say
      what you changed.

      DESCRIBE AND STOP — do not act — when the request is house-wide rather
      than one device, when it touches a lock, an alarm, a garage door or
      heating in a way someone could be harmed by, or when you are not sure
      which entity was meant.

      Reach the house through your tools. If a tool for something is not in your
      allowlist, you cannot do it — say so instead of improvising.

      QUOTE EVERY STRING you pass to a tool, `domain` included:
      `{"domain": "sensor"}`, never `{"domain": sensor}`. Home Assistant
      advertises that filter with no type at all, and an unquoted word is not
      valid JSON — the call is discarded before it runs, so repeating it reads
      as a tool that answers nothing. `domain` takes one string or a list of
      them.

      Answer briefly and in plain language. Lead with the answer or the action,
      then the detail. Name entities the way the household does, not by
      entity_id, unless the entity_id is what was asked for.
    maxTurns: 30
    # Names an AgentRuntime other than the parent's `default`. Empty emits no
    # runtimeRef and falls back to `default`.
    runtimeRef: ""
  ops:
    # Rendered ONLY when an operator credential is configured. That credential
    # is the prerequisite, not a nicety: an agent asked to repair an integration
    # with a token that cannot reconfigure one fails every task it is given.
    enabled: true
    name: ha-operator
    # The agent's OUTPUT CONTRACT. `blocks` appends the operator's shared
    # output-format specification — the block grammar, the fold, the markdown
    # subset and a default section set — so a long answer opens with its
    # conclusion and folds the detail away on every surface. `none` appends
    # nothing and this profile's own prompt owns formatting.
    #
    # REQUIRED on the CR, with no default: both candidate defaults are wrong, so
    # the author declares it.
    outputFormat: blocks
    systemPrompt: |
      You are the administrator of a live Home Assistant installation. You are
      called when something in the house is BROKEN, and you are the agent that
      fixes it.

      HOW YOU REACH THE HOUSE — read this before concluding you cannot do
      something. You have TWO paths, and the second is the one that matters for
      your job:

      1. Assist intents, through your mcp__homeassistant__* tools. These control
         devices — lights, climate, media, switches. They CANNOT read logs,
         reload an integration, or change configuration.
      2. The Home Assistant REST API, through your shell. `$HA_URL` and
         `$HA_TOKEN` are in your environment, and `curl` and `jq` are installed.
         This is how you diagnose and repair. Never say a task is impossible
         because no MCP tool exists for it — check whether the API does it.

      On path 1, QUOTE EVERY STRING you pass, `domain` included:
      `{"domain": "sensor"}`, never `{"domain": sensor}`. Home Assistant
      advertises that filter with no type at all, and an unquoted word is not
      valid JSON — the call is discarded before it runs, so repeating it reads
      as a tool that answers nothing. `domain` takes one string or a list of
      them.

      Every call looks like this:

        curl -sS -H "Authorization: Bearer $HA_TOKEN" "$HA_URL/api/..."

      What you will need most:

        # the error log, newest last
        curl -sS -H "Authorization: Bearer $HA_TOKEN" "$HA_URL/api/error_log" | tail -100

        # one entity, or everything
        curl -sS -H "Authorization: Bearer $HA_TOKEN" "$HA_URL/api/states/<entity_id>" | jq .
        curl -sS -H "Authorization: Bearer $HA_TOKEN" "$HA_URL/api/states" | jq -r '.[].entity_id'

        # integrations and their state - find the entry_id you need
        curl -sS -H "Authorization: Bearer $HA_TOKEN" "$HA_URL/api/config/config_entries/entry" \
          | jq -r '.[] | "\(.entry_id)  \(.domain)  \(.state)  \(.title)"'

        # reload one integration
        curl -sS -X POST -H "Authorization: Bearer $HA_TOKEN" \
          "$HA_URL/api/config/config_entries/entry/<entry_id>/reload"

        # call any service
        curl -sS -X POST -H "Authorization: Bearer $HA_TOKEN" -H "Content-Type: application/json" \
          -d '{"entity_id":"<entity_id>"}' "$HA_URL/api/services/<domain>/<service>"

        # validate configuration before acting on it
        curl -sS -X POST -H "Authorization: Bearer $HA_TOKEN" "$HA_URL/api/config/core/check_config" | jq .

      Adding an integration means the config-flow API
      (`/api/config/config_entries/flow`), which is several steps and often
      needs credentials. Describe what you would do and stop.

      YOUR JOB is the half the everyday assistant does not do: integrations that
      failed to set up, devices that went unavailable, configuration that is
      wrong, errors Home Assistant is logging about itself.

      INVESTIGATE BEFORE YOU ACT. Read the error log and the integration's state,
      and say what you think the cause is. Many Home Assistant errors resolve
      themselves - when that is what you find, say so rather than acting to look
      useful.

      Then make the narrowest change that fixes it, and say plainly what you
      changed.

      DESCRIBE AND STOP - do not act - when any of these is true:
        * the change is hard to undo (a lock, an alarm, a garage door, anything
          that could leave someone locked out or a house unheated in winter);
        * it restarts Home Assistant or reloads its core configuration;
        * it would remove or re-pair a device, or delete history;
        * it edits automations or scripts someone else wrote;
        * you are not confident which entity or integration was meant.
      In those cases, write exactly what you would do and wait to be told.

      Never touch an entity you were not asked about and did not diagnose.

      Answer briefly. Lead with the finding or the action, then the evidence.
    maxTurns: 40
    runtimeRef: ""

# The bundle's OWN wiring — the one component that spends money and touches the
# house by itself. Two routes, one per agent.
#
# OFF by default, and that default is the load-bearing part: enabling this
# bundle for its adapter, its tooling and its profiles must never silently
# acquire routes beside the ones your install declared. The parent chart's
# `pipelines:` stays the normal place to declare routes.
#
# The bundle may ship these at all only because it owns its whole lane — it
# renders the source, both profiles and both toolsets, so the only objects it
# does not render are chat surfaces and channels, and those are values-supplied
# names omitted when unset.
pipelines:
  enabled: false
  control:
    # The user-facing route. Claims the chat sources below, so an unaddressed
    # message on those surfaces reaches ha-user.
    name: ha-control
    # Display only — see k8s-bundle's `pipelines.observe.icon`.
    icon: aops:home
  ops:
    # The ops route. Claims ha-logs and NOTHING ELSE — see chatSources.
    name: ha-ops
    icon: aops:operate
  # Chat sources BOTH routes claim, BY NAME. A claim is what puts an agent in
  # the list a person is offered on that surface.
  #
  # Wiring is many-to-many: a source is claimed by as many Pipelines as you
  # want, and two agents on one surface is an ordinary configuration. An
  # unaddressed message there is answered with the list of agents that serve it,
  # so the person names one — `/ha-control <task>`, `/ha-ops <task>`. Addressing
  # works from any wired surface regardless of claims.
  #
  # Leave empty if this house is reached only by name.
  # Channels BOTH routes deliver to, BY NAME — objects this bundle does not
  # render, so the key is omitted entirely when the list is empty. Empty is a
  # working configuration: with no thread to wait for, the conversation
  # dispatches immediately and its answer is read from status.runs[].result.
  channels: []
  # Bind the built-in SHELL toolset, so an agent can reach the Home Assistant
  # REST API with the token in its profile env.
  #
  # null = ON for the OPS route, OFF for the control route. That asymmetry is
  # the design, not a default to tidy up: repairing an integration means
  # touching configuration, and no MCP tool here reaches configuration — Home
  # Assistant's MCP server exposes Assist intents only. So the REST path IS how
  # `ha-operator` does its job, and giving the everyday agent the same path
  # would hand it the operator's whole surface for no capability it needs.
  #
  # true = both routes get it. false = neither, which leaves `ha-operator` able
  # to call services and unable to reconfigure anything.
  restAccess: null

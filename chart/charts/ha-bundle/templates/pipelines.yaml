{{- /*
Wiring component: the bundle's OWN routes — one per agent.

Bundles normally ship no Pipeline. This one may because it owns its whole lane:
the source, both profiles and both toolsets are rendered here, so the only
foreign names a route needs are chat sources and channels, and both are
values-supplied and omitted when unset. It DEFAULTS OFF, and that default is the
load-bearing part — enabling this bundle for its parts must never silently
acquire routes beside the ones the install declared.

Each route is gated on its own profile: a Pipeline with no profile has no agent
to run.

BOTH routes claim the chat sources. Wiring is many-to-many — a source is claimed
by as many Pipelines as an install wants — so a surface serving both agents is
the ordinary shape, and it is what puts both in the list an unaddressed message
is answered with. The ops route additionally claims the log source, which is the
only asymmetry between them.
*/ -}}
{{- if include "ha-bundle.wiringActive" . }}
{{- $p := .Values.pipelines }}
{{- $g := .Values.global | default dict }}
{{- $la := .Values.logsAdapter }}
{{- $mcp := .Values.mcp }}
{{- /* Every ref below is emitted only when the object it names is rendered: a
ref to a toolset nobody created is how an allowlist rots into fiction. */ -}}
{{- /* The tools BOTH routes share: the built-in observe set and, when the MCP
component renders, the house's own looking and doing intents. The everyday route
binds the doing half too — invoking services IS its job. */ -}}
{{- $baseTools := list }}
{{- if dig "builtinToolsets" "enabled" false $g }}
{{- $baseTools = append $baseTools (dig "builtinToolsets" "observe" "name" "agentops-observe" $g) }}
{{- end }}
{{- $mcpConfigs := list }}
{{- if include "ha-bundle.mcpEnabled" . }}
{{- $baseTools = append $baseTools $mcp.toolsets.observe.name }}
{{- $mcpConfigs = append $mcpConfigs $mcp.name }}
{{- if include "ha-bundle.mcpActionsEnabled" . }}
{{- $baseTools = append $baseTools $mcp.toolsets.actions.name }}
{{- end }}
{{- end }}
{{- /* The ADMIN path is the ops route's alone. Assist intents cannot read a log
or touch a registry, so this is what makes `ha-ops` able to repair anything —
and binding it on the control route would hand the everyday agent the whole
house through a server the toolset split was never meant to bound. */ -}}
{{- $opsOnlyTools := list }}
{{- $opsOnlyConfigs := list }}
{{- if include "ha-bundle.adminMcpEnabled" . }}
{{- $opsOnlyTools = append $opsOnlyTools .Values.adminMcp.toolset.name }}
{{- $opsOnlyConfigs = append $opsOnlyConfigs .Values.adminMcp.name }}
{{- end }}
{{- /* The SHELL toolset opens the REST path, and it is per route: configuration
is what the ops agent fixes and no Assist intent reaches configuration, while the
everyday agent needs nothing beyond the intents. */ -}}
{{- $shell := "" }}
{{- if dig "builtinToolsets" "enabled" false $g }}
{{- $shell = dig "builtinToolsets" "shell" "name" "agentops-shell" $g }}
{{- end }}
{{- $controlTools := $baseTools }}
{{- if and $shell (include "ha-bundle.restAccessFor" (dict "ctx" . "route" "control")) }}
{{- $controlTools = append $controlTools $shell }}
{{- end }}
{{- $opsTools := concat $baseTools $opsOnlyTools }}
{{- if and $shell (include "ha-bundle.restAccessFor" (dict "ctx" . "route" "ops")) }}
{{- $opsTools = append $opsTools $shell }}
{{- end }}
{{- $logSource := list }}
{{- if and $la.enabled $la.source.create }}{{ $logSource = append $logSource $la.source.name }}{{ end }}

{{- $routes := list }}
{{- if include "ha-bundle.userProfileEnabled" . }}
{{- $routes = append $routes (dict
      "name" $p.control.name
      "icon" ($p.control.icon | default "")
      "runtimeRef" ($p.control.runtimeRef | default $p.runtimeRef | default "")
      "serviceAccountName" ($p.control.serviceAccountName | default $p.serviceAccountName | default (include "ha-bundle.routeServiceAccount" (dict "ctx" $ "route" $p.control.name)))
      "profile" .Values.profiles.user.name
      "sources" ($p.chatSources | default list)
      "tools" $controlTools
      "configs" $mcpConfigs) }}
{{- end }}
{{- if include "ha-bundle.opsProfileEnabled" . }}
{{- $routes = append $routes (dict
      "name" $p.ops.name
      "icon" ($p.ops.icon | default "")
      "runtimeRef" ($p.ops.runtimeRef | default $p.runtimeRef | default "")
      "serviceAccountName" ($p.ops.serviceAccountName | default $p.serviceAccountName | default (include "ha-bundle.routeServiceAccount" (dict "ctx" $ "route" $p.ops.name)))
      "profile" .Values.profiles.ops.name
      "sources" (concat ($p.chatSources | default list) $logSource)
      "tools" $opsTools
      "configs" (concat $mcpConfigs $opsOnlyConfigs)) }}
{{- end }}
{{- range $routes }}
---
apiVersion: agentops.dev/v1alpha1
kind: Pipeline
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-ha-bundle
spec:
  {{- with .icon }}
  # Display only: how this route is recognised in a chat command menu or the
  # console's typeahead. Nothing routes on it.
  icon: {{ . | quote }}
  {{- end }}
  profileRef:
    name: {{ .profile }}
  {{- with .runtimeRef }}
  # WHAT EXECUTES this route. Unset resolves the AgentRuntime named `default`,
  # which the PARENT renders — no bundle renders a runtime, an identity or a
  # credential, and naming one here creates nothing.
  runtimeRef:
    name: {{ . }}
  {{- end }}
  {{- with .serviceAccountName }}
  # UNDER WHOSE IDENTITY, overriding the runtime's own. The same decision as the
  # toolsets below — which tools, and with whose credentials — which is why both
  # are on this one object.
  #
  # The account is the PARENT's to render (`rbac.runtime.serviceAccounts`) or
  # yours to grant. This bundle renders no ServiceAccount.
  serviceAccountName: {{ . }}
  {{- end }}
  {{- with .sources }}
  # Wiring is pipeline-only: without a claim a source reports Wired=False and
  # DROPS every signal it admits.
  signalSourceRefs:
    {{- range . }}
    - name: {{ . }}
    {{- end }}
  {{- end }}
  {{- with $p.channels }}
  # A class of object this bundle does not render, so each is named from values
  # and the key is absent when nobody named one. With no channel the
  # conversation dispatches immediately and its answer lands in
  # status.runs[].result.
  channelRefs:
    {{- range . }}
    - name: {{ . }}
    {{- end }}
  {{- end }}
  {{- with .tools }}
  # Declared, not inherited: profiles carry no capabilities and nothing supplies
  # a default, so this stanza IS the agent's allowlist.
  toolsets:
    refs:
      {{- range . }}
      - name: {{ . }}
      {{- end }}
  {{- end }}
  {{- with .configs }}
  mcpConfigs:
    refs:
      {{- range . }}
      - name: {{ . }}
      {{- end }}
  {{- end }}
{{- end }}
{{- end }}

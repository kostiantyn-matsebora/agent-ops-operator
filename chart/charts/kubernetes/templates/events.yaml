{{- /*
Events component: the adapter implementation, the Events permissions its
ServiceAccount needs, and (under source.create) the SignalSource itself.

NOT the claim on that source. Wiring is pipeline-only — an unclaimed
SignalSource reports Wired=False and DROPS every signal — but the Pipeline is
its own component (pipelines.yaml), so an events lane can be rendered for a
route declared anywhere, including in the parent chart's own `pipelines:`.
*/ -}}
{{- if and (include "kubernetes.active" .) .Values.eventsAdapter.enabled }}
{{- $ea := .Values.eventsAdapter }}
{{- $adapterSA := include "kubernetes.adapterServiceAccount" . }}
apiVersion: agentops.dev/v1alpha1
kind: SignalAdapter
metadata:
  name: {{ $ea.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-kubernetes
spec:
  image: {{ printf "%s:%s" $ea.image.repository (toString $ea.image.tag) | quote }}
  # This adapter's DATA SOURCE is the Kubernetes API, so it mounts its own SA
  # token. That grants nothing by itself — the RBAC below does, bound by this
  # chart to the adapter's deterministic SA name.
  # THE IDENTITY IS A REFERENCE, and this bundle renders it below beside the
  # events grant. Naming it is what mounts its token.
  serviceAccountName: {{ $adapterSA }}
  # Two watchers would post every event twice.
  singleton: true
  {{- with $ea.resources }}
  resources:
{{ toYaml . | indent 4 }}
  {{- end }}
  # Interface metadata: makes `kubectl get signaladapter` answer "what goes in
  # spec.config?" without reading adapter source.
  configSchema:
    type: object
    properties:
      severities:
        type: array
        description: 'Event type values to act on (default ["Warning"]).'
        items:
          type: string
          enum: ["Normal", "Warning"]
      namespaces:
        type: array
        description: Namespaces to watch; empty = all the RBAC allows.
        items:
          type: string
      includeReasons:
        type: array
        description: When non-empty, only these Event reasons produce signals.
        items:
          type: string
      excludeReasons:
        type: array
        description: >-
          Event reasons to drop, applied after includeReasons. Superseded by
          rules; translated into leading drop rules for compatibility.
        items:
          type: string
      includeOwnNamespace:
        type: boolean
        description: >-
          Stop excluding the operator's own namespace wholesale. Relaxes ONLY
          that mechanism — events about agent-ops' own pods are still dropped
          by name prefix and by owner, and no configuration can re-admit them.
      rules:
        type: array
        description: >-
          Ordered, first-match-wins suppression policy. Each rule selects with
          Alertmanager matchers and either drops or holds for `for`, after
          which the involved object is re-checked before emitting.
        items:
          type: object
          properties:
            matchers:
              type: array
              description: >-
                Alertmanager matcher syntax over the signal's labels
                (=, !=, =~, !~). `reason` is available as an alias for
                alertname. Empty = catch-all.
              items:
                type: string
            for:
              type: string
              description: >-
                Dwell before re-checking, e.g. "5m". "0" emits immediately —
                required for reasons describing something that ALREADY
                happened (OOMKilling, Evicted), where a re-check would find
                the healthy replacement and erase the incident.
            action:
              type: string
              description: '"drop" suppresses outright; absent means dwell and verify.'
              enum: ["drop"]
            escalateAfterObjects:
              type: integer
              description: >-
                Emit early once this many distinct objects of one workload are
                pending, so a long dwell cannot hide a whole-workload outage.
      route:
        type: object
        description: The Alertmanager half of the policy.
        properties:
          inhibitRules:
            type: array
            items:
              type: object
              properties:
                sourceMatchers:
                  type: array
                  items:
                    type: string
                targetMatchers:
                  type: array
                  items:
                    type: string
                equal:
                  type: array
                  description: Labels that must be equal on cause and target.
                  items:
                    type: string
          timeIntervals:
            type: array
            description: >-
              Named time intervals, in Alertmanager's shape. The time axis of
              suppression: `for` verifies a condition that a scheduled outage
              genuinely satisfies, inhibition needs a cause event that a power
              cut never produces, and matchers cannot select on the clock.
            items:
              type: object
              properties:
                name:
                  type: string
                times:
                  type: array
                  description: >-
                    Clock ranges within a day; start inclusive, end exclusive.
                    A window spanning midnight is two entries.
                  items:
                    type: object
                    properties:
                      startTime:
                        type: string
                      endTime:
                        type: string
                location:
                  type: string
                  description: >-
                    IANA timezone, e.g. Europe/Kyiv. Defaults to UTC, which
                    drifts against local time at each daylight-saving change.
                weekdays:
                  type: array
                  items:
                    type: string
                daysOfMonth:
                  type: array
                  description: Negative values count back from the end of the month.
                  items:
                    type: string
                months:
                  type: array
                  items:
                    type: string
                years:
                  type: array
                  items:
                    type: string
          muteTimeIntervals:
            type: array
            description: >-
              Which named intervals mute, and what they mute. Evaluated at
              EMIT — after the dwell, before the emit cap — so a problem
              outliving the window is still reported once it closes.
            items:
              type: object
              properties:
                name:
                  type: string
                  description: Name of an interval declared in timeIntervals.
                matchers:
                  type: array
                  description: >-
                    Narrows what the window silences. Absent = everything from
                    this source for the interval's duration, which is the
                    principal hazard of the feature.
                  items:
                    type: string
          drainingNodes:
            type: string
            description: >-
              The node-STATE suppression axis: "suppress" (default) silences
              every event on a node this cluster is deliberately draining
              (cordoned, or maintenance-tainted) for as long as the drain
              lasts; "report" disables it, evaluating those events exactly as
              the other axes would. Needs the ClusterRole's nodes grant —
              absent that, this is a no-op and every source says so once.
            enum: ["suppress", "report"]
          drainingNodeMatchers:
            type: array
            description: >-
              Narrows what a draining node suppresses. Absent = every event on
              that node's objects, for as long as it drains.
            items:
              type: string
          drainingNodeBound:
            type: string
            description: >-
              How long a drain may suppress before it is reported once (a
              Node-kind signal, reason NodeDrainExceeded) and released — a
              forgotten cordon must not go silent forever. Default 1h.
{{- if $ea.rbac.create }}
{{- /* THE ADAPTER'S IDENTITY, RENDERED BESIDE THE GRANT IT CARRIES.

The manager creates no ServiceAccount — it names this one and mounts its token.
Whoever grants a component is the only one who knows it needs an identity at
all, and that is this file: the role below and this account are read together
rather than one here and one in a Go reconciler. */}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $adapterSA }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-kubernetes
{{- if $ea.rbac.clusterWide }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $adapterSA }}-events-{{ $.Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # Read-only pods/replicasets: the adapter resolves an event's WORKLOAD through
  # owner references (Pod -> ReplicaSet -> Deployment) and re-checks whether the
  # involved object is still unhealthy before emitting. Without this grant it
  # reports Ready=False naming the missing permission rather than silently
  # emitting per-pod signals again.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list", "watch"]
  # Drain awareness (route.drainingNodes): nodes are CLUSTER-scoped, so this
  # exists only here — a namespaced install has no equivalent grant, and the
  # adapter degrades to drain awareness off rather than 403ing a source.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $adapterSA }}-events-{{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $adapterSA }}-events-{{ $.Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $adapterSA }}
    namespace: {{ .Release.Namespace }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $adapterSA }}-events
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # Namespaced identically to the events grant on purpose: the adapter scopes
  # its pod/replicaset watches to the same namespaces it watches events in, so
  # a broader grant would be unused and a narrower one would 403.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $adapterSA }}-events
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $adapterSA }}-events
subjects:
  - kind: ServiceAccount
    name: {{ $adapterSA }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
{{- if $ea.source.create }}
{{- $src := $ea.source }}
---
apiVersion: agentops.dev/v1alpha1
kind: SignalSource
metadata:
  name: {{ $src.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-kubernetes
spec:
  # a REFERENCE to the SignalAdapter CR above — its implementation defines the
  # schema of the config below
  adapter: {{ $ea.name }}
  {{- with $src.grouping }}
  grouping:
{{ toYaml . | indent 4 }}
  {{- end }}
  {{- /* Built as a map so an all-empty config omits the key entirely: emitting
  a bare `config:` would set spec.config to null rather than leave it unset. */}}
  {{- $cfg := dict }}
  {{- with $src.severities }}{{ $_ := set $cfg "severities" . }}{{ end }}
  {{- with $src.namespaces }}{{ $_ := set $cfg "namespaces" . }}{{ end }}
  {{- with $src.includeReasons }}{{ $_ := set $cfg "includeReasons" . }}{{ end }}
  {{- with $src.excludeReasons }}{{ $_ := set $cfg "excludeReasons" . }}{{ end }}
  {{- with $src.rules }}{{ $_ := set $cfg "rules" . }}{{ end }}
  {{- with $src.route }}{{ $_ := set $cfg "route" . }}{{ end }}
  {{- if $src.includeOwnNamespace }}{{ $_ := set $cfg "includeOwnNamespace" true }}{{ end }}
  {{- if $cfg }}
  config:
{{ toYaml $cfg | indent 4 }}
  {{- end }}
{{- end }}
{{- end }}

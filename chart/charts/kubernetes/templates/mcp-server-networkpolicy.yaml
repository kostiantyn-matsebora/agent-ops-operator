{{- $np := (.Values.global.agentops).networkPolicy | default dict }}
{{- if and (include "kubernetes.active" .) .Values.mcpServers.enabled $np.enabled }}
{{- $s := .Values.mcpServers }}
{{- $name := include "kubernetes.mcpServerName" . }}
{{/*
  This server holds the SECOND of the two walls — its own ServiceAccount's RBAC
  — and until this policy exists that wall is reachable by any pod in the
  cluster with no credential at all. Under `rbacMode: full` that is the acting grant
  over HTTP.

  Runtime pods only. The manager never calls it, and neither does anything else
  this chart deploys.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agentops-runtime
        {{- with $np.probesFrom }}
        # The kubelet's probe, which reaches this server on the SAME port it
        # serves MCP on — so it cannot be opened to everyone the way the
        # manager's dedicated probe port can. Without it, on a CNI that does not
        # exempt host traffic, liveness fails and this server crash-loops.
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $s.port }}
{{- end }}

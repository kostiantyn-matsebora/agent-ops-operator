{{- /*
ONE RUNTIME IDENTITY PER ROUTE THIS BUNDLE SHIPS.

A bundle that ships Pipelines ships the accounts those Pipelines run as. It is
the only scope that knows what its own routes do — this chart cannot, and the
parent restating it would be one fact in two places.

THEY HOLD NO KUBERNETES RBAC, AND THAT IS THE CORRECT DEFAULT, NOT AN OMISSION.
The runtime image ships no kubectl (dropped in 0.5.0), so an agent reaches the
cluster ONLY through the MCP server — which has its own account,
`agentops-mcp-k8s`, rendered beside this one and carrying the actual grant. That
is the two-wall model: MCP reach = the server's RBAC ∩ the bound toolset.

So what these accounts buy is IDENTITY, not power:

  * each route is a distinct subject, so an audit says which route holds what
  * a grant added later lands on ONE route instead of every agent in the install
  * a mistaken grant on the parent's floor account cannot reach a bundle route

Add a grant with `pipelines.<route>.rbac.clusterRoles` / `.bindClusterRoles`
below, or name your own account with `pipelines.<route>.serviceAccountName`,
which suppresses the one rendered here.
*/ -}}
{{- if and (include "kubernetes.wiringActive" .) .Values.profile.enabled }}
{{- $p := .Values.pipelines }}
{{- $routes := list }}
{{- if include "kubernetes.observePipelineEnabled" . }}
{{- $routes = append $routes (dict "key" "observe" "cfg" $p.observe) }}
{{- end }}
{{- if include "kubernetes.adminPipelineEnabled" . }}
{{- $routes = append $routes (dict "key" "admin" "cfg" $p.admin) }}
{{- end }}
{{- range $r := $routes }}
{{- $cfg := $r.cfg }}
{{- /* An explicitly named account is the operator's, and this bundle creates
nothing for it — naming is a reference. A route granted NOTHING renders no
account either: it inherits the release default, and an account bound to nothing
is the floor wearing another name. */ -}}
{{- if include "kubernetes.routeAccountRendered" (dict "ctx" $ "cfg" $cfg "p" $p) }}
{{- $sa := include "kubernetes.routeServiceAccount" (dict "ctx" $ "route" $cfg.name) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-kubernetes
{{- $rbac := $cfg.rbac | default dict }}
{{- range $rbac.clusterRoles | default list }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $sa }}-{{ .name }}-{{ $.Release.Namespace }}
rules:
{{ toYaml .rules | indent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $sa }}-{{ .name }}-{{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $sa }}-{{ .name }}-{{ $.Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- range $rbac.bindClusterRoles | default list }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $sa }}-{{ . }}-{{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ . }}-{{ $.Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

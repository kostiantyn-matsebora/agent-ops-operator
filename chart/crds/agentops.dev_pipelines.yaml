---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: pipelines.agentops.dev
spec:
  group: agentops.dev
  names:
    kind: Pipeline
    listKind: PipelineList
    plural: pipelines
    singular: pipeline
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.profileRef.name
      name: Profile
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Pipeline binds signal sources, channels, and an agent profile into one
          declared flow: N sources fan into conversations mirrored across M channels.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PipelineSpec declares the wiring between the pipeline elements: every
              referenced signal source's signals become conversations bound to ALL
              referenced channels with the pipeline's profile, and conversations started
              from any referenced channel are bound to all of them (full mirroring).

              It also selects WHAT EXECUTES those conversations and UNDER WHOSE IDENTITY —
              `runtimeRef` and `serviceAccountName`. Capabilities and execution identity
              are the same decision: one says which tools may be called, the other with
              whose credentials, and split across two objects no single object states an
              agent's power. The Pipeline still carries no credentials and no server or
              tool definitions.

              THE CAPABILITY — the six fields `AgentCapabilitySpec` holds — is either
              INLINE here (today's shape, unchanged) or a `capabilityRef` naming an
              `AgentCapability` object, mutually exclusive by CEL. Nothing here resolves
              which: `dispatch.ResolveCapability` is the one place that reads either form,
              and every consumer of a Pipeline's capability calls it rather than this
              struct's embedded fields directly.
            properties:
              agentFile:
                description: |-
                  AgentFile names the agent definition file by its location, taking
                  precedence over both the profile's AgentFile and its Agent name form
                  when set. Travels with Repositories: declaring none here, while
                  Repositories replaces the profile's list, leaves the conversation
                  with no agent file — it never inherits the profile's.
                properties:
                  path:
                    description: |-
                      Path to the file, relative to Repo's root. Never absolute, never
                      containing `..`. A path that passes this check yet resolves outside
                      the repository through a symlink is refused at pod start instead,
                      naming the path — admission cannot see the checked-out tree.
                    maxLength: 1024
                    minLength: 1
                    type: string
                  repo:
                    description: |-
                      Repo names the `repositories[]` entry holding the file. Optional
                      when exactly one repository resolves, required with two or more —
                      enforced on the holder's Ready condition (multi-repo-workspace),
                      never here: admission sees only this object, never the resolved
                      list a Pipeline or Coordinator reaches it through.
                    maxLength: 63
                    type: string
                required:
                - path
                type: object
                x-kubernetes-validations:
                - message: agentFile.path must be relative to the repository root
                    and must not contain '..'
                  rule: '!self.path.startsWith(''/'') && !self.path.contains(''..'')'
              capabilityRef:
                description: |-
                  capabilityRef names an AgentCapability holding this pipeline's capability
                  INSTEAD of inlining it above — mutually exclusive with the inline fields
                  by CEL. A Pipeline naming neither this nor `profileRef` fails `Ready`,
                  not admission: CEL cannot express "one of" across an embedded struct.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              channelRefs:
                description: |-
                  ChannelRefs: every conversation of this pipeline is mirrored on all of
                  these surfaces. Channels may appear in several pipelines.
                items:
                  description: ObjectRef references another object by name (same namespace).
                  properties:
                    name:
                      description: Name of the referenced object.
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
              icon:
                description: "Icon is how this Pipeline is RECOGNISED in a list of
                  them — one of\n`aops:<name>` (the built-in set), `mdi:<name>` (a
                  public icon set), an\nimage URL or an emoji. Optional, and purely
                  how the name is presented.\n\nA REFERENCE, not an image. Four forms,
                  and the manager tells them apart\nnot at all — it publishes the
                  string and interprets it no further:\n\n\taops:kubernetes            the
                  built-in set, shipped inside each surface\n\tmdi:kubernetes             a
                  named icon from a public set\n\thttps://example/logo.svg   your
                  own, by URL\n\t\U0001F50E                         an emoji, drawable
                  by anything\n\nWHAT A SURFACE CAN DRAW IS THE SURFACE'S BUSINESS.
                  `aops:` and an emoji\nwork everywhere, because every adapter ships
                  the first and every\ntransport can print the second. Telegram can
                  draw neither a URL nor a\nnamed set — a command menu takes no image
                  — so it renders what it can and\nomits the rest. Nothing fails over
                  an icon.\n\nPrefer `aops:` for anything shipped: it needs no network,
                  survives an\nair-gapped install, and is the only form guaranteed
                  on every surface.\n\nIt is INTERFACE METADATA, not wiring, and it
                  does not weaken the rule\nthat this CR carries the wiring exclusively:
                  nothing routes on it, no\ncondition reads it, and removing it changes
                  where not one signal goes.\nSame category as `ChannelAdapter.spec.configSchema`.\n\nIt
                  lives HERE rather than on the profile because a Pipeline is what
                  a\nmessage addresses, so a Pipeline is what appears in a menu."
                maxLength: 256
                type: string
              mcpConfigs:
                description: |-
                  MCPConfigs binds MCPConfig CRs supplying this capability's MCP servers,
                  overlaid per server key in ref order (later wins). No mode: an agent
                  definition declares no servers, so there is nothing to compose against.
                properties:
                  refs:
                    description: |-
                      Refs are applied in order: MCP server keys are overlaid with the later
                      ref winning a collision.
                    items:
                      description: ObjectRef references another object by name (same
                        namespace).
                      properties:
                        name:
                          description: Name of the referenced object.
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    minItems: 1
                    type: array
                required:
                - refs
                type: object
              persistence:
                description: "Persistence declares WHERE this capability's conversations
                  keep their\nstate — the CONTEXT volume and the WORKSPACE volume,
                  independently.\n\nPRECEDENCE, and no other order:\n\n\t<embedding
                  kind>.persistence.<volume> -> the chart's release default -> ephemeral\n\nThe
                  CONVERSATION snapshots the RESOLVED claim at creation, so editing\nthis
                  field re-wires only conversations created afterwards. Nothing\nreads
                  a Pipeline or Coordinator at pod-build time."
                properties:
                  context:
                    description: |-
                      Context: a conversation's accumulated context, the thing
                      `runtimeContextId` is a handle into. Absent takes the release default.
                    properties:
                      accessModes:
                        description: |-
                          AccessModes for that claim. Empty is ReadWriteMany, which is what
                          concurrent conversations on one volume need.
                        items:
                          type: string
                        type: array
                      claimName:
                        description: |-
                          ClaimName is a PersistentVolumeClaim that ALREADY EXISTS. Nothing is
                          created; conversations this route originates mount it.
                        maxLength: 253
                        type: string
                      size:
                        description: |-
                          Size requested by the claim the manager renders for VolumeName. Ignored
                          with ClaimName, where nothing is rendered. Empty requests 5Gi — a claim
                          binding to a pre-created volume gets that volume's capacity whatever it
                          asks for, so this is a floor rather than a size.
                        type: string
                      storageClassName:
                        description: |-
                          StorageClassName on that claim. EMPTY RENDERS AN EXPLICIT EMPTY STRING,
                          which is the only value that binds to a pre-created volume — and it is
                          the default here rather than in the chart because this field only ever
                          accompanies VolumeName, where anything else is a mistake. An absent field
                          is filled in by admission with the cluster's default StorageClass, which
                          provisions a second volume beside the one that was named.

                          Set it only for a class whose volumes are pre-created and selected by
                          name, which some CSI drivers require.
                        maxLength: 253
                        type: string
                      volumeName:
                        description: |-
                          VolumeName is a PersistentVolume the manager renders a claim on, bound to
                          that volume by name with an EXPLICIT empty storage class — which is what
                          disables dynamic provisioning. An absent storage class is filled in by
                          the cluster's default StorageClass, which provisions a second volume and
                          leaves the operator's untouched.
                        maxLength: 253
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: 'claimName and volumeName are mutually exclusive: name
                        a claim that already exists, or a PersistentVolume for the
                        manager to render a claim on'
                      rule: '!(has(self.claimName) && has(self.volumeName))'
                  workspace:
                    description: |-
                      Workspace: the repository checkout, one subdirectory per conversation.
                      Absent takes the release default, which is ephemeral unless the install
                      turned workspace persistence on.
                    properties:
                      accessModes:
                        description: |-
                          AccessModes for that claim. Empty is ReadWriteMany, which is what
                          concurrent conversations on one volume need.
                        items:
                          type: string
                        type: array
                      claimName:
                        description: |-
                          ClaimName is a PersistentVolumeClaim that ALREADY EXISTS. Nothing is
                          created; conversations this route originates mount it.
                        maxLength: 253
                        type: string
                      size:
                        description: |-
                          Size requested by the claim the manager renders for VolumeName. Ignored
                          with ClaimName, where nothing is rendered. Empty requests 5Gi — a claim
                          binding to a pre-created volume gets that volume's capacity whatever it
                          asks for, so this is a floor rather than a size.
                        type: string
                      storageClassName:
                        description: |-
                          StorageClassName on that claim. EMPTY RENDERS AN EXPLICIT EMPTY STRING,
                          which is the only value that binds to a pre-created volume — and it is
                          the default here rather than in the chart because this field only ever
                          accompanies VolumeName, where anything else is a mistake. An absent field
                          is filled in by admission with the cluster's default StorageClass, which
                          provisions a second volume beside the one that was named.

                          Set it only for a class whose volumes are pre-created and selected by
                          name, which some CSI drivers require.
                        maxLength: 253
                        type: string
                      volumeName:
                        description: |-
                          VolumeName is a PersistentVolume the manager renders a claim on, bound to
                          that volume by name with an EXPLICIT empty storage class — which is what
                          disables dynamic provisioning. An absent storage class is filled in by
                          the cluster's default StorageClass, which provisions a second volume and
                          leaves the operator's untouched.
                        maxLength: 253
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: 'claimName and volumeName are mutually exclusive: name
                        a claim that already exists, or a PersistentVolume for the
                        manager to render a claim on'
                      rule: '!(has(self.claimName) && has(self.volumeName))'
                type: object
              profileRef:
                description: |-
                  ProfileRef: the agent this capability answers as. Optional on the
                  struct because a Pipeline embedding this inline may instead name a
                  `capabilityRef` for the whole capability — CEL cannot express "one of"
                  across an embedded struct, so the two-refs-or-neither check is a Ready
                  condition on the EMBEDDING kind, not admission here.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              repositories:
                description: |-
                  Repositories lists every repository this capability's conversations
                  check out — the SAME shape and resolution rule
                  AgentProfileSpec.Repositories carries: a non-empty list here REPLACES
                  the profile's, never merging (multi-repo-workspace).
                items:
                  description: |-
                    RepositoryEntry is one repository in a `repositories[]` list
                    (multi-repo-workspace), replacing the deprecated single-repository
                    RepositorySpec. A `repositories[]` list on one holder REPLACES another's,
                    never merging — see the "capability's list replaces the profile's list"
                    requirement.
                  properties:
                    auth:
                      description: RepoAuth references credentials for a (possibly
                        private) git repository.
                      properties:
                        secretRef:
                          description: |-
                            SecretRef points to a Secret holding either key `sshKey` (type=ssh,
                            private deploy key) or key `token` (type=https, PAT; optional `username`).
                          properties:
                            name:
                              description: Name of the referenced object.
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                        type:
                          description: RepoAuthType selects the git auth mechanism.
                          enum:
                          - ssh
                          - https
                          type: string
                      required:
                      - secretRef
                      - type
                      type: object
                    keepGit:
                      default: true
                      description: |-
                        KeepGit keeps the `.git` directory after the clone. Absent means
                        TRUE — the agent can inspect history and the tree still looks like
                        an ordinary checkout. False has the workspace-sync init container
                        remove `.git` once the clone completes.
                      type: boolean
                    name:
                      description: |-
                        Name is this entry's identity within the list — a DNS label, and the
                        list's map key, so the API server itself refuses two entries sharing
                        one name.

                        INERT for a single repository: there is no `/workspace/<name>` alias
                        for it. It exists to be addressed once a SECOND repository joins the
                        list — by `agentFile.repo`, `workingDir`, or a `<repo>:<path>` prompt
                        qualifier.
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    ref:
                      default: main
                      description: 'Ref: branch, tag or commit to check out.'
                      type: string
                    url:
                      description: |-
                        URL of the repository to check out, in any form git understands
                        (ssh://, git@host:path, https://).
                      minLength: 1
                      type: string
                  required:
                  - name
                  - url
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              runtimeRef:
                description: |-
                  RuntimeRef selects the AgentRuntime executing this capability's
                  conversations. Absent, the AgentRuntime named "default" — the one the
                  parent chart renders — then the manager's bootstrap configuration.

                  IT REPLACES `AgentProfile.spec.runtimeRef`, which is deprecated. An
                  AgentRuntime carries the ServiceAccount an agent runs as, so selecting
                  one is selecting the agent's power in the cluster — and that is a
                  capability decision, made beside the tools and servers the same
                  capability grants, not an attribute of the prompts an agent is written
                  with.

                  The CONVERSATION snapshots the resolved name at creation, so editing
                  this field re-wires only conversations created afterwards. The
                  referenced CR's CONTENT — image, idle TTL, volumes — is re-read at
                  every pod build, so fixing a runtime heals conversations already
                  running.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              serviceAccountName:
                description: |-
                  ServiceAccountName is the identity the runtime executes under,
                  OVERRIDING the AgentRuntime's own `serviceAccountName`. Absent, the
                  runtime's — which the chart still defaults to `agentops-runtime`.

                  NAMING IS NOT CREATING. No reconciler creates a ServiceAccount, and
                  nothing here validates that one exists or that its RBAC is sufficient:
                  who may create an account and what it is bound to stays an EXTERNAL
                  grant, the same posture adapters already have. A name nothing backs
                  fails at pod admission, naming the account.
                maxLength: 253
                type: string
              signalSourceRefs:
                description: |-
                  SignalSourceRefs: the sources feeding this pipeline. A source is
                  SHAREABLE exactly as a channel is — any number of pipelines may list
                  one, and a signal admitted there opens a conversation on EVERY Ready
                  pipeline listing it, each with its own profile and capabilities. Listing
                  a source means "I watch this", not "I own this".
                items:
                  description: ObjectRef references another object by name (same namespace).
                  properties:
                    name:
                      description: Name of the referenced object.
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
              toolsets:
                description: |-
                  Toolsets binds MCPToolset CRs contributing to the allowlist of this
                  capability's conversations, plus the mode composing them with what the
                  AGENT'S OWN DEFINITION declares (merge unions, overwrite replaces).
                properties:
                  mode:
                    default: merge
                    description: |-
                      Mode composes this binding's tools with the agent definition's:
                      merge unions them (the agent keeps what it declared, the wiring adds),
                      overwrite passes the wiring's alone (the agent's declaration does not
                      apply to this route). Built-ins included — name them in the toolset.
                    enum:
                    - merge
                    - overwrite
                    type: string
                  refs:
                    description: |-
                      Refs are applied in order: tool lists concatenate with dedup, the first
                      occurrence keeping its position.
                    items:
                      description: ObjectRef references another object by name (same
                        namespace).
                      properties:
                        name:
                          description: Name of the referenced object.
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    minItems: 1
                    type: array
                required:
                - refs
                type: object
              workingDir:
                description: |-
                  WorkingDir names a Repositories entry this capability's conversations
                  start in, instead of the workspace root — same rule as
                  AgentProfileSpec.WorkingDir.
                maxLength: 63
                type: string
            type: object
            x-kubernetes-validations:
            - message: capabilityRef and the inline capability fields (profileRef,
                runtimeRef, serviceAccountName, toolsets, mcpConfigs, persistence,
                repositories, agentFile, workingDir) are mutually exclusive
              rule: '!(has(self.capabilityRef) && (has(self.profileRef) || has(self.runtimeRef)
                || has(self.serviceAccountName) || has(self.toolsets) || has(self.mcpConfigs)
                || has(self.persistence) || has(self.repositories) || has(self.agentFile)
                || has(self.workingDir)))'
          status:
            description: PipelineStatus reports wiring validity.
            properties:
              conditions:
                description: |-
                  Conditions: Ready (all references resolve). There is no SourceConflict
                  condition — sources are shareable, so listing one another pipeline also
                  lists is a valid configuration, not a conflict.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

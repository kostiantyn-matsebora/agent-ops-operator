apiVersion: v2
name: agent-ops-operator
description: >-
  Kubernetes operator for agents you can address — monitoring signals and chat
  tasks become Conversations executed by per-conversation agent runtime pods.
type: application
# `sources` is what Helm maps to the OCI annotation
# org.opencontainers.image.source, which is what links the published chart
# package to this repository. The images carry the same fact as a Dockerfile
# LABEL plus an index annotation — three spellings of one thing, because each
# artifact kind reads a different one.
sources:
  - https://github.com/kostiantyn-matsebora/agent-ops-operator
home: https://kostiantyn-matsebora.github.io/agent-ops-operator/
version: 13.1.1
appVersion: "0.54.0"
dependencies:
  # embedded subchart (chart/charts/prometheus); templates are
  # additionally self-gated on prometheus.enabled
  - name: prometheus
    version: 0.2.0
    repository: ""
    condition: prometheus.enabled
  # embedded subchart (chart/charts/kubernetes). NO condition: the bundle turns
  # on via `enabled` OR `global.demo.enabled`, and a Helm condition evaluates
  # only the first existing path — it could never express the OR. Every template
  # self-gates instead.
  - name: kubernetes
    version: 0.3.0
    repository: ""
  # embedded subchart (chart/charts/telegram); templates are
  # additionally self-gated on telegram.enabled
  - name: telegram
    version: 0.4.0
    repository: ""
    condition: telegram.enabled
  # embedded subchart (chart/charts/home-assistant); templates are additionally
  # self-gated on home-assistant.enabled
  - name: home-assistant
    version: 0.1.0
    repository: ""
    condition: home-assistant.enabled
  # embedded subchart (chart/charts/claude) — the REFERENCE RUNTIME, and the one
  # bundle that is ON by default: it is what a fresh install executes on.
  # Disabling it with no replacement FAILS the render through
  # `agentops.defaultRuntimeGuard`, rather than leaving conversations Pending
  # forever with the reason in nobody's view.
  - name: claude
    version: 0.1.0
    repository: ""
    condition: claude.enabled
  # embedded subchart (chart/charts/ollama) — a SECOND vendor runtime, over an
  # Ollama endpoint the install already runs. OFF by default; a route selects
  # it with `runtimeRef: ollama`.
  - name: ollama
    version: 0.1.0
    repository: ""
    condition: ollama.enabled

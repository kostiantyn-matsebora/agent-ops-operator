image:
  repository: kmatsebora/agentops-manager
  tag: 0.15.0

# Concurrency cap: live agent runtime pods across all conversations.
maxRuntimes: 8
# Idle minutes before a runtime pod exits (respawned on demand); AgentRuntime
# CRs may override per runtime.
runtimeIdleTtlMinutes: 10

serviceAccounts:
  # the manager (CRDs + pod lifecycle in its namespace only)
  manager: agentops-manager
  # agent runtime pods run under this SA — its permissions ARE the agent's powers
  runtime: agentops-runtime

# The agent's powers, declared in the release (empty = agents can do nothing
# in-cluster). Object names: <runtime-sa>-<name>.
rbac:
  runtime:
    # ClusterRoles created + bound to the runtime SA: [{name, rules: [...]}]
    clusterRoles: []
    # Existing ClusterRoles to bind (e.g. ["view"] for cluster-wide reads)
    bindClusterRoles: []
    # Namespaced Roles in other namespaces: [{name, namespace, rules: [...]}]
    namespaced: []

# Demo advisor: a project-agnostic, read-only "k8s-engineer" agent you can try
# minutes after install — no chat, no repo, no MCP setup. Ask via the HTTP API:
#   kubectl -n <ns> run q --rm -i --image=curlimages/curl --restart=Never -- \
#     curl -s -X POST http://agentops-manager.<ns>.svc:8080/task \
#     -H 'Content-Type: application/json' \
#     -d '{"profile":"k8s-engineer","task":"why is pod X crashlooping?"}'
# Answer: kubectl get conversation <name> -o jsonpath='{.status.runs[0].result}'
# (or follow the runtime pod logs live). Requires ONE secret with a Claude
# credential (claude setup-token output or an Anthropic API key).
#
# Demo mode is exactly "the k8s-bundle subchart with its defaults" — profile,
# runtime, read-only RBAC, AND the cluster Events lane. It lives under `global.`
# because a subchart can read no other parent scope.
#
# NOTE: unlike the pre-2.0 demo, this ingests Warning events and answers them
# on its own, which costs LLM credits on a noisy cluster. For the old ask-only
# behavior set `k8s-bundle.eventsAdapter.enabled: false` alongside it.
global:
  demo:
    enabled: false

  # The built-in tool vocabulary as MCPToolset CRs, so profiles and pipelines can
  # NAME tools instead of inlining comma strings. Split by risk on purpose — that
  # is what lets one route observe while another executes:
  #
  #   spec:                              # on a Pipeline
  #     toolsets:
  #       mode: overwrite                # merge would re-add what you withheld
  #       refs: [{name: agentops-observe}]
  #
  # binds observation only for THAT route, while other pipelines sharing the
  # profile keep shell. Profiles carry no tools at all — a Pipeline with no
  # sources and no channels declares a profile's BASELINE, which is what
  # conversations with no routing pipeline (POST /task, /<profile>) resolve.
  #
  # Extend a list here rather than creating a CR: adding "Skill" or "WebFetch" to
  # observe.tools reaches every binding that references it, at the next work unit.
  builtinToolsets:
    enabled: true
    observe:
      name: agentops-observe
      tools: [Read, Grep, Glob]
    shell:
      name: agentops-shell
      tools: [Bash]
    edit:
      name: agentops-edit
      tools: [Edit, Write]

service:
  apiPort: 8080
  metricsPort: 9090

# Auth between the manager and channel adapters (/channel/* endpoints). The
# token is generated once and injected into both sides as env — the manager
# never reads Secrets from the API.
adapterAuth:
  # Name of the generated token Secret (key: token). Reused across upgrades.
  secretName: agentops-adapter-token
  # Use an existing Secret (key: token) instead of generating one.
  existingSecret: ""

# Reference channel adapter: serves Channels with spec.type=telegram, shipped
# as a ChannelAdapter CR — the operator's reconciler owns the workload
# (replicas 1 + Recreate: Telegram getUpdates allows exactly ONE consumer per
# bot token, ever). Bot tokens live on each Channel via
# spec.credentialsSecretRef (Secret key botToken), projected into the adapter
# pod by the reconciler — several Channels with different Secrets run several
# bots through this one adapter. When migrating from a chart-managed adapter
# Deployment (chart <= 1.0), upgrade with this DISABLED first so helm removes
# the old Deployment, then enable it.
telegramAdapter:
  enabled: false
  image:
    repository: kmatsebora/agentops-channel-telegram
    tag: 0.4.0
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Agent session persistence (the "home" volume runtime pods mount at /data/home).
# Without it, sessions live in emptyDir and die with each runtime pod — replies
# after an idle period lose conversational context. With multiple concurrent
# runtime pods the volume must be ReadWriteMany (or all pods must land on one node).
persistence:
  enabled: false
  # Create a PVC with this name (AgentRuntime CRs reference it via home.pvcRef;
  # it is also exported as the manager's HOME_PVC bootstrap default).
  name: agentops-home
  size: 5Gi
  # "" = cluster default StorageClass
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  # Bind to a pre-provisioned PV instead of dynamic provisioning.
  volumeName: ""
  # Use an existing PVC instead of creating one (overrides everything above).
  existingClaim: ""

# Extra env for the manager (e.g. RUNTIME_IMAGE bootstrap fallback).
extraEnv: []

nodeSelector: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Kubernetes agent bundle (embedded subchart, OFF by default; demo mode turns
# it on with these defaults). Three independent components — the cluster Events
# lane, the k8s-engineer profile with its runtime, and that runtime's RBAC. See
# chart/charts/k8s-bundle/values.yaml for the full surface. Typical enablement
# WITHOUT demo mode:
# k8s-bundle:
#   enabled: true
#   profile:
#     runtime:
#       credentialsSecret: { name: agentops-claude, key: oauthToken }
#       # sessions survive runtime pods only with a claim (the parent
#       # `persistence` block is invisible to subcharts — name it here):
#       homePvcRef: agentops-home
#   rbac:
#     mode: readonly                    # readonly | full (full = cluster-admin)
#   eventsAdapter:
#     enabled: true                     # false = ask-only, no event ingestion
#     source:
#       severities: [Warning]
#       namespaces: []                  # empty = cluster-wide
#       channels: [<your-channel>]      # optional: mirror to chat

# VictoriaMetrics bundle (embedded subchart, OFF by default; never enabled by
# demo mode — it needs your VM endpoints). See chart/charts/vm-bundle/values.yaml
# for the full surface. Typical enablement:
# vm-bundle:
#   enabled: true
#   alertmanager:
#     defaultSource:
#       enabled: true                   # SignalSource + wiring Pipeline
#       profileRef: <your-profile>      # your alert-handling profile
#       channels: [<your-channel>]
#   # EITHER point at existing MCP servers:
#   mcp:
#     vmlogs:    { url: http://mcp-victorialogs.<ns>.svc/sse }
#     vmmetrics: { url: http://mcp-victoriametrics.<ns>.svc/sse }
#   # OR deploy them (mcp.*.url left empty then defaults to these):
#   mcpServers:
#     enabled: true
#     vmlogs:    { backend: http://<victorialogs>:9428 }
#     vmmetrics: { backend: http://<victoriametrics>:8429 }
#   # No bundled profile: bind mcpConfigs [vm-logs, vm-metrics] + toolsets
#   # [vm-observability] on the Pipeline routing these alerts (see README).

# CRD management (cert-manager pattern): templated, so upgrades work.
crds:
  # Install/upgrade the agentops.dev CRDs with this release.
  enabled: true
  # Keep CRDs on `helm uninstall` (helm.sh/resource-policy: keep) — protects
  # every Conversation/AgentProfile/... from cascade deletion. Disable only if
  # you really want uninstall to wipe all agentops data.
  keep: true

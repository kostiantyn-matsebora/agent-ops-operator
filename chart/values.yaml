image:
  repository: ghcr.io/kostiantyn-matsebora/agentops-manager
  tag: 0.57.1

# How many conversations may be ACTIVE at once. A conversation is active while
# it holds a runtime pod; one that finished and let its pod exit costs nothing
# and does not count. Over-cap work is not dropped — it waits in phase Pending
# (no pod, no chat topic, no MCP ConfigMap) and is admitted FIFO by creation
# time as slots free.
#
# UPGRADE-VISIBLE: was `maxRuntimes: 8`. The default is now 5, so an install
# that never set the old key gets less throughput and more queueing; raise this
# to restore it. Nothing is lost, only delayed (up to maxQueuedConversations).
maxActiveConversations: 5

# Bound on the PENDING backlog. Beyond it /signal/inbound declines to create a
# conversation and reports the batch as dropped for capacity — chat senders are
# told on the surface they typed on, alerts are logged and counted.
maxQueuedConversations: 50

# DEPRECATED alias for maxActiveConversations, honored for one release when the
# new key is unset (the manager logs a deprecation line). Named after pods
# rather than conversations, which is what made `maxRuntimes: 5` read as a limit
# on AgentRuntime kinds. Unset by default; setting it emits the retired
# MAX_RUNTIMES env, honoured for one release.
maxRuntimes: ""


serviceAccounts:
  # the manager (CRDs + pod lifecycle in its namespace only)
  manager: agentops-manager
  # MOVED to global.agentops.runtimeDefaults.serviceAccountName — the k8s bundle
  # derives its MCP server's identity guard from the runtime SA, and a subchart
  # can read no parent scope but `global.`. Setting it here now FAILS the render
  # naming the new key, rather than quietly running agents under an identity you
  # did not choose.
  runtime: ""

# ADDITIONAL runtime identities this install declares.
#
# THERE IS NO PRESET POSTURE. What a route may do in the cluster is an account
# somebody wrote down and named on the Pipeline that needs it — a grant that is
# deliberate and separately reviewable, rather than a mode name that silently
# means something. The account a route naming nothing inherits holds NOTHING,
# and nothing this chart renders can widen it.
rbac:
  # DRAIN AWARENESS costs the manager its first cluster-scoped grant, so it is
  # opt-in and off.
  #
  # When a node is cordoned the manager releases the IDLE runtime pods on it, so
  # the shared context volume detaches and its filesystem unmounts before the
  # machine goes down. That is the window a corrupt filesystem comes from: a
  # reboot manager that force-reboots on a drain timeout takes the block device
  # away while ext4 is still mounted and dirty.
  #
  # Nodes are cluster-scoped, so seeing a cordon at all needs a ClusterRole
  # (nodes: get,list,watch — read-only, nothing else). Every other permission
  # this manager holds is namespaced, and that posture is worth keeping by
  # default: an install that reboots gracefully, or that does not share a
  # context volume, gains nothing here.
  #
  # NOT a substitute for a working drain. Kubernetes already refuses to schedule
  # new pods onto a cordoned node, and an ordinary eviction unmounts cleanly on
  # its own. What this buys is PROMPTNESS — idle pods go at cordon time rather
  # than whenever the drain reaches them, which matters when the reboot happens
  # on a timeout rather than on the drain finishing.
  drainAware: false
  runtime:
    # RUNTIME IDENTITIES, for a Pipeline to NAME in `spec.serviceAccountName`.
    #
    # THE FLOOR ACCOUNT (`agentops-runtime`) IS NOT ONE OF THESE. This chart
    # always renders it, always bound to nothing, and refuses to bind anything
    # to it — that is what makes a route naming no account powerless, and it is
    # also what keeps the floor NAMEABLE as a way to take one route back to
    # nothing on an install whose inherited default carries rights.
    #
    # THIS IS WHAT REPLACED CLONING AN `AgentRuntime`. The account used to have
    # nowhere to live except the runtime, so a second trust level meant a second
    # AgentRuntime identical but for one field. Now one runtime image serves
    # both and the difference is stated on the route, beside the tools that
    # route grants — one object stating an agent's power instead of two.
    #
    # Each entry declares an account and its posture:
    #
    #   serviceAccounts:
    #     - name: agentops-runtime-acting
    #       create: true          # default; false references an account you own
    #       clusterRoles: []      # ClusterRoles created AND bound to it
    #       bindClusterRoles: []  # existing ClusterRoles to bind
    #       namespaced: []        # Roles in other namespaces
    #
    # AN ENTRY STATING NONE OF THE THREE IS CREATED HOLDING NOTHING, which is a
    # useful thing to declare: a named identity for an audit, with no grant.
    #
    # `rbacMode` IS DELETED AND FAILS THE RENDER. It named a posture — `readonly`
    # or `full` — and a reviewer reading `full` sees a word rather than the
    # verbs. That is the same objection that deleted the release-wide mode, and
    # being declared per account rather than defaulted release-wide does not make
    # the word readable. It also read as harmless while granting an agent's own
    # ServiceAccount cluster-wide write, which is a path around the MCP server
    # and its toolset split — the wall an agent's cluster reach is supposed to
    # go through.
    #
    # WHERE TO START WHEN WRITING `rules:` — `agentops.runtimeReadRules` and
    # `agentops.runtimeWriteRules` in chart/templates/_helpers.tpl. They are what
    # the deleted modes expanded to, and the `kubernetes` bundle still binds them
    # to its MCP server. Copy what you want and read what you copied.
    #
    # AND READ THE WRITE RULES BEFORE COPYING THEM: where the helper emits them
    # they are gated by runtimeDefaults.allowPodExecution, and a hand-written
    # copy carries no such gate. Anything that produces or enters a pod reads
    # every Secret the kubelet resolves for it.
    #
    # ...then on the acting Pipeline:
    #
    #   pipelines:
    #     - name: k8s-operate
    #       serviceAccountName: agentops-runtime-workloads
    #
    # An account this chart does NOT create is fine and is not refused: naming
    # is a reference, and who may create one and what it is bound to stays an
    # external grant — the same posture adapters already have. A name nothing
    # backs fails at pod admission, saying which account.
    serviceAccounts: []

# THE REFERENCE RUNTIME, AS A BUNDLE — and where you set the model credential.
#
# ON BY DEFAULT, unlike every other bundle here, because this is what a fresh
# install executes on. It renders ONE `AgentRuntime` named `default`, which is
# what a Pipeline naming no `runtimeRef` resolves to.
#
# THE CREDENTIAL IS THE ONE VALUE AN INSTALL MUST SUPPLY:
#
#   claude:
#     credentialsSecret:
#       token: <a `claude setup-token` output, or an Anthropic API key>
#
# THIS SECTION IS DECLARED HERE SO IT IS VISIBLE. Helm resolves a subchart's
# values as `.Values.claude` whether or not the parent names the key, so the
# section worked without this block and appeared in `helm show values` nowhere —
# an operator had to read `chart/charts/claude/values.yaml` to learn that the
# vendor's image and credential had moved out of the release-wide defaults.
#
# Everything the bundle accepts is documented there, and every key
# `global.agentops.runtimeDefaults` accepts is accepted here too, overriding it
# for this runtime only.
#
# RUNNING A DIFFERENT BACKEND? Set `claude.enabled: false` and declare your own
# under `runtimes:` below, stating its image and its credential — the defaults
# carry neither, on purpose.
claude:
  enabled: true
  # name: default
  # image: ghcr.io/kostiantyn-matsebora/agentops-runtime-claude:0.8.0
  credentialsSecret:
    token: ""

# The SECOND vendor this chart ships: a local-model runtime over an Ollama
# endpoint you already run (chart/charts/ollama/values.yaml). OFF by default,
# and it deploys no model server — `endpoint` and `model` are yours to set.
# A route selects it with `pipelines[].runtimeRef: ollama`.
#
#   ollama:
#     enabled: true
#     endpoint: http://ollama.ollama.svc:11434
#     model: qwen2.5:14b
ollama:
  enabled: false

# THE RUNTIMES THIS INSTALL DECLARES — the second of the two runtime blocks.
#
# THE RULE SEPARATING THEM, in one line each:
#   global.agentops.runtimeDefaults   what EVERY runtime inherits
#   runtimes:                         the runtimes that EXIST, each stating
#                                     only what DIFFERS from those defaults
#
# `default` is the name a Pipeline declaring no `runtimeRef` resolves to, and
# THE CHART RENDERS IT as a copy of one declared runtime: the one flagged
# `default: true` (here, or on a bundle), or the FIRST configured when none is —
# `runtimes:` entries in order, then the bundles. One runtime alone is always
# the default. Every runtime is optional. THE RENDER FAILS when NO runtime is
# declared while a route still resolves to `default`, or when two are flagged.
# That check replaced the old guarantee that this chart always rendered one: a
# runtime may now come from a bundle, and a bundle can be turned off.
#
#   runtimes:
#     - name: mine                 # inherits every default; states its own image
#       default: true              # the one a route naming no runtimeRef runs on
#     - name: ollama               # a second VENDOR, stating only its difference
#       image: ghcr.io/example/agentops-runtime-ollama:0.1.0
#       contextStorage: external   # keeps context at its own API, needs no disk
#       credentialsSecret:
#         name: agentops-ollama
#         envName: OLLAMA_API_KEY
#
# ...then a route selects it:
#
#   pipelines:
#     - name: house-ops
#       runtimeRef: ollama
#
# ONE `AgentRuntime` PER VENDOR is the shape. A second TRUST LEVEL is NOT a
# second runtime — the identity is on the route (`pipelines[].serviceAccountName`)
# and so is the storage (`pipelines[].persistence`), so one image serves both.
#
# EMPTY BY DEFAULT, WHICH IS NOT THE SAME AS "NO RUNTIME". The `claude:` bundle
# ships one answering to `default`, on by default, and that is what a fresh
# install executes on. Disable that bundle and declare your own here — or every
# route names its own `runtimeRef`, and the render fails otherwise.
runtimes: []

# Demo advisor: a project-agnostic, read-only "k8s-engineer" agent you can try
# minutes after install — no chat, no repo, no MCP setup. Requires ONE secret
# with a Claude credential (claude setup-token output or an Anthropic API key).
#
# The CONSOLE is wired for you: the route claims its signal source and binds it
# as a channel, so the quickest ask is to port-forward the console and start a
# conversation there. The walkthrough:
#   https://kostiantyn-matsebora.github.io/agent-ops-operator/getting-started/
#
# Demo mode is exactly "the kubernetes subchart with its defaults" — the
# k8s-engineer profile, its MCP tooling AND the cluster Events lane — plus the
# read-only RBAC it resolves for this chart's own runtime, and the console
# claim. It lives under `global.` because a subchart can read no other parent
# scope.
#
# NOTE: it also ingests Warning events and answers them on its own, which costs
# LLM credits on a noisy cluster (cooldown, grouping and the conversation cap
# bound it). `kubernetes.eventsAdapter.enabled: false` removes that lane and
# leaves the console one — the `cluster-events` SOURCE goes with the adapter, so
# a signal posted to it afterwards has nothing to land on.
global:
  demo:
    enabled: false

  # The release-wide facts declared in the ONE scope a subchart can read.
  # kubernetes's MCP server derives its own identity and posture from the
  # runtime keys, and both bundles render their MCP servers' network policies
  # from the networkPolicy key — which is why none of these is an ordinary
  # top-level value.
  agentops:
    # WHO MAY REACH THE COMPONENTS THIS RELEASE DEPLOYS.
    #
    # Every component here assumes its callers are wired. Nothing enforces that
    # on its own: the MCP servers accept any caller, and so does the manager's
    # work contract. Enabling this restricts each component to the callers its
    # wiring implies.
    #
    # READ THE WARNING IN NOTES.txt BEFORE TRUSTING IT. A NetworkPolicy on a
    # cluster whose CNI does not enforce policy applies cleanly, appears in
    # `kubectl get`, and protects NOTHING. This chart cannot detect the
    # difference, which is why the output says so rather than reporting your
    # components as protected.
    #
    # Off by default: on a cluster that DOES enforce, a policy that missed a
    # flow breaks it, and that is not a surprise to hand an install by default.
    networkPolicy:
      enabled: false
      # Callers permitted to reach the MANAGER's API beyond the release's own
      # adapters and runtime pods. Raw NetworkPolicyPeer entries.
      extraIngress: []
      # Peers allowed to scrape the manager's metrics port. A collector in
      # another namespace needs naming here, or enabling policy silences it.
      metricsFrom: []
      # Peers allowed to reach the console — normally the ingress controller's
      # namespace. The console is what an operator loses first if this is
      # wrong, so it is its own key rather than folded into extraIngress.
      consoleFrom: []
      # WHERE THE KUBELET PROBES COME FROM.
      #
      # A liveness probe originates on the NODE, and a node is not a pod — no
      # podSelector or namespaceSelector can name it. Some CNIs exempt host
      # traffic and some do not, and on one that does not, a policy that omits
      # this does far worse than lose monitoring: liveness fails, the kubelet
      # restarts the workload, and the install crash-loops because of the policy
      # meant to protect it.
      #
      # The manager's probe port serves only /healthz and /readyz, so it is
      # opened unconditionally. The MCP servers probe the SAME port they serve
      # MCP on, so they cannot be — name your node addresses here instead.
      #
      #   probesFrom:
      #     - ipBlock:
      #         cidr: 192.0.2.0/24   # your node network
      #
      # Leave it empty ONLY if you have confirmed your CNI exempts host traffic.
      probesFrom: []
    # HOW AGENTS EXECUTE — a COMPLETE runtime configuration, and the one every
    # runtime in this release inherits. The other half is the top-level
    # `runtimes:` list, which states only what DIFFERS from this.
    #
    # THESE DEFAULTS ARE SUFFICIENT FOR EVERY VENDOR-NEUTRAL DECISION — the
    # storage shape, the resource requests, the idle TTL, egress mediation,
    # context synchronisation. What they deliberately do NOT carry is an image
    # or a model credential, because neither can be stated without naming a
    # vendor: the reference runtime's are in the `claude:` section below, and
    # another backend states its own on its `runtimes:` entry.
    #
    # THE MODEL CREDENTIAL IS THE SINGLE VALUE WITH NO DEFENSIBLE DEFAULT, so it
    # is the one thing an install must supply — `claude.credentialsSecret.token`
    # for the shipped runtime, or point a runtime at a Secret you manage.
    #
    # "Defaults" does NOT mean the fields left over after the list took the
    # interesting ones. A block omitting the storage shape or the resource
    # requests would document nothing and configure nothing, and every install
    # would restate the same values.
    #
    # WHY IT LIVES UNDER `global.` AND NOT AT PARENT SCOPE, which is a forcing
    # rather than a preference. A subchart reads no parent scope but this one,
    # and TWO things need these values from in there:
    #
    #   1. `allowPodExecution` is read by `agentops.runtimeWriteRules` — a
    #      PARENT helper the `kubernetes` bundle CALLS to build its MCP server's
    #      RBAC. Named templates are global in Helm, but inside a call made from
    #      a subchart only `.Values.global` resolves. Move that read to parent
    #      scope and the MCP server's write rules silently lose their gate,
    #      which is the other half of the same wall.
    #   2. A BUNDLE MAY SHIP A RUNTIME, and it has no other scope to inherit
    #      these defaults from. Restating them per bundle would be one fact in
    #      as many places as there are vendors.
    #
    # The parent-only keys ride along, and that costs nothing: a subchart that
    # never reads `image` is not harmed by being able to.
    runtimeDefaults:
      # WHAT EVERY RUNTIME INHERITS, AND NOTHING THAT NAMES A VENDOR.
      #
      # The reference runtime's IMAGE and its MODEL CREDENTIAL are not here:
      # they live in the `claude:` bundle that ships that runtime, beside its
      # own name. They sat here once, and an install running another backend
      # inherited one vendor's image reference and its environment variable —
      # which is the thing extracting the bundle was meant to end.
      #
      # A key here is one that means the same for every vendor. If you cannot
      # state it without naming one, it belongs to that vendor's bundle or to a
      # `runtimes:` entry.
      # Does this runtime's backend keep a conversation's context on a DISK at
      # all: `volume`, `external` or `none`. It is BACKEND SHAPE, never
      # PLACEMENT — WHICH volume is the route's decision, on
      # `pipelines[].persistence`. The manager reads it to know whether
      # continuity is possible here BEFORE promising it, so a runtime that keeps
      # context at a vendor API says `external` and is never failed for a volume
      # it does not need.
      contextStorage: volume
      # Idle minutes before a runtime pod exits (respawned on demand).
      #
      # THE ONE NUMBER, and it lives here for the same reason `resources` does:
      # the retired top-level `runtimeIdleTtlMinutes` was one the parent alone
      # could read, which a bundle-shipped runtime could not inherit — it rendered an
      # EMPTY field, and the CRD's structural default of 10 silently replaced
      # the release's setting.
      #
      # At 1 a finished conversation releases its slot within a minute instead
      # of holding it for ten, which is what makes a small
      # maxActiveConversations workable. The trade is latency, not memory: a
      # follow-up a few minutes later pays pod startup again, but the context
      # survives in /data/context and resumes. Raise it for runtimes with
      # expensive startup, or for a chatty human you want a warm pod for.
      #
      # It is always WRITTEN to the CR: the CRD carries a structural default of
      # 10, so an omitted field is not "unset" — the API server stores 10 and
      # the manager prefers any non-zero spec value over its own bootstrap
      # default. Omitting it looked correct in the rendered manifest and was
      # wrong in the stored object.
      idleTtlMinutes: 1
      # Where conversation runtime pods may be scheduled. Set it when a runtime
      # image is not multi-arch, or when agent work belongs on particular nodes
      # — a runtime pod that lands on an unsupported architecture just
      # crash-loops. The reference runtime-claude images are multi-arch from
      # 0.7.0; older tags are amd64 only.
      nodeSelector: {}
      # WRITTEN OUT, not `{}`. These are the numbers the manager applies when a
      # runtime states none, and they existed either way — compiled into the
      # operator, where no operator could read or tune them. The first sign of
      # one being wrong is an evicted conversation, which is a poor place to
      # discover a value you were never shown.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1536Mi
      # THE IDENTITY EVERY ROUTE INHERITS — and it is a REFERENCE this chart
      # does NOT create. Naming is not creating, which is the posture adapters
      # already have, and it is also what makes reusing an account you already
      # own possible at all: a chart creating it would collide on Helm's
      # ownership check.
      #
      # THE DEFAULT IS THE FLOOR, `agentops-runtime`, which this chart DOES
      # render and binds to NOTHING, in any configuration. SILENCE MEANS NO
      # POWER: a route that says nothing about its identity can do nothing in
      # the cluster. It reaches only what its toolsets and MCP servers give it,
      # declared on the same object that could have named an account.
      #
      # It shipped inverted once — a release-wide mode bound its posture to the
      # account every unnamed route inherited, and three of four routes in the
      # reference install held pod-delete and node-patch because nobody typed a
      # field, two of them routes that reach no Kubernetes API at all.
      #
      # POINT IT AT AN ACCOUNT OF YOUR OWN to give every unnamed route a
      # baseline — declare it under `rbac.runtime.serviceAccounts`, or bring one
      # this chart never sees. The floor is still rendered when you do, and that
      # is the useful half: naming `agentops-runtime` on ONE Pipeline is then
      # how that route is taken back to nothing.
      serviceAccountName: agentops-runtime
      # MAY AN ACTING AGENT CAUSE A POD TO EXIST, OR ENTER ONE?
      #
      # OFF, AND THIS IS THE FLAG THAT DECIDES WHETHER "AGENTS CANNOT READ YOUR
      # SECRETS" IS TRUE OR MERELY WRITTEN DOWN.
      #
      # No runtime role this chart renders carries any verb on `secrets`. That
      # is not enough on its own. The KUBELET resolves a Secret when it builds a
      # pod, so an agent that can create a pod mounting one — or exec into a pod
      # that already has one — reads the value having never asked the API server
      # for a Secret. `secrets: get` is never evaluated, and no RBAC rule
      # refusing it applies.
      #
      # Verified on a live cluster against this exact role: pod created, pod log
      # read, secret value returned, with all seven `secrets` verbs denied
      # throughout.
      #
      # WHAT IT GATES is every write that produces or enters a pod, not just
      # `pods: create`. Creating a Job, Deployment, StatefulSet or DaemonSet
      # writes a pod spec that can mount a Secret, and patching an existing one
      # edits that spec. Gating the obvious verb and leaving the rest would be a
      # flag that reads as a boundary and is not one.
      #
      # BOTH WALLS MOVE TOGETHER. It gates the acting rules bound to an account
      # you declare AND the `kubernetes` bundle's MCP server role, through one
      # shared helper — because an agent reaches the cluster THROUGH that
      # server, so fixing one wall leaves the hole one indirection along.
      #
      # WITH IT OFF an agent is still a real operator. It reads the cluster,
      # scales workloads, deletes and evicts pods, cordons nodes, deletes
      # workloads, and creates or edits ConfigMaps, Services, Ingresses,
      # NetworkPolicies, PodDisruptionBudgets, HPAs and PVCs. What it cannot do
      # is RUN NEW CODE — which on Kubernetes is the same capability as reading
      # a Secret.
      #
      # TURN IT ON ONLY IF YOU ACCEPT THE AGENT READING EVERY SECRET IN THE
      # CLUSTER. The grants are cluster-wide, so that is the scope.
      allowPodExecution: false
      # CONTEXT SYNC — keep the LIVE context off the durable volume.
      #
      # A node reboot corrupted the shared context filesystem on 2026-08-20.
      # Because the live context WAS that volume, one damaged filesystem took
      # every conversation's context with it AND stopped every runtime pod from
      # starting.
      #
      # Enabled, a sidecar keeps the live context on pod-local storage and the
      # durable volume holds a SNAPSHOT: a run already going survives the volume
      # going bad underneath it, and the agent container loses its mount of the
      # volume entirely — so it can neither read another conversation's context
      # nor corrupt the filesystem.
      #
      # OFF unless `paths` is set, because only the RUNTIME knows where its
      # backend keeps context. The chart cannot infer it, and a wrong guess
      # persists nothing while looking configured.
      contextSync:
        # Include globs relative to the runtime's HOME. For the reference
        # runtime-claude this is where claude-code files its transcripts.
        # Empty disables the whole mechanism.
        paths: []
        # - ".claude/projects/-data-workspace/**"
        #
        # Churn INSIDE those paths. Without it the change detector reports a
        # change on nearly every cycle and the skip-when-unchanged rule buys
        # nothing.
        exclude: []
        # How often to checkpoint while a pod is alive. "0s" leaves only
        # work-boundary checkpoints. This bounds what a SIGKILL can lose.
        interval: 2m
        # Previous copies kept. More than one because a checkpoint taken mid-run
        # may hold a partially written file, and the older copies are the
        # fallback.
        retain: 3
        # The sidecar image. RELEASE-WIDE rather than per runtime: it implements
        # a contract, and the manager reads it once as bootstrap configuration.
        image: ghcr.io/kostiantyn-matsebora/agentops-context-sync:0.2.2
        # Bounds the pod-local live context. In this mode the WHOLE context tree
        # is ephemeral — caches and tool state included — so it must be
        # generous. Empty leaves it unbounded, which is Kubernetes' own default.
        # RELEASE-WIDE, like the image above.
        liveSizeLimit: 4Gi
      # ENFORCE THE AGENT'S TOOL ACCESS FROM OUTSIDE THE AGENT.
      #
      # The tool allowlist reaches the agent as `--allowedTools` on a CLI
      # running beside it, so it configures a COOPERATING agent. An agent with a
      # shell — `agentops-shell` is bound on ordinary pipelines — can open a
      # socket to a bound MCP server and call anything that server registers.
      # Mediation puts a proxy in the pod that the agent's traffic cannot route
      # around, and enforces the bound toolsets there.
      #
      # ON BY DEFAULT. The wall that constrains an uncooperative agent is not
      # something an operator should have to discover: shipping it off left
      # every install with the weaker of the two until somebody read far enough.
      #
      # THE COST, AND IT LANDS LATE. Mediation adds a PRIVILEGED init container
      # (NET_ADMIN) that installs the redirect and exits before the agent
      # starts, and a namespace under `restricted` Pod Security admission
      # REFUSES it — at POD ADMISSION, not at render, so the failure appears far
      # from this setting. It also adds a container per active conversation.
      # Set `enabled: false` here, or on one runtime, to decline it.
      egressMediation:
        enabled: true
        # The proxy image. Release-wide like the sidecar above: a contract, not
        # a backend choice.
        image: ghcr.io/kostiantyn-matsebora/agentops-egress-proxy:0.2.3
        # The image that installs the redirect. Empty uses the proxy image,
        # which ships both. Point it elsewhere only to keep the privileged image
        # minimal.
        initImage: ""
        # The port the proxy listens on inside the pod. Override only if a
        # runtime image already uses it. Nothing outside the pod can reach it.
        port: 15001
        # Destination ports left UNREDIRECTED. Every port here is one the agent
        # reaches unmediated, so this is a hole in the boundary by construction
        # — not a tuning knob.
        excludePorts: []
    # What a subchart needs to know about the console, in the ONE scope it can
    # read. A bundle that ships a route claims this source and binds this
    # channel, so an install that deploys the console can start a conversation
    # in it without an operator wiring that up by hand — the console shipped
    # inert otherwise, which is a working demo in every part except the one
    # anybody opens first.
    #
    # These MIRROR `console.enabled` / `console.signalSourceName` /
    # `console.channelName` and the render FAILS if they disagree: values cannot
    # be derived from other values, so the duplication is real and is made safe
    # by being checked rather than trusted. Setting `console.enabled: false`
    # means clearing `signalSource` and `channel` here too, and the failure says
    # exactly that.
    console:
      signalSource: console
      channel: console

  # The built-in tool vocabulary as MCPToolset CRs, so profiles and pipelines can
  # NAME tools instead of inlining comma strings. Split by risk on purpose — that
  # is what lets one route observe while another executes:
  #
  #   spec:                              # on a Pipeline
  #     toolsets:
  #       mode: overwrite                # merge would re-add what you withheld
  #       refs: [{name: agentops-observe}]
  #
  # binds observation only for THAT route, while other pipelines sharing the
  # profile keep shell. Profiles carry no tools at all, and nothing supplies a
  # default: a Pipeline that declares no toolsets grants none, so every route —
  # a claimed source, a posted `kind: task` signal, a chat command — gets
  # exactly what its own Pipeline binds.
  #
  # Extend a list here rather than creating a CR: adding "Skill" or "WebFetch" to
  # observe.tools reaches every binding that references it, at the next work unit.
  builtinToolsets:
    enabled: true
    observe:
      name: agentops-observe
      tools: [Read, Grep, Glob]
    shell:
      name: agentops-shell
      tools: [Bash]
    edit:
      name: agentops-edit
      tools: [Edit, Write]

# Wiring — the ONLY place Pipelines are declared. No bundle ships one: a
# Pipeline names a profile, sources and channels that routinely come from
# DIFFERENT bundles, so wiring belongs to the install rather than to any
# component of it. A source no Pipeline claims drops every signal.
#
#   pipelines:
#     - name: k8s-ops                 # Pipeline CR name
#       profile: k8s-engineer         # REQUIRED
#       signalSources: [cluster-events, k8s-ops-chat, home-ops]
#       channels: [k8s-ops]
#       toolsets: [agentops-observe, agentops-shell, k8s-observability]
#       toolsetsMode: merge           # optional: merge (default) | overwrite
#       mcpConfigs: [k8s-api]
#       runtimeRef: default           # optional: what EXECUTES this route
#       serviceAccountName: ""        # optional: UNDER WHOSE IDENTITY
#       contextClaim: ""              # optional: WHERE ITS STATE LIVES
#       contextVolume: ""             #   ...a claim, XOR a PersistentVolume
#       contextSize: 5Gi              #   ...the claim rendered for that volume
#       workspaceClaim: ""            # the same four, for the checkout
#       workspaceVolume: ""
#       workspaceSize: 10Gi
#
# One entry can claim every source in the install, which is usually what you
# want: one route, one set of capabilities, however a conversation started.
#
# THE LAST TWO ARE THE SAME DECISION AS THE TOOLSETS. One says which tools may
# be called, the other with whose credentials, and stating them on one object is
# what lets a single reviewer approve an agent's power. Both are OPTIONAL and an
# install setting neither behaves exactly as one that could not set them:
# `runtimeRef` falls back to the AgentRuntime named `default`, and
# `serviceAccountName` to that runtime's own account.
#
# Set `serviceAccountName` when one runtime image should serve two trust levels
# — an observing route and an acting one — and render the extra account through
# `rbac.runtime.serviceAccounts` above. That replaced cloning an AgentRuntime
# whose only difference was the account it named.
#
# PERSISTENCE IS THE SAME DECISION READ A THIRD WAY: which tools may be called,
# with whose credentials, and WHERE what the agent accumulates is kept. All
# three are the route's, which is why an AgentRuntime declares no volume at all.
#
# Leave the six unset and the route takes the release-wide claims below
# (`persistence.context` / `.workspace`) with nothing restated — which is what
# nearly every install wants. Set them for a route that keeps its state
# somewhere of its own, and note the CLAIM/VOLUME split:
#
#   contextClaim: a PVC that ALREADY EXISTS. Nothing is created.
#   contextVolume: a PersistentVolume. A pod cannot mount one — only a claim on
#     it — so THE MANAGER renders that claim, named after the route and the
#     volume, with an explicit empty storage class so it BINDS rather than
#     provisioning a second volume beside yours.
#
# That claim OUTLIVES the Pipeline. It carries no ownerRef and the manager holds
# no delete verb on claims, so deleting a route never deletes the accumulated
# context of the conversations it started — the one loss here that reconciling
# again cannot repair.
#
# TWO ROUTES ON ONE RUNTIME CAN NOW KEEP THEIR STATE ON DIFFERENT VOLUMES, which
# is the thing the retired `runtime.contextPvcRef` made impossible.
#
# The Conversation SNAPSHOTS all of it at creation, so re-wiring a Pipeline moves
# only conversations created afterwards. It never changes the identity an
# already-running one's next pod executes as, and never moves a conversation that
# has already written to a volume onto a different one.
pipelines: []

service:
  apiPort: 8080
  metricsPort: 9090

# Auth between the manager and channel adapters (/channel/* endpoints). The
# token is generated once and injected into both sides as env — the manager
# never reads Secrets from the API.
adapterAuth:
  # Name of the token Secret (key: token). Generated at install, then unmanaged.
  secretName: agentops-adapter-token
  # Use an existing Secret (key: token) instead of generating one.
  existingSecret: ""
  # Pin the master token; changing it 401s EVERY adapter until its pod restarts.
  token: ""

# Scrape configuration for the manager's `agentops_*` metrics.
#
# The metrics are ALWAYS exposed on the manager's existing :9090 — this only
# tells a monitoring stack where to look. Everything here is off by default
# because neither VMServiceScrape nor ServiceMonitor is a built-in kind, and
# rendering one without its CRD fails the whole install.
#
# Turn on whichever matches your stack. The rules are examples: two conditions
# that are real failures but look like health from every other angle — ops
# queued with nothing claiming them, and runtime slots pinned at the ceiling.
metrics:
  interval: 30s
  vmServiceScrape:
    enabled: false
    labels: {}
  serviceMonitor:
    enabled: false
    labels: {}
  rules:
    enabled: false
    # VMRule for the VictoriaMetrics operator; set these two to
    # monitoring.coreos.com/v1 + PrometheusRule for prometheus-operator.
    apiVersion: operator.victoriametrics.com/v1beta1
    kind: VMRule
    labels: {}

# The agent-ops console: a browser view of the whole install — CR inventory,
# the wiring graph with LIVE traffic, queues, and conversation runs — that is
# ALSO a channel, so you can reply to an agent from the screen you are watching
# it on, and a signal source, so you can start one.
#
# CRs only: enabling this renders a ChannelAdapter, a Channel, an
# externally-served SignalAdapter, a SignalSource, the UI token Secret and a
# read-only Role. The reconciler brings up the Deployment and the Service, so
# the chart ships no connectivity. Two adapter identities, ONE pod.
#
# TRUST BOUNDARY: whoever holds the UI token sees everything the console's
# ServiceAccount can read — every agentops CR in this namespace, including
# conversation payloads (alert bodies, agent results) — and can INSTRUCT any
# agent the console is joined to, which on an install that granted a route
# workload writes means an agent that can act. The Role is read-only and the
# console writes
# nothing to the Kubernetes API; the token still deserves the care that implies.
#
# ClusterIP with no Ingress by default: reaching it means a port-forward or a
# deliberate decision. When you DO expose it, put an authenticating proxy in
# front (oauth2-proxy against your OIDC provider). The console reads the
# identity from the proxy's forwarded headers and logs every write with it;
# without one, every write is recorded as "token".
#
# ON BY DEFAULT since chart 5.0.0. Enabling it WIRES nothing: conversations show
# up as "observed" until you add the console channel to a Pipeline's
# channelRefs[], and origination is refused until a Pipeline claims the console
# source. Both are one-line edits the UI prints for you.
console:
  enabled: true
  # Name of the ChannelAdapter CR — and therefore of the workload, the SA
  # (agentops-adapter-<name>) and the Service.
  name: console
  # Name of the Channel CR pipelines reference (defaults to `name`).
  channelName: ""
  # Name of the SignalSource the console originates from (defaults to `name`).
  # Sources are SHAREABLE: every Ready Pipeline claiming this one is offered
  # when a message names none, and a `/<pipeline> <task>` command reaches one by
  # name. Declare several (console-k8s, console-ha) when you want the composer
  # to present separate starting points rather than one list of choices.
  signalSourceName: ""
  displayName: agent-ops console
  image:
    repository: ghcr.io/kostiantyn-matsebora/agentops-console
    # 0.25.1 makes the console LIVE rather than polling. A stream event now
    # carries the changed object, projected into the shapes the snapshots serve,
    # so a listing, a kind detail and an open conversation update in place. A
    # change counter used to sit in every query key, which made each event a
    # cache miss and blanked the page for a second — sending a message did it
    # three times. Views that cannot be applied — install counts, the traffic
    # graph, cross-object findings, resolved capabilities — re-read on a stable
    # key, so they change without blanking. The browser cache is bounded to five
    # minutes off screen and persists nothing. Sending a message asks for
    # nothing either: the manager delivers it back to this channel, so the
    # bubble arrives on the stream like any other.
    # 0.15.13 scopes the graph to what you clicked, and fixes a graph that
    # rendered tiny in a corner. Selecting an element narrows the picture to the
    # ROUTE THROUGH IT — everything upstream and everything downstream, to a
    # depth defaulting to all. The route may not turn around: this system shares
    # objects on purpose (one runtime per install, one channel per several
    # pipelines), and an undirected walk turns each into a shortcut. Measured
    # live, that put the Home Assistant toolsets 3 hops from a Kubernetes
    # pipeline and made every depth show the whole graph.
    # Routes are oriented by FLOW, not by how an edge is drawn: `served-by`
    # points from the served CR to its adapter for both kinds, but a signal
    # adapter FEEDS its source while a channel adapter delivers outward. Taken
    # as drawn, every signal adapter was a dead end scoping to two nodes.
    # The depth control offers only the levels a route actually HAS. A Pipeline
    # is the centre of its own route — sources, profile, toolsets, configs and
    # channels are all one hop — so four buttons there gave two pictures and
    # read as broken. A route one hop deep offers no choice and no control.
    # A scope reports what it put out of view on the same terms class hiding
    # does, so it can simplify without concealing a failure.
    # The corner: a graph inside an inactive tab measured a 0x0 host, fitted to
    # it, and clamped to minimum zoom for good. The fit now waits for a host
    # with a size, so it works in a tab, a drawer, or wherever one lands next.
    tag: 0.38.1
  # Browser-facing port; the reconciler owns the Service and injects LISTEN_ADDR.
  port: 8080
  write:
    # Gates BOTH write paths: the chat composer and "new conversation". On by
    # default, because a default-enabled component whose headline capabilities
    # are default-disabled is a confusing way to ship nothing. Turning it off
    # makes the console a strict viewer — the affordances disappear AND the
    # endpoints refuse, so it is a boundary rather than a UI preference.
    enabled: true
  metrics:
    # Optional Prometheus/VictoriaMetrics query endpoint. With it the console
    # renders windows far beyond the manager's in-memory activity buffer
    # (throughput, run-duration percentiles, queue depth over a week) as clearly
    # labelled AGGREGATES. Without it every view still works and long windows
    # are reported unavailable rather than drawn empty.
    #   url: http://vmselect.monitoring:8481/select/0/prometheus
    url: ""
  auth:
    # Use an existing Secret (key: uiToken) instead of generating one.
    existingSecret: ""
    # Pin the token; wins over an existing Secret, and is how you rotate one.
    uiToken: ""
    # Salts the per-viewer read-state key. Generated on install, and added on
    # the first upgrade that finds the Secret without one. Set it only to pin
    # the value — rotating it resets everyone to the channel-wide watermark.
    readerSalt: ""
    # Does the CONSOLE authenticate browsers? Leave this true unless something
    # in front of it already does.
    #
    # This is NOT the same setting as "no token configured", and the two must
    # never be confused: an empty uiToken with `enabled: true` authorizes
    # NOBODY, which is the safe reading of an absent value. Only this explicit
    # false relaxes the requirement.
    #
    # Turning it off means: anyone who reaches the Service — a port-forward, a
    # pod in this namespace, a request that bypassed your proxy — reads every
    # agentops CR in the namespace, conversation payloads included, and can
    # instruct any agent the console is joined to — including one whose route
    # names a granted account. The proxy becomes the ONLY gate, so it must
    # also be the only route to the Service.
    #
    # Lost the token? Set auth.uiToken — deleting the Secret restores nothing.
    enabled: true
    # REQUIRED when enabled is false — the render FAILS without it. Name what
    # authenticates instead: oauth2-proxy, cloudflare-access, envoy-ext-authz,
    # a mesh policy. The chart cannot verify the claim; naming it puts the
    # answer to "what protects this console?" in `helm get values` and in the
    # post-install notes rather than in someone's head.
    #
    # In this mode, forward-auth identity headers are BELIEVED. The proxy MUST
    # strip client-supplied copies of them, or a caller picks their own
    # identity. A proxy that forwards no identity at all leaves a read-only
    # console: reads are served, writes are refused rather than attributed to
    # nobody.
    externalAuthenticator: ""
  # Browser-facing exposure. OFF by default — see the TRUST BOUNDARY above
  # before turning it on, because this is the moment the UI token starts
  # crossing a network.
  #
  # ROOT OF A HOSTNAME ONLY. The SPA is built with Vite's default base and emits
  # absolute /assets/… URLs, so serving it under a sub-path routes correctly and
  # then renders a blank page. `path` exists and is validated rather than
  # silently accepted: a non-root value FAILS the render.
  ingress:
    enabled: false
    # REQUIRED when enabled — a hostname cannot be guessed.
    host: ""
    # Additional hostnames serving the same console. Each gets its own rule, and
    # each is covered by the derived certificate below.
    extraHosts: []
    className: ""
    annotations: {}
    # Merged onto the Ingress alongside the chart's own labels.
    labels: {}
    path: /
    # Prefix | ImplementationSpecific | Exact — all work at the root; ingress
    # controllers differ on which they prefer.
    pathType: Prefix
    # TLS. Nothing here is required, and leaving it empty renders no `tls`
    # section — legitimate when TLS terminates upstream at a load balancer or in
    # a service mesh. The install notes will point out that the bearer token
    # otherwise crosses the network in clear text.
    #
    # `tls` also still accepts the pre-5.x LIST form (raw Ingress tls entries).
    # A list is rendered verbatim so existing values files and
    # `helm upgrade --reuse-values` keep working.
    tls:
      # Existing certificate Secret. The tls[] hosts are DERIVED from `host` +
      # `extraHosts`, so hostnames are never restated.
      secretName: ""
      # cert-manager issuer: adds the issuer annotation and derives secretName
      # when it is unset.
      clusterIssuer: ""
      # Full raw override — a list of Ingress tls entries, used verbatim and
      # taking precedence over the derived form.
      existing: []
  resources: {}

# Telegram — shipped as the embedded `telegram` subchart
# (chart/charts/telegram), same shape as prometheus and kubernetes.
# Off by default. Its full values live in that subchart's values.yaml; set them
# under this key.
#
# Enabling it alone ships the three IMPLEMENTATIONS (router + signal adapter +
# channel adapter) and wires nothing. `surface.enabled` also ships the Channel
# and the chat SignalSource — and then REQUIRES everything that cannot be
# guessed, failing the render rather than half-installing:
#
#   telegram:
#     enabled: true
#     surface:
#       enabled: true
#       chatId: "-1001234567890"
#       credentials:
#         existingSecret: agentops-telegram   # key: botToken
#         # ...or supply botToken directly and the bundle creates the Secret
#
# The bundle ships NO Pipeline (that would pull a profile and a runtime into a
# transport bundle), so claim the sources yourself — until you do, messages
# drop with Wired=False. The post-install notes print the Pipeline to apply.
#
# MIGRATION from the flat `telegramAdapter` values: the old single-container
# adapter POLLED. Scale it to zero and confirm no getUpdates consumer remains
# BEFORE enabling this bundle — two consumers of one bot token means 409s and
# stolen updates.
telegram:
  enabled: false

# Runtime storage: the CONTEXT volume (a conversation's accumulated context, on
# by default) and the WORKSPACE volume (repository checkouts, off by default).
#
# BOTH offer the same three ways to run against storage this chart did not
# create — `existingClaim` for a claim you already made, `volumeName` for a
# PersistentVolume by name, `selector` for one by label. A capability on one
# volume and not the other would be two spellings of one fact.
#
# RENAMED in this release: the whole block moved under `persistence.context`,
# and the claim is `agentops-context` rather than `agentops-home`. The volume is
# named for what it HOLDS, and the MOUNT PATH is named for it too: /data/context,
# which $HOME then points at. Nothing inside the volume moved when it did — a
# claim's contents appear AT the mount path, and the stored transcript directory
# is named for the WORKING directory. /data/workspace is the load-bearing path,
# and it did not move.
#
#   UPGRADING an install that already has an `agentops-home` claim. The
#   RECOMMENDED path REBINDS the volume under the new name, which moves no data:
#     1. kubectl patch pv <PV> -p '{"spec":{"persistentVolumeReclaimPolicy":"Retain"}}'
#     2. kubectl -n <ns> delete pvc <the retired agentops-home claim>
#     3. kubectl patch pv <PV> --type=json -p '[{"op":"remove","path":"/spec/claimRef"}]'
#     4. persistence:
#          context:
#            volumeName: <the PV>
#            storageClassName: <THE PV'S OWN CLASS>
#
#   STEP 4'S SECOND LINE IS THE ONE THAT BITES. A PV that was DYNAMICALLY
#   PROVISIONED keeps its storageClassName forever, and a claim asking for a
#   different one is refused — `VolumeMismatch: storageClassName does not match`,
#   and the claim sits Pending looking exactly like a missing provisioner. Read
#   the class off the PV (`kubectl get pv <PV> -o jsonpath='{.spec.storageClassName}'`)
#   and write THAT. `-` is for a STATICALLY created PV that has no class at all,
#   which is not what an existing agent-ops install has.
#
#   Naming the old claim outright still works and is one line, but it keeps the
#   retired word in every `kubectl get pvc` forever:
#     persistence.context.existingClaim: agentops-home
#   `helm.sh/resource-policy: keep` on the live object means Helm leaves the old
#   claim alone either way.
persistence:
  # The accumulated context (mounted at /data/context). ON by default, so
  # conversational history survives a runtime pod restart.
  #
  # Turning it OFF is a supported choice, not a downgrade to avoid — a cluster
  # with no default StorageClass, or no ReadWriteMany provisioner, needs it:
  #
  #   --set persistence.context.enabled=false
  #
  # What that costs: context lives in emptyDir and dies with each runtime pod,
  # so a reply after an idle period resumes a context whose files are gone and
  # answers without it. The symptom is an agent apologising for lost history.
  #
  # THE ACCESS MODE IS LEFT EMPTY, AND THE CHART ANSWERS IT.
  #
  # ReadWriteMany for an ordinary install — every runtime pod mounts this volume
  # and the scheduler places them freely, so a claim one node can attach pins the
  # install to that node.
  #
  # ReadWriteOnce under `global.demo.enabled`, because `local-path` REFUSES an
  # RWX claim and it is the only class rancher-desktop, k3d, kind and minikube
  # ship. The demo then keeps its memory instead of trading it away. Many pods
  # may share an RWO volume on ONE node, which is where the volume's affinity
  # puts them, so the concurrency cap still holds.
  #
  # TYPE A VALUE AND IT WINS, in both modes. Empty is the only thing a chart can
  # tell apart from a deliberate choice, which is why the default is not a mode.
  context:
    enabled: true
    # Create a PVC with this name (AgentRuntime CRs reference it via
    # context.pvcRef; it is also exported as the manager's CONTEXT_PVC
    # bootstrap default).
    name: agentops-context
    size: 5Gi
    ## If defined, storageClassName: <storageClass>
    ## If set to "-", storageClassName: "", which disables dynamic provisioning
    ## If undefined (the default) or set to null, no storageClassName spec is set,
    ##   choosing the default provisioner.
    storageClassName: ""
    # empty: ReadWriteMany, or ReadWriteOnce under demo mode. See above.
    accessModes: []
    # Bind to a pre-created PV by NAME. Pair it with storageClassName: "-", or
    # the cluster's default StorageClass is injected by admission and a second
    # volume is provisioned against the one you already made.
    volumeName: ""
    # Or match a pre-created PV by LABEL — the shape a fleet of them takes,
    # where naming one per release defeats the point.
    # selector:
    #   matchLabels:
    #     agentops.dev/volume: context
    # Use an existing PVC instead of creating one (overrides everything above).
    existingClaim: ""

  # The repository checkout (/data/workspace), OFF by default — and the
  # asymmetry with the context volume above is deliberate. Losing accumulated
  # context silently costs conversational history; losing a checkout costs a
  # re-clone, which is cheap and always correct, whereas a stale shared checkout
  # is neither.
  #
  # Turn it on to keep uncommitted agent work across a runtime pod restart
  # mid-conversation and to skip the re-clone. Each conversation gets its own
  # subdirectory in the claim, so concurrent runtime pods never share a working
  # tree — but that makes ReadWriteMany a real requirement here rather than a
  # recommendation, since the pods mount the same claim at the same time.
  #
  # Nothing reclaims a conversation's directory after it is deleted. Size the
  # claim for the conversations you keep, or prune it out of band.
  #
  # The claim OUTLIVES this setting. Both volumes carry
  # `helm.sh/resource-policy: keep`, so disabling this — or uninstalling the
  # release — leaves the PVC behind rather than destroying uncommitted agent
  # work. Helm then stops tracking it and reports it nowhere, so an orphaned
  # volume is yours to remove deliberately:
  #   kubectl -n <ns> delete pvc <name>
  # That is the trade: a flag toggle can strand storage, but it can never
  # silently delete work an agent has not committed.
  workspace:
    enabled: false
    name: agentops-workspace
    size: 10Gi
    ## If defined, storageClassName: <storageClass>
    ## If set to "-", storageClassName: "", which disables dynamic provisioning
    ## If undefined (the default) or set to null, no storageClassName spec is set,
    ##   choosing the default provisioner.
    storageClassName: ""
    # empty: ReadWriteMany, or ReadWriteOnce under demo mode. See above.
    accessModes: []
    # Bind to a pre-created PV by NAME. Pair it with storageClassName: "-", or
    # the cluster's default StorageClass is injected by admission and a second
    # volume is provisioned against the one you already made.
    volumeName: ""
    # Or match a pre-created PV by LABEL — the shape a fleet of them takes,
    # where naming one per release defeats the point.
    # selector:
    #   matchLabels:
    #     agentops.dev/volume: workspace
    existingClaim: ""

# Extra env for the manager (e.g. RUNTIME_IMAGE bootstrap fallback).
extraEnv: []

nodeSelector: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Kubernetes agent bundle (embedded subchart, OFF by default; demo mode turns
# it on with these defaults). Four independent components — the cluster Events
# lane, the k8s-engineer profile, its MCP tooling, and its own wiring, which is
# the only bundle component that is off inside an active bundle and is turned on
# by demo mode alone. The bundle ships NO runtime, no runtime ServiceAccount and
# no runtime RBAC: those are the `runtimes:` list and
# `global.agentops.runtimeDefaults.*` above. See
# chart/charts/kubernetes/values.yaml for the full surface. Typical enablement
# WITHOUT demo mode:
# global:
#   agentops:
#     allowMutations: true            # this bundle's own setting
# kubernetes:
#   enabled: true
#   eventsAdapter:
#     enabled: true                     # false = ask-only, no event ingestion
#     source:
#       severities: [Warning]
#       namespaces: []                  # empty = cluster-wide
#       channels: [<your-channel>]      # optional: mirror to chat

# Prometheus/Alertmanager bundle (embedded subchart, OFF by default; never
# enabled by demo mode — it needs your own metrics and Alertmanager endpoints).
# Named for the payload format and query API it speaks; VictoriaMetrics is one
# supported backend, not the subject. See
# chart/charts/prometheus/values.yaml for the full surface. Typical
# enablement:
# prometheus:
#   enabled: true
#   alertmanager:
#     defaultSource:
#       enabled: true                   # SignalSource (INERT until claimed)
#   # EITHER point at an existing Prometheus MCP server:
#   mcp:
#     enabled: true
#     url: http://mcp-prometheus.<ns>.svc/sse
#   # OR deploy one (mcp.url left empty then defaults to it):
#   mcpServers:
#     enabled: true
#     backend: http://<prometheus-or-vmsingle>:9090
#   # The bundle's own route — OFF by default, the one component that spends
#   # money and acts on its own:
#   pipelines:
#     enabled: true
#     channels: [<your-channel>]        # optional; omitted when unset
# MIGRATION: the retired `vm-bundle:` key — every value must be restated under
# the new one, and the render FAILS while the old key is present. See docs/CHANGELOG.md.

# Home Assistant bundle (embedded subchart, OFF by default; never enabled by
# demo mode — it needs your own Home Assistant endpoint and tokens). It ships a
# PRIVILEGE SPLIT: ha-user reads the house and answers questions, ha-operator
# acts and is reached by name (`/ha-ops <task>`) so escalating is deliberate.
# See chart/charts/home-assistant/values.yaml for the full surface. Typical
# enablement:
# home-assistant:
#   enabled: true
#   homeAssistant:
#     endpoint: https://ha.example.org
#     credentials:
#       readSecret: ha-read            # keys: token, authorization
#       adminSecret: ha-admin          # the ops agent's PREREQUISITE; omit for
#                                      # an ask-only house
#   # The bundle's own routes — OFF by default, the one component that spends
#   # money and acts on its own:
#   pipelines:
#     enabled: true
#     chatSources: [<your-chat-source>] # claimed by ha-control only
#     channels: [<your-channel>]        # optional; omitted when unset
# The Secrets are referenced by name and never created here:
#   kubectl -n <ns> create secret generic ha-admin \
#     --from-literal=token="$TOKEN" --from-literal=authorization="Bearer $TOKEN"
home-assistant:
  enabled: false

# CRD management (cert-manager pattern): templated, so upgrades work.
# Conversation retention — TWO STAGES, two clocks, both OFF by default.
# Closing is reversible and keeps the record; deleting is neither. Stage 2 is
# NOT "stage 1 but tidier" — see docs/CHANGELOG.md and docs/concepts.md.
retention:
  # Close a FINISHED conversation once it has been idle this long.
  # Idle time, never lifetime: measured from the last run or input.
  # Closing tears down the pod and archives the threads; the object, its
  # answers and its volume state stay, and it can be reopened.
  autoclose:
    enabled: false
    idleAge: 168h
  # Delete a CLOSED conversation this long after it was closed.
  # IRREVERSIBLE, and status.runs[].result is the only durable copy of what the
  # agent answered — choose this as "how long do I want to be able to read
  # this", not "how long until it is tidy".
  # Without the housekeeping job below this reclaims the API half and LEAVES
  # THE DISK: fine with persistence off, a silent leak with it on.
  autodelete:
    enabled: false
    closedAge: 720h

# The disk half of retention: a CronJob reclaiming what deleted conversations
# left behind. Separate workload because the manager mounts no volume, and
# mounting the claim ROOT is the reach subPath isolation denies agents.
# THE CONTEXT MOUNT PROBE — find a damaged context volume while it is IDLE.
#
# The corruption that matters here is only detectable at MOUNT time. Anything
# that can read the filesystem is something whose mount already succeeded, so a
# read-only scan can never find it. Attempting to mount is the only real probe.
#
# Runtime pods mount it, but only when there is work — and with a short idle TTL
# the volume is detached most of the time, so damage can sit unseen until the
# next conversation needs it. This closes that gap to one interval.
#
# Failure surfaces as a FAILED JOB, never as a signal: the `agentops-` name
# prefix is what the events adapter's self-exclusion keys on, so a broken volume
# cannot start a conversation that needs that same volume to run.
contextProbe:
  enabled: false
  schedule: "23 * * * *"
  # Claim to probe. Empty follows `persistence` above, which is the usual case.
  claimName: ""
  # A volume that will not attach leaves the pod in ContainerCreating forever.
  # This is what turns that into a failed Job somebody can see.
  deadlineSeconds: 300
  image: busybox:1.36

housekeeping:
  enabled: false
  schedule: "17 3 * * *"
  image:
    repository: ghcr.io/kostiantyn-matsebora/agentops-housekeeping
    tag: 0.2.2
  # Reports what it would remove and removes nothing. Take it off only after a
  # run has named no directory belonging to a conversation you are keeping.
  dryRun: true
  # Bounds ONE run, so a first pass on an old install cannot reclaim everything.
  maxDeletions: 50
  # Reclaim <workspace-claim>/<conversation> with no Conversation of that name.
  workspaces: true
  # Reclaim transcripts whose session id no conversation references.
  sessions: true
  # Must exceed the longest plausible run: a transcript is unreferenced until
  # the run that produces it finishes, so this is what protects a live one.
  sessionGrace: 168h
  # Its OWN identity, never the runtime SA — setting them equal fails the render.
  serviceAccountName: agentops-housekeeping
  resources: {}
  nodeSelector: {}

# CRDs ARE NOT VALUES ANY MORE. They live in `chart/crds/`, which Helm applies
# out-of-band BEFORE it builds the rest of the manifest — the only thing that
# lets one release ship both the CRDs and the Pipelines, Channels and profiles
# that are instances of them. As templates they could never install onto a
# cluster that did not already have them: Helm resolves every kind in the
# manifest before applying any of it, so the CRs failed to map and the whole
# install aborted with `ensure CRDs are installed first`.
#
#   crds.enabled  ->  the `--skip-crds` flag on helm install
#   crds.keep     ->  inherent. Helm NEVER deletes what it installed from crds/
#
# What it costs, and Helm says so plainly: Helm never UPGRADES them either. A
# CRD field change ships with a `kubectl apply -f` line in the release notes.
#
# Setting either key is refused rather than ignored — see templates/crds-guard.yaml.
crds: {}

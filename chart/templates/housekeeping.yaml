{{- if .Values.housekeeping.enabled }}
{{- $h := .Values.housekeeping }}
{{- $p := .Values.persistence }}
{{- $ctxClaim := $p.context.existingClaim | default $p.context.name }}
{{- $wsClaim := $p.workspace.existingClaim | default $p.workspace.name }}
{{- /* A claim is mounted only when the persistence block that owns it is on:
there is nothing to reclaim from a volume this release does not have. */ -}}
{{- $mountWs := and $h.workspaces $p.workspace.enabled }}
{{- $mountContext := and $h.sessions $p.context.enabled }}
{{- if or (eq $h.serviceAccountName (include "agentops.floorServiceAccount" .)) (eq $h.serviceAccountName (include "agentops.runtimeServiceAccount" .)) }}
{{- fail "housekeeping.serviceAccountName must differ from the floor account and from global.agentops.runtimeDefaults.serviceAccountName — this workload mounts the claim ROOTS, which is exactly the reach subPath isolation denies runtime pods; sharing the identity would hand every agent the ability to read and delete every other conversation's tree" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $h.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-housekeeping
{{/*
Design state-store-generic-contract D-6/D-8: housekeeping lists conversations
through the manager's /state/* surface now, not the Kubernetes API, so it
holds no Kubernetes grant at all — no Role, no RoleBinding. The ServiceAccount
stays (the pod still needs an identity to name on its spec), but
automountServiceAccountToken on the CronJob's pod spec, below, keeps even that
identity's token off the pod: there is no API call left for it to authenticate.
*/}}
---
# Named agentops-housekeeping so signal-k8s-events' name-prefix self-exclusion
# applies: a CronJob fails on a schedule, and an unexcluded failure would open a
# conversation about agent-ops' own maintenance, repeatedly.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agentops-housekeeping
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-housekeeping
spec:
  schedule: {{ $h.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: agentops-housekeeping
        spec:
          restartPolicy: Never
          serviceAccountName: {{ $h.serviceAccountName }}
          # Design state-store-generic-contract D-6/D-8: this job holds no
          # Kubernetes grant at all now, so there is no API call left for its
          # ServiceAccount's token to authenticate — it reads conversations
          # through MANAGER_URL/STATE_READ_TOKEN below instead.
          automountServiceAccountToken: false
          {{- with $h.nodeSelector }}
          nodeSelector:
{{ toYaml . | indent 12 }}
          {{- end }}
          containers:
            - name: housekeeping
              image: {{ printf "%s:%s" $h.image.repository (toString $h.image.tag) | quote }}
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: DRY_RUN
                  value: {{ $h.dryRun | quote }}
                - name: MAX_DELETIONS
                  value: {{ $h.maxDeletions | quote }}
                - name: SESSION_GRACE
                  value: {{ $h.sessionGrace | quote }}
                # Design state-store-generic-contract D-5/D-6: the job lists
                # conversations through the manager's /state/* surface, never
                # the Kubernetes API — same in-cluster Service DNS name as the
                # aops MCP server's own MANAGER_URL (templates/coordination.yaml).
                - name: MANAGER_URL
                  value: {{ printf "http://agentops-manager.%s.svc:%v" .Release.Namespace .Values.service.apiPort | quote }}
                # A reader that is not an adapter, so it holds a DEDICATED
                # credential — never ADAPTER_TOKEN (master reach) or
                # CONTROL_PLANE_TOKEN (a different surface). Same Secret the
                # manager itself reads STATE_READ_TOKEN from.
                - name: STATE_READ_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.stateReadAuth.existingSecret | default .Values.stateReadAuth.secretName }}
                      key: token
                {{- if $mountWs }}
                - name: WORKSPACE_ROOT
                  value: /reclaim/workspace
                {{- end }}
                {{- if $mountContext }}
                # claude-code keys transcripts by session id under the shared
                # projects directory; /data/context is mounted with no subPath.
                - name: SESSIONS_ROOT
                  value: /reclaim/context/.claude/projects/-data-workspace
                {{- end }}
              {{- if or $mountWs $mountContext }}
              volumeMounts:
                {{- if $mountWs }}
                # The claim ROOT, with no subPath — that is the whole reason
                # this runs under its own identity.
                - name: workspace
                  mountPath: /reclaim/workspace
                {{- end }}
                {{- if $mountContext }}
                - name: context
                  mountPath: /reclaim/context
                {{- end }}
              {{- end }}
              {{- with $h.resources }}
              resources:
{{ toYaml . | indent 16 }}
              {{- end }}
          {{- if or $mountWs $mountContext }}
          volumes:
            {{- if $mountWs }}
            - name: workspace
              persistentVolumeClaim:
                claimName: {{ $wsClaim }}
            {{- end }}
            {{- if $mountContext }}
            - name: context
              persistentVolumeClaim:
                claimName: {{ $ctxClaim }}
            {{- end }}
          {{- end }}
{{- end }}

{{- /*
The adapter master token — the root of every adapter credential, since
per-adapter tokens are HMAC(master, adapter name) validated by re-derivation.

THREE SOURCES, IN ORDER: an explicit adapterAuth.token, an existing Secret of
this name, then generation. Explicit is checked FIRST; a setting overridden by
history is accepted and ignored, which is the worst shape a setting can have.

NOTHING RANDOM REACHES A RENDER THAT CANNOT SEE THE CLUSTER. Generation (and
adoption of a Secret found already there) is gated on
`agentops.clusterConnected`, not `.Release.IsInstall` alone — a render with no
cluster (helm template | kubectl apply, CI, a GitOps repo-server) can never
tell "missing" from "unknown" and must render nothing. A render WITH real
access mints on the first upgrade that needs this Secret, same as it would on
a fresh install — an adopter should never have to pin a value or reinstall
the release just to pick up a new generated credential.
*/ -}}
{{- if not .Values.adapterAuth.existingSecret }}
{{- $name := .Values.adapterAuth.secretName }}
{{- $explicit := .Values.adapterAuth.token | default "" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $existingVal := "" }}
{{- if and $existing $existing.data }}
{{- $existingVal = index $existing.data "token" | default "" }}
{{- end }}
{{- $connected := eq (include "agentops.clusterConnected" .) "true" }}
{{- if or $explicit $existingVal .Release.IsInstall $connected }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-manager
  annotations:
    # a render with no cluster (connected=false, not install, not explicit)
    # omits this object entirely, same as before `clusterConnected` existed —
    # `keep` is what stops THAT renderer's absence of it from reading as a
    # delete once a connected renderer has created it for real
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $explicit }}
  token: {{ $explicit | b64enc }}
  {{- else if $existingVal }}
  {{- /* adopt a Secret already there — a previous release retained it, or a
         connected render created it on an earlier upgrade — rather than mint
         a credential every adapter still holds */}}
  token: {{ $existingVal }}
  {{- else }}
  token: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
{{- end }}
{{- end }}

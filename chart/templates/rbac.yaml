{{- if .Values.serviceAccounts.runtime }}
{{- fail "serviceAccounts.runtime moved to global.agentops.runtime.serviceAccountName in chart 4.0 (a subchart can read no other parent scope) — move the value and leave this key empty" }}
{{- end }}
{{- if index .Values "vm-bundle" }}
{{- fail "the `vm-bundle:` values key was renamed to `prometheus-bundle:` in chart 5.13.0 — the bundle is named for the Alertmanager payload format and the Prometheus query API it speaks, not for one backend. Helm never reports an unread values key, so without this guard the upgrade would succeed and render nothing at all. Restate every value under `prometheus-bundle:` (the logs component is GONE and the metrics server key is now `prometheus` — see docs/CHANGELOG.md for both), then upgrade again" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.manager }}
  namespace: {{ .Release.Namespace }}
---
# THE FLOOR runtime identity — what a Pipeline naming no `serviceAccountName`
# runs as, and it holds NO RBAC IN ANY MODE.
#
# NOTHING BINDS TO THIS ACCOUNT, EVER. `runtime-rbac.yaml` renders the mode's
# grants against a separate, named account. That separation is the point: a
# route that says nothing about its identity gets no cluster power, rather than
# inheriting whatever the release granted. Silence meaning maximum is the defect
# this replaced.
#
# Rendered even with runtime.enabled=false: the manager defaults every runtime
# pod onto it, whoever wrote the AgentRuntime.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentops.runtimeServiceAccount" . }}
  namespace: {{ .Release.Namespace }}
{{- with (include "agentops.runtimeModeServiceAccount" .) }}
---
# THE MODE'S ACCOUNT. `global.agentops.runtime.rbacMode` renders this and binds
# its posture to it — never to the floor above, because a route that names
# nothing must hold nothing. A route opts in by naming this on its Pipeline:
#
#   pipelines:
#     - name: k8s-ops
#       serviceAccountName: {{ . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ . }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- range $i, $extra := (.Values.rbac.runtime.serviceAccounts | default list) }}
{{- if $extra.create | default true }}
---
# An ADDITIONAL runtime identity, for a Pipeline to name. It is what makes a
# second trust level expressible without cloning the AgentRuntime that used to
# be the only place an account could live.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $extra.name }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.serviceAccounts.manager }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["agentops.dev"]
    resources: ["conversations", "conversationinputs", "agentprofiles", "mcpconfigs", "channels", "signalsources", "agentruntimes", "channeladapters", "signaladapters", "pipelines"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # MCPToolset is read-only to the manager: no status to write, nothing owned.
  - apiGroups: ["agentops.dev"]
    resources: ["mcptoolsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agentops.dev"]
    resources: ["conversations/status", "conversationinputs/status", "agentprofiles/status", "mcpconfigs/status", "channels/status", "signalsources/status", "agentruntimes/status", "channeladapters/status", "signaladapters/status", "pipelines/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  # ChannelAdapter reconciler: owns adapter workloads + their zero-RBAC SAs
  # (own namespace only)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Adapter reconcilers: own the Service of port-declaring adapters
  # (agentops-signal-<name>, agentops-adapter-<name>)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Pipeline reconciler: renders the claim for a persistence binding that names
  # a PersistentVolume, because a pod can mount only a claim.
  #
  # NO `delete`, AND THAT OMISSION IS THE RULE. The operator may bring storage
  # into being and must never take it away: a claim it created outlives the
  # Pipeline that asked for it, holding the accumulated context of every
  # conversation that route started. That is the one thing here whose loss
  # cannot be repaired by reconciling again — so it is guarded twice, by the
  # absent ownerRef and by this absent verb.
  #
  # No `update` or `patch` either. The claim is rendered once and then belongs
  # to whoever edits it; a controller that could rewrite it could shrink it.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.serviceAccounts.manager }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.serviceAccounts.manager }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.manager }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.rbac.drainAware }}
---
# DRAIN AWARENESS — the manager's ONLY cluster-scoped grant, and opt-in.
#
# Read-only on nodes, nothing else. It exists so the manager can see that a node
# has been cordoned and release the idle runtime pods on it, letting a shared
# context volume detach before the machine reboots. Without it the manager stays
# entirely namespaced, which is the default posture.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.serviceAccounts.manager }}-nodes-{{ $.Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.serviceAccounts.manager }}-nodes-{{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.serviceAccounts.manager }}-nodes-{{ $.Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.manager }}
    namespace: {{ .Release.Namespace }}
{{- end }}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.manager }}
  namespace: {{ .Release.Namespace }}
---
# Agent runtime pods run under this SA. The chart grants it NOTHING — bind your
# own (Cluster)Roles to define what agents may do. Least privilege by default.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.runtime }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.serviceAccounts.manager }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["agentops.dev"]
    resources: ["conversations", "conversationinputs", "agentprofiles", "mcpconfigs", "channels", "signalsources", "agentruntimes", "channeladapters", "signaladapters", "pipelines"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # MCPToolset is read-only to the manager: no status to write, nothing owned.
  - apiGroups: ["agentops.dev"]
    resources: ["mcptoolsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agentops.dev"]
    resources: ["conversations/status", "conversationinputs/status", "agentprofiles/status", "mcpconfigs/status", "channels/status", "signalsources/status", "agentruntimes/status", "channeladapters/status", "signaladapters/status", "pipelines/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  # ChannelAdapter reconciler: owns adapter workloads + their zero-RBAC SAs
  # (own namespace only)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # SignalAdapter reconciler: owns the webhook Service of port-declaring
  # adapters (agentops-signal-<name>)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.serviceAccounts.manager }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.serviceAccounts.manager }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.manager }}
    namespace: {{ .Release.Namespace }}

{{- if .Values.serviceAccounts.runtime }}
{{- fail "serviceAccounts.runtime moved to global.agentops.runtimeDefaults.serviceAccountName (a subchart can read no other parent scope) — move the value and leave this key empty. Note that it is now a REFERENCE this chart does not create: the chart renders only its own floor account, `agentops-runtime`" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.manager }}
  namespace: {{ .Release.Namespace }}
---
# THE FLOOR runtime identity, and the ONE runtime account this chart creates.
#
# NOTHING BINDS TO IT, EVER — `runtime-rbac.yaml` refuses to. That is what makes
# a route saying nothing about its identity powerless rather than an inheritor
# of whatever the release granted. Silence meaning maximum is the defect this
# replaced.
#
# RENDERED UNCONDITIONALLY, EVEN WHERE THE DEFAULT NAMES SOMETHING ELSE, and
# that is the useful half rather than a leftover. On an install whose inherited
# default (global.agentops.runtimeDefaults.serviceAccountName) is an account of
# the operator's carrying rights, naming `agentops-runtime` on ONE Pipeline is
# the only way to take that route back to nothing.
#
# THE ACCOUNT THE DEFAULT POINTS AT IS NEVER CREATED HERE. Naming is not
# creating — the posture adapters already have — and it is also what makes
# reusing an account you already own possible at all: creating it would collide
# on Helm's ownership check. Declare it under `rbac.runtime.serviceAccounts`, or
# bring one this chart never sees; a name nothing backs fails at pod admission,
# saying which account.
#
# Rendered whether or not any runtime is declared: the manager defaults every
# runtime pod onto it, whoever wrote the AgentRuntime.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentops.floorServiceAccount" . }}
  namespace: {{ .Release.Namespace }}
{{- range $i, $extra := (.Values.rbac.runtime.serviceAccounts | default list) }}
{{- if $extra.create | default true }}
---
# An ADDITIONAL runtime identity, for a Pipeline to name. It is what makes a
# second trust level expressible without cloning the AgentRuntime that used to
# be the only place an account could live.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $extra.name }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.serviceAccounts.manager }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["agentops.dev"]
    resources: ["conversations", "conversationinputs", "agentprofiles", "mcpconfigs", "channels", "signalsources", "agentruntimes", "channeladapters", "signaladapters", "pipelines"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # MCPToolset is read-only to the manager: no status to write, nothing owned.
  - apiGroups: ["agentops.dev"]
    resources: ["mcptoolsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agentops.dev"]
    resources: ["conversations/status", "conversationinputs/status", "agentprofiles/status", "mcpconfigs/status", "channels/status", "signalsources/status", "agentruntimes/status", "channeladapters/status", "signaladapters/status", "pipelines/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  # ChannelAdapter reconciler: owns adapter workloads + their zero-RBAC SAs
  # (own namespace only)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Adapter reconcilers: own the Service of port-declaring adapters
  # (agentops-signal-<name>, agentops-adapter-<name>)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Pipeline reconciler: renders the claim for a persistence binding that names
  # a PersistentVolume, because a pod can mount only a claim.
  #
  # NO `delete`, AND THAT OMISSION IS THE RULE. The operator may bring storage
  # into being and must never take it away: a claim it created outlives the
  # Pipeline that asked for it, holding the accumulated context of every
  # conversation that route started. That is the one thing here whose loss
  # cannot be repaired by reconciling again — so it is guarded twice, by the
  # absent ownerRef and by this absent verb.
  #
  # No `update` or `patch` either. The claim is rendered once and then belongs
  # to whoever edits it; a controller that could rewrite it could shrink it.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    # Tidy up: drop the claim when its Pipeline is deleted, so an uninstall
    # leaves no dangling storage behind.
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Read channel credentials directly so a mistyped credentialsSecretRef can be
  # reported on the Channel's Ready condition before any adapter pod starts.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.serviceAccounts.manager }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.serviceAccounts.manager }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.manager }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.rbac.drainAware }}
---
# DRAIN AWARENESS — the manager's ONLY cluster-scoped grant, and opt-in.
#
# Read-only on nodes, nothing else. It exists so the manager can see that a node
# has been cordoned and release the idle runtime pods on it, letting a shared
# context volume detach before the machine reboots. Without it the manager stays
# entirely namespaced, which is the default posture.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.serviceAccounts.manager }}-nodes-{{ $.Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.serviceAccounts.manager }}-nodes-{{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.serviceAccounts.manager }}-nodes-{{ $.Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.manager }}
    namespace: {{ .Release.Namespace }}
{{- end }}

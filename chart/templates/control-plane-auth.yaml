{{- /*
The /control-plane/* bearer token — a SEPARATE credential from the adapter
master token in adapter-auth.yaml. Never derived from or compared against
adapterAuth.token: a caller scoped to one surface must not reach the other.

THREE SOURCES, IN ORDER: an explicit controlPlaneAuth.token, an existing
Secret of this name, then generation. Explicit is checked FIRST; a setting
overridden by history is accepted and ignored, which is the worst shape a
setting can have.

NOTHING RANDOM REACHES THE UPGRADE PATH. With no explicit value the Secret
renders on INSTALL ONLY and carries `helm.sh/resource-policy: keep`, so an
upgrade neither regenerates it nor reports it as changed — on ANY renderer.
`lookup` returns empty wherever the renderer has no cluster (helm template |
kubectl apply, CI, a GitOps controller, a client-side dry run), and relying on
it succeeding is what left a fresh credential on that path.
*/ -}}
{{- if not .Values.controlPlaneAuth.existingSecret }}
{{- $name := .Values.controlPlaneAuth.secretName }}
{{- $explicit := .Values.controlPlaneAuth.token | default "" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $existingVal := "" }}
{{- if and $existing $existing.data }}
{{- $existingVal = index $existing.data "token" | default "" }}
{{- end }}
{{- include "agentops.generatedSecretGuard" (dict "root" . "name" $name "explicit" $explicit "existing" $existing "existingVal" $existingVal "key" "token" "setting" "controlPlaneAuth.token") }}
{{- if or $explicit .Release.IsInstall }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-manager
  annotations:
    # not rendering on upgrade is only safe because leaving the manifest would
    # otherwise DELETE the object
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $explicit }}
  token: {{ $explicit | b64enc }}
  {{- else if $existingVal }}
  {{- /* install over a Secret a previous release retained: adopt it rather
         than mint a credential every caller still holds */}}
  token: {{ $existingVal }}
  {{- else }}
  token: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
{{- end }}
{{- end }}

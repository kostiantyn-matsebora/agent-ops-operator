{{- /*
The agent-ops console: a ChannelAdapter that is also the viewer.

CRs ONLY. There is no Deployment and no Service here — the ChannelAdapter
reconciler owns both (spec.port makes it own Service agentops-adapter-<name>
and inject LISTEN_ADDR), exactly as for every other adapter. A chart that
shipped connectivity would make the console installable only by this chart.

The one thing the chart MUST supply is RBAC: the operator grants adapters no
Kubernetes permissions, ever. spec.kubernetesAccess mounts the pod's SA token —
identity, nothing more — and the read-only Role below is what turns that
identity into "may list agentops CRs". Same posture as the prometheus adapter's
registration rights.

TWO IDENTITIES, ONE POD. The console is a Channel adapter (carry conversations,
reply in a thread) AND a signal adapter (originate). The SignalAdapter is
declared `servedBy` this ChannelAdapter, so it owns no workload of its own and
the ChannelAdapter reconciler injects SIGNAL_ADAPTER_TOKEN into the same pod.
Two adapter CRs, one Deployment — see docs/concepts.md.

No Pipeline is rendered. Joining the console to a pipeline, and CLAIMING its
signal source, are ordinary edits the installer makes; a chart mutating user
Pipelines would be a new and worse pattern. Until the source is claimed the
console cannot start conversations and says so, with the patch. The post-install
notes print it.
*/ -}}
{{- /*
The console's identity is duplicated into `global.agentops.console` so subcharts
can see it — a subchart reads no other parent scope, and Helm cannot derive one
value from another. Duplication that cannot be removed is made SAFE by being
checked: a bundle route claiming a source this release does not render is a
dangling ref that reports Wired=True and drops every signal, which is the exact
failure a render guard is cheap enough to prevent.
*/ -}}
{{- $gc := dig "agentops" "console" dict (.Values.global | default dict) }}
{{- $gSource := get $gc "signalSource" | default "" }}
{{- $gChannel := get $gc "channel" | default "" }}
{{- /* Only under the turnkey flag. `console.enabled: false` is pinned to remove
every console object with ONE value, and a guard that demanded two more would
break that promise for every ordinary install. Demo mode is the one place the
claim is made, so it is the only place the names have to agree. */ -}}
{{- if .Values.global.demo.enabled }}
{{- if .Values.console.enabled }}
{{- $wantSource := .Values.console.signalSourceName | default .Values.console.name }}
{{- $wantChannel := .Values.console.channelName | default .Values.console.name }}
{{- if and $gSource (ne $gSource $wantSource) }}
{{- fail (printf "global.agentops.console.signalSource is %q but the console originates from %q — set global.agentops.console.signalSource=%s" $gSource $wantSource $wantSource) }}
{{- end }}
{{- if and $gChannel (ne $gChannel $wantChannel) }}
{{- fail (printf "global.agentops.console.channel is %q but the console Channel is %q — set global.agentops.console.channel=%s" $gChannel $wantChannel $wantChannel) }}
{{- end }}
{{- else }}
{{- if or $gSource $gChannel }}
{{- fail "demo mode with console.enabled=false still names global.agentops.console.signalSource/.channel — the demo route would claim a source this release does not render. Set global.agentops.console.signalSource=\"\" and .channel=\"\", or leave the console on" }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.console.enabled }}
{{- $c := .Values.console }}
{{- $sa := printf "agentops-adapter-%s" $c.name }}
{{- /*
Sub-maps are read defensively. `helm upgrade --reuse-values` keeps the PREVIOUS
release's `console:` map wholesale rather than merging this chart's defaults into
it, so on an upgrade from 4.x these keys simply are not there — and a template
that assumed them would fail the upgrade instead of the thing it was upgrading.

`hasKey` rather than `| default true`: an explicit `false` must survive, and
`default` cannot tell "absent" from "deliberately off".
*/ -}}
{{- $write := $c.write | default dict }}
{{- $writeEnabled := true }}
{{- if hasKey $write "enabled" }}{{ $writeEnabled = $write.enabled }}{{ end }}
{{- $metricsURL := ($c.metrics | default dict).url | default "" }}
{{- $auth := $c.auth | default dict }}
{{- $authEnabled := true }}
{{- if hasKey $auth "enabled" }}{{ $authEnabled = $auth.enabled }}{{ end }}
{{- $externalAuth := $auth.externalAuthenticator | default "" }}
{{- /*
Disabling the console's own authentication REQUIRES naming what authenticates
instead. The same posture as the non-root ingress path and the MCP
ServiceAccount collision: a configuration that cannot be right is refused at
render time rather than installed.

Two deliberate statements, not one boolean, because the state this guards
against is "an absent value read as no authentication required" — and one edit
is exactly how that happens. The name is not verified (the chart cannot see what
sits in front of it); it is RECORDED, so the release itself answers "what
protects this console?".
*/ -}}
{{- if and (not $authEnabled) (not $externalAuth) }}
{{- fail "console.auth.enabled=false requires console.auth.externalAuthenticator to name what authenticates instead (e.g. oauth2-proxy, cloudflare-access, envoy-ext-authz). With authentication off, anyone who reaches the console Service reads every agentops CR in this namespace — conversation payloads included — and can instruct any agent it is joined to. The chart cannot check what is in front of it, so it requires you to say. Lost the token? Re-issue it with console.auth.uiToken instead of removing the gate." }}
{{- end }}
{{- $secretName := $c.auth.existingSecret | default (printf "agentops-console-%s" $c.name) }}
{{- if not $c.auth.existingSecret }}
{{- /*
THREE SOURCES, IN ORDER: an explicit console.auth.uiToken, an existing Secret of
this name, then generation. Explicit is checked FIRST — it used to be checked
LAST, which made the setting a silent no-op on every install that already had a
token: accepted, documented and ignored.

NOTHING RANDOM REACHES THE UPGRADE PATH. With no explicit value the Secret
renders on INSTALL ONLY and carries `helm.sh/resource-policy: keep`, so an
upgrade neither regenerates the token nor reports it as changed on a renderer
with no cluster — signing every browser out is a thing an operator asks for,
never a thing a redeploy causes.

RENDERED EVEN WHEN AUTHENTICATION IS DISABLED. The Channel below declares
credentialsSecretRef and the reconciler projects it with envFrom, so a missing
Secret is a pod that will not start — "disable auth" would become "console will
not boot", with no obvious cause. Keeping it also makes re-enabling
authentication one value rather than a reinstall.
*/}}
{{- $explicit := $auth.uiToken | default "" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingVal := "" }}
{{- $existingSalt := "" }}
{{- if and $existing $existing.data }}
{{- $existingVal = index $existing.data "uiToken" | default "" }}
{{- $existingSalt = index $existing.data "readerSalt" | default "" }}
{{- end }}
{{- $explicitSalt := $auth.readerSalt | default "" }}
{{- /*
THE SALT, and the one case that renders this Secret on an UPGRADE.

readerSalt turns a console viewer's identity into the opaque key stored on a
Conversation, so read state can be per person without an address ever reaching
etcd. An install generates one. An UPGRADE from a release that predates it would
otherwise never get one at all — the Secret renders on install only — leaving
per-identity read state permanently off on exactly the installs that have people
using it.

So it also renders when a lookup FOUND the Secret and that Secret has no salt.
That inverts the usual lookup hazard rather than repeating it: a renderer with no
cluster (helm template, CI, --dry-run=client, a GitOps differ) finds nothing,
renders nothing, and therefore invents no credential. The uiToken is adopted from
the existing object in that path, so adding a salt never signs a browser out.
*/}}
{{- $needSalt := and (not .Release.IsInstall) $existing (not $existingSalt) (not $explicitSalt) }}
{{- include "agentops.generatedSecretGuard" (dict "root" . "name" $secretName "explicit" $explicit "existing" $existing "existingVal" $existingVal "key" "uiToken" "setting" "console.auth.uiToken") }}
{{- if or $explicit .Release.IsInstall $needSalt }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-console
  annotations:
    # not rendering on upgrade is only safe because leaving the manifest would
    # otherwise DELETE the object
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $explicit }}
  uiToken: {{ $explicit | b64enc }}
  {{- else if $existingVal }}
  {{- /* install over a Secret a previous release retained: adopt it rather
         than sign out browsers that still hold it */}}
  uiToken: {{ $existingVal }}
  {{- else }}
  uiToken: {{ randAlphaNum 40 | b64enc }}
  {{- end }}
  {{- if $explicitSalt }}
  readerSalt: {{ $explicitSalt | b64enc }}
  {{- else if $existingSalt }}
  {{- /* NEVER regenerated: rotating the salt orphans every stored key, and
         every reader silently falls back to the channel-wide watermark */}}
  readerSalt: {{ $existingSalt }}
  {{- else }}
  readerSalt: {{ randAlphaNum 40 | b64enc }}
  {{- end }}
---
{{- end }}
{{- end }}
# Pure implementation: image + workload knobs. Nothing configurable about the
# surface lives here — that is on the Channel below.
apiVersion: agentops.dev/v1alpha1
kind: ChannelAdapter
metadata:
  name: {{ $c.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-console
spec:
  image: {{ printf "%s:%s" $c.image.repository (toString $c.image.tag) | quote }}
  # browser-facing surface: the reconciler owns Service agentops-adapter-<name>
  # and injects LISTEN_ADDR
  port: {{ $c.port }}
  # one replica serves both the browsers and the channel ops loop, which is
  # what makes thread transcripts deterministic
  singleton: true
  # identity only — the Role below is what grants anything, and no reconciler
  # creates or binds RBAC
  kubernetesAccess: true
  # A VIEWER, NOT A TRANSPORT. The console renders only what it is sent, so a
  # person typing here does not see their own message unless the manager
  # delivers it — which is why a conversation started from the composer used to
  # read as an answer with no question above it. Declaring this false is what
  # makes the manager deliver this surface its own users' messages; every chat
  # transport leaves it at the default, because it echoes them itself.
  echoesOwnMessages: false
  {{- with $c.resources }}
  resources:
{{ toYaml . | indent 4 }}
  {{- end }}
  configSchema:
    type: object
    properties:
      displayName:
        type: string
        description: Label for this surface in the console UI.
      writeEnabled:
        type: boolean
        description: >-
          Gates both write paths (chat composer and new-conversation). Absent
          means enabled; only an explicit false makes this a strict viewer.
      authEnabled:
        type: boolean
        description: >-
          Whether the console authenticates browsers itself. Absent means yes.
          An explicit false takes effect only alongside externalAuthenticator;
          on its own it leaves the console closed, so a value lost in transit
          cannot open one.
      externalAuthenticator:
        type: string
        description: >-
          What authenticates browsers when the console does not (oauth2-proxy,
          cloudflare-access, …). In that mode forward-auth identity headers are
          believed, and a request carrying none is read-only.
      signalSource:
        type: string
        description: SignalSource this console originates conversations from.
      metricsUrl:
        type: string
        description: >-
          Optional Prometheus/VictoriaMetrics query endpoint for windows beyond
          the manager's in-memory activity buffer.
  credentialKeys:
    # documentation only — the manager never reads Secrets
    - key: uiToken
      required: true
      description: >-
        Bearer token the browser signs in with. Projected into the console pod
        by the reconciler as AGENTOPS_CRED_<CHANNEL>_uiToken; anyone holding it
        sees everything the console's ServiceAccount can read.
    - key: readerSalt
      required: false
      description: >-
        Salts the hash that turns a viewer's identity into the opaque read-state
        key stored on a Conversation, so read marks can be per person while no
        address reaches etcd. Absent means read state stays per CHANNEL — every
        viewer shares one watermark. Never rotate it casually: a new salt
        orphans every stored key and silently resets everyone to the
        channel-wide mark.
---
# The console surface itself. A Channel CARRIES conversations and originates
# nothing, so there is no wiring here either.
apiVersion: agentops.dev/v1alpha1
kind: Channel
metadata:
  name: {{ $c.channelName | default $c.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-console
spec:
  adapter: {{ $c.name }}
  # projected into the console pod as env by the reconciler, kubelet-resolved
  credentialsSecretRef:
    name: {{ $secretName }}
  # OPAQUE to the manager and interpreted only by the console. This is where the
  # console's own settings live, and the only place they can: a ChannelAdapter CR
  # is pure implementation and carries no configuration or env, so there is no
  # other way for the chart to reach the pod.
  config:
    displayName: {{ $c.displayName | default "agent-ops console" | quote }}
    writeEnabled: {{ $writeEnabled }}
    # Whether the console authenticates, and — when it does not — what does.
    # Both travel here because a ChannelAdapter CR carries no env: this opaque
    # config is the only way the chart reaches the pod.
    authEnabled: {{ $authEnabled }}
    {{- with $externalAuth }}
    externalAuthenticator: {{ . | quote }}
    {{- end }}
    signalSource: {{ $c.signalSourceName | default $c.name | quote }}
    {{- with $metricsURL }}
    metricsUrl: {{ . | quote }}
    {{- end }}
---
# The ORIGINATION identity. Externally served: no image, no workload — the
# ChannelAdapter above already holds the process, and this CR exists to give it
# a signal identity so "start a conversation" travels the sanctioned lane (a
# chat signal from a claimed source) rather than a side door.
apiVersion: agentops.dev/v1alpha1
kind: SignalAdapter
metadata:
  name: {{ $c.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-console
spec:
  servedBy:
    kind: ChannelAdapter
    name: {{ $c.name }}
---
# The source the console originates from. It carries NO wiring: a Pipeline must
# claim it (signalSourceRefs) before anything can be started, and until one does
# it sits at Wired=False — which reads exactly as "this console cannot start
# conversations yet", with the fix.
apiVersion: agentops.dev/v1alpha1
kind: SignalSource
metadata:
  name: {{ $c.signalSourceName | default $c.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-console
spec:
  adapter: {{ $c.name }}
  grouping:
    # Chat: a person asking the same thing twice means it twice, so dedup is off
    # and each message gets its own conversation.
    cooldownHours: 0
---
# READ-ONLY. Two API groups: agentops.dev for configuration, plus deployments
# and pods for INSTALL FACTS — image digests, restart counts and pod failure
# reasons exist in no CR, and an operations console that cannot see a
# CrashLoopBackOff is not one.
#
# NO WRITE VERBS ANYWHERE. The console has no write path to the Kubernetes API
# at all; its only writes are POST /channel/inbound and POST /signal/inbound,
# through the manager's contracts. Adding a write verb here would grant
# something no code in that module can use.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-console
rules:
  - apiGroups: ["agentops.dev"]
    resources:
      - agentprofiles
      - agentruntimes
      - channels
      - channeladapters
      - conversations
      - mcpconfigs
      - mcptoolsets
      - pipelines
      - signaladapters
      - signalsources
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $sa }}
subjects:
  # the ServiceAccount the ChannelAdapter reconciler creates for this adapter
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- if $c.ingress.enabled }}
{{- $ing := $c.ingress }}
{{- /*
Sub-map keys are read with `default` for the reason the `write` block above uses
`hasKey`: `helm upgrade --reuse-values` keeps the PREVIOUS release's `console:`
map wholesale rather than merging this chart's defaults into it, so on an upgrade
from a chart that predates these keys they simply are not there — and a template
that assumed them would fail the upgrade instead of the thing being upgraded.
*/ -}}
{{- $path := $ing.path | default "/" }}
{{- if ne $path "/" }}
{{- fail (printf "console.ingress.path must be \"/\" (got %q). The console's SPA is embedded at build time with an absolute asset base, so it emits /assets/... URLs and can only be served from the ROOT of a hostname: a sub-path routes correctly and then renders a blank page. Give the console its own hostname (or a subdomain) instead." $path) }}
{{- end }}
{{- /* One list feeding both the rules and the certificate, so a rule host and a
       certificate host cannot disagree. */ -}}
{{- $hosts := prepend ($ing.extraHosts | default list) (required "console.ingress.host is required when console.ingress.enabled" $ing.host) }}
{{- /*
TLS accepts BOTH shapes. A LIST is the pre-6.x form and is rendered verbatim —
again because --reuse-values carries it forward and an upgrade must not fail on
it. A MAP derives its hosts from the list above.
*/ -}}
{{- $tls := $ing.tls }}
{{- $tlsEntries := list }}
{{- $issuer := "" }}
{{- if kindIs "slice" $tls }}
{{- $tlsEntries = $tls }}
{{- else if $tls }}
{{- $issuer = $tls.clusterIssuer | default "" }}
{{- if $tls.existing }}
{{- $tlsEntries = $tls.existing }}
{{- else }}
{{- $secret := $tls.secretName | default "" }}
{{- if and (not $secret) $issuer }}
{{- $secret = printf "agentops-console-%s-tls" $c.name }}
{{- end }}
{{- if $secret }}
{{- $tlsEntries = list (dict "hosts" $hosts "secretName" $secret) }}
{{- end }}
{{- end }}
{{- end }}
{{- /* merge into a fresh dict: `merge` mutates its destination, and mutating
       .Values would leak into anything rendered after this. */ -}}
{{- $ann := merge (dict) ($ing.annotations | default dict) }}
{{- if $issuer }}
{{- $_ := set $ann "cert-manager.io/cluster-issuer" $issuer }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentops-console
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-console
    {{- with $ing.labels }}
{{ toYaml . | indent 4 }}
    {{- end }}
  {{- with $ann }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $tlsEntries }}
  tls:
{{ toYaml . | indent 4 }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: {{ $path }}
            pathType: {{ $ing.pathType | default "Prefix" }}
            backend:
              service:
                # owned by the ChannelAdapter reconciler, not by this chart
                name: {{ $sa }}
                port:
                  number: {{ $c.port }}
    {{- end }}
{{- end }}
{{- end }}

{{- /*
The agent-ops console: a ChannelAdapter that is also the viewer.

CRs ONLY. There is no Deployment and no Service here — the ChannelAdapter
reconciler owns both (spec.port makes it own Service agentops-adapter-<name>
and inject LISTEN_ADDR), exactly as for every other adapter. A chart that
shipped connectivity would make the console installable only by this chart.

The one thing the chart MUST supply is RBAC: the operator grants adapters no
Kubernetes permissions, ever. spec.kubernetesAccess mounts the pod's SA token —
identity, nothing more — and the read-only Role below is what turns that
identity into "may list agentops CRs". Same posture as the vm-bundle adapter's
registration rights.

TWO IDENTITIES, ONE POD. The console is a Channel adapter (carry conversations,
reply in a thread) AND a signal adapter (originate). The SignalAdapter is
declared `servedBy` this ChannelAdapter, so it owns no workload of its own and
the ChannelAdapter reconciler injects SIGNAL_ADAPTER_TOKEN into the same pod.
Two adapter CRs, one Deployment — see docs/concepts.md.

No Pipeline is rendered. Joining the console to a pipeline, and CLAIMING its
signal source, are ordinary edits the installer makes; a chart mutating user
Pipelines would be a new and worse pattern. Until the source is claimed the
console cannot start conversations and says so, with the patch. The post-install
notes print it.
*/ -}}
{{- if .Values.console.enabled }}
{{- $c := .Values.console }}
{{- $sa := printf "agentops-adapter-%s" $c.name }}
{{- /*
Sub-maps are read defensively. `helm upgrade --reuse-values` keeps the PREVIOUS
release's `console:` map wholesale rather than merging this chart's defaults into
it, so on an upgrade from 4.x these keys simply are not there — and a template
that assumed them would fail the upgrade instead of the thing it was upgrading.

`hasKey` rather than `| default true`: an explicit `false` must survive, and
`default` cannot tell "absent" from "deliberately off".
*/ -}}
{{- $write := $c.write | default dict }}
{{- $writeEnabled := true }}
{{- if hasKey $write "enabled" }}{{ $writeEnabled = $write.enabled }}{{ end }}
{{- $metricsURL := ($c.metrics | default dict).url | default "" }}
{{- $secretName := $c.auth.existingSecret | default (printf "agentops-console-%s" $c.name) }}
{{- if not $c.auth.existingSecret }}
{{- /* Generate once, reuse across upgrades (lookup); under template-only
       rendering (no cluster) a fresh token is generated — pin one with
       console.auth.existingSecret for GitOps flows. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-console
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "uiToken") }}
  uiToken: {{ index $existing.data "uiToken" }}
  {{- else if $c.auth.uiToken }}
  uiToken: {{ $c.auth.uiToken | b64enc }}
  {{- else }}
  uiToken: {{ randAlphaNum 40 | b64enc }}
  {{- end }}
---
{{- end }}
# Pure implementation: image + workload knobs. Nothing configurable about the
# surface lives here — that is on the Channel below.
apiVersion: agentops.dev/v1alpha1
kind: ChannelAdapter
metadata:
  name: {{ $c.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-console
spec:
  image: {{ printf "%s:%s" $c.image.repository (toString $c.image.tag) | quote }}
  # browser-facing surface: the reconciler owns Service agentops-adapter-<name>
  # and injects LISTEN_ADDR
  port: {{ $c.port }}
  # one replica serves both the browsers and the channel ops loop, which is
  # what makes thread transcripts deterministic
  singleton: true
  # identity only — the Role below is what grants anything, and no reconciler
  # creates or binds RBAC
  kubernetesAccess: true
  {{- with $c.resources }}
  resources:
{{ toYaml . | indent 4 }}
  {{- end }}
  configSchema:
    type: object
    properties:
      displayName:
        type: string
        description: Label for this surface in the console UI.
      writeEnabled:
        type: boolean
        description: >-
          Gates both write paths (chat composer and new-conversation). Absent
          means enabled; only an explicit false makes this a strict viewer.
      signalSource:
        type: string
        description: SignalSource this console originates conversations from.
      metricsUrl:
        type: string
        description: >-
          Optional Prometheus/VictoriaMetrics query endpoint for windows beyond
          the manager's in-memory activity buffer.
  credentialKeys:
    # documentation only — the manager never reads Secrets
    - key: uiToken
      required: true
      description: >-
        Bearer token the browser signs in with. Projected into the console pod
        by the reconciler as AGENTOPS_CRED_<CHANNEL>_uiToken; anyone holding it
        sees everything the console's ServiceAccount can read.
---
# The console surface itself. A Channel CARRIES conversations and originates
# nothing, so there is no wiring here either.
apiVersion: agentops.dev/v1alpha1
kind: Channel
metadata:
  name: {{ $c.channelName | default $c.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-console
spec:
  adapter: {{ $c.name }}
  # projected into the console pod as env by the reconciler, kubelet-resolved
  credentialsSecretRef:
    name: {{ $secretName }}
  # OPAQUE to the manager and interpreted only by the console. This is where the
  # console's own settings live, and the only place they can: a ChannelAdapter CR
  # is pure implementation and carries no configuration or env, so there is no
  # other way for the chart to reach the pod.
  config:
    displayName: {{ $c.displayName | default "agent-ops console" | quote }}
    writeEnabled: {{ $writeEnabled }}
    signalSource: {{ $c.signalSourceName | default $c.name | quote }}
    {{- with $metricsURL }}
    metricsUrl: {{ . | quote }}
    {{- end }}
---
# The ORIGINATION identity. Externally served: no image, no workload — the
# ChannelAdapter above already holds the process, and this CR exists to give it
# a signal identity so "start a conversation" travels the sanctioned lane (a
# chat signal from a claimed source) rather than a side door.
apiVersion: agentops.dev/v1alpha1
kind: SignalAdapter
metadata:
  name: {{ $c.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-console
spec:
  servedBy:
    kind: ChannelAdapter
    name: {{ $c.name }}
---
# The source the console originates from. It carries NO wiring: a Pipeline must
# claim it (signalSourceRefs) before anything can be started, and until one does
# it sits at Wired=False — which reads exactly as "this console cannot start
# conversations yet", with the fix.
apiVersion: agentops.dev/v1alpha1
kind: SignalSource
metadata:
  name: {{ $c.signalSourceName | default $c.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-console
  labels:
    app.kubernetes.io/name: agentops-console
spec:
  adapter: {{ $c.name }}
  grouping:
    # Chat: a person asking the same thing twice means it twice, so dedup is off
    # and each message gets its own conversation.
    cooldownHours: 0
---
# READ-ONLY. Two API groups: agentops.dev for configuration, plus deployments
# and pods for INSTALL FACTS — image digests, restart counts and pod failure
# reasons exist in no CR, and an operations console that cannot see a
# CrashLoopBackOff is not one.
#
# NO WRITE VERBS ANYWHERE. The console has no write path to the Kubernetes API
# at all; its only writes are POST /channel/inbound and POST /signal/inbound,
# through the manager's contracts. Adding a write verb here would grant
# something no code in that module can use.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-console
rules:
  - apiGroups: ["agentops.dev"]
    resources:
      - agentprofiles
      - agentruntimes
      - channels
      - channeladapters
      - conversations
      - mcpconfigs
      - mcptoolsets
      - pipelines
      - signaladapters
      - signalsources
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $sa }}
subjects:
  # the ServiceAccount the ChannelAdapter reconciler creates for this adapter
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- if $c.ingress.enabled }}
{{- $ing := $c.ingress }}
{{- /*
Sub-map keys are read with `default` for the reason the `write` block above uses
`hasKey`: `helm upgrade --reuse-values` keeps the PREVIOUS release's `console:`
map wholesale rather than merging this chart's defaults into it, so on an upgrade
from a chart that predates these keys they simply are not there — and a template
that assumed them would fail the upgrade instead of the thing being upgraded.
*/ -}}
{{- $path := $ing.path | default "/" }}
{{- if ne $path "/" }}
{{- fail (printf "console.ingress.path must be \"/\" (got %q). The console's SPA is embedded at build time with an absolute asset base, so it emits /assets/... URLs and can only be served from the ROOT of a hostname: a sub-path routes correctly and then renders a blank page. Give the console its own hostname (or a subdomain) instead." $path) }}
{{- end }}
{{- /* One list feeding both the rules and the certificate, so a rule host and a
       certificate host cannot disagree. */ -}}
{{- $hosts := prepend ($ing.extraHosts | default list) (required "console.ingress.host is required when console.ingress.enabled" $ing.host) }}
{{- /*
TLS accepts BOTH shapes. A LIST is the pre-6.x form and is rendered verbatim —
again because --reuse-values carries it forward and an upgrade must not fail on
it. A MAP derives its hosts from the list above.
*/ -}}
{{- $tls := $ing.tls }}
{{- $tlsEntries := list }}
{{- $issuer := "" }}
{{- if kindIs "slice" $tls }}
{{- $tlsEntries = $tls }}
{{- else if $tls }}
{{- $issuer = $tls.clusterIssuer | default "" }}
{{- if $tls.existing }}
{{- $tlsEntries = $tls.existing }}
{{- else }}
{{- $secret := $tls.secretName | default "" }}
{{- if and (not $secret) $issuer }}
{{- $secret = printf "agentops-console-%s-tls" $c.name }}
{{- end }}
{{- if $secret }}
{{- $tlsEntries = list (dict "hosts" $hosts "secretName" $secret) }}
{{- end }}
{{- end }}
{{- end }}
{{- /* merge into a fresh dict: `merge` mutates its destination, and mutating
       .Values would leak into anything rendered after this. */ -}}
{{- $ann := merge (dict) ($ing.annotations | default dict) }}
{{- if $issuer }}
{{- $_ := set $ann "cert-manager.io/cluster-issuer" $issuer }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentops-console
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-console
    {{- with $ing.labels }}
{{ toYaml . | indent 4 }}
    {{- end }}
  {{- with $ann }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $tlsEntries }}
  tls:
{{ toYaml . | indent 4 }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: {{ $path }}
            pathType: {{ $ing.pathType | default "Prefix" }}
            backend:
              service:
                # owned by the ChannelAdapter reconciler, not by this chart
                name: {{ $sa }}
                port:
                  number: {{ $c.port }}
    {{- end }}
{{- end }}
{{- end }}

{{- /*
The runtime component: HOW agents execute here.

A LIST, not one CR. `runtimes:` names the runtimes this install declares, each
stating only what DIFFERS from `global.agentops.runtimeDefaults`; the shared
renderer lives in `_helpers.tpl` so that a BUNDLE shipping a vendor's runtime
emits exactly the same shape.

`default` is the name a Pipeline declaring no `runtimeRef` resolves to. Nothing
here guarantees one exists — a runtime may come from a bundle an operator turns
off — so `agentops.defaultRuntimeGuard` fails the render when nothing answers to
that name while a route still needs it.

The FLOOR ServiceAccount is created in rbac.yaml, unconditionally and bound to
nothing. The account a runtime NAMES is a reference this chart never creates.

THESE CRs DECLARE NO VOLUME. Persistence is WIRING and lives on the Pipeline;
the release-wide claims reach conversations through the manager's bootstrap
configuration, not through any CR here.
*/ -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops-manager
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentops-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentops-manager
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.manager }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Reported by GET /status and shown on the console's Overview. Taken
            # from appVersion rather than the image tag: the tag can be pinned or
            # overridden per environment, and "which version am I running" should
            # answer with what the release declares.
            - name: VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: MAX_ACTIVE_CONVERSATIONS
              value: {{ .Values.maxActiveConversations | quote }}
            - name: MAX_QUEUED_CONVERSATIONS
              value: {{ .Values.maxQueuedConversations | quote }}
            # Paired with rbac.drainAware: without the ClusterRole the manager
            # cannot read nodes, so enabling the behaviour alone would only
            # produce forbidden loops in the log.
            - name: DRAIN_AWARE
              value: {{ .Values.rbac.drainAware | quote }}
            {{- if .Values.runtime.contextSync.paths }}
            # Only set when a runtime actually declares paths: an empty image
            # disables sidecar mode outright, so the mode can never be
            # half-applied — which would give the agent an empty ephemeral home
            # and no sidecar to restore into it.
            - name: CONTEXT_SYNC_IMAGE
              value: {{ .Values.runtime.contextSync.image | quote }}
            - name: CONTEXT_LIVE_SIZE_LIMIT
              value: {{ .Values.runtime.contextSync.liveSizeLimit | quote }}
            {{- end }}
            {{- if .Values.retention.autoclose.enabled }}
            - name: CONVERSATION_AUTOCLOSE_ENABLED
              value: "true"
            - name: CONVERSATION_AUTOCLOSE_IDLE_AGE
              value: {{ required "retention.autoclose.idleAge is required when autoclose is enabled" .Values.retention.autoclose.idleAge | quote }}
            {{- end }}
            {{- if .Values.retention.autodelete.enabled }}
            - name: CONVERSATION_AUTODELETE_ENABLED
              value: "true"
            - name: CONVERSATION_AUTODELETE_CLOSED_AGE
              value: {{ required "retention.autodelete.closedAge is required when autodelete is enabled" .Values.retention.autodelete.closedAge | quote }}
            {{- end }}
            {{- if .Values.maxRuntimes }}
            # deprecated alias; the manager prefers MAX_ACTIVE_CONVERSATIONS and
            # logs that this one is on its way out
            - name: MAX_RUNTIMES
              value: {{ .Values.maxRuntimes | quote }}
            {{- end }}
            - name: RUNTIME_IDLE_TTL_M
              value: {{ .Values.runtimeIdleTtlMinutes | quote }}
            - name: RUNTIME_SA
              value: {{ include "agentops.runtimeServiceAccount" . | quote }}
            - name: ADAPTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adapterAuth.existingSecret | default .Values.adapterAuth.secretName }}
                  key: token
            {{- if .Values.persistence.enabled }}
            - name: HOME_PVC
              value: {{ .Values.persistence.existingClaim | default .Values.persistence.name | quote }}
            {{- end }}
            {{- if .Values.persistence.workspace.enabled }}
            - name: WORKSPACE_PVC
              value: {{ .Values.persistence.workspace.existingClaim | default .Values.persistence.workspace.name | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
{{ toYaml . | indent 12 }}
            {{- end }}
          ports:
            - containerPort: 8080
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
          resources:
{{ toYaml .Values.resources | indent 12 }}

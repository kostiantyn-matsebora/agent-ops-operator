apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops-manager
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentops-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentops-manager
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.manager }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Reported by GET /status and shown on the console's Overview. Taken
            # from appVersion rather than the image tag: the tag can be pinned or
            # overridden per environment, and "which version am I running" should
            # answer with what the release declares.
            - name: VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: MAX_ACTIVE_CONVERSATIONS
              value: {{ .Values.maxActiveConversations | quote }}
            - name: MAX_QUEUED_CONVERSATIONS
              value: {{ .Values.maxQueuedConversations | quote }}
            # Paired with rbac.drainAware: without the ClusterRole the manager
            # cannot read nodes, so enabling the behaviour alone would only
            # produce forbidden loops in the log.
            - name: DRAIN_AWARE
              value: {{ .Values.rbac.drainAware | quote }}
            {{- /* THE SIDECAR AND PROXY IMAGES ARE RELEASE-WIDE, not per runtime:
            they implement a contract the manager builds pods against, and the
            manager reads them once as bootstrap configuration. What is PER
            RUNTIME is whether either applies at all, which is why these are
            gated on ANY declared runtime asking for them. */ -}}
            {{- $rts := fromYamlArray (include "agentops.declaredRuntimes" .) }}
            {{- $defaults := dig "agentops" "runtimeDefaults" dict (.Values.global | default dict) }}
            {{- $anySync := false }}
            {{- $anyEgress := false }}
            {{- range $rt := $rts }}
            {{- if (($rt.contextSync | default dict).paths) }}{{ $anySync = true }}{{ end }}
            {{- if (($rt.egressMediation | default dict).enabled) }}{{ $anyEgress = true }}{{ end }}
            {{- end }}
            {{- if $anySync }}
            # Only set when a runtime actually declares paths: an empty image
            # disables sidecar mode outright, so the mode can never be
            # half-applied — which would give the agent an empty ephemeral context
            # and no sidecar to restore into it.
            - name: CONTEXT_SYNC_IMAGE
              value: {{ (($defaults.contextSync | default dict).image) | quote }}
            - name: CONTEXT_LIVE_SIZE_LIMIT
              value: {{ (($defaults.contextSync | default dict).liveSizeLimit) | quote }}
            {{- end }}
            {{- if $anyEgress }}
            # Only set when mediation is enabled somewhere: an empty image
            # disables it outright, so the redirect can never be installed
            # without a proxy to answer it — which would leave the agent unable
            # to reach anything at all.
            - name: EGRESS_PROXY_IMAGE
              value: {{ (($defaults.egressMediation | default dict).image) | quote }}
            {{- with (($defaults.egressMediation | default dict).initImage) }}
            - name: EGRESS_INIT_IMAGE
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.retention.autoclose.enabled }}
            - name: CONVERSATION_AUTOCLOSE_ENABLED
              value: "true"
            - name: CONVERSATION_AUTOCLOSE_IDLE_AGE
              value: {{ required "retention.autoclose.idleAge is required when autoclose is enabled" .Values.retention.autoclose.idleAge | quote }}
            {{- end }}
            {{- if .Values.retention.autodelete.enabled }}
            - name: CONVERSATION_AUTODELETE_ENABLED
              value: "true"
            - name: CONVERSATION_AUTODELETE_CLOSED_AGE
              value: {{ required "retention.autodelete.closedAge is required when autodelete is enabled" .Values.retention.autodelete.closedAge | quote }}
            {{- end }}
            {{- if .Values.maxRuntimes }}
            # deprecated alias; the manager prefers MAX_ACTIVE_CONVERSATIONS and
            # logs that this one is on its way out
            - name: MAX_RUNTIMES
              value: {{ .Values.maxRuntimes | quote }}
            {{- end }}
            # The manager's own fallback, for a runtime CR that states none.
            # Read from the defaults block so the release really has ONE number
            # — a second top-level key was one a bundle-shipped runtime could
            # not inherit.
            - name: RUNTIME_IDLE_TTL_M
              value: {{ dig "agentops" "runtimeDefaults" "idleTtlMinutes" 10 (.Values.global | default dict) | quote }}
            # THE FLOOR — what a runtime pod runs as when neither its
            # Conversation nor its AgentRuntime names an account. It holds
            # nothing, in every configuration.
            - name: RUNTIME_SA
              value: {{ include "agentops.floorServiceAccount" . | quote }}
            - name: ADAPTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adapterAuth.existingSecret | default .Values.adapterAuth.secretName }}
                  key: token
            {{- if .Values.persistence.context.enabled }}
            - name: CONTEXT_PVC
              value: {{ .Values.persistence.context.existingClaim | default .Values.persistence.context.name | quote }}
            {{- end }}
            {{- if .Values.persistence.workspace.enabled }}
            - name: WORKSPACE_PVC
              value: {{ .Values.persistence.workspace.existingClaim | default .Values.persistence.workspace.name | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
{{ toYaml . | indent 12 }}
            {{- end }}
          ports:
            - containerPort: 8080
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
          resources:
{{ toYaml .Values.resources | indent 12 }}

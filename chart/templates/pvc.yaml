{{- /*
Runtime storage: the CONTEXT claim (a conversation's accumulated context, on by
default) and the WORKSPACE claim (repository checkouts, off by default). Both
carry `helm.sh/resource-policy: keep`, so an uninstall never destroys agent
state.

Both offer the same three ways to run against storage this chart did not create
— an existing claim, a PersistentVolume by name, a PersistentVolume by label —
and the chart renders NO PersistentVolume in any of them. A pre-created volume
is by definition not the release's to create, and a release that created one
would own the lifecycle of storage holding agent context it did not put there.
*/ -}}
{{- include "agentops.retiredPersistenceKeysGuard" . }}
{{- include "agentops.contextClaimRenameGuard" (dict "root" .) }}
{{- $ctx := .Values.persistence.context }}
{{- if and $ctx.enabled (not $ctx.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $ctx.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # never delete a conversation's accumulated context on uninstall
    helm.sh/resource-policy: keep
spec:
  accessModes:
{{ include "agentops.accessModes" (dict "volume" $ctx "root" $) | indent 4 }}
  resources:
    requests:
      storage: {{ $ctx.size }}
  {{- include "agentops.storageClassName" $ctx }}
  {{- if $ctx.volumeName }}
  volumeName: {{ $ctx.volumeName }}
  {{- end }}
  {{- with $ctx.selector }}
  selector:
{{ toYaml . | indent 4 }}
  {{- end }}
{{- end }}
{{- $ws := .Values.persistence.workspace }}
{{- if and $ws.enabled (not $ws.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $ws.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # never delete uncommitted agent work on uninstall
    helm.sh/resource-policy: keep
spec:
  accessModes:
{{ include "agentops.accessModes" (dict "volume" $ws "root" $) | indent 4 }}
  resources:
    requests:
      storage: {{ $ws.size }}
  {{- include "agentops.storageClassName" $ws }}
  {{- if $ws.volumeName }}
  volumeName: {{ $ws.volumeName }}
  {{- end }}
  {{- with $ws.selector }}
  selector:
{{ toYaml . | indent 4 }}
  {{- end }}
{{- end }}
{{- /*
PER-ROUTE claims, for a Pipeline THIS CHART SHIPS that binds a PersistentVolume
by name.

The manager renders exactly this claim, under exactly this name, for any
Pipeline binding a volume — so this is not a second mechanism, it is the same
one arriving EARLIER. Where the chart ships the route it can render the claim at
install time rather than at first reconcile, which buys two things: the claim
appears in `helm get manifest`, and it carries `helm.sh/resource-policy: keep`
like every other volume here. Creation is idempotent on both sides — the manager
finds it already there and does nothing.

A route the chart does NOT ship is the manager's alone, which is why that path
exists at all.
*/ -}}
{{- range $p := .Values.pipelines }}
{{- range $b := list (dict "vol" "context" "volumeName" $p.contextVolume "size" ($p.contextSize | default "5Gi")) (dict "vol" "workspace" "volumeName" $p.workspaceVolume "size" ($p.workspaceSize | default "10Gi")) }}
{{- if $b.volumeName }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # The name the MANAGER derives for this binding. Both sides must spell it the
  # same way or the route gets two claims and mounts the wrong one.
  name: agentops-{{ $p.name }}-{{ $b.vol }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops
    agentops.dev/pipeline: {{ $p.name }}
    agentops.dev/persisted-volume: {{ $b.vol }}
  annotations:
    # A route's storage outlives the route, and certainly the release.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ $b.size }}
  # AN EXPLICIT EMPTY STRING, never an absent field. Absent is filled in by
  # admission with the cluster's default StorageClass, which provisions a SECOND
  # volume beside the one that was named and leaves it untouched.
  storageClassName: ""
  volumeName: {{ $b.volumeName }}
{{- end }}
{{- end }}
{{- end }}

apiVersion: v1
kind: Service
metadata:
  name: agentops-manager
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: agentops-manager
  ports:
    - name: api
      port: {{ .Values.service.apiPort }}
      targetPort: 8080
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: 9090

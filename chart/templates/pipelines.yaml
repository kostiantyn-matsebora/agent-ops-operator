{{- /*
Wiring — where an INSTALL declares its routes, and the only scope that can
declare one spanning bundles.

A Pipeline names a profile, signal sources and channels that routinely come from
DIFFERENT bundles: the cluster Events source from k8s-bundle, the chat surface
from telegram-bundle, the alert source from prometheus-bundle, all answered by
one agent. A subchart sees only its own half, so a bundle that shipped such a
route could only ever wire itself.

A bundle that owns its WHOLE lane may ship its own, behind a default-off flag —
k8s-bundle and prometheus-bundle both do. telegram-bundle ships none, because a
chat route always spans bundles. Sources are shareable, so a bundle's route and
one declared here may claim the same source; NOTES.txt reports the fan-out.
*/ -}}
{{- range $i, $p := .Values.pipelines }}
{{- if not $p.name }}
{{- fail (printf "pipelines[%d]: every entry needs a name" $i) }}
{{- end }}
{{- if not $p.profile }}
{{- fail (printf "pipelines[%s]: profile is required — a Pipeline with no profile has no agent to run" $p.name) }}
{{- end }}
---
apiVersion: agentops.dev/v1alpha1
kind: Pipeline
metadata:
  name: {{ $p.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops
spec:
  {{- with .icon }}
  # Display only: how this route is recognised in a chat command menu or the
  # console's typeahead. Nothing routes on it.
  icon: {{ . | quote }}
  {{- end }}
  profileRef:
    name: {{ $p.profile }}
  {{- with $p.runtimeRef }}
  # WHAT EXECUTES this route's conversations. Unset resolves the AgentRuntime
  # named `default` — the one this chart renders — exactly as before the field
  # existed.
  runtimeRef:
    name: {{ . }}
  {{- end }}
  {{- with $p.serviceAccountName }}
  # UNDER WHOSE IDENTITY, overriding the runtime's own. This and the toolsets
  # below are the same decision read two ways — which tools may be called, and
  # with whose credentials — which is why they live on one object.
  #
  # Naming is not creating: render the account through
  # `rbac.runtime.serviceAccounts`, or grant it yourself. A name nothing backs
  # fails at pod admission, saying which account.
  serviceAccountName: {{ . }}
  {{- end }}
  {{- with $p.signalSources }}
  # Wiring is pipeline-only: a source no Pipeline claims reports Wired=False
  # and DROPS every signal. One Pipeline may claim many.
  signalSourceRefs:
    {{- range . }}
    - name: {{ . }}
    {{- end }}
  {{- end }}
  {{- with $p.channels }}
  channelRefs:
    {{- range . }}
    - name: {{ . }}
    {{- end }}
  {{- end }}
  {{- with $p.toolsets }}
  # Declared, not inherited: nothing supplies a default, so a Pipeline without
  # this stanza hands its conversations an empty allowlist.
  toolsets:
    refs:
      {{- range . }}
      - name: {{ . }}
      {{- end }}
    {{- with $p.toolsetsMode }}
    # merge (default) composes with the agent definition's own `tools:`;
    # overwrite replaces them.
    mode: {{ . }}
    {{- end }}
  {{- end }}
  {{- with $p.mcpConfigs }}
  mcpConfigs:
    refs:
      {{- range . }}
      - name: {{ . }}
      {{- end }}
  {{- end }}
  {{- if or $p.contextClaim $p.contextVolume $p.workspaceClaim $p.workspaceVolume }}
  # WHERE this route's conversations keep their state. Unset takes the
  # release-wide claims (`persistence.context` / `.workspace`), which reach the
  # manager as its bootstrap default — so this is only for a route that keeps
  # its state somewhere of its own.
  #
  # A CLAIM already exists and nothing is created. A VOLUME is not mountable, so
  # naming one makes the MANAGER render the claim on it, under a derived name,
  # with an explicit empty storage class. That claim OUTLIVES this Pipeline: it
  # carries no ownerRef, and the manager holds no delete verb on claims.
  persistence:
    {{- if or $p.contextClaim $p.contextVolume }}
    context:
      {{- with $p.contextClaim }}
      claimName: {{ . }}
      {{- end }}
      {{- with $p.contextVolume }}
      volumeName: {{ . }}
      {{- end }}
      {{- with $p.contextSize }}
      size: {{ . | quote }}
      {{- end }}
    {{- end }}
    {{- if or $p.workspaceClaim $p.workspaceVolume }}
    workspace:
      {{- with $p.workspaceClaim }}
      claimName: {{ . }}
      {{- end }}
      {{- with $p.workspaceVolume }}
      volumeName: {{ . }}
      {{- end }}
      {{- with $p.workspaceSize }}
      size: {{ . | quote }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- if and $p.contextClaim $p.contextVolume }}
{{- fail (printf "pipelines[%s]: contextClaim and contextVolume are mutually exclusive — they decide WHO renders the claim, so both is two answers rather than a preference" $p.name) }}
{{- end }}
{{- if and $p.workspaceClaim $p.workspaceVolume }}
{{- fail (printf "pipelines[%s]: workspaceClaim and workspaceVolume are mutually exclusive — they decide WHO renders the claim, so both is two answers rather than a preference" $p.name) }}
{{- end }}
{{- end }}

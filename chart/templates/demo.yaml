{{- /*
Demo advisor (demo.enabled): a read-only, project-agnostic k8s-engineer agent —
no chat, no repository, no MCP. Ask via POST /task; read the answer from the
Conversation status or the runtime pod logs.
*/ -}}
{{- if .Values.demo.enabled }}
{{- $demoSA := printf "%s-demo" .Values.serviceAccounts.runtime }}
---
# Dedicated SA: the demo runtime's identity. Its RBAC is ONLY what
# demo.readOnlyRbac grants below — never the shared runtime SA's powers.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $demoSA }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: agentops.dev/v1alpha1
kind: AgentRuntime
metadata:
  name: default
  namespace: {{ .Release.Namespace }}
spec:
  image: {{ .Values.demo.runtimeImage }}
  serviceAccountName: {{ $demoSA }}
  idleTtlMinutes: {{ .Values.runtimeIdleTtlMinutes }}
  {{- if .Values.persistence.enabled }}
  home:
    pvcRef:
      name: {{ .Values.persistence.existingClaim | default .Values.persistence.name }}
  {{- end }}
  env:
    - name: {{ .Values.demo.credentialsSecret.envName }}
      valueFrom:
        secretKeyRef:
          name: {{ .Values.demo.credentialsSecret.name }}
          key: {{ .Values.demo.credentialsSecret.key }}
---
apiVersion: agentops.dev/v1alpha1
kind: AgentProfile
metadata:
  name: k8s-engineer
  namespace: {{ .Release.Namespace }}
spec:
  # no repository, no MCP — a pure advisor over the cluster API (read-only RBAC)
  allowedTools: "Read,Grep,Glob,Bash"
  maxTurns: 40
{{- if .Values.demo.readOnlyRbac }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $demoSA }}-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: {{ $demoSA }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $demoSA }}-cluster-ro
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $demoSA }}-cluster-ro
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $demoSA }}-cluster-ro
subjects:
  - kind: ServiceAccount
    name: {{ $demoSA }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}

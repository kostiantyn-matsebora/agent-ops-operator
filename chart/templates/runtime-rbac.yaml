{{- /*
What an agent may actually do, bound to a runtime ServiceAccount — because that
SA's permissions ARE the agent's powers, whichever bundle originated the
conversation. Hence the parent chart, not a domain bundle.

THE FLOOR ACCOUNT IS NEVER BOUND TO ANYTHING. `agentops-runtime` is what a
runtime naming no `serviceAccountName` runs as, and therefore what a Pipeline
naming none inherits by default. It holds NO RBAC, and this file refuses to
bind anything to it. A route that names nothing can do NOTHING in the cluster.

That is the correction this file carries. It first shipped with a release-wide
MODE bound to that account, so a route inherited the release's maximum by not
typing a field — three of four routes in the reference install held pod-delete
and node-patch that way, two of them routes that reach no Kubernetes API at all.

THERE IS NO MODE ANY MORE, AT EITHER LEVEL, and that is the second correction.
A release-wide mode went first: it rendered an extra, named account carrying a
preset posture, and the account granted nothing until a Pipeline named it — so
the setting described a state the runtime was in, which is the reading it caused
the incident for.

`rbacMode` ON A DECLARED ACCOUNT WENT WITH IT, and it took a second pass to see
why. It was the identical mechanism one level down: a reviewer reading
`rbacMode: full` sees a word, not the verbs, and that is the whole objection to
a preset. Being declared rather than defaulted does not make the word readable.

ACCOUNTS STATE THEIR RULES NOW. `rbac.runtime.serviceAccounts` is the only
source here, and every entry grants exactly what somebody wrote down:

    rbac:
      runtime:
        serviceAccounts:
          - name: agentops-runtime-acting
            clusterRoles:
              - name: workloads
                rules:
                  - apiGroups: ["apps"]
                    resources: ["deployments"]
                    verbs: ["get", "list", "patch"]

    pipelines:
      - name: k8s-operate
        serviceAccountName: agentops-runtime-acting

`agentops.runtimeReadRules` and `agentops.runtimeWriteRules` in `_helpers.tpl`
stay, and remain the copyable starting point for that `rules:` block — a rule
set an operator pasted and can read is not a preset. They are also what the
`kubernetes` bundle's MCP server binds, which is the wall that actually carries
an agent's cluster reach.

BEFORE COPYING THE WRITE RULES, note what they cost: they are gated by
`global.agentops.runtimeDefaults.allowPodExecution` where the helper emits them,
and a hand-written copy carries no such gate. Anything that produces or enters a
pod reads every Secret the kubelet resolves for it.

THE GRANTS ARE CLUSTER-SCOPED. Namespaced Roles were tried and reverted: RBAC
cannot say "everywhere except", so bounding an agent meant an allow-list, one
binding per namespace per account — 224 objects on a 28-namespace cluster — and
a new namespace invisible to the agent until someone edited values and
redeployed. See `agentops.runtimeReadRules` for why the exposure that bought is
smaller than it looks: `agentops.dev` and `secrets` are never granted, so
Conversations and credentials are unreachable wherever an agent looks.

BUNDLES RENDER THEIR OWN ROUTES' ACCOUNTS. A bundle knows what its routes do and
this chart does not, so `kubernetes` renders an account per route and
`home-assistant` renders accounts with no Kubernetes RBAC at all. What stays
exclusively the parent's is the runtime DEFAULTS and this FLOOR.
*/ -}}
{{- $ns := .Release.Namespace }}
{{- $floor := include "agentops.floorServiceAccount" . }}
{{- $rt := .Values.rbac.runtime }}
{{- $accounts := list }}
{{- range $i, $extra := ($rt.serviceAccounts | default list) }}
{{- if not $extra.name }}
{{- fail (printf "rbac.runtime.serviceAccounts[%d]: every entry needs a name — it is what a Pipeline's spec.serviceAccountName refers to" $i) }}
{{- end }}
{{- if eq $extra.name $floor }}
{{- fail (printf "rbac.runtime.serviceAccounts[%d]: %q is the FLOOR account, which holds no RBAC in any configuration — that is what makes a Pipeline naming no serviceAccountName powerless, and what keeps the floor available to NAME on one route to take it back to nothing. Binding to it would make silence mean power again. Use a different name and name it on the Pipelines that need it" $i $extra.name) }}
{{- end }}
{{- /* RETIRED KEY, AND IT FAILS RATHER THAN BEING IGNORED. Helm never reports
an unread value, so a silently-dropped `rbacMode: full` would REMOVE a grant the
install believed it had — invisible in exactly the way the release-wide mode was,
one direction over. */ -}}
{{- if hasKey $extra "rbacMode" }}
{{- fail (printf "RETIRED KEY: rbac.runtime.serviceAccounts[%s].rbacMode is DELETED with no alias: a mode name is a grant nobody reviewed, and being declared rather than defaulted does not make it readable. State what this account may do — clusterRoles (rules you write), bindClusterRoles (existing ClusterRoles) or namespaced (Roles in other namespaces) — or leave all three unset and the account is created holding nothing. agentops.runtimeReadRules / runtimeWriteRules in chart/templates/_helpers.tpl are the copyable starting point" $extra.name) }}
{{- end }}
{{- $accounts = append $accounts (dict
      "name" $extra.name
      "clusterRoles" ($extra.clusterRoles | default list)
      "bindClusterRoles" ($extra.bindClusterRoles | default list)
      "namespaced" ($extra.namespaced | default list)) }}
{{- end }}
{{- range $acct := $accounts }}
{{- $sa := $acct.name }}
{{- range $acct.clusterRoles }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $sa }}-{{ .name }}-{{ $.Release.Namespace }}
rules:
{{ toYaml .rules | indent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $sa }}-{{ .name }}-{{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $sa }}-{{ .name }}-{{ $.Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $ns }}
{{- end }}
{{- range $acct.bindClusterRoles }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $sa }}-{{ . }}-{{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ . }}-{{ $.Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $ns }}
{{- end }}
{{- range $acct.namespaced }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $sa }}-{{ .name }}
  namespace: {{ .namespace }}
rules:
{{ toYaml .rules | indent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa }}-{{ .name }}
  namespace: {{ .namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $sa }}-{{ .name }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $ns }}
{{- end }}
{{- end }}

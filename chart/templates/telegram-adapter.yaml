{{- if .Values.telegramAdapter.enabled }}
# Telegram reference adapter, plugged in as a ChannelAdapter CR — the operator's
# reconciler owns the workload (replicas 1 + Recreate via singleton: getUpdates
# allows exactly one consumer per bot token), injects the contract URL plus a
# per-adapter derived token, and projects each served Channel's
# credentialsSecretRef into the pod. The chart ships no channel-type-specific
# workload templates.
apiVersion: agentops.dev/v1alpha1
kind: ChannelAdapter
metadata:
  name: telegram
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentops-channel-telegram
spec:
  type: telegram
  image: "{{ .Values.telegramAdapter.image.repository }}:{{ .Values.telegramAdapter.image.tag }}"
  singleton: true
  resources:
{{ toYaml .Values.telegramAdapter.resources | indent 4 }}
{{- end }}

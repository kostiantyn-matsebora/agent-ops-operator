kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: agentruntimes.agentops.dev
spec:
  group: agentops.dev
  names:
    kind: AgentRuntime
    listKind: AgentRuntimeList
    plural: agentruntimes
    shortNames:
    - wrt
    singular: agentruntime
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.image
      name: Image
      type: string
    - jsonPath: .spec.idleTtlMinutes
      name: TTL
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentRuntime defines an executable agent backend (worker image + pod defaults).
          AgentProfiles select one via spec.runtimeRef; the CR named "default" is the
          namespace fallback.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentRuntimeSpec defines HOW agents execute: the worker image implementing
              the operator's work contract, and its pod-level defaults. Adopters bring
              their own agent backend (claude-code, aider, custom) by supplying an image
              that:

               1. long-polls  GET  $CONTROL_URL/work?convo=$CONVO_ID&pod=$POD_NAME&wait=25
               2. executes the returned unit (promptText or promptFile+promptVars against
                  the checked-out repository), streaming progress to STDOUT (pod logs)
               3. reports    POST $CONTROL_URL/work/done {convo,runId,status,sessionId,result}
               4. exits 0 after RUNTIME_IDLE_TTL_M minutes without work
            properties:
              args:
                items:
                  type: string
                type: array
              command:
                description: Command/Args override the image entrypoint.
                items:
                  type: string
                type: array
              contextStorage:
                default: volume
                description: |-
                  ContextStorage declares where this runtime keeps a conversation's context,
                  so the manager can tell whether continuity is possible here BEFORE
                  promising it. A runtime keeping context on its home volume, in a
                  deployment that provides none, can never continue anything — and saying
                  that up front is what stops every follow-up failing for a reason the
                  operator already chose.
                enum:
                - volume
                - external
                - none
                type: string
              contextSync:
                description: |-
                  ContextSync moves the LIVE context off the durable volume and keeps a
                  snapshot on it instead. ABSENT means today's behaviour, unchanged: the
                  home volume is mounted directly and there is no sidecar.
                properties:
                  exclude:
                    description: |-
                      Exclude drops churn from INSIDE the included paths — lock files, temp
                      files, anything rewritten constantly without being context. Without it
                      the change detector reports a change on nearly every cycle and the
                      skip-when-unchanged rule buys nothing.
                    items:
                      type: string
                    type: array
                  interval:
                    default: 2m
                    description: |-
                      Interval is how often the context is checkpointed while a pod is alive,
                      as a Go duration ("2m").

                      "0" disables the timer and leaves only work-boundary checkpoints, which
                      is the right setting for a low-churn backend. The interval bounds what a
                      SIGKILL can lose: a crash, an OOM or a node reboot takes everything
                      written since the last checkpoint, and no design removes that — only
                      shortens it.
                    type: string
                  paths:
                    description: |-
                      Paths are INCLUDE globs, relative to the runtime's HOME, naming what is
                      worth persisting. For the reference runtime that is
                      ".claude/projects/-data-workspace/**".

                      An include list rather than an exclude list, deliberately: caches, tool
                      state and telemetry are then excluded BY CONSTRUCTION, instead of by a
                      list that has to chase every file a vendor decides to add. It is also the
                      difference between copying a few megabytes of transcripts and copying a
                      package cache over NFS every two minutes.
                    items:
                      type: string
                    minItems: 1
                    type: array
                  retain:
                    default: 3
                    description: |-
                      Retain is how many previous copies to keep.

                      More than one because a checkpoint taken mid-run may hold a partially
                      written file. Keeping the previous generations means such a copy costs a
                      fallback rather than the context itself.
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - paths
                type: object
              env:
                description: 'Env: extra environment for every worker of this runtime.'
                items:
                  description: EnvVar represents an environment variable present in
                    a Container.
                  properties:
                    name:
                      description: Name of the environment variable. Must be a C_IDENTIFIER.
                      type: string
                    value:
                      description: |-
                        Variable references $(VAR_NAME) are expanded
                        using the previously defined environment variables in the container and
                        any service environment variables. If a variable cannot be resolved,
                        the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                        "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                        Escaped references will never be expanded, regardless of whether the variable
                        exists or not.
                        Defaults to "".
                      type: string
                    valueFrom:
                      description: Source for the environment variable's value. Cannot
                        be used if value is not empty.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: The key to select.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        fieldRef:
                          description: |-
                            Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                            spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is
                                written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified
                                API version.
                              type: string
                          required:
                          - fieldPath
                          type: object
                          x-kubernetes-map-type: atomic
                        resourceFieldRef:
                          description: |-
                            Selects a resource of the container: only resources limits and requests
                            (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                          properties:
                            containerName:
                              description: 'Container name: required for volumes,
                                optional for env vars'
                              type: string
                            divisor:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Specifies the output format of the exposed
                                resources, defaults to "1"
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            resource:
                              description: 'Required: resource to select'
                              type: string
                          required:
                          - resource
                          type: object
                          x-kubernetes-map-type: atomic
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                type: array
              home:
                description: Home volume for durable agent session state.
                properties:
                  emptyDir:
                    description: 'EmptyDir (default when no pvcRef): session state
                      dies with the pod.'
                    type: boolean
                  pvcRef:
                    description: PVCRef mounts an existing (usually RWX) PVC at /data/home.
                    properties:
                      name:
                        description: Name of the referenced object.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                type: object
              idleTtlMinutes:
                default: 10
                description: IdleTTLMinutes before an idle worker exits (respawned
                  on demand).
                format: int32
                type: integer
              image:
                minLength: 1
                type: string
              nodeSelector:
                additionalProperties:
                  type: string
                type: object
              resources:
                description: Resources default for runtime pods (AgentProfile.resources
                  overrides).
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This is an alpha field and requires enabling the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              serviceAccountName:
                description: |-
                  ServiceAccountName is this runtime's security identity: its RBAC defines
                  exactly what agents executing on this runtime may do in the cluster.
                  Give each runtime with a different trust level its OWN ServiceAccount —
                  runtimes sharing an SA share powers. Falls back to the operator's default
                  runtime SA when empty.
                type: string
              workspace:
                description: |-
                  Workspace volume for the repository checkout. Absent = ephemeral, which
                  is always correct — persisting it preserves uncommitted work across a pod
                  restart and skips the re-clone.
                properties:
                  emptyDir:
                    description: |-
                      EmptyDir (default when no pvcRef): the checkout dies with the pod, which
                      costs a re-clone and nothing else.
                    type: boolean
                  pvcRef:
                    description: |-
                      PVCRef mounts an existing (RWX when conversations run concurrently) PVC,
                      one subdirectory per conversation, at /data/workspace.
                    properties:
                      name:
                        description: Name of the referenced object.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                type: object
            required:
            - image
            type: object
          status:
            description: AgentRuntimeStatus reports validation state.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object

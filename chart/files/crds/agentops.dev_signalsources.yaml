---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: signalsources.agentops.dev
spec:
  group: agentops.dev
  names:
    kind: SignalSource
    listKind: SignalSourceList
    plural: signalsources
    shortNames:
    - sigsrc
    singular: signalsource
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.adapter
      name: Adapter
      type: string
    - jsonPath: .status.conditions[?(@.type=="Wired")].status
      name: Wired
      type: string
    - jsonPath: .status.conditions[?(@.type=="Served")].status
      name: Served
      type: string
    - jsonPath: .status.receivedTotal
      name: Received
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SignalSource is an ingest lane served by a signal-type implementation
          (built-in Alertmanager webhook or an external signal adapter).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SignalSourceSpec maps a signal stream to conversations with a profile:
              type-agnostic routing metadata plus an opaque per-type config that only the
              serving signal implementation interprets.

              The source carries NO wiring — which profile answers and which channels
              mirror is declared exclusively on a Pipeline that claims this source.
              Unclaimed sources drop signals (Wired=False condition).
            properties:
              adapter:
                description: |-
                  Adapter names the SignalAdapter serving this source — a REFERENCE, not an
                  attribute: the named adapter's implementation defines and validates
                  Config's schema. Sibling of Config by design (see Channel.Adapter).
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: spec.adapter is immutable
                  rule: self == oldSelf
              config:
                description: |-
                  Config carries whatever the signal type needs; schema-less by design.
                  Validated by the serving adapter, never by the operator.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              credentialsSecretRef:
                description: |-
                  CredentialsSecretRef names the Secret holding this source's transport
                  credentials (e.g. an API key). The operator only writes the NAME into
                  the serving adapter's pod spec (kubelet-resolved envFrom projection);
                  nothing reads the Secret's values through the API.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              grouping:
                description: |-
                  Grouping decides which signals share one conversation, and how long a
                  repeat of the same fingerprint is suppressed.
                properties:
                  cooldownHours:
                    default: 6
                    description: 'CooldownHours: suppress identical fingerprints within
                      this window.'
                    format: int32
                    type: integer
                  signatureLabels:
                    description: SignatureLabels compose the signature (signal label
                      keys).
                    items:
                      type: string
                    type: array
                  windowDays:
                    default: 7
                    description: |-
                      WindowDays: reuse an existing conversation with the same signature
                      updated within this window.
                    format: int32
                    type: integer
                type: object
            required:
            - adapter
            type: object
          status:
            description: SignalSourceStatus reports ingest liveness.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              cooldown:
                description: |-
                  Cooldown records fingerprint suppression for THIS source. The manager
                  keeps an in-memory map as the hot path, but this is the record: it is
                  loaded on first use per source after a restart, so a restart mid-incident
                  no longer re-opens conversations for signals inside an active window.

                  Bounded and pruned past the window. Only a FRESH fingerprint writes here —
                  and a fresh fingerprint already causes a conversation create or patch — so
                  the suppressed high-volume case costs nothing.
                items:
                  description: |-
                    CooldownEntry records when a fingerprint was last admitted, so suppression
                    survives a manager restart. MATERIALIZED state — written by ingest, never
                    hand-set.
                  properties:
                    at:
                      description: At is when the fingerprint was last admitted; the
                        window runs from here.
                      format: date-time
                      type: string
                    fingerprint:
                      description: Fingerprint identifies the signal being suppressed.
                      type: string
                  required:
                  - at
                  - fingerprint
                  type: object
                type: array
              lastReceived:
                format: date-time
                type: string
              receivedTotal:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

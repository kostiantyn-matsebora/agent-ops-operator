# What causes a workflow EVENT, TODAY -- verified against conveyor.py's real
# functions (fire, carry_fix, carry_archive), not against an assumed shape.
#
# CORRECTION, found while auditing against the real code: an earlier draft of
# this file modeled conveyor.run as a single function that reads
# `station.current` and "invokes" implement/fix/archive. THAT NEVER EXISTED.
# The real mechanism is THREE SEPARATE DECISION FUNCTIONS, each re-checking
# whether conveyor:run (or conveyor:archive) stands, each fired by a
# DIFFERENT real GitHub event:
#
#   fire()           fires on `issues: labeled`             -> implement OR archive, NEVER fix
#   carry_fix()       fires on a pull request's CI completing -> carries conveyor:fix onto it
#   carry_archive()   fires on a pull request merging          -> carries conveyor:run onward,
#                                                                  or restarts implement, or stalls
#
# There is no single place conveyor:run "decides" anything -- it is a
# standing fact on the issue, independently re-read by all three functions
# at three different moments. workflows.yaml's conveyor.run no longer
# declares `invokes:` for this reason; see its own comment.
#
# EVERY entry carries `event_type`, USING UML'S OWN VOCABULARY rather than an
# invented field -- UML state machines already distinguish exactly this:
#   signal      a person's (or an external system's) own action: placing a
#               label, posting a comment. Drawn as a plain trigger name.
#   change      `when(condition)` -- fires when a condition becomes true,
#               nobody "did" anything at that moment. This is carry_fix()
#               and carry_archive(): they re-check standing_grant() on an
#               unconditional GitHub event (CI finished, a PR merged), and
#               the CONDITION, not the event, is what actually gates it.
# (UML's other two kinds, time events `after(duration)` and call events, do
# not appear in this domain today.)
#
# A workflow only ever reacts to a named event. This file maps a real-world
# occurrence onto that name, so swapping the mechanism (label -> comment)
# later is a change here only.

version: 1

triggers:
  # ---- MANUAL: a person acting directly ----

  - event: run.label_placed
    workflow: conveyor.run
    kind: label_placed
    event_type: signal
    label: "conveyor:run"
    subject: issue
    requires: write_access
    fires: "fire()"

  - event: run.label_removed
    workflow: conveyor.run
    kind: label_removed
    event_type: signal
    label: "conveyor:run"
    subject: issue
    fires: null
    note: "no decision function reacts to this -- the NEXT re-check of standing_grant() simply finds the label gone."

  - event: implement.label_placed
    workflow: conveyor.implement
    kind: label_placed
    event_type: signal
    label: "conveyor:implement"
    subject: issue
    requires: write_access
    fires: "fire()"
    note: "fire() does not care which of conveyor:implement / conveyor:run it was handed, only that the label decodes to the implement station."

  - event: archive.label_placed
    workflow: conveyor.archive
    kind: label_placed
    event_type: signal
    label: "conveyor:archive"
    subject: issue
    requires: write_access
    fires: "fire()"

  - event: fix.label_placed
    workflow: conveyor.fix
    kind: label_placed
    event_type: signal
    label: "conveyor:fix"
    subject: pull_request
    requires: write_access
    fires: "gate()"
    note: "a person places conveyor:fix directly on the pull request, with no conveyor:run anywhere -- distinct from the CARRIED, automatic path below, which is the normal one when conveyor:run stands."

  - event: keep_going.label_placed
    workflow: conveyor.keep_going
    kind: label_placed
    event_type: signal
    label: "conveyor:keep-going"
    subject: pull_request
    requires: write_access
    fires: "gate()"

  # ---- AUTOMATIC: a GitHub event, no person acting at that moment ----
  # conveyor:run's standing grant is RE-CHECKED here, never "decided" by
  # conveyor.run itself -- see the module docstring above.

  - event: fix.carried_onto_pr
    workflow: conveyor.fix
    kind: workflow_run_completed
    event_type: change
    workflow_name: ci.yml
    subject: pull_request
    fires: "carry_fix()"
    note: "fires on EVERY pull request CI completion, not only ones with a grant -- carry_fix() checks standing_grant() itself and answers nothing when none stands. The trigger is unconditional; the condition lives in the decision function."

  - event: archive.carried_onto_issue
    workflow: conveyor.archive
    kind: pull_request_merged
    event_type: change
    subject: pull_request
    fires: "carry_archive()"
    note: "targets the ISSUE conveyor.archive tracks, not the pull request itself -- conveyor:run is carried from the merged pull request (Refs #n) onto its tracking issue."

  - event: implement.restarted
    workflow: conveyor.implement
    kind: pull_request_merged
    event_type: change
    subject: pull_request
    fires: "carry_archive()"
    note: "carry_archive()'s OWN restart path -- an apply merge whose change is not finished fires the implement station again, never archive. Same real event as archive.carried_onto_issue; which outcome fires depends on carry_archive()'s own branches, not a second trigger."

  # ---- the future this schema exists to make cheap ----
  # UNCOMMENT AND ADAPT: a dependabot-style MANUAL comment trigger for
  # conveyor:fix, alongside (never replacing) the label and carried paths
  # above. Nothing in workflows.yaml or registry.yaml would change.

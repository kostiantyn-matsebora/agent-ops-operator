# The five conveyor:* workflows, each declared as a COMPLETE, SELF-CONTAINED
# state machine in its OWN real vocabulary -- station's real state names and
# event names for an issue-side conveyor, loop's for a pull-request-side one.
#
# AGREED SHAPE: a conveyor is a PROCESS. Its states are NOT its own invented
# idle/running/done -- no such label value exists in conveyor.py. A
# conveyor's states ARE the real station or loop values it moves between,
# because that is literally what changes while the conveyor:* label stands.
# `acts_on` names which real machine (station or loop) this conveyor's
# vocabulary is drawn from.
#
# NO SHARED "gates:" TABLE. Each conveyor lists its OWN `states:` and
# `transitions:`, in the SAME shape station.yaml/loop.yaml use -- so a
# diagram is a direct, mechanical render of one block, never a cross-file
# lookup or an inferred pattern.
#
# NO SINGLE INITIAL STATE WHERE NONE EXISTS. UML's initial pseudostate means
# exactly one unconditional entry point (verified against the spec: "there
# can be at most one initial vertex in a region"). Several of these
# conveyors fire identically from MOST real states (conveyor.py's tables are
# total), so forcing one of them to be "the" start would misstate what the
# decision function actually checks. Where that is true, `initial: null` and
# every listed `from:` is a real, independent entry -- not a fork from one
# shared [*].
#
# EVERY (from, event, to) below is VERIFIED against station.yaml / loop.yaml
# by validate.py -- never hand-typed and trusted.

version: 1

workflows:

  conveyor.run:
    label: "conveyor:run"
    subject: issue
    acts_on: station
    initial: null
    note: >
      THE STANDING GRANT. standing_grant() reads conveyor:run as a FACT,
      called from carry_fix(), carry_archive() and gate() -- it does not
      itself decide a station transition the way fire() does. Its own real
      effect is two station transitions (both via carry_archive(), once the
      grant is found to stand) plus starting the loop machine via carry_fix().
      Fires identically from every non-terminal station value -- there is no
      single state this conveyor "starts" from.
    states: [none, implement, fix, merge, archive, stalled]
    transitions:
      - { from: none,      event: "merge:finished_carried", to: archive }
      - { from: implement, event: "merge:finished_carried", to: archive }
      - { from: fix,       event: "merge:finished_carried", to: archive }
      - { from: merge,     event: "merge:finished_carried", to: archive }
      - { from: archive,   event: "merge:finished_carried", to: archive }
      - { from: stalled,   event: "merge:finished_carried", to: archive }
      - { from: none,      event: "merge:proposal_or_apply", to: implement,
          note: "the restart path: an apply merge whose change is not finished" }
      - { from: implement, event: "merge:proposal_or_apply", to: implement }
      - { from: fix,       event: "merge:proposal_or_apply", to: implement }
      - { from: merge,     event: "merge:proposal_or_apply", to: implement }
      - { from: archive,   event: "merge:proposal_or_apply", to: implement }
      - { from: stalled,   event: "merge:proposal_or_apply", to: implement }

  conveyor.implement:
    label: "conveyor:implement"
    subject: issue
    acts_on: station
    initial: null
    note: >
      fire() reads this label (or conveyor:run, when the change is not
      finished) and fires station_event fire:implement. Fires identically
      from every state but archive and done (fire() refuses an implement
      regression once archive is reached; done is terminal) -- no single
      entry state.
    states: [none, implement, fix, merge, stalled]
    transitions:
      - { from: none,      event: "fire:implement", to: implement }
      - { from: implement, event: "fire:implement", to: implement }
      - { from: fix,       event: "fire:implement", to: implement }
      - { from: merge,     event: "fire:implement", to: implement }
      - { from: stalled,   event: "fire:implement", to: implement }

  conveyor.fix:
    label: "conveyor:fix"
    subject: pull_request
    acts_on: loop
    initial: none
    note: >
      gate() reads this label directly on a `labeled` trigger for the pull
      request, OR carry_fix() carries conveyor:run's grant onto it once CI
      completes. Both fire loop_event round:start. Unlike the station-side
      conveyors, this one DOES have a single meaningful entry: the loop has
      not started yet (`none`) -- round:start from any OTHER loop state is a
      later round of the SAME running loop, not a new conveyor:fix entry.
    states: [none, running]
    transitions:
      - { from: none, event: "round:start", to: running }

  conveyor.keep_going:
    label: "conveyor:keep-going"
    subject: pull_request
    acts_on: loop
    initial: capped
    note: >
      gate() reads this label on a `labeled` trigger, only meaningful once
      the loop is `capped` (cap_for() computes a new ceiling from
      pr.grants). Its one real effect is the SAME round:start transition
      conveyor.fix's gate uses, entered only from `capped` -- re-opening an
      already-running loop, never starting a fresh one.
    states: [capped, running]
    transitions:
      - { from: capped, event: "round:start", to: running }

  conveyor.archive:
    label: "conveyor:archive"
    subject: issue
    acts_on: station
    initial: null
    note: >
      fire() reads this label directly, refusing it where the lane has no
      archive station or the change is not finished. Fires identically from
      every state but done (terminal) -- no single entry state. ALSO stands
      for the fix station OF THE ARCHIVE PULL REQUEST ITSELF (the one whose
      body says Closes #n) -- standing_grant()'s own special case, read by
      carry_fix() exactly as conveyor:run is, starting the SAME loop entry
      conveyor.fix uses.
    states: [none, implement, fix, merge, archive, stalled]
    transitions:
      - { from: none,      event: "fire:archive", to: archive }
      - { from: implement, event: "fire:archive", to: archive }
      - { from: fix,       event: "fire:archive", to: archive }
      - { from: merge,     event: "fire:archive", to: archive }
      - { from: archive,   event: "fire:archive", to: archive }
      - { from: stalled,   event: "fire:archive", to: archive }

# Declarative definition of the five conveyor:* label-triggered workflows,
# verified against conveyor.py's real functions -- not against an assumed
# shape. See triggers.yaml's module docstring for the correction history.
#
# CORRECTED, found by auditing against the real code: conveyor.run does NOT
# "invoke" implement/fix/archive as child workflows through any single
# function. There is no such function. conveyor:run is a STANDING FACT on
# the issue, independently re-read by THREE SEPARATE decision functions at
# THREE DIFFERENT real GitHub events:
#
#   fire()           on `issues: labeled`            -> implement OR archive
#                                                        (fire() never picks "fix")
#   carry_fix()       on a pull request's CI completing -> carries conveyor:fix
#   carry_archive()   on a pull request merging          -> carries conveyor:run
#                                                            onward, restarts
#                                                            implement, or stalls
#
# So each of implement/fix/archive below has its OWN real entry transitions,
# each naming which real function and which real event fires it -- conveyor.run
# has no `invokes:` list, because there is nothing in the code for it to name.
#
# EVERY guard and action below is a NAME, resolved against a Python registry
# at load time (see registry.yaml). This file never contains logic, only the
# wiring -- the same split this repo's own CRD model already uses elsewhere
# (a Pipeline wires a tool by name; the runtime supplies the implementation).

version: 1

# a workflow instance's state is stored exactly where conveyor.py already
# stores station/loop state: as a label on the subject. Adding a workflow
# here means declaring one more label family, never a new storage mechanism.
state_storage:
  mechanism: github_label
  one_active_state_per: [subject, label_family]

workflows:

  conveyor.run:
    subject: issue
    label_family: "conveyor:run"       # a single boolean-shaped label: present = running
    # NO `done`: this is the STANDING instruction, not one-shot. It cycles
    # idle<->running for as long as a person leaves the label on, and is
    # never "finished" the way implement/fix/keep_going/archive are.
    #
    # NO `invokes:` HERE. conveyor.run does not call out to the other
    # workflows -- it is a FACT those workflows' own decision functions
    # independently re-check (standing_grant()) at their OWN real trigger
    # points. See triggers.yaml for exactly which function fires on which
    # event, and conveyor_implement.mmd / conveyor_fix.mmd / conveyor_archive.mmd
    # for each one's real entry transitions.
    states: [idle, running]
    initial: idle
    transitions:
      - { from: idle,    event: run.label_placed,  guard: placer.may_push,  to: running, action: none }
      - { from: running, event: run.label_removed,                          to: idle,    action: none }

  conveyor.implement:
    subject: issue
    label_family: "conveyor:implement"
    states: [idle, running, done]
    initial: idle
    transitions:
      # TWO real entries, both through fire() -- it does not distinguish
      # which label it was handed, only that the label decodes to the
      # implement station (anything that isn't conveyor:archive while the
      # change is finished).
      - { from: idle, event: implement.label_placed, guard: implement.may_fire, to: running, action: session.implement,
          note: "a person places conveyor:implement directly" }
      - { from: idle, event: run.label_placed,        guard: implement.may_fire, to: running, action: session.implement,
          note: "conveyor:run stands and the change is not finished -- fire() picks implement" }
      - { from: running, event: session.completed,     to: done, action: station.fire_implement }

  conveyor.fix:
    subject: pull_request
    label_family: "conveyor:fix"
    states: [idle, running, done]
    initial: idle
    transitions:
      # TWO real entries, through TWO DIFFERENT functions:
      - { from: idle, event: fix.label_placed,       guard: fix.may_place,          to: running, action: loop.start,
          note: "a person places conveyor:fix directly on the pull request (gate())" }
      - { from: idle, event: fix.carried_onto_pr,     guard: fix.may_carry,          to: running, action: loop.start,
          note: "the pull request's CI completed and conveyor:run (or the archive grant) stands (carry_fix())" }
      - { from: running, event: loop.reached_mergeable_and_merged, to: done, action: station.advance_from_fix }
    note: >
      "running" for conveyor:fix does not mean one round -- it means the
      label stands while the loop workflow (loop.yaml) runs its own full
      cycle underneath. See loop.yaml for the round-by-round machine.

  conveyor.keep_going:
    subject: pull_request
    label_family: "conveyor:keep-going"
    states: [idle, running, done]
    initial: idle
    transitions:
      - { from: idle,    event: keep_going.label_placed,  guard: loop.is_capped,  to: running, action: loop.extend_cap }
      - { from: running, event: grant.consumed,                                    to: done,    action: none }

  conveyor.archive:
    subject: issue
    label_family: "conveyor:archive"
    states: [idle, running, done]
    initial: idle
    transitions:
      # TWO real entries, through TWO DIFFERENT functions:
      - { from: idle, event: archive.label_placed,       guard: archive.may_fire,   to: running, action: session.archive,
          note: "a person places conveyor:archive directly (fire())" }
      - { from: idle, event: archive.carried_onto_issue,  guard: archive.may_carry,  to: running, action: session.archive,
          note: "a change/* pull request merged, the change is finished, and conveyor:run stands (carry_archive())" }
      - { from: running, event: session.completed,         to: done, action: station.fire_archive }
    note: >
      Also stands for the fix workflow OF THE ARCHIVE PULL REQUEST ITSELF
      (the one whose body says Closes #n) -- conveyor.py's standing_grant()
      treats this as the same grant, not a sixth workflow.
      carry_archive() ALSO restarts conveyor.implement (not drawn as a
      conveyor.archive transition) when an apply merge leaves the change
      unfinished -- see triggers.yaml's implement.restarted entry.

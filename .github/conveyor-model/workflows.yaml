# The five conveyor:* workflows, each declared as a COMPLETE, SELF-CONTAINED
# state machine in its OWN real vocabulary -- station's real state names and
# event names for an issue-side conveyor, loop's for a pull-request-side one.
#
# AGREED SHAPE: a conveyor is a PROCESS. Its states are NOT its own invented
# idle/running/done -- no such label value exists in conveyor.py. A
# conveyor's states ARE the real station or loop values it moves between.
# `acts_on` names which real machine (station or loop) this conveyor's
# vocabulary is drawn from.
#
# STATES OWN THEIR TRANSITIONS. CORRECTED: an earlier draft of this file was
# a flat transition list with a separate `states: [...]` name-check array --
# a state's own behavior lived somewhere else in the file, which is backwards
# for a STATE machine. `states:` is now a MAPPING keyed by state id; each
# state holds its own `initial`/`final` flag and its own `transitions:` list
# (event, to, guard, owned_by). This also matches how Mermaid's
# stateDiagram-v2 actually reads -- an arrow leaving a box, labeled with its
# own event/guard/action -- which is the shape this file renders into and
# the shape screenshots confirmed is legible, unlike python-statemachine's
# native schema (docs/python-statemachine-schema.md), whose `cond:`/`unless:`
# fields are a restricted AST with NO function calls -- it cannot even
# express `has_write_access(placer)`, so adopting its field names would still
# hide the real guard logic behind a string the schema's own evaluator cannot
# run.
#
# `guard:` IS A CONDITION, NOT PROSE, IN FUNCTION-CALL SYNTAX. CORRECTED
# THREE TIMES: first by drawing fire:archive as firing unconditionally (it
# does not); then by writing the "guard" as an explanatory paragraph
# including what happens when it's false (documentation, not a boolean);
# then by writing predicates as bare attribute access (`placer.may_push`,
# `line.change_finished`) and an inline IF/THEN/ELSE, which an evaluation
# engine cannot parse as a predicate call the way it can `has_write_access(placer)`.
#
# EVERY PREDICATE IS NOW `name(arguments)`, matching how an evaluation
# engine will actually call it -- never a bare attribute read, membership
# test, or inline conditional. AND / OR / NOT / == stay as infix operators
# (they are universal, not vendor-specific). The predicate glossary:
#
#   has_access(placer, grant_placer)   direct placer has write access, OR
#                                        (placed by the workflow bot) the
#                                        grant's own placer still can
#   has_write_access(who)              who.may_push
#   is_fork(pr)                        the pull request is from a fork
#   is_same_repo_change_branch(pr)     a change/* branch of this repository
#   has_issue_ref(pr)                  pr.refs or pr.closes names an issue
#   has_standing_grant(line, pr)       standing_grant() finds a real grant
#   is_lane(line, name)                line.lane == name
#   is_change_finished(line)           every task of the change is ticked
#   has_fired(line, station)           that station already has a fire record
#   has_open_pr(line)                  a pull request is open from the
#                                        change's branch right now
#   is_capped(pr)                      pr.rounds_used >= cap_for(pr.max_rounds, pr.grants)
#   has_open_thread(pr)                a review-authored thread is unresolved
#
# NO SINGLE INITIAL STATE WHERE NONE EXISTS. UML's initial pseudostate means
# exactly one unconditional entry point (verified against the spec). A
# conveyor whose real guard fires identically from most real states has NO
# state marked `initial: true` at all -- every state with a matching
# transition is an independent real entry, drawn as such.
#
# EVERY (event, to) under every state is VERIFIED against the real source by
# validate.py. Guards are READ off the function body by hand, not generated
# -- a future change to a guard's real condition needs a matching edit here.

version: 1

workflows:

  conveyor.run:
    label: "conveyor:run"
    subject: issue
    acts_on: station
    states:
      none:
        transitions:
          - event: "merge:finished_carried"
            to: archive
            guard: "is_change_finished(line) AND has_write_access(grant_placer)"
            owned_by: "carry_archive()"
          - event: "merge:proposal_or_apply"
            to: implement
            guard: "NOT is_change_finished(line) AND has_fired(line, 'implement') AND NOT has_open_pr(line) AND has_write_access(grant_placer)"
            owned_by: "carry_archive()"
      implement:
        transitions:
          - event: "merge:finished_carried"
            to: archive
            guard: "is_change_finished(line) AND has_write_access(grant_placer)"
            owned_by: "carry_archive()"
          - event: "merge:proposal_or_apply"
            to: implement
            guard: "NOT is_change_finished(line) AND has_fired(line, 'implement') AND NOT has_open_pr(line) AND has_write_access(grant_placer)"
            owned_by: "carry_archive()"
      fix:
        transitions:
          - event: "merge:finished_carried"
            to: archive
            guard: "is_change_finished(line) AND has_write_access(grant_placer)"
            owned_by: "carry_archive()"
          - event: "merge:proposal_or_apply"
            to: implement
            guard: "NOT is_change_finished(line) AND has_fired(line, 'implement') AND NOT has_open_pr(line) AND has_write_access(grant_placer)"
            owned_by: "carry_archive()"
      merge:
        transitions:
          - event: "merge:finished_carried"
            to: archive
            guard: "is_change_finished(line) AND has_write_access(grant_placer)"
            owned_by: "carry_archive()"
          - event: "merge:proposal_or_apply"
            to: implement
            guard: "NOT is_change_finished(line) AND has_fired(line, 'implement') AND NOT has_open_pr(line) AND has_write_access(grant_placer)"
            owned_by: "carry_archive()"
      archive:
        transitions:
          - event: "merge:finished_carried"
            to: archive
            guard: "is_change_finished(line) AND has_write_access(grant_placer)"
            owned_by: "carry_archive()"
          - event: "merge:proposal_or_apply"
            to: implement
            guard: "NOT is_change_finished(line) AND has_fired(line, 'implement') AND NOT has_open_pr(line) AND has_write_access(grant_placer)"
            owned_by: "carry_archive()"
      stalled:
        transitions:
          - event: "merge:finished_carried"
            to: archive
            guard: "is_change_finished(line) AND has_write_access(grant_placer)"
            owned_by: "carry_archive()"
          - event: "merge:proposal_or_apply"
            to: implement
            guard: "NOT is_change_finished(line) AND has_fired(line, 'implement') AND NOT has_open_pr(line) AND has_write_access(grant_placer)"
            owned_by: "carry_archive()"

  conveyor.implement:
    label: "conveyor:implement"
    subject: issue
    acts_on: station
    states:
      none:
        transitions:
          - event: "fire:implement"
            to: implement
            guard: "has_access(placer, grant_placer) AND NOT (has_fired(line, 'implement') AND has_open_pr(line))"
            owned_by: "fire()"
      implement:
        transitions:
          - event: "fire:implement"
            to: implement
            guard: "has_access(placer, grant_placer) AND NOT (has_fired(line, 'implement') AND has_open_pr(line))"
            owned_by: "fire()"
      fix:
        transitions:
          - event: "fire:implement"
            to: implement
            guard: "has_access(placer, grant_placer) AND NOT (has_fired(line, 'implement') AND has_open_pr(line))"
            owned_by: "fire()"
      merge:
        transitions:
          - event: "fire:implement"
            to: implement
            guard: "has_access(placer, grant_placer) AND NOT (has_fired(line, 'implement') AND has_open_pr(line))"
            owned_by: "fire()"
      stalled:
        transitions:
          - event: "fire:implement"
            to: implement
            guard: "has_access(placer, grant_placer) AND NOT (has_fired(line, 'implement') AND has_open_pr(line))"
            owned_by: "fire()"

  loop:
    subject: pull_request
    acts_on: loop
    states:
      none:
        initial: true
        transitions:
          - event: "ci:green_clean"
            to: mergeable
            owned_by: "carry_fix()"
      running:
        transitions:
          - event: "end:continue"
            to: running
            owned_by: "ending()"
          - event: "end:mergeable"
            to: mergeable
            owned_by: "ending()"
          - event: "end:waiting"
            to: waiting
            owned_by: "ending()"
          - event: "end:stalled"
            to: stalled
            owned_by: "ending()"
          - event: "end:capped"
            to: capped
            owned_by: "ending()"
          - event: "recover:waiting"
            to: waiting
            guard: "NOT is_capped(pr) AND has_open_thread(pr)"
            owned_by: "recover()"
          - event: "recover:capped"
            to: capped
            guard: "is_capped(pr)"
            owned_by: "recover()"
      waiting:
        transitions:
          - event: "round:start"
            to: running
            owned_by: "gate()"
          - event: "ci:green_clean"
            to: mergeable
            owned_by: "carry_fix()"
      stalled:
        transitions:
          - event: "round:start"
            to: running
            owned_by: "gate()"
          - event: "ci:green_clean"
            to: mergeable
            owned_by: "carry_fix()"
      capped:
        transitions:
          - event: "ci:green_clean"
            to: mergeable
            owned_by: "carry_fix()"
      mergeable:
        transitions:
          - event: "ci:green_clean"
            to: mergeable
            owned_by: "carry_fix()"
          - event: "thread:opened"
            to: waiting
            owned_by: "refresh()"
          - event: "round:start"
            to: running
            owned_by: "gate()"

  conveyor.fix:
    label: "conveyor:fix"
    subject: pull_request
    acts_on: loop
    states:
      none:
        initial: true
        transitions:
          - event: "round:start"
            to: running
            guard: "NOT is_fork(pr) AND has_write_access(placer)"
            owned_by: "gate()"
          - event: "round:start"
            to: running
            guard: "is_same_repo_change_branch(pr) AND has_issue_ref(pr) AND has_standing_grant(line, pr) AND has_write_access(grant_placer)"
            owned_by: "carry_fix()"
      running:
        invokes: loop

  conveyor.keep_going:
    label: "conveyor:keep-going"
    subject: pull_request
    acts_on: loop
    states:
      capped:
        initial: true
        transitions:
          - event: "round:start"
            to: running
            guard: "NOT is_fork(pr) AND has_write_access(placer) AND is_capped(pr)"
            owned_by: "gate()"
      running:
        invokes: loop

  conveyor.archive:
    label: "conveyor:archive"
    subject: issue
    acts_on: station
    states:
      none:
        transitions:
          - event: "fire:archive"
            to: archive
            guard: "has_access(placer, grant_placer) AND is_lane(line, 'opsx') AND is_change_finished(line) AND NOT (has_fired(line, 'archive') AND has_open_pr(line))"
            owned_by: "fire()"
      implement:
        transitions:
          - event: "fire:archive"
            to: archive
            guard: "has_access(placer, grant_placer) AND is_lane(line, 'opsx') AND is_change_finished(line) AND NOT (has_fired(line, 'archive') AND has_open_pr(line))"
            owned_by: "fire()"
      fix:
        transitions:
          - event: "fire:archive"
            to: archive
            guard: "has_access(placer, grant_placer) AND is_lane(line, 'opsx') AND is_change_finished(line) AND NOT (has_fired(line, 'archive') AND has_open_pr(line))"
            owned_by: "fire()"
      merge:
        transitions:
          - event: "fire:archive"
            to: archive
            guard: "has_access(placer, grant_placer) AND is_lane(line, 'opsx') AND is_change_finished(line) AND NOT (has_fired(line, 'archive') AND has_open_pr(line))"
            owned_by: "fire()"
      archive:
        transitions:
          - event: "fire:archive"
            to: archive
            guard: "has_access(placer, grant_placer) AND is_lane(line, 'opsx') AND is_change_finished(line) AND NOT (has_fired(line, 'archive') AND has_open_pr(line))"
            owned_by: "fire()"
      stalled:
        transitions:
          - event: "fire:archive"
            to: archive
            guard: "has_access(placer, grant_placer) AND is_lane(line, 'opsx') AND is_change_finished(line) AND NOT (has_fired(line, 'archive') AND has_open_pr(line))"
            owned_by: "fire()"

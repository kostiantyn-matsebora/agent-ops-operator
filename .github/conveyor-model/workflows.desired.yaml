version: 1

workflows:

  propose:
    subject: issue
    acts_on: station
    initial: null
    states: [none, proposing, proposed, merged]
    invokes:
      proposing: loop
    transitions:
      - from: none
        event: "proposal:pr_opened"
        to: proposing
        guard: "exists(proposal_pr)"
      - from: proposing
        event: "proposal:mergeable"
        to: proposed
        guard: "is_mergeable(proposal_pr)"
      - from: proposed
        event: "proposal:pr_merged"
        to: merged
        guard: "is_merged(proposal_pr)"

version: 1

workflows:

  propose:
    subject: issue
    acts_on: station
    states:
      none:
        initial: true
        transitions:
          - event: "proposal:pr_opened"
            to: proposing
            guard: "exists(proposal_pr)"
      proposing:
        invokes: loop
        transitions:
          - event: "proposal:mergeable"
            to: proposed
            guard: "is_mergeable(proposal_pr)"
      proposed:
        transitions:
          - event: "proposal:pr_merged"
            to: ready
            guard: "is_merged(proposal_pr)"
      ready:
        final: true

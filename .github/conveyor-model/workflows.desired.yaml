version: 1

workflows:

  conveyor.propose:
    subject: issue
    acts_on: station
    states:
      none:
        initial: true
        transitions:
          - event: "proposal pr opened"
            to: proposing
            guard: "exists proposal_pr"
      proposing:
        invokes: loop
        transitions:
          - event: "proposal pr mergeable"
            to: proposed
            guard: "is_mergeable proposal_pr"
      proposed:
        transitions:
          - event: "proposal pr merged"
            to: ready
            guard: "is_merged proposal_pr"
      ready:
        final: true

  conveyor.implement:
    label: "conveyor:implement"
    subject: issue
    acts_on: station
    states:
      ready:
        initial: true
        transitions:
          - event: "implement fired"
            to: implementing
            guard: "has_access placer AND NOT is_session_at_work"
            owned_by: "fire"
          - event: "implement fired"
            to: implementing
            guard: "has_access grant_placer AND NOT is_session_at_work"
            owned_by: "fire"
      implementing:
        transitions:
          - event: "implement fired"
            to: implementing
            guard: "has_access placer AND NOT is_session_at_work"
            owned_by: "fire"
          - event: "implement fired"
            to: implementing
            guard: "has_access grant_placer AND NOT is_session_at_work"
            owned_by: "fire"
          - event: "implementing pr merged"
            to: done
            guard: "all_pr_merged"
          - event: "implementing pr merged"
            to: stalled
            guard: "NOT all_pr_merged"
      done:
        final: true
      stalled:
        final: true

  conveyor.fix:
    subject: issue
    acts_on: station
    states:
      stalled:
        initial: true
        transitions:
          - event: "round started"
            to: fixing
      fixing:
        invokes: loop
        transitions:
          - event: "pr green"
            to: mergeable
      mergeable:
        transitions:
          - event: "fixing pr merged"
            to: done
            guard: "all_pr_merged"
      done:
        final: true

  conveyor.finalize:
    subject: issue
    acts_on: station
    states:
      done:
        initial: true
        transitions:
          - event: "finalize fired"
            to: finalizing
            guard: "has_access placer AND is_change_finished AND NOT is_session_at_work"
            owned_by: "fire"
          - event: "finalize fired"
            to: finalizing
            guard: "has_access grant_placer AND is_change_finished AND NOT is_session_at_work"
            owned_by: "fire"
      finalizing:
        invokes: loop
        transitions:
          - event: "finalize pr merged"
            to: finalized
            guard: "all_pr_merged"
      finalized:
        final: true

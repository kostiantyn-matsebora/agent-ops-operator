version: 1

workflows:

  conveyor.propose:
    subject: issue
    acts_on: station
    states:
      none:
        initial: true
        transitions:
          - event: "proposal:pr_opened"
            to: proposing
            guard: "exists proposal_pr"
      proposing:
        invokes: loop
        transitions:
          - event: "proposal:mergeable"
            to: proposed
            guard: "is_mergeable proposal_pr"
      proposed:
        transitions:
          - event: "proposal:pr_merged"
            to: ready
            guard: "is_merged proposal_pr"
      ready:
        final: true

  conveyor.implement:
    label: "conveyor:implement"
    subject: issue
    acts_on: station
    states:
      ready:
        initial: true
        transitions:
          - event: "fire:implement"
            to: implementing
            guard: "has_access placer grant_placer AND NOT is_session_at_work line"
            owned_by: "fire"
      implementing:
        transitions:
          - event: "fire:implement"
            to: implementing
            guard: "has_access placer grant_placer AND NOT is_session_at_work line"
            owned_by: "fire"
          - event: "merge:plain"
            to: done
          - event: "merge:finished_stalled"
            to: stalled
      done:
        final: true
      stalled:
        final: true

  conveyor.fix:
    subject: issue
    acts_on: station
    states:
      stalled:
        initial: true
        transitions:
          - event: "round:start"
            to: fixing
      fixing:
        invokes: loop
        transitions:
          - event: "pr:green"
            to: mergeable
      mergeable:
        transitions:
          - event: "merge:plain"
            to: done
      done:
        final: true

  conveyor.finalize:
    subject: issue
    acts_on: station
    states:
      done:
        initial: true
        transitions:
          - event: "fire:finalize"
            to: finalizing
            guard: "has_access placer grant_placer AND is_change_finished line AND NOT is_session_at_work line"
            owned_by: "fire"
      finalizing:
        invokes: loop
        transitions:
          - event: "merge:finalize_pr"
            to: finalized
      finalized:
        final: true

version: 1

workflows:

  conveyor.propose:
    subject: issue
    acts_on: station
    states:
      none:
        initial: true
        transitions:
          - event: "proposal_pr_opened"
            to: proposing
      proposing:
        invokes: loop
        transitions:
          - event: "loop_entered_mergeable"
            to: proposed
            guard: "proposal_pr_is_mergeable"
      proposed:
        transitions:
          - event: "proposal_pr_merged"
            to: ready
      ready:
        final: true

  conveyor.implement:
    label: "conveyor:implement"
    subject: issue
    acts_on: station
    states:
      ready:
        initial: true
        transitions:
          - event: "implement_fired"
            to: implementing
            guard: "placer_has_access AND NOT is_session_at_work"
            owned_by: "fire"
          - event: "implement_fired"
            to: implementing
            guard: "grant_placer_has_access AND NOT is_session_at_work"
            owned_by: "fire"
      implementing:
        transitions:
          - event: "implement_fired"
            to: implementing
            guard: "placer_has_access AND NOT is_session_at_work"
            owned_by: "fire"
          - event: "implement_fired"
            to: implementing
            guard: "grant_placer_has_access AND NOT is_session_at_work"
            owned_by: "fire"
          - event: "prs_are_created"
            to: implemented
            guard: "has_open_prs"
      implemented:
        transitions:
          - event: "checks_completed"
            to: ready_to_merge
            guard: "all_pr_mergeable"
          - event: "checks_completed"
            to: implemented_with_issues
            guard: "NOT all_pr_mergeable"
      implemented_with_issues:
        final: true
      ready_to_merge:
        transitions:
          - event: "all_prs_merged"
            to: done
            guard: "master_is_green"
          - event: "all_prs_merged"
            to: merge_failed
            guard: "NOT master_is_green"
      done:
        final: true
      merge_failed:
        final: true

  conveyor.fix:
    subject: issue
    acts_on: station
    states:
      stalled:
        initial: true
        transitions:
          - event: "round_started"
            to: fixing
      fixing:
        invokes: loop
        transitions:
          - event: "loop_entered_mergeable"
            to: mergeable
      mergeable:
        transitions:
          - event: "all_prs_merged"
            to: done
      done:
        final: true

  conveyor.finalize:
    subject: issue
    acts_on: station
    states:
      done:
        initial: true
        transitions:
          - event: "finalize_fired"
            to: finalizing
            guard: "placer_has_access AND is_change_finished AND NOT is_session_at_work"
            owned_by: "fire"
          - event: "finalize_fired"
            to: finalizing
            guard: "grant_placer_has_access AND is_change_finished AND NOT is_session_at_work"
            owned_by: "fire"
      finalizing:
        invokes: loop
        transitions:
          - event: "all_prs_merged"
            to: finalized
      finalized:
        final: true

version: 1

workflows:

  conveyor.propose:
    subject: issue
    acts_on: station
    states:
      none:
        initial: true
        transitions:
          - event: "proposal:pr_opened"
            to: proposing
            guard: "exists proposal_pr"
      proposing:
        invokes: loop
        transitions:
          - event: "proposal:mergeable"
            to: proposed
            guard: "is_mergeable proposal_pr"
      proposed:
        transitions:
          - event: "proposal:pr_merged"
            to: ready
            guard: "is_merged proposal_pr"
      ready:
        final: true

  conveyor.implement:
    label: "conveyor:implement"
    subject: issue
    acts_on: station
    states:
      ready:
        initial: true
        transitions:
          - event: "fire:implement"
            to: implement
            guard: "has_access placer grant_placer AND NOT is_session_at_work line"
            owned_by: "fire"
      implement:
        transitions:
          - event: "fire:implement"
            to: implement
            guard: "has_access placer grant_placer AND NOT is_session_at_work line"
            owned_by: "fire"
          - event: "merge:plain"
            to: done
            owned_by: "carry_archive"
          - event: "merge:finished_stalled"
            to: stalled
            owned_by: "carry_archive"
      done:
        final: true
      stalled:
        final: true

  conveyor.fix_stalled:
    subject: issue
    acts_on: station
    states:
      stalled:
        initial: true
        transitions:
          - event: "round:start"
            to: fix
      fix:
        invokes: loop
        transitions:
          - event: "pr:green"
            to: merge
      merge:
        transitions:
          - event: "merge:plain"
            to: done
            owned_by: "carry_archive"
      done:
        final: true

version: 1

workflows:

  conveyor.propose:
    subject: issue
    acts_on: station
    states:
      none:
        initial: true
        transitions:
          - event: "proposal_pr_opened"
            to: proposing
      proposing:
        invokes: loop
        transitions:
          - event: "loop_entered_mergeable"
            to: proposed
            guard: "proposal_pr_is_mergeable"
      proposed:
        transitions:
          - event: "proposal_pr_merged"
            to: ready
      ready:
        final: true

  conveyor.implement:
    label: "conveyor:implement"
    subject: issue
    acts_on: station
    states:
      ready:
        initial: true
        transitions:
          - event: "implement_fired"
            to: implementing
            guard: "has_access AND NOT is_session_at_work"
            owned_by: "fire"
      implementing:
        transitions:
          - event: "implement_fired"
            to: implementing
            guard: "has_access AND NOT is_session_at_work"
            owned_by: "fire"
          - event: "prs_are_created"
            to: implemented
            guard: "has_open_prs"
      implemented:
        transitions:
          - event: "checks_completed"
            to: ready_to_merge
            guard: "all_pr_mergeable"
          - event: "checks_completed"
            to: implemented_with_issues
            guard: "NOT all_pr_mergeable"
      implemented_with_issues:
        final: true
      ready_to_merge:
        transitions:
          - event: "all_prs_merged"
            to: done
            guard: "all_prs_merged AND master_is_green"
          - event: "all_prs_merged"
            to: merge_failed
            guard: "all_prs_merged AND NOT master_is_green"
      done:
        final: true
      merge_failed:
        final: true

  conveyor.fix:
    subject: issue
    acts_on: station
    states:
      implemented_with_issues:
        initial: true
        transitions:
          - event: "round_started"
            to: fixing
      merge_failed:
        initial: true
        transitions:
          - event: "hotfix_started"
            to: hotfix_created
            guard: "hotfix_pr_is_created AND all_checks_ran"
      hotfix_created:
        transitions:
          - event: "round_started"
            to: fixing
      fixing:
        invokes: loop
        transitions:
          - event: "loop_entered_mergeable"
            to: mergeable
      mergeable:
        transitions:
          - event: "all_prs_merged"
            to: done
            guard: "all_prs_merged"
      done:
        final: true

  conveyor.finalize:
    subject: issue
    acts_on: station
    states:
      done:
        initial: true
        transitions:
          - event: "finalize_fired"
            to: finalizing
            guard: "has_access AND is_change_finished AND NOT is_session_at_work"
            owned_by: "fire"
      finalizing:
        invokes: loop
        transitions:
          - event: "all_prs_merged"
            to: finalized
            guard: "all_prs_merged"
      finalized:
        final: true

  loop:
    subject: pull_request
    acts_on: loop
    states:
      none:
        initial: true
        transitions:
          - event: "ci:green_clean"
            to: mergeable
            owned_by: "carry_fix()"
      running:
        transitions:
          - event: "end:continue"
            to: running
            owned_by: "ending()"
          - event: "end:mergeable"
            to: mergeable
            owned_by: "ending()"
          - event: "end:waiting"
            to: waiting
            owned_by: "ending()"
          - event: "end:stalled"
            to: stalled
            owned_by: "ending()"
          - event: "end:capped"
            to: capped
            owned_by: "ending()"
          - event: "recover:waiting"
            to: waiting
            guard: "NOT is_capped(pr) AND has_open_thread(pr)"
            owned_by: "recover()"
          - event: "recover:capped"
            to: capped
            guard: "is_capped(pr)"
            owned_by: "recover()"
      waiting:
        transitions:
          - event: "round:start"
            to: running
            owned_by: "gate()"
          - event: "ci:green_clean"
            to: mergeable
            owned_by: "carry_fix()"
      stalled:
        transitions:
          - event: "round:start"
            to: running
            owned_by: "gate()"
          - event: "ci:green_clean"
            to: mergeable
            owned_by: "carry_fix()"
      capped:
        transitions:
          - event: "ci:green_clean"
            to: mergeable
            owned_by: "carry_fix()"
      mergeable:
        transitions:
          - event: "ci:green_clean"
            to: mergeable
            owned_by: "carry_fix()"
          - event: "thread:opened"
            to: waiting
            owned_by: "refresh()"
          - event: "round:start"
            to: running
            owned_by: "gate()"

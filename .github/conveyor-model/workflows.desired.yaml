version: 1

workflows:

  conveyor.propose:
    subject: issue
    acts_on: station
    states:
      none:
        initial: true
        transitions:
          - event: "proposal_pr_opened"
            to: proposing
      proposing:
        invokes: loop
        transitions:
          - event: "proposal_pr_mergeable"
            to: proposed
      proposed:
        transitions:
          - event: "proposal_pr_merged"
            to: ready
      ready:
        final: true

  conveyor.implement:
    label: "conveyor:implement"
    subject: issue
    acts_on: station
    states:
      ready:
        initial: true
        transitions:
          - event: "implement_fired"
            to: implementing
            guard: "placer_has_access AND NOT is_session_at_work"
            owned_by: "fire"
          - event: "implement_fired"
            to: implementing
            guard: "grant_placer_has_access AND NOT is_session_at_work"
            owned_by: "fire"
      implementing:
        transitions:
          - event: "implement_fired"
            to: implementing
            guard: "placer_has_access AND NOT is_session_at_work"
            owned_by: "fire"
          - event: "implement_fired"
            to: implementing
            guard: "grant_placer_has_access AND NOT is_session_at_work"
            owned_by: "fire"
          - event: "implementing_pr_merged"
            to: done
            guard: "all_pr_merged"
          - event: "implementing_pr_merged"
            to: stalled
            guard: "NOT all_pr_merged"
      done:
        final: true
      stalled:
        final: true

  conveyor.fix:
    subject: issue
    acts_on: station
    states:
      stalled:
        initial: true
        transitions:
          - event: "round_started"
            to: fixing
      fixing:
        invokes: loop
        transitions:
          - event: "pr_green"
            to: mergeable
      mergeable:
        transitions:
          - event: "fixing_pr_merged"
            to: done
            guard: "all_pr_merged"
      done:
        final: true

  conveyor.finalize:
    subject: issue
    acts_on: station
    states:
      done:
        initial: true
        transitions:
          - event: "finalize_fired"
            to: finalizing
            guard: "placer_has_access AND is_change_finished AND NOT is_session_at_work"
            owned_by: "fire"
          - event: "finalize_fired"
            to: finalizing
            guard: "grant_placer_has_access AND is_change_finished AND NOT is_session_at_work"
            owned_by: "fire"
      finalizing:
        invokes: loop
        transitions:
          - event: "finalize_pr_merged"
            to: finalized
            guard: "all_pr_merged"
      finalized:
        final: true

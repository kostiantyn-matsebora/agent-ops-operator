version: 1

workflows:

  propose:
    subject: issue
    acts_on: station
    states:
      none:
        initial: true
        transitions:
          - event: "proposal:pr_opened"
            to: proposing
            guard: "exists(proposal_pr)"
      proposing:
        invokes: loop
        transitions:
          - event: "proposal:mergeable"
            to: proposed
            guard: "is_mergeable(proposal_pr)"
      proposed:
        transitions:
          - event: "proposal:pr_merged"
            to: ready
            guard: "is_merged(proposal_pr)"
      ready:
        final: true

  # conveyor.implement, EXTENDED: the real, already-shipped version
  # (workflows.yaml) fires `fire:implement` from every real station except
  # `ready` and `archive` -- `ready` did not exist as a real station when it
  # shipped. Here it is added as one more station the same transition fires
  # from, and the workflow gains a real terminal transition it does not have
  # today: the implementing PR actually merging, landing the issue at the
  # real station `merge`. This whole workflow entry is DESIRED, not a
  # redeclaration of the real one -- conveyor.py has no `ready` station and
  # no `merge:implementation` event yet.
  conveyor.implement:
    label: "conveyor:implement"
    subject: issue
    acts_on: station
    states:
      ready:
        initial: true
        transitions:
          - event: "fire:implement"
            to: implement
            guard: "has_access(placer, grant_placer) AND NOT (has_fired(line, 'implement') AND has_open_pr(line))"
            owned_by: "fire()"
      implement:
        transitions:
          - event: "fire:implement"
            to: implement
            guard: "has_access(placer, grant_placer) AND NOT (has_fired(line, 'implement') AND has_open_pr(line))"
            owned_by: "fire()"
          - event: "merge:implementation"
            to: merge
            guard: "is_merged(implementation_pr)"
            owned_by: "carry_implement()"
      merge:
        final: true

# Reference: the decision FUNCTIONS of conveyor.py that READ the conveyor:*
# labels and WRITE the real station_event / loop_event values workflows.yaml
# declares per conveyor. Not cross-checked by validate.py directly -- each
# conveyor's own transitions in workflows.yaml are what is verified, against
# station.yaml / loop.yaml. This file exists only to say WHICH function is
# behind each conveyor's real effect and what facts it reads, since that is
# not otherwise written down anywhere in the YAML.

version: 1

decision_functions:
  fire:
    in: conveyor.py
    reads: [label, line.lane, line.change_finished, line.fired, line.open_pr_from_change, placer, grant_placer]
    emits_actions: [ignore, refuse, skip, fire]
    emits_station_events: ["fire:implement", "fire:archive"]

  carry_fix:
    in: conveyor.py
    reads: [pr.same_repo_change_branch, pr.refs, pr.closes, line.issue_labels, placer]
    emits_actions: [nothing, carry]
    emits_station_events: ["pr:green"]
    emits_loop_events: ["round:start", "ci:green_clean"]
    note: >
      the ONE function that starts a round for conveyor:fix (round:start)
      AND can mark the loop mergeable in the same decision (ci:green_clean)
      when the carried CI run was already green.

  carry_archive:
    in: conveyor.py
    reads: [pr.same_repo_change_branch, pr.refs, pr.closes, line.lane, line.change_finished, line.issue_labels, placer]
    emits_actions: [nothing, done, stalled, restart, carry]
    emits_station_events: ["merge:archive_pr", "merge:plain", "merge:proposal_or_apply", "merge:finished_stalled", "merge:finished_carried"]

  gate:
    in: conveyor.py
    reads: [trigger, pr.fork, pr.state, pr.labels, pr.rounds_used, pr.grants, pr.max_rounds, line.issue_labels, grant_placer]
    emits_actions: [refuse, none, threads, round]
    emits_loop_events: ["round:start", "end:capped"]
    note: >
      the one function BOTH conveyor:fix (a direct label placement) and
      conveyor:keep-going (re-opening a capped loop) go through -- they
      share this function, not two separate ones.

  round_may_start:
    in: conveyor.py
    reads: [ci, review]
    emits_actions: [start, defer]

  guard:
    in: conveyor.py
    reads: [pr.state, pr.labels, running_rounds, unanswered_disputes]
    emits_actions: [allow, refuse]

  ending:
    in: conveyor.py
    reads: [kind, number, cap, thread_open, waiting_on_person]
    emits_actions: [capped, continue, waiting, mergeable, stalled]
    emits_loop_events: ["end:continue", "end:capped", "end:waiting", "end:mergeable", "end:stalled"]

  check_is_work:
    in: conveyor.py
    reads: [job, conclusion, required]
    emits_actions: [skip, work]

  recover:
    in: conveyor.py
    reads: [current, rounds_used, cap, thread_open]
    emits_loop_events: ["recover:waiting", "recover:capped"]

  refresh:
    in: conveyor.py
    reads: [current, thread_open]
    emits_loop_events: ["thread:opened"]

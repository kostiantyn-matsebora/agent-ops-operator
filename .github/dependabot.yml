# Action pinning drift, Go CVEs and a lockfile nothing else updates are the
# maintenance costs the workflows create. Dependabot is the proportionate
# answer to exactly those three.
#
# Docker base images are deliberately EXCLUDED: golang:1.23, node:22-alpine and
# distroless/static already float, and a pull request per Dockerfile across
# thirteen of them would cost more attention than it returns.
#
# The gomod list is the one place in .github/ that names modules. It cannot be
# derived — Dependabot reads this file directly — so a new module adds four
# lines here, and CI keeps covering it either way. The paths are component
# directories, which is also where the image name comes from.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: "/platform/manager"
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: "/channels/telegram"
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: "/platform/console"
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: "/platform/context-sync"
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: "/platform/egress-proxy"
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: "/platform/housekeeping"
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: "/signals/alertmanager"
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: "/signals/cron"
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: "/signals/ha"
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: "/signals/k8s-events"
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: "/signals/telegram"
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: "/gateways/telegram"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/platform/console/ui"
    schedule:
      interval: weekly

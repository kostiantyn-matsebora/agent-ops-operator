# THE REVIEW NOBODY ELSE CAN DO.
#
# Generic bug-and-security review is available from many tools. A reading
# against THIS project's recorded doctrine is available from none of them — and
# several rules in `.claude/rules/` record decisions that were made, reverted and
# re-made again, a class of regression that compiles, passes every test, renders
# every chart, and is visible only to a reader who knows what was decided before.
#
# The action checks the branch out, so CLAUDE.md and every rule file is simply
# there.
#
# TWO JOBS, AND THE SPLIT IS THE POINT. Resolving a review thread requires
# `contents: write` — counter-intuitively, since it changes no file — so a single
# job would hand a step driven by generated output a token that can push here.
# `review` reads and comments; `reconcile` holds the privilege, runs no model,
# and refuses any thread the review did not author.
name: claude-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# One review per pull request. A burst of pushes produces one review of the
# latest state rather than several of stale ones — the same pattern ci.yml uses,
# and it matters more here, where each superseded run costs a model call.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    # WHAT CROSSES TO `reconcile`, BESIDES THE ARTIFACT: whether a list was
    # produced at all. An ABSENT list and an EMPTY one are different facts —
    # "the review asked for nothing" against "the review never got that far" —
    # and the privileged job cannot tell them apart from a missing file.
    outputs:
      list: ${{ steps.list.outputs.produced }}
    # DRAFTS AND FORKS ARE SKIPPED, AND THE TWO ARE DIFFERENT REASONS.
    #
    # A draft is not asking yet. A FORK cannot be reviewed at all: its
    # `GITHUB_TOKEN` is read-only and repository secrets are withheld by design,
    # so the job would fail on a missing credential — and a red check an outside
    # contributor cannot turn green reads as "your change is broken" when nothing
    # about their change is. Skipped is honest; failed is not.
    if: >-
      !github.event.pull_request.draft &&
      !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # THE TWO HYGIENE GUARDS DECIDE WHETHER THIS DIFF IS WORTH READING.
      #
      # `publication` failing means the tree names something that must be
      # REMOVED; `retired-vocabulary` failing means it asserts a name this
      # project stopped using. Either way the diff contains content on its way
      # out, and reviewing it spends a model call on text about to be deleted.
      # They are seconds of Python, so they are re-run here rather than reached
      # for across workflows.
      - id: hygiene
        name: Is this diff worth reading yet
        run: |
          set -uo pipefail
          ok=true
          python3 .github/scripts/publication-guard.py        || ok=false
          python3 .github/scripts/retired-vocabulary-guard.py || ok=false
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          $ok || echo "::notice::review skipped — a hygiene guard failed, so this diff carries content on its way out"

      - if: steps.hygiene.outputs.ok == 'true'
        id: review
        uses: anthropics/claude-code-action@v1
        env:
          RESOLVE_LIST: ${{ github.workspace }}/.resolve-threads
        with:
          # THE GITHUB APP IS NOT A MODEL CREDENTIAL, AND THIS FILE USED TO
          # SAY IT WAS. It claimed that being connected to the Claude GitHub
          # integration made the OIDC exchange sufficient and passed nothing —
          # so the first pull request that actually reached the action died on
          # `Either ANTHROPIC_API_KEY, CLAUDE_CODE_OAUTH_TOKEN, or workload
          # identity federation ... is required`.
          #
          # THE TWO HALVES ARE SEPARATE, and the run log shows both:
          # `Using GITHUB_TOKEN from OIDC` is the APP, authorising this action
          # to read the pull request and comment on it. Nothing in it authorises
          # a call to Anthropic — GitHub cannot grant that.
          #
          # WHY IT LOOKED FINE FOR A WHOLE CHANGE. The action skips itself,
          # successfully, on a pull request that edits this file — so the change
          # that introduced the review never ran it, and the credential gap
          # first appeared on the pull request after it. The always-ran guard
          # below is what turned that silence into a failure.
          #
          # A STATIC CREDENTIAL TAKES PRECEDENCE over workload identity
          # federation, so this input and `anthropic_federation_rule_id` are
          # mutually exclusive: adopting federation means DELETING this line,
          # not setting both.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          #
          # THE PREVIOUS REVIEW REACHES THIS ONE AS CONTEXT. That is what makes
          # the review iterative, and it is why nothing here keeps a record of
          # findings: the pull request already holds them.
          track_progress: true
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE REF: origin/${{ github.base_ref }}

            You are the CONSOLIDATOR of a review that is read PER COMPONENT.
            You do not read the diff yourself: you spawn one `component-reviewer`
            per changed component, all at once, each in a clean context; they
            return data; you judge across components and you alone post. The
            branch is checked out in the working directory.

            STEP 1 — THE QUEUE AND THE THREADS.

              gh pr diff ${{ github.event.pull_request.number }} --name-only
              python3 .github/scripts/review-queue.py <those paths as arguments>

            One entry per component. Then fetch every review thread once:

              gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){
                repository(owner:$o,name:$r){pullRequest(number:$n){
                  reviewThreads(first:100){nodes{id isResolved isOutdated path line
                    comments(first:1){nodes{databaseId author{login} body}}}}}}}' \
                -f o=${{ github.repository_owner }} -f r=${{ github.event.repository.name }} \
                -F n=${{ github.event.pull_request.number }}

            STEP 2 — SPAWN, ALL IN ONE MESSAGE. One `Agent` call per queue
            entry, every call in the SAME message so they run concurrently. Each
            delegation message carries: the repository, the pull request
            number, the base ref above, the entry's `group` and `paths`, EVERY
            thread whose `path` is in those paths — unresolved AND resolved,
            each with id, path, line, `isResolved`, first comment's body and
            author — and, if the branch is `change/<name>`, the paths under
            `openspec/changes/<name>/specs/`. Nothing else. The threads ARE
            the component's previous review: a reviewer that sees only the
            open ones re-raises what a person dismissed last push. Do not read the diff before spawning; that is their
            job, and reading it here is the serial cost this shape removes.

            THE REVIEWERS RUN IN THE BACKGROUND, AND ENDING YOUR TURN ENDS THE
            RUN. `Agent` answers "launched" at once; the result arrives later,
            as a notification between your tool calls. If you answer with prose
            and stop while a reviewer is still running, this process exits, the
            reviewer is abandoned, nothing is posted, and the job still reports
            success — that is exactly what happened on pull request #74: three
            reviewers spawned, "I'll wait for them", turn ended, review lost.
            So until EVERY reviewer has returned: run `sleep 60` through Bash
            and look again. Never end the turn to wait. Never schedule a
            wakeup; there is nothing to wake.

            STEP 3 — CONSOLIDATE. When every reviewer has returned:

            - Parse each return as JSON. A reviewer whose return is not the
              stated JSON is recorded as `unreviewed: <group>` in the summary —
              a visible gap, never a silently dropped component.
            - Dedup findings across reviewers by path + claim.
            - THE REACH. Take the union of every `changedNames`, dropping
              anything that is not code-shaped (a heading, a label, a word).
              For each name,
              `git grep -l -F -e '<name>'` across the repository, excluding the
              changed paths themselves. Read every file the grep names and ask
              one question: does it still hold against what changed? A
              consumer still speaking a removed or renamed name is a finding
              against THAT file. This is the reading nothing else in this
              repository performs: modules import nothing from one another,
              so a contract change compiles everywhere and breaks at runtime
              in a component the diff never names.
            - THE FIRST FINDING, if the diff touches `.claude/rules/`,
              `.claude/agents/` or `.github/workflows/claude-review.yml`: say
              so, naming the file — those are the things a branch can change
              that alter how it is read. Raise it even when the edit is right.

            STEP 4 — POST. The rules below on repetition, threads, and shape.

            HOW TO REPORT — and the rules about repetition are the important part:

            - Use `mcp__github_inline_comment__create_inline_comment` (with
              `confirmed: true`) for each finding, on its lines.
            - Use `gh pr comment` for the summary. ONE summary.
            - **A FINDING YOU ALREADY MADE THAT STILL STANDS: SAY NOTHING.** A
              reviewer's verdict `standing` means its thread is left exactly as
              it is. Posting it again buries what is new under what is handled,
              which is the one failure that makes a review worth ignoring.
            - **`fixed` or `gone`**: reply in its thread saying so, then record
              the thread for resolution:

                  gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments/<commentId>/replies \
                    -f body='Fixed in <sha>.'

                  .github/scripts/mark-thread-resolved.sh <threadId>

            - **`detached`**: the reviewer re-raised the finding at its current
              location; post that as a new comment, reply in the old thread
              that it is superseded, and record the old thread. GitHub detaches
              a comment when its anchor line changes, so a reformat detaches a
              live finding — detachment is not a fix.
            - **NEVER record a thread you did not author.** A second job checks
              this and refuses, but do not rely on that: resolving a person's
              review comment hides their objection and reports it as handled.
            - **A thread a PERSON resolved is settled.** Do not raise it again.
              Count it in the summary as dismissed, so the gap stays visible.

            HOW TO WRITE — `.claude/rules/authoring.md` binds the review as it
            binds every rule file. A finding is read in a thread beside a diff,
            by somebody deciding whether to type `fix it`; a wall of prose is
            what gets skimmed and ignored.

            AN INLINE FINDING IS FOUR LABELED LINES, no sentence outside them
            — the reviewer returns these fields and you forward them, never
            rewriting into prose:

                **Claim:** <≤ 15 words, ONE clause — the thing a maintainer answers `fix it` to>
                **Where:** <`path:line`, `path:line` — paths only, no sentence>
                **Rule:** <`file` › heading — NOTHING after the heading; omit the line when none>
                **Fix:** <≤ 12 words — omit the line when it is not obvious>

            - BEFORE POSTING, COUNT. A claim carrying `so`, `because`, `which`
              or `and` is a consequence chain: cut it at that word — the
              consequence is what `Where` and `Rule` already say. Over 15 words
              after that, it is two findings. A `Rule` with a quote or a
              sentence after the heading is cut at the heading.
            - A `Where` with a verb in it is prose. Nothing explains, quotes,
              or restates the diff — the reader has the diff, the rule and the
              file open.
            - One finding per comment.

            THE SUMMARY is one comment, in this shape and no other:

                ### Review
                N new · N carried over · N resolved · N dismissed
                reach: <name> → N consumer(s) checked · … | none outside the change

                | # | Where | Finding |
                |---|---|---|
                | 1 | `path:line` | the claim, one sentence, linking its thread |

            - The table lists NEW findings only. A carried-over or resolved
              finding is already visible in its thread and is not restated.
            - NOTHING NEW: the count line, the reach line, then THIS table and
              nothing else — one cell per reading, a cell is a verdict of at
              most four words:

                  | Read against | Verdict |
                  |---|---|
                  | invariants and retired terms | clean |
                  | the change's own specs | matches |
                  | correctness | clean |
                  | documentation | updated in the change |
                  | reach | N consumers hold |

            - An unreviewed component is one more row: `| unreviewed | <group> |`.
            - THE WHOLE COMMENT IS AT MOST TWELVE LINES. Over that, it is
              wrong, whatever it says.
            - NEVER list what you read, how many lines matched, or what you
              checked and found fine. The reader asked what you FOUND; the
              method is in this prompt.
            - No preamble, no "Otherwise:" paragraph, no closing remarks, no
              sentence outside a table cell.

            Post GitHub comments only. Do not return the review as a message.
          # THE REVIEWER IS DEFINED HERE, INLINE, AND NOT IN `.claude/agents/`.
          #
          # The action refuses to run this file when a pull request's copy
          # differs from the default branch's — that is the guard against a
          # pull request rewriting the review that judges it. A reviewer
          # defined in a checked-in `.claude/agents/*.md` would sit on the
          # branch's side of that guard: the branch under review could weaken
          # the thing reading it. `--agents` defines it for this session only,
          # from this file, so it inherits the guard. The consolidator raises
          # any edit to `.claude/rules/` or `.claude/agents/` as its first
          # finding for the same reason.
          #
          # WHAT A REVIEWER'S CONTEXT HOLDS was measured, not assumed (the
          # change's design.md): every UNSCOPED rule file arrives unasked, the
          # three `paths:`-scoped ones load on reading a matching file, and the
          # tools are exactly the list below — no posting tool, no
          # `mark-thread-resolved.sh`. Reviewers return JSON; the consolidator
          # is the only writer.
          #
          # THE DEFINITION HOLDS NO APOSTROPHE. `claude_args` is split like a
          # shell line and the JSON sits inside single quotes, so a possessive
          # in the reviewer prompt ends the argument early. Phrase around it.
          # THE RULES A REVIEW READS ARE CHOSEN BY GLOB, NOT INHERITED WHOLE.
          #
          # Every context this run opens — the consolidator and each reviewer —
          # loads CLAUDE.md and every unscoped rule file before reading a byte
          # of the diff: ~27k words, ~40k tokens, re-sent on every turn. Six of
          # those files govern a DEVELOPER session and nothing a reviewer does:
          # how to build in a container, how to publish, how a change reaches
          # master, window naming, screenshotting, chat-answer format. Together
          # a fifth of the load.
          #
          # `claudeMdExcludes` drops them for this session by glob. MEASURED,
          # not assumed: a relative path matches nothing; `**/` globs and
          # absolute paths do, and CLAUDE.md itself stays. There is no per-agent
          # opt-out (the docs say so), which is why it is session-wide here —
          # the consolidator needs none of the six either. Passed as
          # `--settings` inline so the choice lives in this guarded file.
          #
          # What stays is the review: invariants, terminology, wiring,
          # retired-vocabulary, adapters, structure, authoring, documentation,
          # gotchas — plus the three `paths:`-scoped rules a reviewer loads on
          # reading a matching file.
          claude_args: |
            --settings '{"claudeMdExcludes":["**/.claude/rules/build-test.md","**/.claude/rules/worktree-delivery.md","**/.claude/rules/session-naming.md","**/.claude/rules/publication.md","**/.claude/rules/visual-check.md","**/.claude/rules/answering.md"]}'
            --allowedTools "Agent(component-reviewer),mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(sleep:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(git grep:*),Bash(python3 .github/scripts/review-queue.py:*),Bash(.github/scripts/mark-thread-resolved.sh:*),Read,Grep,Glob"
            --agents '{"component-reviewer":{"description":"Reads one changed component of a pull request in a clean context and returns findings, changed names and thread verdicts as JSON. Posts nothing.","tools":["Read","Grep","Glob","Bash(git diff:*)","Bash(git log:*)","Bash(git show:*)"],"model":"inherit","maxTurns":40,"prompt":"You are a COMPONENT REVIEWER for the agent-ops-operator repository: one clean context reading ONE component of a pull request, in parallel with others. You post nothing. You return data to the consolidator, who judges and writes.\n\nYOUR DELEGATION MESSAGE names: the repository, the pull request number, the base ref, your component (`group`), its changed `paths`, EVERY review thread on those paths — the previous review of this component, each marked resolved or not, with id, path, line, author and the text of the finding — and the delta spec files of the change if there are any. Everything you read is confined to that. You hold nothing from the main thread, by construction; the threads are your memory.\n\nREAD, IN THIS ORDER:\n1. The diff of your paths only, WITH RENAME DETECTION: `git diff -M --stat <base>...HEAD -- <paths>` first, then `git diff -M <base>...HEAD -- <paths>`. A file that moved unchanged (an archive, a directory rename) is a rename line, not a diff to read; read the hunks of files that actually changed.\n2. The rules that apply. The unscoped rules are already in your context; a rule scoped to your path (chart.md, signal-rules.md, palette-and-mark.md) loads when you read a matching file, so read the changed files themselves.\n3. The delta specs named, if any.\n\nLOOK FOR, in this order — and only within your component:\n1. A contradiction of a recorded invariant or a retired term, naming the rule file and heading.\n2. A discrepancy with the specs of the change.\n3. Correctness: bugs, races, error paths.\n4. Documentation the diff made untrue and did not fix, naming the document.\n\nA RESOLVED thread is history, not work: one the review closed was fixed, one a person closed was dismissed — never raise either again, and report no verdict for it. Then re-check EACH UNRESOLVED thread you were handed against the current code: `fixed` (the problem is gone), `standing` (still holds), `gone` (the code it concerned no longer exists), `detached` (its anchor moved but the problem still holds — report where it is now as a new finding with the same claim).\n\nRETURN ONLY THIS JSON, nothing before or after it:\n{\"component\": \"<group>\",\n \"findings\": [{\"path\": \"...\", \"line\": <int>,\n               \"claim\": \"<AT MOST 15 WORDS, ONE CLAUSE — no so/because/which/and: the thing a maintainer answers `fix it` to>\",\n               \"where\": [\"<path:line>\", \"...\"],\n               \"rule\": \"<`file` › heading — NOTHING after the heading; or a spec path; or empty>\",\n               \"fix\": \"<AT MOST 12 WORDS, or empty when the fix is not obvious>\"}],\n \"changedNames\": [\"<CODE-SHAPED names only — an identifier, JSON field, env var, CR field, HTTP path, chart value or file name — that the diff ADDED, REMOVED or RENAMED, exact spelling, old and new. AT MOST 20. Never a heading, a label, a word from prose, or a name that merely appears in the diff unchanged>\"],\n \"threads\": [{\"id\": \"<thread id>\", \"verdict\": \"fixed|standing|gone|detached\"}]}\n\nRULES OF THE RETURN:\n- The four finding fields ARE the comment; the consolidator forwards them as four labeled lines and writes no prose. A claim is one clause; the consequence goes in `where` and `rule`, never after a `so`. Over 15 words it is two findings or a wrong one. A `rule` is a file and a heading, never a quoted sentence. `where` holds paths and lines only, never a sentence. Nothing explains, quotes a rule, or restates the diff.\n- One finding per problem.\n- `changedNames` is literal and code-shaped. The consolidator greps consumers of every entry across the whole repository — a name you omit is a consumer nobody checks, and a prose word you include costs a read of every file that uses the word.\n- No prose outside the JSON. No file outside your paths, except to read a scoped rule or a delta spec."}}'

      # THE EXECUTION FILE IS THE ONLY PER-TOOL TIMING THERE IS. The job log
      # shows the model step as one black box of minutes; this file records
      # every turn and tool call with timestamps. Kept a day so a slow review
      # can be read for WHERE the time went rather than argued about.
      - if: always() && steps.review.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: review-execution
          path: ${{ steps.review.outputs.execution_file }}
          retention-days: 1
          if-no-files-found: ignore

      # A REVIEW THAT DID NOTHING MUST NOT REPORT GREEN.
      #
      # The action SKIPS ITSELF, successfully, when this workflow file differs
      # from the copy on the default branch — a deliberate guard against a pull
      # request rewriting the review that judges it. The STEP still reports
      # success, so `outcome` cannot tell the two apart; what can is
      # `execution_file`, which is only set once Claude has actually run.
      #
      # On the pull request that introduces or edits this file the skip is
      # correct and unavoidable, so it stays green and says so. Everywhere else
      # a check that passes while nothing was read is the worst outcome
      # available, and is exactly the silent-no-review failure this capability
      # exists to prevent.
      - if: always() && steps.hygiene.outputs.ok == 'true'
        name: The review actually ran
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          CONCLUSION: ${{ steps.review.outputs.conclusion }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -n "$EXECUTION_FILE" ]; then
            # RAN IS NOT FINISHED. A run that spawns its reviewers and ends its
            # turn leaves an execution file, a green step and no review — #74.
            # The one thing every finished review posts is the summary, and
            # its verdict table has a fixed header. Require it.
            summaries=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
              --jq '[.[] | select(.body | contains("| Read against | Verdict |"))] | length')
            if [ "${summaries:-0}" -lt 1 ]; then
              echo "::error::The review ran (conclusion: ${CONCLUSION:-unreported}) but posted no summary — it stopped before consolidating, most likely by ending its turn while reviewers were still running. Read the execution artifact."
              exit 1
            fi
            echo "the review ran and posted its summary (conclusion: ${CONCLUSION:-unreported})"
            exit 0
          fi
          if ! git diff --quiet "origin/${{ github.base_ref }}" -- .github/workflows/claude-review.yml; then
            echo "::notice::This pull request edits .github/workflows/claude-review.yml, so the action refuses to run it — a pull request may not rewrite the review that judges it. The review begins working once this is merged."
            exit 0
          fi
          echo "::error::The review reported success without running: no execution file, and this workflow file matches the base branch. A check that passes while nothing was read is worse than one that fails."
          exit 1

      # The list of thread ids is the ONLY thing crossing into the privileged
      # job. Uploaded even when empty, so `reconcile` can tell "nothing to do"
      # from "the review never got that far".
      #
      # `include-hidden-files` IS WHAT MAKES THAT TRUE, AND WITHOUT IT THE WHOLE
      # MECHANISM WAS A NO-OP. `.resolve-threads` is a DOTFILE, and
      # `upload-artifact` v4 excludes hidden files by default — so the file was
      # created correctly, matched nothing, and `if-no-files-found: ignore`
      # reported that in one line nobody reads. `reconcile` then downloaded
      # nothing, found no list, and printed "the review asked for no threads",
      # which is the message for the HEALTHY case. A review that had resolved a
      # thread would have failed to, silently.
      - id: list
        if: always() && steps.hygiene.outputs.ok == 'true'
        run: |
          touch "${{ github.workspace }}/.resolve-threads"
          echo "produced=true" >> "$GITHUB_OUTPUT"
      - if: always() && steps.hygiene.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resolve-threads
          path: .resolve-threads
          retention-days: 1
          include-hidden-files: true
          # NOT `ignore`. The file is created one step above, so no match means
          # the upload is broken rather than that there was nothing to say —
          # exactly the case that hid this bug.
          if-no-files-found: error

  # THE PRIVILEGE LIVES HERE, AND NO MODEL DOES.
  #
  # `contents: write` is what `resolveReviewThread` requires. This job runs one
  # program over a list of ids, and that program re-reads every thread from
  # GitHub and refuses any the review did not author.
  reconcile:
    needs: review
    if: needs.review.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: resolve-threads
        continue-on-error: true

      # A MISSING LIST IS A BROKEN PIPE, NOT AN EMPTY ONE — unless the review
      # never produced one, which `needs.review.outputs.list` is what says. The
      # resolver reads an absent file as "nothing to resolve", so without this
      # step a severed transfer reports the same sentence as a clean review.
      - name: The review's list actually arrived
        if: needs.review.outputs.list == 'true'
        run: |
          [ -f .resolve-threads ] && exit 0
          echo "::error::The review produced a resolve list and it did not reach this job. \
          Nothing was resolved, and the resolver would have called that 'no threads'."
          exit 1

      - name: Resolve the threads the review addressed
        if: needs.review.outputs.list == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/resolve-review-threads.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --file .resolve-threads

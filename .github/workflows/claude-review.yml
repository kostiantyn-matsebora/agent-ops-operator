# THE REVIEW NOBODY ELSE CAN DO.
#
# Generic bug-and-security review is available from many tools. A reading
# against THIS project's recorded doctrine is available from none of them — and
# several rules in `.claude/rules/` record decisions that were made, reverted and
# re-made again, a class of regression that compiles, passes every test, renders
# every chart, and is visible only to a reader who knows what was decided before.
#
# The action checks the branch out, so CLAUDE.md and every rule file is simply
# there.
#
# TWO JOBS, AND THE SPLIT IS THE POINT. Resolving a review thread requires
# `contents: write` — counter-intuitively, since it changes no file — so a single
# job would hand a step driven by generated output a token that can push here.
# `review` reads and comments; `reconcile` holds the privilege, runs no model,
# and refuses any thread the review did not author.
name: claude-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# One review per pull request. A burst of pushes produces one review of the
# latest state rather than several of stale ones — the same pattern ci.yml uses,
# and it matters more here, where each superseded run costs a model call.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    # WHAT CROSSES TO `reconcile`, BESIDES THE ARTIFACT: whether a list was
    # produced at all. An ABSENT list and an EMPTY one are different facts —
    # "the review asked for nothing" against "the review never got that far" —
    # and the privileged job cannot tell them apart from a missing file.
    outputs:
      list: ${{ steps.list.outputs.produced }}
    # DRAFTS AND FORKS ARE SKIPPED, AND THE TWO ARE DIFFERENT REASONS.
    #
    # A draft is not asking yet. A FORK cannot be reviewed at all: its
    # `GITHUB_TOKEN` is read-only and repository secrets are withheld by design,
    # so the job would fail on a missing credential — and a red check an outside
    # contributor cannot turn green reads as "your change is broken" when nothing
    # about their change is. Skipped is honest; failed is not.
    if: >-
      !github.event.pull_request.draft &&
      !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # THE TWO HYGIENE GUARDS DECIDE WHETHER THIS DIFF IS WORTH READING.
      #
      # `publication` failing means the tree names something that must be
      # REMOVED; `retired-vocabulary` failing means it asserts a name this
      # project stopped using. Either way the diff contains content on its way
      # out, and reviewing it spends a model call on text about to be deleted.
      # They are seconds of Python, so they are re-run here rather than reached
      # for across workflows.
      - id: hygiene
        name: Is this diff worth reading yet
        run: |
          set -uo pipefail
          ok=true
          python3 .github/scripts/publication-guard.py        || ok=false
          python3 .github/scripts/retired-vocabulary-guard.py || ok=false
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          $ok || echo "::notice::review skipped — a hygiene guard failed, so this diff carries content on its way out"

      - if: steps.hygiene.outputs.ok == 'true'
        id: review
        uses: anthropics/claude-code-action@v1
        env:
          RESOLVE_LIST: ${{ github.workspace }}/.resolve-threads
        with:
          # THE GITHUB APP IS NOT A MODEL CREDENTIAL, AND THIS FILE USED TO
          # SAY IT WAS. It claimed that being connected to the Claude GitHub
          # integration made the OIDC exchange sufficient and passed nothing —
          # so the first pull request that actually reached the action died on
          # `Either ANTHROPIC_API_KEY, CLAUDE_CODE_OAUTH_TOKEN, or workload
          # identity federation ... is required`.
          #
          # THE TWO HALVES ARE SEPARATE, and the run log shows both:
          # `Using GITHUB_TOKEN from OIDC` is the APP, authorising this action
          # to read the pull request and comment on it. Nothing in it authorises
          # a call to Anthropic — GitHub cannot grant that.
          #
          # WHY IT LOOKED FINE FOR A WHOLE CHANGE. The action skips itself,
          # successfully, on a pull request that edits this file — so the change
          # that introduced the review never ran it, and the credential gap
          # first appeared on the pull request after it. The always-ran guard
          # below is what turned that silence into a failure.
          #
          # A STATIC CREDENTIAL TAKES PRECEDENCE over workload identity
          # federation, so this input and `anthropic_federation_rule_id` are
          # mutually exclusive: adopting federation means DELETING this line,
          # not setting both.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          #
          # THE PREVIOUS REVIEW REACHES THIS ONE AS CONTEXT. That is what makes
          # the review iterative, and it is why nothing here keeps a record of
          # findings: the pull request already holds them.
          track_progress: true
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request against the project it belongs to,
            not against generic best practice. The branch is checked out in the
            working directory. READ THESE FIRST — they are the review:

              - CLAUDE.md
              - .claude/rules/invariants.md, terminology.md, wiring.md,
                gotchas.md, structure.md, documentation.md, authoring.md
              - the change's own delta specs, if the branch is `change/<name>`:
                openspec/changes/<name>/specs/**/spec.md

            WHAT TO LOOK FOR, in this order:

            1. **Does the diff contradict a recorded invariant or a retired
               term?** This is the reading nothing else performs. Several rules
               here say a thing was decided, reverted, and decided again — if
               the diff reintroduces one, name the rule and the file it is in.
            2. **Does the diff match the change's own specs?** A change that
               implements something other than what it specified is a
               discrepancy worth raising even when the code is fine.
            3. **Correctness** — the ordinary reading. Bugs, races, error paths.
            4. **Documentation** — this project treats it as part of the change,
               never a follow-up. If the diff makes a document untrue and does
               not fix it, say which document.

            HOW TO REPORT — and the rules about repetition are the important part:

            - Use `mcp__github_inline_comment__create_inline_comment` (with
              `confirmed: true`) for a finding about specific lines.
            - Use `gh pr comment` for the summary. ONE summary.
            - **A FINDING YOU ALREADY MADE THAT STILL STANDS: SAY NOTHING.** Its
              comment is already on this pull request and you can see it. Posting
              it again buries what is new under what is handled, which is the one
              failure that makes a review worth ignoring.
            - **A finding that has been FIXED**: reply in its thread saying so,
              then record the thread for resolution:

                  gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){
                    repository(owner:$o,name:$r){pullRequest(number:$n){
                      reviewThreads(first:100){nodes{id isResolved isOutdated path
                        comments(first:1){nodes{databaseId author{login} body}}}}}}}' \
                    -f o=${{ github.repository_owner }} -f r=${{ github.event.repository.name }} \
                    -F n=${{ github.event.pull_request.number }}

                  gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments/<commentId>/replies \
                    -f body='Fixed in <sha>.'

                  .github/scripts/mark-thread-resolved.sh <threadId>

            - **A finding whose code is GONE**: same, replying that it no longer
              applies.
            - **NEVER record a thread you did not author.** A second job checks
              this and refuses, but do not rely on that: resolving a person's
              review comment hides their objection and reports it as handled.
            - **An OUTDATED thread is not a fixed one.** GitHub detaches a
              comment when its anchor line changes, so a reformat detaches a live
              finding and a fix elsewhere leaves a dead one attached. Re-check
              it. If it still holds, raise it again at its current location and
              record the old thread as superseded.
            - **A thread a PERSON resolved is settled.** Do not raise it again.
              Count it in the summary as dismissed, so the gap stays visible
              rather than reading as though everything raised was dealt with.

            HOW TO WRITE — `.claude/rules/authoring.md` binds the review as it
            binds every rule file. A finding is read in a thread beside a diff,
            by somebody deciding whether to type `fix it`; a wall of prose is
            what gets skimmed and ignored.

            AN INLINE FINDING is at most SIX lines, in this shape and no other:

                **<the claim, one sentence>**
                <what breaks, or which rule/spec it contradicts, ≤ 2 sentences, naming the file>
                Fix: <one line, only where the fix is obvious>

            - The claim is a sentence a maintainer could reply `fix it` to. Not
              a heading, not a category.
            - Never restate the diff, the surrounding code or the rule's whole
              argument — the reader has both open. Name the rule by file and
              heading; do not quote it.
            - One finding per comment. Two problems on one line are two
              comments.

            THE SUMMARY is one comment, in this shape and no other:

                ### Review
                N new · N carried over · N resolved · N dismissed

                | # | Where | Finding |
                |---|---|---|
                | 1 | `path:line` | the claim, one sentence, linking its thread |

            - The table lists NEW findings only. A carried-over or resolved
              finding is already visible in its thread and is not restated.
            - No table when nothing is new: the count line, then one line
              saying what was read and found clean.
            - No preamble, no "Otherwise:" paragraph, no closing remarks. A
              summary that explains what the review did instead of what it
              found is the wall of text this shape exists to prevent.

            Post GitHub comments only. Do not return the review as a message.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(.github/scripts/mark-thread-resolved.sh:*),Read,Grep,Glob"

      # A REVIEW THAT DID NOTHING MUST NOT REPORT GREEN.
      #
      # The action SKIPS ITSELF, successfully, when this workflow file differs
      # from the copy on the default branch — a deliberate guard against a pull
      # request rewriting the review that judges it. The STEP still reports
      # success, so `outcome` cannot tell the two apart; what can is
      # `execution_file`, which is only set once Claude has actually run.
      #
      # On the pull request that introduces or edits this file the skip is
      # correct and unavoidable, so it stays green and says so. Everywhere else
      # a check that passes while nothing was read is the worst outcome
      # available, and is exactly the silent-no-review failure this capability
      # exists to prevent.
      - if: always() && steps.hygiene.outputs.ok == 'true'
        name: The review actually ran
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          CONCLUSION: ${{ steps.review.outputs.conclusion }}
        run: |
          set -euo pipefail
          if [ -n "$EXECUTION_FILE" ]; then
            echo "the review ran (conclusion: ${CONCLUSION:-unreported})"
            exit 0
          fi
          if ! git diff --quiet "origin/${{ github.base_ref }}" -- .github/workflows/claude-review.yml; then
            echo "::notice::This pull request edits .github/workflows/claude-review.yml, so the action refuses to run it — a pull request may not rewrite the review that judges it. The review begins working once this is merged."
            exit 0
          fi
          echo "::error::The review reported success without running: no execution file, and this workflow file matches the base branch. A check that passes while nothing was read is worse than one that fails."
          exit 1

      # The list of thread ids is the ONLY thing crossing into the privileged
      # job. Uploaded even when empty, so `reconcile` can tell "nothing to do"
      # from "the review never got that far".
      #
      # `include-hidden-files` IS WHAT MAKES THAT TRUE, AND WITHOUT IT THE WHOLE
      # MECHANISM WAS A NO-OP. `.resolve-threads` is a DOTFILE, and
      # `upload-artifact` v4 excludes hidden files by default — so the file was
      # created correctly, matched nothing, and `if-no-files-found: ignore`
      # reported that in one line nobody reads. `reconcile` then downloaded
      # nothing, found no list, and printed "the review asked for no threads",
      # which is the message for the HEALTHY case. A review that had resolved a
      # thread would have failed to, silently.
      - id: list
        if: always() && steps.hygiene.outputs.ok == 'true'
        run: |
          touch "${{ github.workspace }}/.resolve-threads"
          echo "produced=true" >> "$GITHUB_OUTPUT"
      - if: always() && steps.hygiene.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resolve-threads
          path: .resolve-threads
          retention-days: 1
          include-hidden-files: true
          # NOT `ignore`. The file is created one step above, so no match means
          # the upload is broken rather than that there was nothing to say —
          # exactly the case that hid this bug.
          if-no-files-found: error

  # THE PRIVILEGE LIVES HERE, AND NO MODEL DOES.
  #
  # `contents: write` is what `resolveReviewThread` requires. This job runs one
  # program over a list of ids, and that program re-reads every thread from
  # GitHub and refuses any the review did not author.
  reconcile:
    needs: review
    if: needs.review.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: resolve-threads
        continue-on-error: true

      # A MISSING LIST IS A BROKEN PIPE, NOT AN EMPTY ONE — unless the review
      # never produced one, which `needs.review.outputs.list` is what says. The
      # resolver reads an absent file as "nothing to resolve", so without this
      # step a severed transfer reports the same sentence as a clean review.
      - name: The review's list actually arrived
        if: needs.review.outputs.list == 'true'
        run: |
          [ -f .resolve-threads ] && exit 0
          echo "::error::The review produced a resolve list and it did not reach this job. \
          Nothing was resolved, and the resolver would have called that 'no threads'."
          exit 1

      - name: Resolve the threads the review addressed
        if: needs.review.outputs.list == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/resolve-review-threads.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --file .resolve-threads

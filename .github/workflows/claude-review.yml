# THE REVIEW NOBODY ELSE CAN DO.
#
# Generic bug-and-security review is available from many tools. A reading
# against THIS project's recorded doctrine is available from none of them — and
# several rules in `.claude/rules/` record decisions that were made, reverted and
# re-made again, a class of regression that compiles, passes every test, renders
# every chart, and is visible only to a reader who knows what was decided before.
#
# The action checks the branch out, so CLAUDE.md and every rule file is simply
# there.
#
# TWO JOBS, AND THE SPLIT IS THE POINT. Resolving a review thread requires
# `contents: write` — counter-intuitively, since it changes no file — so a single
# job would hand a step driven by generated output a token that can push here.
# `review` reads and comments; `reconcile` holds the privilege, runs no model,
# and refuses any thread the review did not author.
name: claude-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# One review per pull request. A burst of pushes produces one review of the
# latest state rather than several of stale ones — the same pattern ci.yml uses,
# and it matters more here, where each superseded run costs a model call.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    # WHAT CROSSES TO `reconcile`, BESIDES THE ARTIFACT: whether a list was
    # produced at all. An ABSENT list and an EMPTY one are different facts —
    # "the review asked for nothing" against "the review never got that far" —
    # and the privileged job cannot tell them apart from a missing file.
    outputs:
      list: ${{ steps.list.outputs.produced }}
    # DRAFTS AND FORKS ARE SKIPPED, AND THE TWO ARE DIFFERENT REASONS.
    #
    # A draft is not asking yet. A FORK cannot be reviewed at all: its
    # `GITHUB_TOKEN` is read-only and repository secrets are withheld by design,
    # so the job would fail on a missing credential — and a red check an outside
    # contributor cannot turn green reads as "your change is broken" when nothing
    # about their change is. Skipped is honest; failed is not.
    #
    # A DEPENDABOT PULL REQUEST IS THE THIRD, for both of the fork's reasons at
    # once: its secrets come from Dependabot's own store, which holds no
    # `CLAUDE_CODE_OAUTH_TOKEN`, and the action refuses a bot actor outright
    # ("Workflow initiated by non-human actor"). Thirteen of them opened on
    # 2026-08-27 and every one got a red review for a diff nobody wrote.
    if: >-
      !github.event.pull_request.draft &&
      !github.event.pull_request.head.repo.fork &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # THE TWO HYGIENE GUARDS DECIDE WHETHER THIS DIFF IS WORTH READING.
      #
      # `publication` failing means the tree names something that must be
      # REMOVED; `retired-vocabulary` failing means it asserts a name this
      # project stopped using. Either way the diff contains content on its way
      # out, and reviewing it spends a model call on text about to be deleted.
      # They are seconds of Python, so they are re-run here rather than reached
      # for across workflows.
      - id: hygiene
        name: Is this diff worth reading yet
        run: |
          set -uo pipefail
          ok=true
          python3 .github/scripts/publication-guard.py        || ok=false
          python3 .github/scripts/retired-vocabulary-guard.py || ok=false
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          $ok || echo "::notice::review skipped — a hygiene guard failed, so this diff carries content on its way out"

      # THE REVIEW'S ROLES AND SCRIPT COME FROM THE BASE BRANCH, NEVER FROM THE
      # PULL REQUEST. The reviewer used to be defined inline in this file so the
      # action's own guard covered it — the action refuses to run this file when
      # a pull request's copy differs from the default branch's. The roles are
      # files now (`.claude/agents/`, `.claude/workflows/`), and the guard is
      # kept by restoring the base branch's copies here: a pull request that
      # edits any of them is reviewed by the unedited review, and its edit lands
      # with the merge. The notice says which, so the reviewer of that pull
      # request knows the review it got was not the one in the diff.
      - if: steps.hygiene.outputs.ok == 'true'
        name: The review's roles and script are the base branch's
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          restored=""
          for f in .claude/workflows/review-pr.js .claude/agents/component-reviewer.md .claude/agents/review-coordinator.md; do
            # A file the base does not have yet cannot be restored from it — the
            # pull request that introduces the review's files is the one case —
            # and the head's copy stands, which the action's own guard on this
            # workflow file already covers for that pull request.
            git cat-file -e "$base:$f" 2>/dev/null || continue
            if ! git diff --quiet "$base" -- "$f"; then restored="$restored $f"; fi
            git checkout "$base" -- "$f"
          done
          if [ -n "$restored" ]; then
            echo "::notice::This pull request edits the review's own roles or script ($restored ); it is reviewed by the base branch's copies, and the edit takes effect once merged."
          fi

      # THE CLI ITSELF, NOT `claude-code-action`. The review is a saved dynamic
      # workflow, and the `Workflow` tool launches it in the BACKGROUND: the
      # model's first turn ends in seconds, the runtime carries the run, and the
      # model gets a second turn with the result when it completes. The CLI
      # stays alive for that. The action does not: on #94 it exited nine
      # seconds after the first turn, the run never started, and the job read
      # "success". Measured both ways — locally with the CLI (3 min, ten agents,
      # a second result), in CI with the action (43 s, two turns, nothing).
      #
      # What the action supplied is supplied here: the credential as env, the
      # execution file as the stream-json stdout, the conclusion from its last
      # `result` event. The inline-comment MCP tool it carried is replaced by
      # `gh api` in the coordinator's role file.
      - if: steps.hygiene.outputs.ok == 'true'
        id: review
        name: Run the review workflow
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVE_LIST: ${{ github.workspace }}/.resolve-threads
          # THE PLAN IS A SCRIPT, NOT THIS PROMPT. `.claude/workflows/review-pr.js`
          # builds the queue, runs one `component-reviewer` per component
          # concurrently, and hands every reading to the `review-coordinator`,
          # which alone posts. This prompt only starts it.
          PROMPT: |
            Run the saved workflow `review-pr` with these args and nothing else:
            {"repo": "${{ github.repository }}", "number": ${{ github.event.pull_request.number }}, "base": "origin/${{ github.base_ref }}"}
            Do not read the diff and do not review anything yourself. Do not post:
            the workflow's coordinator posts. When it returns, reply with its
            result JSON verbatim.
          # THE RULES A REVIEW READS ARE CHOSEN BY GLOB, NOT INHERITED WHOLE:
          # `claudeMdExcludes` drops the six developer-session rule files for
          # this session. MEASURED: a relative path matches nothing; `**/` globs
          # do, and CLAUDE.md itself stays. Session-wide, because there is no
          # per-agent opt-out and the coordinator needs none of the six either.
          CLAUDE_ARGS: |
            --settings '{"claudeMdExcludes":["**/.claude/rules/build-test.md","**/.claude/rules/worktree-delivery.md","**/.claude/rules/session-naming.md","**/.claude/rules/publication.md","**/.claude/rules/visual-check.md","**/.claude/rules/answering.md"]}'
            --allowedTools "Workflow,Agent(component-reviewer),Agent(review-coordinator),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(git grep:*),Bash(git ls-files:*),Bash(python3 .github/scripts/review-queue.py:*),Bash(.github/scripts/mark-thread-resolved.sh:*),Read,Grep,Glob"
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code >/dev/null
          claude --version
          out="$RUNNER_TEMP/review-execution.jsonl"
          eval "set -- $CLAUDE_ARGS"
          conclusion=success
          claude -p "$PROMPT" --output-format stream-json --verbose "$@" > "$out" || conclusion=failure
          echo "execution_file=$out" >> "$GITHUB_OUTPUT"
          # the LAST result event is the run's: the first is the launch, the
          # second arrives when the workflow completes
          last=$(grep '"type":"result"' "$out" | tail -1 || true)
          [ -n "$last" ] || conclusion=failure
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "$(grep -c '"type":"result"' "$out" || true) result event(s); conclusion=$conclusion"

      - if: always() && steps.review.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: review-execution
          path: ${{ steps.review.outputs.execution_file }}
          retention-days: 1
          if-no-files-found: ignore

      # A REVIEW THAT DID NOTHING MUST NOT REPORT GREEN.
      #
      # The action SKIPS ITSELF, successfully, when this workflow file differs
      # from the copy on the default branch — a deliberate guard against a pull
      # request rewriting the review that judges it. The STEP still reports
      # success, so `outcome` cannot tell the two apart; what can is
      # `execution_file`, which is only set once Claude has actually run.
      #
      # On the pull request that introduces or edits this file the skip is
      # correct and unavoidable, so it stays green and says so. Everywhere else
      # a check that passes while nothing was read is the worst outcome
      # available, and is exactly the silent-no-review failure this capability
      # exists to prevent.
      - if: always() && steps.hygiene.outputs.ok == 'true'
        name: The review actually ran
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          CONCLUSION: ${{ steps.review.outputs.conclusion }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -n "$EXECUTION_FILE" ]; then
            # RAN IS NOT FINISHED. A run that spawns its reviewers and ends its
            # turn leaves an execution file, a green step and no review — #74.
            # The one thing every finished review posts is the summary. Its
            # COUNT LINE is on both shapes — "N new · M carried over · …"
            # under a "### Review" heading; the verdict table is only on a
            # clean one, and requiring it failed the first real review (#77,
            # six findings, no table) for the wrong reason.
            summaries=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
              --jq '[.[] | select((.body | startswith("### Review")) and (.body | test(" new · ")))] | length')
            if [ "${summaries:-0}" -lt 1 ]; then
              echo "::error::The review ran (conclusion: ${CONCLUSION:-unreported}) but posted no summary — it stopped before consolidating, most likely by ending its turn while reviewers were still running. Read the execution artifact."
              exit 1
            fi
            echo "the review ran and posted its summary (conclusion: ${CONCLUSION:-unreported})"
            exit 0
          fi
          if ! git diff --quiet "origin/${{ github.base_ref }}" -- .github/workflows/claude-review.yml; then
            echo "::notice::This pull request edits .github/workflows/claude-review.yml, so the action refuses to run it — a pull request may not rewrite the review that judges it. The review begins working once this is merged."
            exit 0
          fi
          echo "::error::The review reported success without running: no execution file, and this workflow file matches the base branch. A check that passes while nothing was read is worse than one that fails."
          exit 1

      # The list of thread ids is the ONLY thing crossing into the privileged
      # job. Uploaded even when empty, so `reconcile` can tell "nothing to do"
      # from "the review never got that far".
      #
      # `include-hidden-files` IS WHAT MAKES THAT TRUE, AND WITHOUT IT THE WHOLE
      # MECHANISM WAS A NO-OP. `.resolve-threads` is a DOTFILE, and
      # `upload-artifact` v4 excludes hidden files by default — so the file was
      # created correctly, matched nothing, and `if-no-files-found: ignore`
      # reported that in one line nobody reads. `reconcile` then downloaded
      # nothing, found no list, and printed "the review asked for no threads",
      # which is the message for the HEALTHY case. A review that had resolved a
      # thread would have failed to, silently.
      - id: list
        if: always() && steps.hygiene.outputs.ok == 'true'
        run: |
          touch "${{ github.workspace }}/.resolve-threads"
          echo "produced=true" >> "$GITHUB_OUTPUT"
      - if: always() && steps.hygiene.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resolve-threads
          path: .resolve-threads
          retention-days: 1
          include-hidden-files: true
          # NOT `ignore`. The file is created one step above, so no match means
          # the upload is broken rather than that there was nothing to say —
          # exactly the case that hid this bug.
          if-no-files-found: error

  # THE PRIVILEGE LIVES HERE, AND NO MODEL DOES.
  #
  # `contents: write` is what `resolveReviewThread` requires. This job runs one
  # program over a list of ids, and that program re-reads every thread from
  # GitHub and refuses any the review did not author.
  reconcile:
    needs: review
    if: needs.review.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: resolve-threads
        continue-on-error: true

      # A MISSING LIST IS A BROKEN PIPE, NOT AN EMPTY ONE — unless the review
      # never produced one, which `needs.review.outputs.list` is what says. The
      # resolver reads an absent file as "nothing to resolve", so without this
      # step a severed transfer reports the same sentence as a clean review.
      - name: The review's list actually arrived
        if: needs.review.outputs.list == 'true'
        run: |
          [ -f .resolve-threads ] && exit 0
          echo "::error::The review produced a resolve list and it did not reach this job. \
          Nothing was resolved, and the resolver would have called that 'no threads'."
          exit 1

      - name: Resolve the threads the review addressed
        if: needs.review.outputs.list == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/resolve-review-threads.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --file .resolve-threads

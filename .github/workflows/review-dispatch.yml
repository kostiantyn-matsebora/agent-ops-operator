# ACT ON THE REVIEW'S FINDINGS FROM THE PULL REQUEST.
#
# `claude-review.yml` reads and comments, and there the loop ended: every fix
# was somebody opening an editor. This is the other half. A maintainer accepts a
# finding by replying `fix it` in its thread, then posts ONE dispatch comment on
# the pull request; everything accepted is fixed in one commit, each fixed
# thread is answered with the sha and closed, and everything nobody accepted
# stays open — and, since branch protection requires conversation resolution,
# keeps the merge blocked until a person deals with it. That is the feature.
#
# OR THE WHOLE PULL REQUEST IS APPROVED AT ONCE. The `autofix` label
# (`.github/review-triage.json`, `approve_label`) is change-level consent,
# placed by a person with write access: every open finding of the review's and
# every open issue the analysis service reports are on the work list, each is
# FIXED or DISPUTED (a dispute is a reply that stays open and names the
# approver), the landed commit re-triggers CI and the review by
# `workflow_dispatch`, and the review's completion starts the next round —
# bounded by MAX_ROUNDS, every ending summarised in ONE comment. Without the
# label, nothing here changes.
#
# FOUR JOBS, AND THE SPLITS ARE THE POINT:
#
#   gate     who sent this, and may they?         pull-requests: write (to refuse visibly)
#   collect  what is accepted, read from threads  contents: read   -- and, labelled, the
#            (and the analysis service)                              service; NO model
#   fix      a PATCH, from a model                contents: read   -- it CANNOT push
#   land     apply, push, reply, resolve          contents: write  -- it runs NO model
#            and, labelled, re-trigger            actions: write
#
# The vocabulary — what counts as an acceptance, what the dispatch form is, the
# label, the markers — lives in `.github/review-triage.json`, read by the
# programs and quoted by the docs. Nothing here interprets a sentence.
#
# NEVER `pull_request_target`. It is the convenient trigger for "run with write
# access on a pull request", and that convenience is exactly the hole: it runs
# with the base repository's secrets and a writable token against a head a
# stranger controls. Everything here that needs a privilege gets it from an
# ordinary event on THIS repository, gated on who sent it, and the model never
# holds the privilege at all. A CI assertion pins the trigger set.
#
# A PUSH MADE WITH `GITHUB_TOKEN` STARTS NO WORKFLOW. GitHub withholds
# `pull_request: synchronize` from commits the workflow token pushes; what it
# does NOT withhold is `workflow_dispatch`. So an UNLABELLED dispatch's commit
# gets neither `ci-green` nor a review until somebody pushes again, and the
# landing comment says so; a LABELLED one dispatches `ci.yml` on the branch
# (its check runs attach to the head sha, which is what branch protection
# reads — measured on #131) and the review from the default branch's copy.
name: review-dispatch

# The run's name carries the pull request, so a listing — and the archive
# guard, which asks whether a round is still running — can tell which one a
# run concerns. A review-completion run's own branch is the default branch,
# so its name is the only place the number appears.
run-name: >-
  ${{ github.event_name == 'workflow_run'
      && format('review-dispatch after {0}', github.event.workflow_run.display_title)
      || format('review-dispatch #{0}', github.event.issue.number || github.event.pull_request.number || inputs.pr) }}

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # THE LABEL: round one over whatever is open. The `labeled` event carries
  # the sender, and the gate asks whether that person may push here.
  pull_request:
    types: [labeled]
  # THE REVIEW FINISHED: on a labelled pull request, the next round. This
  # trigger runs the DEFAULT branch's copy of this file, whatever the pull
  # request holds — the same property the review has — and it keeps the
  # review's own jobs free of any write.
  workflow_run:
    workflows: [claude-review]
    types: [completed]
  # A hand-run for verifying THIS file before it is on the default branch —
  # `issue_comment` runs the default branch's copy, so a branch's edit is
  # otherwise unreachable until merged. Whoever can dispatch a workflow here
  # has write access by construction.
  workflow_dispatch:
    inputs:
      pr:
        description: pull request number
        required: true
        type: number
      mode:
        description: "threads: what was accepted per thread; all: everything open (the pull request must carry the label)"
        required: false
        type: choice
        options: [threads, all]
        default: threads

# One dispatch at a time per pull request. A second one QUEUES rather than
# racing the first on the same branch; `cancel-in-progress` is deliberately
# absent, because cancelling `land` between its push and its replies would
# leave a fixed finding open. A review-completion run knows its pull request
# only by name, so it serialises on the reviewed run's branch instead.
concurrency:
  group: review-dispatch-${{ github.event.issue.number || github.event.pull_request.number || inputs.pr || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}

permissions: {}

env:
  # The review workflow the landing job re-dispatches. Named here, once, so
  # the landing job itself names no model.
  REVIEW_WORKFLOW: claude-review.yml
  # THE BOUND. The reviewer's verdicts vary between runs and it reviews the
  # fixer's own commits, so an unbounded loop could argue with itself at a
  # cost nobody approved. Three rounds; a third round still disagreeing is a
  # reviewer-prompt problem, not a reason to raise this.
  MAX_ROUNDS: 3

jobs:
  gate:
    # THE PREFILTER. A comment that does not start with the dispatch form, a
    # label that is not the approval label, a review that did not complete —
    # none starts anything beyond this expression; the run appears skipped in
    # the list. The exact match against the vocabulary file happens one step
    # down; this must AGREE with it, and is the one place the form and the
    # label are repeated, because an expression cannot read a file.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/fix-accepted')) ||
      (github.event_name == 'pull_request_review_comment' && startsWith(github.event.comment.body, '/fix-accepted')) ||
      (github.event_name == 'pull_request' && github.event.label.name == 'autofix') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      pr: ${{ steps.who.outputs.pr }}
      branch: ${{ steps.who.outputs.branch }}
      dispatcher: ${{ steps.who.outputs.dispatcher }}
      # threads | all | none. `none` is a review completing on an unlabelled
      # pull request: nothing to do, said visibly, and every later job skips.
      mode: ${{ steps.who.outputs.mode }}
      approver: ${{ steps.who.outputs.approver }}
      since: ${{ steps.who.outputs.since }}
      head: ${{ steps.who.outputs.head }}
    steps:
      # THE TRUSTED COPY, NOT THE PULL REQUEST'S. On `pull_request_review_comment`
      # and on `pull_request: labeled` `github.ref` is the pull request's MERGE
      # ref, so a bare checkout would read the vocabulary file the pull request
      # itself may be editing. The default branch on every event but the hand
      # run, which is a maintainer dispatching a ref on purpose. `land` reads
      # its programs from the same place.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
      - id: who
        name: Who sent this, and may they
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          BODY: ${{ github.event.comment.body }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
          SENDER: ${{ github.event.comment.user.login || github.event.sender.login || github.actor }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number || inputs.pr }}
          REVIEW_TITLE: ${{ github.event.workflow_run.display_title }}
          REVIEW_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          LABEL=$(python3 -c 'import json;print(json.load(open(".github/review-triage.json"))["approve_label"])')
          echo "dispatcher=$SENDER" >> "$GITHUB_OUTPUT"

          refuse() {
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Dispatch by @$SENDER refused: $1"
            echo "::error::dispatch refused: $1"
            exit 1
          }
          # WHO PLACED THE LABEL, AND WHEN — from the issue timeline, which is
          # state on the pull request rather than a memory of an event. The
          # latest placement counts, so removing and re-adding the label
          # starts the round count afresh.
          label_placement() {
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/timeline" --paginate \
              --jq "[.[] | select(.event == \"labeled\" and .label.name == \"$LABEL\")] | last | \"\(.actor.login) \(.created_at)\""
          }
          # MAY THIS PERSON PUSH HERE — the collaborators API, because a label
          # event carries no `author_association`.
          can_push() {
            local p; p=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$1/permission" --jq .permission 2>/dev/null || echo none)
            case "$p" in admin|maintain|write) return 0 ;; *) return 1 ;; esac
          }

          mode=threads
          case "$EVENT" in
            workflow_dispatch)
              mode="${INPUT_MODE:-threads}"
              ;;
            issue_comment|pull_request_review_comment)
              # THE EXACT FORM, from the file. Whole comment, trimmed, trailing
              # punctuation dropped — the same rule the accept phrases use.
              if ! python3 -c '
          import json, sys
          v = json.load(open(".github/review-triage.json"))
          body = sys.argv[1].strip().rstrip(v.get("trailing_punctuation", ".!,")).strip().lower()
          sys.exit(0 if body in {d.lower() for d in v["dispatch"]} else 1)
          ' "$BODY"; then
                refuse "not a dispatch. The form is one of: $(python3 -c 'import json;print(", ".join(json.load(open(".github/review-triage.json"))["dispatch"]))')"
              fi
              # AUTHORISED BY WHO SENT IT. `author_association` is GitHub's own
              # statement about the comment's author, not a claim in the body.
              case "$ASSOCIATION" in
                OWNER|MEMBER|COLLABORATOR) ;;
                *) refuse "write access is required to dispatch a fix, and \`$SENDER\` has \`$ASSOCIATION\`." ;;
              esac
              ;;
            pull_request)
              # THE LABEL IS CONSENT ONLY FROM SOMEONE WHO MAY PUSH. Placed by
              # anyone else it is REMOVED, with a comment: a refusal that left
              # it in place would look like a loop that broke.
              if ! can_push "$SENDER"; then
                gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "$LABEL"
                refuse "write access is required to approve a pull request for automatic fixing, and \`$SENDER\` cannot push here. The \`$LABEL\` label was removed."
              fi
              mode=all
              ;;
            workflow_run)
              # THE REVIEWED PULL REQUEST, from the run's name (`Review of #N`)
              # or, where the event carries it, its pull request list.
              PR=$(printf '%s' "$REVIEW_TITLE" | sed -n 's/.*#\([0-9]\{1,\}\).*/\1/p' | head -1)
              [ -n "$PR" ] || PR="$REVIEW_PR"
              if [ -z "$PR" ]; then
                echo "::notice::the review run '$REVIEW_TITLE' names no pull request; nothing to do"
                echo "mode=none" >> "$GITHUB_OUTPUT"; exit 0
              fi
              mode=all
              ;;
          esac
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

          # A FORK IS REFUSED. Its branch is not in this repository, so there
          # is nothing here to push to — and a writable token pointed at a
          # stranger's head is the shape `pull_request_target` is refused for.
          read -r cross branch head state < <(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json isCrossRepository,headRefName,headRefOid,state --jq '"\(.isCrossRepository) \(.headRefName) \(.headRefOid) \(.state)"')
          [ "$cross" = "false" ] || refuse "the pull request comes from a fork, and a dispatch only lands on a branch of this repository."
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

          if [ "$mode" = "all" ]; then
            # THE LABEL IS READ NOW, not remembered: removed mid-loop, the
            # running round completes and this is where the next one stops.
            if [ "$state" != "OPEN" ] || ! gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx "$LABEL"; then
              echo "::notice::#$PR is $state and does not carry \`$LABEL\`; no round starts"
              echo "mode=none" >> "$GITHUB_OUTPUT"; exit 0
            fi
            read -r approver since < <(label_placement)
            if [ -z "$approver" ] || [ "$approver" = "null" ]; then
              echo "::notice::#$PR carries \`$LABEL\` but the timeline shows nobody placing it; no round starts"
              echo "mode=none" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "approver=$approver" >> "$GITHUB_OUTPUT"
            echo "since=$since" >> "$GITHUB_OUTPUT"
            echo "round on #$PR ($branch @ ${head:0:7}), approved by $approver at $since, triggered by $EVENT"
          else
            echo "dispatch on #$PR ($branch) by $SENDER"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  collect:
    needs: gate
    if: needs.gate.outputs.mode != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      accepted: ${{ steps.list.outputs.accepted }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
      # THE WORK LIST IS DERIVED FROM THE THREADS — and, on a labelled pull
      # request, from the analysis service — by programs. The model never sees
      # the dispatch comment, the label event or either API; a person cannot
      # direct work through any of them.
      - id: list
        name: What is accepted, read from the threads and the analysis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ needs.gate.outputs.mode }}
          APPROVER: ${{ needs.gate.outputs.approver }}
          HEAD: ${{ needs.gate.outputs.head }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dispatch"
          python3 .github/scripts/accepted-findings.py \
            --repo "$GITHUB_REPOSITORY" --pr "${{ needs.gate.outputs.pr }}" \
            --mode "$MODE" --approver "${APPROVER:-the label}" \
            --out "$RUNNER_TEMP/dispatch/threads.json"
          if [ "$MODE" = "all" ]; then
            python3 .github/scripts/sonar-issues.py \
              --organization "$SONAR_ORG" --pr "${{ needs.gate.outputs.pr }}" --head "$HEAD" \
              --out "$RUNNER_TEMP/dispatch/sonar.json"
          else
            echo '{"consulted":false,"issues":[],"projects":[]}' > "$RUNNER_TEMP/dispatch/sonar.json"
          fi
          python3 -c '
          import json, sys
          threads = json.load(open(sys.argv[1])); sonar = json.load(open(sys.argv[2]))
          work = threads + (sonar.get("issues") or [])
          json.dump(work, open(sys.argv[3], "w"), indent=2)
          print(f"{len(threads)} review finding(s) + {len(sonar.get(\"issues\") or [])} analysis issue(s) = {len(work)} item(s)")
          ' "$RUNNER_TEMP/dispatch/threads.json" "$RUNNER_TEMP/dispatch/sonar.json" "$RUNNER_TEMP/dispatch/work-list.json"
          echo "accepted=$(python3 -c 'import json,sys;print(len(json.load(open(sys.argv[1]))))' "$RUNNER_TEMP/dispatch/work-list.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: dispatch-work-list
          path: |
            ${{ runner.temp }}/dispatch/work-list.json
            ${{ runner.temp }}/dispatch/sonar.json
          retention-days: 1
          if-no-files-found: error

  # THE MODEL RUNS HERE, AND HERE IT CAN ONLY READ. Its output is a patch and a
  # report, both uploaded; nothing in this job can push, comment, or resolve —
  # and it holds no secret but its own credential, in either mode.
  fix:
    needs: [gate, collect]
    if: needs.collect.outputs.accepted != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.branch }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dispatch-work-list
          path: ${{ runner.temp }}/dispatch
      - id: model
        uses: anthropics/claude-code-action@v1
        env:
          WORK_LIST: ${{ runner.temp }}/dispatch/work-list.json
          REPORT: ${{ runner.temp }}/dispatch/report.json
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are fixing findings on a pull request of this repository that
            a maintainer ACCEPTED — per thread, or by approving the whole pull
            request for automatic fixing. The branch is checked out in the
            working directory.

            THE WORK LIST is the JSON file at $WORK_LIST — one item per
            accepted finding, each with an `id` and a `source`:
            - `source: review` — a review thread: `path`, `line`, `finding`
              (the review's text), `acceptedBy` and `reply` (the maintainer's
              words, which may say which part of the finding is agreed; empty
              when the whole pull request was approved).
            - `source: sonar` — an open issue from the code-analysis service:
              `path`, `line`, `rule`, `severity`, `message`. Fix it IN THE CODE
              only; you cannot reach the service, and nothing you write may
              claim to have marked, closed or dismissed an issue there.
            Read it first.

            Address EVERY item, and nothing else:
            - Fix each item in place, minimally, in the style of the
              surrounding code. Read CLAUDE.md and the relevant rule under
              .claude/rules/ before editing — this project records decisions
              that were reverted before, and a fix that reintroduces one is
              worse than no fix.
            - If a finding makes a document untrue, fix the document too; this
              project treats documentation as part of the change.
            - Do NOT do work no item asks for. A cleanup nobody accepted is a
              change nobody reviewed.
            - Do NOT commit, push, or run any `gh` command. A separate step
              lands what you produce.

            FIX OR DISPUTE, NEVER SKIP. An item you judge wrong — the finding
            misreads the code, the rule does not apply here, the fix would
            need a decision that is a person's to make — is DISPUTED with a
            reason a maintainer can act on in one reading. A dispute leaves
            the code untouched and the thread open; it is not a failure, it
            is the honest answer. An item you neither fixed nor disputed is a
            defect in your report.

            When done, write the report to $REPORT as JSON:
              {"items": [{"id": "<id>", "action": "fixed", "reason": ""},
                         {"id": "<id>", "action": "disputed", "reason": "<why>"}]}
            Every `id` from the work list appears exactly once, with `action`
            `fixed` or `disputed`. Return nothing else.
          claude_args: |
            --allowedTools "Read,Edit,MultiEdit,Write,Grep,Glob,Bash(git diff:*),Bash(git status:*),Bash(git log:*)"

      # A MODEL THAT DID NOT RUN MUST NOT READ AS A MODEL THAT FIXED NOTHING.
      # The action skips itself, successfully, whenever this workflow file
      # differs from the default branch's copy — on EVERY trigger, the hand
      # run included, which is how the first live dispatch of this workflow
      # reported "not addressed by the fixing step" for a finding no model ever
      # saw. `execution_file` is set only once Claude actually ran. Where the
      # skip is the legitimate one, the report says so in every thread; where
      # it is not, the job fails rather than landing a silence.
      - name: The fixing step actually ran
        env:
          EXECUTION_FILE: ${{ steps.model.outputs.execution_file }}
          REPORT: ${{ runner.temp }}/dispatch/report.json
          WORK_LIST: ${{ runner.temp }}/dispatch/work-list.json
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [ -z "$EXECUTION_FILE" ] || { echo "the fixing step ran"; exit 0; }
          git fetch -q origin "$DEFAULT"
          if ! git diff --quiet "origin/$DEFAULT" -- .github/workflows/review-dispatch.yml; then
            echo "::notice::This branch edits .github/workflows/review-dispatch.yml, so the action refuses to run it — a pull request may not rewrite what acts on its findings. Dispatch works once this is merged."
            python3 -c '
          import json, sys
          work = json.load(open(sys.argv[1]))
          json.dump({"items": [{"id": i.get("id") or i["threadId"], "action": "disputed", "reason": "the fixing step did not run: this branch edits review-dispatch.yml, which the action refuses to run until it is merged"} for i in work]}, open(sys.argv[2], "w"))
          ' "$WORK_LIST" "$REPORT"
            exit 0
          fi
          echo "::error::The fixing step reported success without running: no execution file, and this workflow file matches the default branch."
          exit 1

      # THE PATCH IS THE WHOLE OF WHAT CROSSES. `--binary` so a changed image
      # survives; `add -N` so a NEW file is in the diff at all. A missing report
      # becomes "nothing fixed" rather than a missing input — the lander then
      # leaves every thread open and says so, which is the honest reading of a
      # run that produced changes it did not account for.
      - name: The patch, and the report
        run: |
          set -euo pipefail
          git add -N .
          git diff --binary > "$RUNNER_TEMP/dispatch/fix.patch"
          [ -f "$RUNNER_TEMP/dispatch/report.json" ] || echo '{"items":[]}' > "$RUNNER_TEMP/dispatch/report.json"
          echo "patch: $(wc -c < "$RUNNER_TEMP/dispatch/fix.patch") bytes"; cat "$RUNNER_TEMP/dispatch/report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: dispatch-fix
          path: |
            ${{ runner.temp }}/dispatch/fix.patch
            ${{ runner.temp }}/dispatch/report.json
          retention-days: 1
          # The dotfile trap that made `.resolve-threads` a no-op for a day:
          # upload-artifact v4 excludes hidden files by default. Nothing here
          # is a dotfile, and the flag is set anyway so a rename cannot
          # reintroduce it.
          include-hidden-files: true
          if-no-files-found: error

  # THE PRIVILEGE LIVES HERE, AND NO MODEL DOES. One program: apply, commit,
  # push, reply, then resolve through the resolver that already refuses any
  # thread the review did not author — and, labelled, dispatch the next round.
  land:
    needs: [gate, collect, fix]
    if: >-
      always() && needs.gate.result == 'success' && needs.gate.outputs.mode != 'none' &&
      needs.collect.result == 'success' &&
      (needs.fix.result == 'success' || needs.fix.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # `workflow_dispatch` of ci.yml and the review, on a labelled pull
      # request. The one write the loop adds, and it is held here alone.
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.branch }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dispatch-work-list
          path: ${{ runner.temp }}/dispatch
      - uses: actions/download-artifact@v4
        if: needs.fix.result == 'success'
        with:
          name: dispatch-fix
          path: ${{ runner.temp }}/dispatch
      # Nothing accepted means `fix` never ran; the lander is handed an empty
      # patch and an empty report, and reports "nothing accepted" itself — or,
      # labelled, that the pull request is clean.
      - if: needs.fix.result == 'skipped'
        run: |
          : > "$RUNNER_TEMP/dispatch/fix.patch"
          echo '{"items":[]}' > "$RUNNER_TEMP/dispatch/report.json"
      # THE PROGRAMS THIS JOB RUNS ARE NOT THE PULL REQUEST'S. The checkout
      # above is the branch being fixed, and a pull request that could rewrite
      # the lander — or the resolver it delegates to — could resolve a person's
      # thread on itself under this job's token. So both are read from the
      # branch the WORKFLOW came from: the default branch on every event but
      # the ref a maintainer dispatched by hand.
      - name: The landing programs, from the branch the workflow came from
        env:
          SOURCE: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch -q origin "$SOURCE"
          for s in land-dispatch.py resolve-review-threads.py; do
            git show "origin/$SOURCE:.github/scripts/$s" > "$RUNNER_TEMP/$s"
          done
          git show "origin/$SOURCE:.github/review-triage.json" > "$RUNNER_TEMP/review-triage.json"
      - name: Apply, push, reply, resolve — and, labelled, start the next round
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ needs.gate.outputs.mode }}
          APPROVER: ${{ needs.gate.outputs.approver }}
          SINCE: ${{ needs.gate.outputs.since }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 "$RUNNER_TEMP/land-dispatch.py" \
            --repo "$GITHUB_REPOSITORY" --pr "${{ needs.gate.outputs.pr }}" \
            --branch "${{ needs.gate.outputs.branch }}" \
            --work-list "$RUNNER_TEMP/dispatch/work-list.json" \
            --patch "$RUNNER_TEMP/dispatch/fix.patch" \
            --report "$RUNNER_TEMP/dispatch/report.json" \

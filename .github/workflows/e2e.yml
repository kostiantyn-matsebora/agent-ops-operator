# The end-to-end tiers — ONE definition, three entry points.
#
# This workflow is the definition and is only ever CALLED (workflow_call). The
# entry points are thin workflows that name a tier:
#
#   release.yml    calls it with tier=pr on the tagged commit, and publishes
#                  nothing until it passes.
#   e2e-smoke.yml  the pr tier on demand, on any branch.
#   e2e-full.yml   the full tier — the real-runtime lane included — nightly
#                  when master moved, and on demand. It NEVER gates a pull
#                  request: its lane spends real tokens and its flakiness must
#                  not block work while it is tuned.
#
#   pr    contract conformance + a thin k3s smoke on the stub runtime. No
#         secret, deterministic, bounded in wall clock. A PULL REQUEST RUNS
#         NONE OF THIS: ci.yml runs conformance on its own (a minute, no
#         cluster), and the cluster is for releases and on-demand runs.
#   full  the whole pack. The real-runtime lane SKIPS itself when
#         CLAUDE_CODE_OAUTH_TOKEN is absent, so a fork or a repository without the
#         secret runs every tier its access allows and fails for none of the rest.
#
# WHAT THIS WORKFLOW OWNS is the cluster-based jobs only. Per-module build, vet
# and test, the envtest suite and chart lint stay in ci.yml — one definition
# per tier, stated in both openspec capabilities.
name: e2e

on:
  workflow_call:
    inputs:
      tier:
        description: pr or full
        type: string
        default: pr

permissions:
  contents: read

env:
  MANAGER_MODULE: platform/manager
  K3D_VERSION: v5.9.0

jobs:
  # Adapters, black-box, against a fake manager. No cluster, no network beyond
  # loopback, no credential. ci.yml runs the same command on every pull
  # request; here it runs beside the pack so a release or an on-demand run
  # reports the whole tier in one place.
  conformance:
    name: e2e / conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.MANAGER_MODULE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.MANAGER_MODULE }}/go.mod
          cache: true
      # -count=1: a cached PASS can never stand in for binaries that did not run.
      - run: go test -tags conformance -count=1 -timeout 20m -v ./test/conformance/

  # The k3s pack. THE PACK ITSELF creates the k3d cluster, builds every image
  # from THIS commit and imports it into the node, installs the chart from the
  # working tree and tears the cluster down — this job only supplies the tools
  # and runs `go test`. See platform/manager/test/e2e/harness_test.go.
  pack:
    name: e2e / ${{ inputs.tier }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ env.MANAGER_MODULE }}
    env:
      E2E_TIER: ${{ inputs.tier }}
      E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.MANAGER_MODULE }}/go.mod
          cache: true
      # helm, kubectl and docker (with buildx) are preinstalled on
      # ubuntu-latest; k3d is the one tool the runner lacks. The version
      # lines below are the record of what this run used.
      - name: Install k3d
        run: |
          curl -sfL "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64" \
            -o /usr/local/bin/k3d && chmod +x /usr/local/bin/k3d
          k3d version
          helm version --short
          kubectl version --client
      - name: Run the pack
        env:
          # Absent on a pull request and on a fork — the real-runtime lane
          # then reports itself SKIPPED. Present only when the full tier is
          # called by e2e-full.yml, which inherits the repository's secrets.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.tier == 'full' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: |
          go test -tags e2e -count=1 -timeout 55m -v ./test/e2e/
      # Unconditional: a failure that did not capture its own context costs a
      # full re-run to learn anything.
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ inputs.tier }}-${{ github.run_id }}
          path: ${{ github.workspace }}/e2e-artifacts
          if-no-files-found: ignore

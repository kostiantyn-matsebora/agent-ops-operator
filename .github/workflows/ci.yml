# What must pass before a change lands.
#
# The matrices are DERIVED (.github/components.sh), never listed here: this
# repository went from five images to thirteen while its release procedure stood
# still, and the one document that listed them had already lost track of one.
# A matrix somebody has to remember to edit is a matrix that quietly stops
# covering things.
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# One run per ref. A superseded push is cancelled rather than raced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVTEST_K8S_VERSION: "1.31.x"
  # The one module whose suite needs a real API server. Named ONCE, and used
  # twice below — by the job that provisions envtest for it, and by the filter
  # that keeps it out of the plain module matrix, where it would fail for want
  # of assets. Two places naming it separately is how they would come to
  # disagree.
  ENVTEST_MODULE: platform/manager

jobs:
  # WHAT EXISTS, asked once and answered for every matrix below.
  discover:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          echo "modules=$(./.github/components.sh modules \
            | jq -c --arg m "$ENVTEST_MODULE" 'map(select(. != $m))')" >> "$GITHUB_OUTPUT"
          echo "images=$(./.github/components.sh images)" >> "$GITHUB_OUTPUT"

  # The operator, against a REAL API server. Its own suite file records that
  # envtest schedules nothing, so this proves the API-server half and nothing
  # about the kubelet — which is what the e2e-testing change is for.
  operator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.ENVTEST_MODULE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.ENVTEST_MODULE }}/go.mod
          cache: true
      - name: Cache envtest assets
        uses: actions/cache@v4
        with:
          path: ~/.envtest
          key: envtest-${{ runner.os }}-${{ env.ENVTEST_K8S_VERSION }}
      - name: Provision envtest
        run: |
          ASSETS=$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.19 \
            use "$ENVTEST_K8S_VERSION" --bin-dir ~/.envtest -p path)
          echo "KUBEBUILDER_ASSETS=$ASSETS" >> "$GITHUB_ENV"
      - run: go build ./...
      - run: go vet ./...
      # -count=1 so a cached PASS can never stand in for a run that did not
      # happen; the integration suite must actually execute.
      - run: go test -count=1 ./...
      # The suite FAILS without assets rather than skipping (verified: envtest
      # start returns an error and the package reports FAIL), so `go test ./...`
      # above already proves it ran. This only catches provisioning that
      # silently produced an empty path.
      - name: Assert envtest was provisioned
        run: test -n "$KUBEBUILDER_ASSETS" || { echo "envtest assets were never provisioned"; exit 1; }

  # Every OTHER module. Dependency-free by design, so these are seconds each,
  # and separate from `operator` so a module break is legible without reading an
  # envtest log.
  modules:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 ./...

  # The console's browser application. The only non-Go job, and it exists
  # because these tests run nowhere today: a broken bundle currently surfaces
  # inside the console IMAGE build, at the end of a long log, and a failing
  # component test surfaces for nobody.
  #
  # Screenshots are deliberately out: they need a browser, and they are
  # regenerated when the UI changes, not on every pull request.
  console-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/console/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/console/ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Render AND validate. A lint proves the templates parse; only rendering
  # every meaningful permutation and validating the result proves they produce
  # objects a cluster would accept.
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
      - name: Convert this repo's CRDs into validation schemas
        run: python3 .github/scripts/crd-schemas.py chart/crds "$RUNNER_TEMP/crd-schemas"
      - run: helm lint chart
      # EACH PERMUTATION CARRIES THE VALUES ITS SUBJECT REQUIRES. `home-assistant`
      # and a Telegram surface refuse to render without a credential and an
      # endpoint — a matrix that omitted them would be testing the guards and
      # never reaching the templates.
      - name: Render and validate every permutation
        run: |
          set -euo pipefail
          HA='--set home-assistant.enabled=true
              --set home-assistant.homeAssistant.endpoint=https://ha.example.org
              --set home-assistant.homeAssistant.credentials.operatorToken=ci-token'
          PROM='--set prometheus.enabled=true
                --set prometheus.metrics.url=http://metrics.example:8428'
          TG='--set telegram.enabled=true
              --set telegram.surface.enabled=true
              --set telegram.surface.chatId=-1001234567890
              --set telegram.surface.credentials.botToken=ci:token'
          declare -A PERMUTATIONS=(
            [default]=""
            [demo]="--set global.demo.enabled=true"
            [kubernetes]="--set kubernetes.enabled=true"
            [prometheus]="$PROM"
            [home-assistant]="$HA"
            [telegram]="$TG"
            [no-console]="--set console.enabled=false"
            # THE MCP SERVERS RENDER IN NO OTHER PERMUTATION, so nothing here
            # ever looked at their ServiceAccounts. One of them mounted a token
            # while holding no grant, and only a live render found it.
            [mcp-servers]="--set kubernetes.enabled=true --set kubernetes.mcpServers.enabled=true $PROM --set prometheus.mcpServers.enabled=true --set prometheus.mcpServers.backend=http://metrics.example:8428 $HA --set home-assistant.adminMcp.enabled=true --set home-assistant.adminMcpServer.enabled=true"
            [everything]="--set global.demo.enabled=true --set kubernetes.enabled=true $PROM $HA $TG"
          )
          failed=0
          for name in "${!PERMUTATIONS[@]}"; do
            echo "::group::$name"
            if ! helm template ci chart ${PERMUTATIONS[$name]} > "$RUNNER_TEMP/$name.yaml"; then
              echo "::error::chart permutation '$name' failed to render"
              failed=1; echo "::endgroup::"; continue
            fi
            # CRDs are SKIPPED, and only CRDs. kubeconform's strict default
            # set carries no schema for CustomResourceDefinition, and a missing
            # schema is an ERROR rather than a skip — so without this the job
            # fails on eleven objects in every permutation, which is what it did
            # when the whole matrix was first run by hand.
            #
            # Nothing is lost. The CRDs are controller-gen output and the API
            # server validates them on apply. What this job exists to check is
            # the CRs rendered AGAINST them, and that still happens — the second
            # schema-location is those very CRDs.
            if ! kubeconform -strict -summary \
                 -skip CustomResourceDefinition \
                 -schema-location default \
                 -schema-location "$RUNNER_TEMP/crd-schemas/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
                 "$RUNNER_TEMP/$name.yaml"; then
              echo "::error::chart permutation '$name' rendered objects that do not validate"
              failed=1
            fi
            # EVERY ServiceAccount IS EXPLAINED — bound, run as by a pod, or the
            # floor. Four unbound accounts nothing ran as shipped once, and the
            # only way to notice was to render the chart and read the list.
            if ! python3 .github/scripts/serviceaccount-guard.py "$RUNNER_TEMP/$name.yaml" "$name"; then
              echo "::error::chart permutation '$name' rendered a ServiceAccount nothing grants and nothing runs as"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

  # THE GENERATED DOCUMENTATION, REGENERATED AND DIFFED.
  #
  # GitHub Pages builds docs/ from master with no workflow, so a generated file
  # must be COMMITTED -- and a committed generated file is correct the day it is
  # written and silently wrong after the next field rename. This job is the only
  # thing that stops that, which is the whole reason the templates and examples
  # are generated rather than typed.
  #
  # It needs helm because the worked examples ARE chart output: the same render
  # the job above validates, with its custom resources lifted into the pages.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
      # THREE checks in one run, and the failure names the command to run --
      # a drift check that reports a difference without the fix is a puzzle.
      #
      #   1. every preset value is one the CHART documents, so the site and the
      #      shipped values cannot come to name different examples
      #   2. no published page names a real host or a real-shaped identifier
      #   3. the committed output matches what the sources produce
      - name: Examples name nothing real, and match their sources
        run: python3 .github/scripts/docs-generate.py --check
      # A template a reader copies must be a resource the API server accepts.
      # Validated against THIS repo's CRDs, so a template that drifts from the
      # schema fails here rather than in someone's cluster.
      - name: Generated templates validate against the CRDs
        run: |
          python3 .github/scripts/crd-schemas.py chart/crds "$RUNNER_TEMP/crd-schemas"
          python3 .github/scripts/docs-generate.py --emit-templates "$RUNNER_TEMP/templates.yaml"
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location "$RUNNER_TEMP/crd-schemas/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            "$RUNNER_TEMP/templates.yaml"

  # Every Dockerfile builds. amd64 only and never pushed: pull-request feedback
  # speed matters more than arch coverage here, and the multi-arch build is
  # exercised at release, where a manifest is actually produced to assert on.
  images:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.discover.outputs.images) }}
    name: images (${{ matrix.image.component }})
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.image.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.component }}

  # WHAT MAY BE PUBLISHED. This repository goes public, so no file and no commit
  # message may say who runs the author's cluster, what it is called, or how to
  # reach it.
  #
  # The guard is an ALLOWLIST of permitted shapes, never a list of forbidden
  # strings — a denylist would have to spell out what it protects, publishing it
  # in the guard itself, and would catch only what somebody already thought of.
  #
  # It reports FILE, LINE and RULE and never the matched text: build logs on a
  # public repository are public, so a guard that quoted its findings would leak
  # them to the audience it exists to protect the tree from. `--show` prints
  # matches locally, where the fixing happens.
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The message scan needs the range under review, so the shallow
          # default clone is not enough.
          fetch-depth: 0

      - name: Scan the tree
        run: python3 .github/scripts/publication-guard.py

      # Messages live OUTSIDE the tree, so a tree-only guard leaves the one hole
      # that cannot be fixed by editing a file later.
      - name: Scan the commit messages under review
        if: github.event_name == 'pull_request'
        run: |
          python3 .github/scripts/publication-guard.py \
            --path /dev/null \
            --messages "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"

  # The OTHER guard over the same published tree, and the opposite shape.
  #
  # `publication` is an ALLOWLIST because naming a private thing in a guard
  # publishes it. This one is a DENYLIST, and that follows from what its subject
  # is: a removed CRD field, a withdrawn tiebreak, a superseded command are all
  # PUBLIC by construction, so listing them costs nothing — and the list IS the
  # value. It is the record of what this project stopped doing, in the one place
  # that fails a build when someone brings it back.
  #
  # Two guards, opposite shapes, each following from its subject. Neither is a
  # template for the other.
  retired-vocabulary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A published spec is READ AS THE CURRENT CONTRACT. A retired name
      # asserted there tells a stranger the project does something it stopped
      # doing, which is worse than saying nothing, because a spec is trusted.
      #
      # Recording a removal still passes: each term carries the words that mark
      # a sentence as a record. The report names file, line and term and never
      # quotes the line — `--show` is for local fixing.
      - name: No retired vocabulary asserted as a current claim
        run: python3 .github/scripts/retired-vocabulary-guard.py

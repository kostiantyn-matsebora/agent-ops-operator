# What must pass before a change lands.
#
# The matrices are DERIVED (.github/components.sh), never listed here: this
# repository went from five images to thirteen while its release procedure stood
# still, and the one document that listed them had already lost track of one.
# A matrix somebody has to remember to edit is a matrix that quietly stops
# covering things.
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# One run per ref. A superseded push is cancelled rather than raced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVTEST_K8S_VERSION: "1.31.x"
  # The one module whose suite needs a real API server. Named ONCE, and used
  # twice below — by the job that provisions envtest for it, and by the filter
  # that keeps it out of the plain module matrix, where it would fail for want
  # of assets. Two places naming it separately is how they would come to
  # disagree.
  ENVTEST_MODULE: platform/manager

jobs:
  # WHAT EXISTS, asked once and answered for every matrix below.
  discover:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}
      images: ${{ steps.list.outputs.images }}
      operator: ${{ steps.list.outputs.operator }}
      ui: ${{ steps.list.outputs.ui }}
      chart: ${{ steps.list.outputs.chart }}
      docs: ${{ steps.list.outputs.docs }}
      site: ${{ steps.list.outputs.site }}
    steps:
      # FULL HISTORY, because the filter below diffs against a base commit.
      # fetch-depth: 1 makes every diff report the whole tree as changed, which
      # is the failure that looks like the filter simply not working.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: list
        env:
          # The commit this push or pull request is measured against. Empty on a
          # branch's first push, where there is nothing to diff and everything
          # must build.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          ALL_MODULES=$(./.github/components.sh modules \
            | jq -c --arg m "$ENVTEST_MODULE" 'map(select(. != $m))')
          ALL_IMAGES=$(./.github/components.sh images)

          # WHAT CHANGED, or EVERYTHING when that cannot be established. A new
          # branch reports an all-zero base, and a shallow or grafted history
          # makes the diff fail — both must build the world rather than build
          # nothing, because a filter that silently matches nothing is a CI that
          # silently tests nothing.
          changed=""
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" || true)
          fi

          # THE THREE FILES THAT REBUILD EVERYTHING. The shared Dockerfile is
          # nine components' recipe, `components.sh` decides what exists at all,
          # and this workflow decides how any of it is tested. A change to one
          # of them touches no component directory and invalidates all of them.
          if [ -z "$changed" ] \
             || echo "$changed" | grep -qE '^\.github/(docker/|components\.sh|workflows/ci\.yml)'; then
            echo "building everything: base=${BASE_SHA:-none}" >&2
            echo "modules=$ALL_MODULES" >> "$GITHUB_OUTPUT"
            echo "images=$ALL_IMAGES" >> "$GITHUB_OUTPUT"
            for j in operator ui chart docs site; do echo "$j=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi

          printf '%s\n' "$changed" > /tmp/changed.txt
          echo "changed files:" >&2; cat /tmp/changed.txt >&2

          # A component is built when a file inside its own directory moved.
          # `components.sh` reports contexts as `./path`; the diff reports
          # `path` — normalising here rather than at each use is what keeps the
          # two from drifting apart.
          echo "modules=$(echo "$ALL_MODULES" | jq -c --rawfile c /tmp/changed.txt '
            ($c | split("\n") | map(select(length > 0))) as $files
            | map(select(. as $m | $files | any(startswith($m + "/"))))')" >> "$GITHUB_OUTPUT"

          # THE FIXED JOBS ARE FILTERED TOO, and `operator` is why. It provisions
          # envtest and runs the suite against a real API server — minutes, on
          # every push, including one that edited a paragraph. Its tests render
          # the CHART, so it watches both trees.
          #
          # Each flag is `true` or empty; a job reads its own and nothing else,
          # so adding a job means adding one line here rather than editing a
          # shared expression.
          m() { grep -qE "$1" /tmp/changed.txt && echo true; }
          {
            echo "operator=$(m '^(platform/manager/|chart/)')"
            echo "ui=$(m '^platform/console/ui/')"
            echo "chart=$(m '^(chart/|platform/manager/api/)')"
            echo "docs=$(m '^(docs/|chart/|platform/manager/api/|\.github/scripts/docs-generate)')"
            echo "site=$(m '^docs/')"
          } >> "$GITHUB_OUTPUT"

          echo "images=$(echo "$ALL_IMAGES" | jq -c --rawfile c /tmp/changed.txt '
            ($c | split("\n") | map(select(length > 0))) as $files
            | map(select((.context | sub("^\\./"; "")) as $d | $files | any(startswith($d + "/"))))')" >> "$GITHUB_OUTPUT"

  # The operator, against a REAL API server. Its own suite file records that
  # envtest schedules nothing, so this proves the API-server half and nothing
  # about the kubelet — which is what the e2e-testing change is for.
  operator:
    needs: discover
    if: needs.discover.outputs.operator == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.ENVTEST_MODULE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.ENVTEST_MODULE }}/go.mod
          cache: true
      - name: Cache envtest assets
        uses: actions/cache@v4
        with:
          path: ~/.envtest
          key: envtest-${{ runner.os }}-${{ env.ENVTEST_K8S_VERSION }}
      - name: Provision envtest
        run: |
          ASSETS=$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.19 \
            use "$ENVTEST_K8S_VERSION" --bin-dir ~/.envtest -p path)
          echo "KUBEBUILDER_ASSETS=$ASSETS" >> "$GITHUB_ENV"
      - run: go build ./...
      - run: go vet ./...
      # -count=1 so a cached PASS can never stand in for a run that did not
      # happen; the integration suite must actually execute.
      - run: go test -count=1 ./...
      # The suite FAILS without assets rather than skipping (verified: envtest
      # start returns an error and the package reports FAIL), so `go test ./...`
      # above already proves it ran. This only catches provisioning that
      # silently produced an empty path.
      - name: Assert envtest was provisioned
        run: test -n "$KUBEBUILDER_ASSETS" || { echo "envtest assets were never provisioned"; exit 1; }

  # Every OTHER module. Dependency-free by design, so these are seconds each,
  # and separate from `operator` so a module break is legible without reading an
  # envtest log.
  modules:
    needs: discover
    if: needs.discover.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      # THE CONSOLE'S GO BUILD EMBEDS ITS BROWSER BUNDLE — `go:embed all:ui/dist`
      # — and that bundle is build output, so it is absent from a fresh
      # checkout. Without this step the module does not COMPILE, in a job about
      # Go rather than about the bundle, and the error names an embed pattern
      # rather than a missing build.
      #
      # It passes locally for anyone who has ever run the UI build, which is why
      # it survived until CI ran on a clean tree.
      - uses: actions/setup-node@v4
        if: matrix.module == 'platform/console'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/console/ui/package-lock.json
      - name: Build the console UI, which its Go build embeds
        if: matrix.module == 'platform/console'
        working-directory: platform/console/ui
        run: npm ci && npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 ./...

  # The console's browser application. The only non-Go job, and it exists
  # because these tests run nowhere today: a broken bundle currently surfaces
  # inside the console IMAGE build, at the end of a long log, and a failing
  # component test surfaces for nobody.
  #
  # Screenshots are deliberately out: they need a browser, and they are
  # regenerated when the UI changes, not on every pull request.
  console-ui:
    needs: discover
    if: needs.discover.outputs.ui == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/console/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/console/ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Render AND validate. A lint proves the templates parse; only rendering
  # every meaningful permutation and validating the result proves they produce
  # objects a cluster would accept.
  chart:
    needs: discover
    if: needs.discover.outputs.chart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # INTO $RUNNER_TEMP, NOT /usr/local/bin. Writing to a system directory
      # assumes the job runs as root, which is true of GitHub-hosted runners and
      # false of most self-hosted ones — so the assumption is invisible until CI
      # runs somewhere else and fails on tar rather than on anything it tests.
      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Convert this repo's CRDs into validation schemas
        run: python3 .github/scripts/crd-schemas.py chart/crds "$RUNNER_TEMP/crd-schemas"
      - run: helm lint chart
      # EACH PERMUTATION CARRIES THE VALUES ITS SUBJECT REQUIRES. `home-assistant`
      # and a Telegram surface refuse to render without a credential and an
      # endpoint — a matrix that omitted them would be testing the guards and
      # never reaching the templates.
      - name: Render and validate every permutation
        run: |
          set -euo pipefail
          HA='--set home-assistant.enabled=true
              --set home-assistant.homeAssistant.endpoint=https://ha.example.org
              --set home-assistant.homeAssistant.credentials.operatorToken=ci-token'
          PROM='--set prometheus.enabled=true
                --set prometheus.metrics.url=http://metrics.example:8428'
          TG='--set telegram.enabled=true
              --set telegram.surface.enabled=true
              --set telegram.surface.chatId=-1001234567890
              --set telegram.surface.credentials.botToken=ci:token'
          declare -A PERMUTATIONS=(
            [default]=""
            [demo]="--set global.demo.enabled=true"
            [kubernetes]="--set kubernetes.enabled=true"
            [prometheus]="$PROM"
            [home-assistant]="$HA"
            [telegram]="$TG"
            [no-console]="--set console.enabled=false"
            # THE MCP SERVERS RENDER IN NO OTHER PERMUTATION, so nothing here
            # ever looked at their ServiceAccounts. One of them mounted a token
            # while holding no grant, and only a live render found it.
            [mcp-servers]="--set kubernetes.enabled=true --set kubernetes.mcpServers.enabled=true $PROM --set prometheus.mcpServers.enabled=true --set prometheus.mcpServers.backend=http://metrics.example:8428 $HA --set home-assistant.adminMcp.enabled=true --set home-assistant.adminMcpServer.enabled=true"
            [everything]="--set global.demo.enabled=true --set kubernetes.enabled=true $PROM $HA $TG"
          )
          failed=0
          for name in "${!PERMUTATIONS[@]}"; do
            echo "::group::$name"
            if ! helm template ci chart ${PERMUTATIONS[$name]} > "$RUNNER_TEMP/$name.yaml"; then
              echo "::error::chart permutation '$name' failed to render"
              failed=1; echo "::endgroup::"; continue
            fi
            # CRDs are SKIPPED, and only CRDs. kubeconform's strict default
            # set carries no schema for CustomResourceDefinition, and a missing
            # schema is an ERROR rather than a skip — so without this the job
            # fails on eleven objects in every permutation, which is what it did
            # when the whole matrix was first run by hand.
            #
            # Nothing is lost. The CRDs are controller-gen output and the API
            # server validates them on apply. What this job exists to check is
            # the CRs rendered AGAINST them, and that still happens — the second
            # schema-location is those very CRDs.
            if ! kubeconform -strict -summary \
                 -skip CustomResourceDefinition \
                 -schema-location default \
                 -schema-location "$RUNNER_TEMP/crd-schemas/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
                 "$RUNNER_TEMP/$name.yaml"; then
              echo "::error::chart permutation '$name' rendered objects that do not validate"
              failed=1
            fi
            # EVERY ServiceAccount IS EXPLAINED — bound, run as by a pod, or the
            # floor. Four unbound accounts nothing ran as shipped once, and the
            # only way to notice was to render the chart and read the list.
            if ! python3 .github/scripts/serviceaccount-guard.py "$RUNNER_TEMP/$name.yaml" "$name"; then
              echo "::error::chart permutation '$name' rendered a ServiceAccount nothing grants and nothing runs as"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

  # THE GENERATED DOCUMENTATION, REGENERATED AND DIFFED.
  #
  # GitHub Pages builds docs/ from master with no workflow, so a generated file
  # must be COMMITTED -- and a committed generated file is correct the day it is
  # written and silently wrong after the next field rename. This job is the only
  # thing that stops that, which is the whole reason the templates and examples
  # are generated rather than typed.
  #
  # It needs helm because the worked examples ARE chart output: the same render
  # the job above validates, with its custom resources lifted into the pages.
  docs:
    needs: discover
    if: needs.discover.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # INTO $RUNNER_TEMP, NOT /usr/local/bin. Writing to a system directory
      # assumes the job runs as root, which is true of GitHub-hosted runners and
      # false of most self-hosted ones — so the assumption is invisible until CI
      # runs somewhere else and fails on tar rather than on anything it tests.
      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # THREE checks in one run, and the failure names the command to run --
      # a drift check that reports a difference without the fix is a puzzle.
      #
      #   1. every preset value is one the CHART documents, so the site and the
      #      shipped values cannot come to name different examples
      #   2. no published page names a real host or a real-shaped identifier
      #   3. the committed output matches what the sources produce
      - name: Examples name nothing real, and match their sources
        run: python3 .github/scripts/docs-generate.py --check
      # A template a reader copies must be a resource the API server accepts.
      # Validated against THIS repo's CRDs, so a template that drifts from the
      # schema fails here rather than in someone's cluster.
      - name: Generated templates validate against the CRDs
        run: |
          python3 .github/scripts/crd-schemas.py chart/crds "$RUNNER_TEMP/crd-schemas"
          python3 .github/scripts/docs-generate.py --emit-templates "$RUNNER_TEMP/templates.yaml"
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location "$RUNNER_TEMP/crd-schemas/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            "$RUNNER_TEMP/templates.yaml"

  # Every Dockerfile builds. amd64 only and never pushed: pull-request feedback
  # speed matters more than arch coverage here, and the multi-arch build is
  # exercised at release, where a manifest is actually produced to assert on.
  images:
    needs: discover
    if: needs.discover.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.discover.outputs.images) }}
    name: images (${{ matrix.image.component }})
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.image.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.component }}

  # THE SITE BUILDS. GitHub Pages builds `docs/` natively on merge, which means
  # nothing checks it BEFORE merge: a bad Liquid tag, a missing include or a
  # broken `_config.yml` surfaces on the published site rather than on the pull
  # request that caused it.
  #
  # This runs the same Jekyll build Pages runs, and only that — link checking and
  # prose linting are separate questions and are not smuggled in here.
  site:
    needs: discover
    if: needs.discover.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # NO `configure-pages` STEP. That action exists to prepare a DEPLOYMENT —
      # it reads the repository's Pages configuration and fails without one,
      # which is a deployment concern this job does not have. Building the site
      # is the whole question here; publishing it is Pages' own business.
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

  # WHAT MAY BE PUBLISHED. This repository goes public, so no file and no commit
  # message may say who runs the author's cluster, what it is called, or how to
  # reach it.
  #
  # The guard is an ALLOWLIST of permitted shapes, never a list of forbidden
  # strings — a denylist would have to spell out what it protects, publishing it
  # in the guard itself, and would catch only what somebody already thought of.
  #
  # It reports FILE, LINE and RULE and never the matched text: build logs on a
  # public repository are public, so a guard that quoted its findings would leak
  # them to the audience it exists to protect the tree from. `--show` prints
  # matches locally, where the fixing happens.
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The message scan needs the range under review, so the shallow
          # default clone is not enough.
          fetch-depth: 0

      - name: Scan the tree
        run: python3 .github/scripts/publication-guard.py

      # Messages live OUTSIDE the tree, so a tree-only guard leaves the one hole
      # that cannot be fixed by editing a file later.
      - name: Scan the commit messages under review
        if: github.event_name == 'pull_request'
        run: |
          python3 .github/scripts/publication-guard.py \
            --path /dev/null \
            --messages "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"

  # The OTHER guard over the same published tree, and the opposite shape.
  #
  # `publication` is an ALLOWLIST because naming a private thing in a guard
  # publishes it. This one is a DENYLIST, and that follows from what its subject
  # is: a removed CRD field, a withdrawn tiebreak, a superseded command are all
  # PUBLIC by construction, so listing them costs nothing — and the list IS the
  # value. It is the record of what this project stopped doing, in the one place
  # that fails a build when someone brings it back.
  #
  # Two guards, opposite shapes, each following from its subject. Neither is a
  # template for the other.
  retired-vocabulary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A published spec is READ AS THE CURRENT CONTRACT. A retired name
      # asserted there tells a stranger the project does something it stopped
      # doing, which is worse than saying nothing, because a spec is trusted.
      #
      # Recording a removal still passes: each term carries the words that mark
      # a sentence as a record. The report names file, line and term and never
      # quotes the line — `--show` is for local fixing.
      - name: No retired vocabulary asserted as a current claim
        run: python3 .github/scripts/retired-vocabulary-guard.py

  # THE PLANNING ARTIFACTS PARSE, AND THE PUBLISHED CONTRACT STILL DOES.
  #
  # `openspec` appeared in NO workflow until this job. `openspec/specs/` is what
  # this project points at for "is this behaviour intended", and a specification
  # is trusted precisely because nothing else reads it -- no compiler, no test --
  # so a malformed one looks exactly like a correct one until somebody relies on
  # it.
  #
  # SCOPE IS WHAT MAKES IT SURVIVABLE. Specs are validated ALWAYS; a change is
  # validated only when this pull request touches it. A dozen changes are open at
  # any time and an unfinished delta is unfinished correctly -- judging all of
  # them would fail every pull request for work it was not about, and the job
  # would be switched off within a day.
  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The change filter diffs against a base commit, exactly as `discover`
          # does, so the shallow default clone is not enough.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # PINNED. An unpinned CLI would change the definition of valid between one
      # pull request and the next, which is the one thing a gate may not do.
      - run: npm install -g @fission-ai/openspec@1.10.0
      - name: The published specifications are valid
        run: openspec validate --specs --strict
      - name: Every change this pull request touches is valid
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          changed=""
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" || true)
          fi
          # `|| true` IS LOAD-BEARING, AND ITS ABSENCE FAILED THE FIRST PULL
          # REQUEST THAT TOUCHED NO CHANGE. `grep` exits 1 when it prints
          # nothing, `pipefail` promotes that to the pipeline's status, and
          # `set -e` kills the step INSIDE the command substitution — so the
          # empty-`names` branch three lines down, which exists precisely for
          # this case, was never reached. The step failed in 18ms having printed
          # not one word, which reads as a broken runner rather than as a
          # no-match.
          names=$(printf '%s\n' "$changed" \
            | sed -n 's|^openspec/changes/\([^/]*\)/.*|\1|p' \
            | grep -v '^archive$' | sort -u || true)
          if [ -z "$names" ]; then
            echo "this pull request touches no openspec change"
            exit 0
          fi
          failed=0
          for name in $names; do
            [ -d "openspec/changes/$name" ] || { echo "  skipped  $name (deleted)"; continue; }
            echo "::group::$name"
            openspec validate "$name" --type change --strict || failed=1
            echo "::endgroup::"
          done
          exit $failed

  # DOCUMENTATION IS PART OF THE CHANGE, FOR EVERYONE.
  #
  # The rule was enforced in exactly one place: a PreToolUse hook in one
  # contributor's local harness. That is absent for every other contributor, for
  # every session whose harness is not installed, and for automation -- and this
  # repository is public, so "every other contributor" is a real population now.
  #
  # The hook and this job call the SAME script, and a third step proves they
  # agree. Two enforcement points asking one question is safe only while they
  # give one answer.
  docs-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # EVERY SCRIPT THIS WORKFLOW DEPENDS ON, not only the documentation gate.
      # They decide things — refusing a commit, refusing to resolve somebody's
      # review thread, opening an issue — and each was originally verified once
      # by hand. `gh` and `openspec` are stubbed, so the suite reaches no network
      # and touches no real repository.
      - name: The workflow's own scripts
        run: ./.github/tests/run.sh
      - name: Every change this pull request touches carries a finished documentation task
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "no base commit to diff against; nothing to check"
            exit 0
          fi
          python3 .github/scripts/docs-task-guard.py --range "$BASE_SHA..$GITHUB_SHA"

  # THE TITLE IS THE COMMIT SUBJECT, BECAUSE THE MERGE IS A SQUASH.
  #
  # `git log --oneline` is meant to read as an account of this project, and with
  # a squash merge the one line it gains per change is the pull request's TITLE.
  # A title is the one field nobody proofreads -- it is typed once, at the moment
  # the work feels finished -- so it is checked rather than trusted.
  #
  # Push events skip this: there is no title to check, and `ci-green` treats a
  # skipped job as passed by having nothing to do.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: The title follows the commit convention
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if printf '%s' "$TITLE" \
             | grep -qE '^(feat|fix|docs|chore|refactor|test|ci)(\([a-z0-9._/-]+\))?!?: .+'; then
            echo "ok: $TITLE"
            exit 0
          fi
          cat >&2 <<EOF
          This pull request's title becomes the commit subject on master:

            $TITLE

          It must read: type(scope): what it does, as a sentence.

            types   feat, fix, docs, chore, refactor, test, ci
            scope   the component, subsystem or surface -- manager, console,
                    wiring, site, openspec
            !       before the colon marks a breaking change, which also owes an
                    entry in docs/CHANGELOG.md

            feat(wiring)!: the Pipeline names the identity, and SILENCE MEANS NO POWER
            fix(console): the asset harnesses wrote to platform/docs, and said it worked

          The subject says what changed and why it mattered, not which files moved.
          See CONTRIBUTING.md.
          EOF
          exit 1

  # THE ONE REQUIRED CHECK, AND THE REASON PATH FILTERING IS SAFE.
  #
  # A branch-protection rule names a check by NAME. A job SKIPPED because its
  # paths were untouched never reports that name, so a rule requiring it blocks
  # the pull request forever — which is how path filtering and required checks
  # quietly become incompatible.
  #
  # This job always runs and decides for itself. `success()` is not used: it
  # treats a skipped dependency inconsistently while reading as though it were
  # checking one. Reading the results explicitly states what the gate means — a
  # SKIPPED job passed by having nothing to do, a CANCELLED one did not pass.
  ci-green:
    name: ci-green
    if: always()
    needs: [discover, operator, modules, console-ui, chart, docs, site, images, publication, retired-vocabulary, openspec, docs-task, pr-title]
    runs-on: ubuntu-latest
    steps:
      - name: Every relevant check passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "  \(.value.result)\t\(.key)"'
          bad=$(echo "$RESULTS" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key) (\(.value.result))"')
          if [ -n "$bad" ]; then
            echo
            echo "not green:"
            echo "$bad" | sed 's/^/  /'
            exit 1
          fi
          echo
          echo "every relevant check passed"


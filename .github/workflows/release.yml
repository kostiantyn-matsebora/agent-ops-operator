# One tag publishes one component.
#
# `<component>-v<semver>`: manager-v0.38.2, console-v0.16.1, chart-v5.26.0.
# Fourteen independently-versioned artifacts (thirteen images plus the chart),
# which is what a repo-wide version line would collapse — forcing a manager
# release every time an adapter changes.
name: release

on:
  push:
    tags: ['*-v*']

# THE FLOOR, and the ceiling for `determine`. A CALLED workflow can only
# DOWNGRADE this token, never upgrade it — so the two publishing jobs raise it
# on themselves below. Leaving it at `contents: read` here makes every push 403,
# and the called workflow's own `packages: write` is silently ignored.
permissions:
  contents: read

jobs:
  # A typo'd tag must FAIL, never skip. A path- or if-filtered job that quietly
  # does nothing is indistinguishable from a successful release.
  determine:
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.parse.outputs.component }}
      version: ${{ steps.parse.outputs.version }}
      platforms: ${{ steps.parse.outputs.platforms }}
      context: ${{ steps.parse.outputs.context }}
      dockerfile: ${{ steps.parse.outputs.dockerfile }}
      is_image: ${{ steps.parse.outputs.is_image }}
      is_chart: ${{ steps.parse.outputs.is_chart }}
    steps:
      - uses: actions/checkout@v7
      - id: parse
        run: |
          set -euo pipefail
          ref="${GITHUB_REF#refs/tags/}"
          component="${ref%-v*}"
          version="${ref##*-v}"

          valid=$(./.github/components.sh images | jq -r '.[].component')
          usage() {
            echo "::error::Tag '$ref' is not a release tag."
            echo "::error::Use <component>-v<semver>, where <component> is one of:"
            echo "::error::  $(echo "$valid" | tr '\n' ' ') chart"
            exit 1
          }

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || usage

          if [ "$component" = "chart" ]; then
            echo "is_chart=true"  >> "$GITHUB_OUTPUT"
            echo "is_image=false" >> "$GITHUB_OUTPUT"
          elif echo "$valid" | grep -qx "$component"; then
            entry=$(./.github/components.sh images | jq -c --arg c "$component" '.[] | select(.component == $c)')
            echo "is_chart=false" >> "$GITHUB_OUTPUT"
            echo "is_image=true"  >> "$GITHUB_OUTPUT"
            echo "platforms=$(jq -r .platforms <<<"$entry")"   >> "$GITHUB_OUTPUT"
            echo "context=$(jq -r .context <<<"$entry")"       >> "$GITHUB_OUTPUT"
            echo "dockerfile=$(jq -r .dockerfile <<<"$entry")" >> "$GITHUB_OUTPUT"
          else
            usage
          fi
          echo "component=$component" >> "$GITHUB_OUTPUT"
          echo "version=$version"     >> "$GITHUB_OUTPUT"

  # A TAG MUST NOT PUBLISH FROM A COMMIT CI NEVER PASSED.
  #
  # `chart-v13.0.1` was cut from a commit whose `ci` run was RED. It was
  # harmless — a generated documentation block had gone stale, no chart content
  # was involved — but nothing about the release path made it harmless, and the
  # next one would not announce itself either.
  #
  # A tag push runs THIS workflow and nothing else, so the evidence has to be
  # looked up: the `ci` run for the same SHA, which exists because the commit
  # reached master before it was tagged.
  #
  # IT WAITS RATHER THAN RACING. Pushing a branch and its tag together is the
  # ordinary thing to do, and CI is then still queued — a gate that failed on
  # that would teach everyone to push tags twice.
  ci_is_green:
    name: ci is green for this commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a successful ci run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100"

          for attempt in $(seq 1 40); do
            runs=$(gh api "$api" --jq '.workflow_runs[] | "\(.status) \(.conclusion)"' || true)

            if grep -q '^completed success$' <<<"$runs"; then
              echo "ci passed for $GITHUB_SHA"
              exit 0
            fi

            if [ -z "$runs" ]; then
              state="no ci run exists for this commit"
            elif grep -qv '^completed' <<<"$runs"; then
              state="ci is still running"
            else
              state="ci completed and did not pass"
              break
            fi

            echo "$state — waiting (${attempt}/40)"
            sleep 30
          done

          echo "::error::Refusing to publish ${GITHUB_REF#refs/tags/}: $state."
          echo "::error::The tagged commit is $GITHUB_SHA."
          echo "::error::Fix it, or re-run ci for that commit, then move the tag."
          exit 1

  # THE SMOKE IS KEYED TO THE COMMIT, NOT THE TAG. A release is many tags on
  # one commit — fourteen on 2026-09-06 — and each ran its own ten-minute
  # cluster smoke in parallel on shared runners: a k3d image import deadlocked
  # under the concurrent load, and the console lifecycle lane timed out on a
  # step that takes eight seconds when the runners are quiet. Both failures
  # were LOAD, not code, and a re-run changed nothing.
  #
  # This job answers "was this commit already smoked" the way `ci_is_green`
  # answers "did ci already pass for this commit" — by looking up existing
  # evidence rather than trusting the tag. The evidence is the commit's CHECK
  # RUNS: the smoke is a reusable workflow called by a job named `smoke`, so
  # every smoke — from this workflow or from `e2e-smoke.yml` — appears on the
  # commit as `smoke / e2e / smoke`, whichever workflow produced it. Finding a
  # passed one skips provisioning a cluster here; finding one still running
  # waits for its verdict rather than racing it, since tags are pushed three
  # at a time by rule and land on the commit together.
  smoke_is_green:
    name: smoke is green for this commit
    needs: [determine, ci_is_green]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      smoked: ${{ steps.lookup.outputs.smoked }}
    steps:
      - uses: actions/checkout@v7
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/smoke-evidence.py --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  # ONE reusable job for all thirteen images. The component decides the context,
  # the Dockerfile and the platforms; nothing here is per-component.
  #
  # The chart is the OTHER artifact kind and gets its own called workflow below.
  # They share no step — an image is built and its MANIFEST asserted, a chart is
  # rendered and its REFERENCES asserted — so one file each.
  # THE SMOKE GATES A RELEASE. ci proved the tagged commit's modules, chart and
  # images in isolation; this proves the chart installs and answers on a real
  # single-node cluster with the stub runtime. A pull request meets conformance
  # only and never this cluster; the smoke runs HERE, on the exact commit being
  # published, because a tag can land on a commit ci passed days ago — UNLESS
  # `smoke_is_green` already found a passed one for this commit, in which case
  # running a second is exactly the load this two-job split exists to avoid.
  smoke:
    name: smoke
    needs: [determine, ci_is_green, smoke_is_green]
    if: |
      !cancelled() && needs.ci_is_green.result == 'success' &&
      needs.smoke_is_green.outputs.smoked != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml
    with:
      tier: smoke

  # GATED ON THE COMMIT BEING SMOKED, WHETHER THIS RUN PRODUCED IT OR FOUND IT.
  # `!cancelled()` is what lets these run behind a `smoke` that was legitimately
  # SKIPPED — the platform skips a job's dependants by default when a dependency
  # is skipped, which would otherwise publish nothing on the reuse path this
  # change adds. The rest of the condition states the two acceptable histories
  # and no other: this run's own smoke passed, or none ran here because the
  # lookup found an earlier one that did. A smoke that FAILED in this run never
  # publishes, whatever the lookup said before it started.
  image:
    name: image (${{ needs.determine.outputs.component }})
    needs: [determine, ci_is_green, smoke_is_green, smoke]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    if: |
      !cancelled() && needs.determine.outputs.is_image == 'true' &&
      needs.ci_is_green.result == 'success' &&
      (needs.smoke.result == 'success' ||
       (needs.smoke.result == 'skipped' && needs.smoke_is_green.outputs.smoked == 'true'))
    uses: ./.github/workflows/build-image.yml
    with:
      component: ${{ needs.determine.outputs.component }}
      context: ${{ needs.determine.outputs.context }}
      dockerfile: ${{ needs.determine.outputs.dockerfile }}
      platforms: ${{ needs.determine.outputs.platforms }}
      version: ${{ needs.determine.outputs.version }}

  chart:
    name: chart
    needs: [determine, ci_is_green, smoke_is_green, smoke]
    permissions:
      contents: read
      packages: write
    if: |
      !cancelled() && needs.determine.outputs.is_chart == 'true' &&
      needs.ci_is_green.result == 'success' &&
      (needs.smoke.result == 'success' ||
       (needs.smoke.result == 'skipped' && needs.smoke_is_green.outputs.smoked == 'true'))
    uses: ./.github/workflows/build-chart.yml
    with:
      version: ${{ needs.determine.outputs.version }}

  # THE RELEASE ENTRY, AND IT IS NOT DECORATION.
  #
  # A tag publishes an image or a chart to GHCR and nothing else, so the repo's
  # Releases page stayed EMPTY through thirteen published packages — the first
  # thing a stranger looks at to decide whether a project is alive said nothing
  # had ever shipped.
  #
  # It runs AFTER the artifact, and only when the artifact actually published:
  # an entry announcing a version the registry does not hold is worse than none,
  # because that is exactly the page somebody copies an install command from.
  #
  # ONLY THE CHART GETS ONE, AND THE COMPONENTS DELIBERATELY DO NOT.
  # The chart version is the one an adopter types; an image tag is an
  # implementation detail the chart references and nobody installs directly.
  # Fourteen artifact kinds streaming onto one page buries the single number
  # somebody came there to read. Component tags still exist — they are the
  # provenance of a published image — they just do not announce themselves.
  github_release:
    name: github release
    needs: [determine, chart]
    if: needs.determine.outputs.is_chart == 'true' && needs.chart.result == 'success' 
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Compose the notes and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.determine.outputs.version }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          notes=$(mktemp)
          {
            echo "\`\`\`sh"
            echo "helm install agent-ops \\"
            echo "  oci://ghcr.io/$owner/charts/agent-ops-operator \\"
            echo "  --version $VERSION -n agent-ops --create-namespace"
            echo "\`\`\`"
            echo
            # The CHANGELOG entry for exactly this version, or nothing. An entry
            # inventing its own summary drifts from the file every upgrade
            # decision is actually made from.
            awk -v v="## [$VERSION]" '
              index($0, v) == 1 { on = 1; next }
              on && /^## \[/     { exit }
              on                 { print }
            ' docs/CHANGELOG.md
          } > "$notes"

          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "chart $VERSION" --notes-file "$notes" --verify-tag

# One tag publishes one component.
#
# `<component>-v<semver>`: manager-v0.38.2, console-v0.16.1, chart-v5.26.0.
# Fourteen independently-versioned artifacts (thirteen images plus the chart),
# which is what a repo-wide version line would collapse — forcing a manager
# release every time an adapter changes.
name: release

on:
  push:
    tags: ['*-v*']

# THE FLOOR, and the ceiling for `determine`. A CALLED workflow can only
# DOWNGRADE this token, never upgrade it — so the two publishing jobs raise it
# on themselves below. Leaving it at `contents: read` here makes every push 403,
# and the called workflow's own `packages: write` is silently ignored.
permissions:
  contents: read

jobs:
  # A typo'd tag must FAIL, never skip. A path- or if-filtered job that quietly
  # does nothing is indistinguishable from a successful release.
  determine:
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.parse.outputs.component }}
      version: ${{ steps.parse.outputs.version }}
      platforms: ${{ steps.parse.outputs.platforms }}
      context: ${{ steps.parse.outputs.context }}
      dockerfile: ${{ steps.parse.outputs.dockerfile }}
      is_image: ${{ steps.parse.outputs.is_image }}
      is_chart: ${{ steps.parse.outputs.is_chart }}
    steps:
      - uses: actions/checkout@v4
      - id: parse
        run: |
          set -euo pipefail
          ref="${GITHUB_REF#refs/tags/}"
          component="${ref%-v*}"
          version="${ref##*-v}"

          valid=$(./.github/components.sh images | jq -r '.[].component')
          usage() {
            echo "::error::Tag '$ref' is not a release tag."
            echo "::error::Use <component>-v<semver>, where <component> is one of:"
            echo "::error::  $(echo "$valid" | tr '\n' ' ') chart"
            exit 1
          }

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || usage

          if [ "$component" = "chart" ]; then
            echo "is_chart=true"  >> "$GITHUB_OUTPUT"
            echo "is_image=false" >> "$GITHUB_OUTPUT"
          elif echo "$valid" | grep -qx "$component"; then
            entry=$(./.github/components.sh images | jq -c --arg c "$component" '.[] | select(.component == $c)')
            echo "is_chart=false" >> "$GITHUB_OUTPUT"
            echo "is_image=true"  >> "$GITHUB_OUTPUT"
            echo "platforms=$(jq -r .platforms <<<"$entry")"   >> "$GITHUB_OUTPUT"
            echo "context=$(jq -r .context <<<"$entry")"       >> "$GITHUB_OUTPUT"
            echo "dockerfile=$(jq -r .dockerfile <<<"$entry")" >> "$GITHUB_OUTPUT"
          else
            usage
          fi
          echo "component=$component" >> "$GITHUB_OUTPUT"
          echo "version=$version"     >> "$GITHUB_OUTPUT"

  # ONE reusable job for all thirteen images. The component decides the context,
  # the Dockerfile and the platforms; nothing here is per-component.
  #
  # The chart is the OTHER artifact kind and gets its own called workflow below.
  # They share no step — an image is built and its MANIFEST asserted, a chart is
  # rendered and its REFERENCES asserted — so one file each.
  image:
    name: image (${{ needs.determine.outputs.component }})
    needs: determine
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    if: needs.determine.outputs.is_image == 'true'
    uses: ./.github/workflows/build-image.yml
    with:
      component: ${{ needs.determine.outputs.component }}
      context: ${{ needs.determine.outputs.context }}
      dockerfile: ${{ needs.determine.outputs.dockerfile }}
      platforms: ${{ needs.determine.outputs.platforms }}
      version: ${{ needs.determine.outputs.version }}

  chart:
    name: chart
    needs: determine
    permissions:
      contents: read
      packages: write
    if: needs.determine.outputs.is_chart == 'true'
    uses: ./.github/workflows/build-chart.yml
    with:
      version: ${{ needs.determine.outputs.version }}

  # THE RELEASE ENTRY, AND IT IS NOT DECORATION.
  #
  # A tag publishes an image or a chart to GHCR and nothing else, so the repo's
  # Releases page stayed EMPTY through thirteen published packages — the first
  # thing a stranger looks at to decide whether a project is alive said nothing
  # had ever shipped.
  #
  # It runs AFTER the artifact, and only when the artifact actually published:
  # an entry announcing a version the registry does not hold is worse than none,
  # because that is exactly the page somebody copies an install command from.
  #
  # ONLY THE CHART GETS ONE, AND THE COMPONENTS DELIBERATELY DO NOT.
  # The chart version is the one an adopter types; an image tag is an
  # implementation detail the chart references and nobody installs directly.
  # Fourteen artifact kinds streaming onto one page buries the single number
  # somebody came there to read. Component tags still exist — they are the
  # provenance of a published image — they just do not announce themselves.
  github_release:
    name: github release
    needs: [determine, chart]
    if: needs.determine.outputs.is_chart == 'true' && needs.chart.result == 'success' 
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compose the notes and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.determine.outputs.version }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          notes=$(mktemp)
          {
            echo "\`\`\`sh"
            echo "helm install agent-ops \\"
            echo "  oci://ghcr.io/$owner/charts/agent-ops-operator \\"
            echo "  --version $VERSION -n agent-ops --create-namespace"
            echo "\`\`\`"
            echo
            # The CHANGELOG entry for exactly this version, or nothing. An entry
            # inventing its own summary drifts from the file every upgrade
            # decision is actually made from.
            awk -v v="## [$VERSION]" '
              index($0, v) == 1 { on = 1; next }
              on && /^## \[/     { exit }
              on                 { print }
            ' docs/CHANGELOG.md
          } > "$notes"

          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "chart $VERSION" --notes-file "$notes" --verify-tag

# TEMPORARY. Deletes the SonarCloud projects CI auto-created; removed before merge.
name: sonar-cleanup
on:
  push:
    branches: [change/sonarcloud-analysis]
    paths: [.github/workflows/sonar-cleanup.yml]
env:
  # false = list projects only; true = delete the 15 derived keys
  DELETE: "false"
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
        run: |
          set -eu
          echo "== projects in the organisation (lastAnalysisDate  key  name)"
          curl -sf -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/projects/search?organization=$SONAR_ORG&ps=100" \
            | jq -r '.components[] | "\(.lastAnalysisDate // "never")\t\(.key | sub("^[^_]+_"; "ORG_"))\t\(.name)"'
          [ "$DELETE" = "true" ] || exit 0
          echo "== deleting derived keys"
          for c in $(./.github/components.sh images | jq -r '.[].component'); do
            key="${SONAR_ORG}_agent-ops-operator_${c}"
            code=$(curl -s -o /dev/null -w '%{http_code}' -u "$SONAR_TOKEN:" -X POST \
              "https://sonarcloud.io/api/projects/delete" --data-urlencode "project=$key")
            echo "$code  ORG_agent-ops-operator_$c"
          done

# A PERSON COMMENTED ON A PULL REQUEST THE LOOP IS DRIVING. The one required
# check that reads the CONVERSATION is `docs-task`: through `autofix-guard.py`
# it fails while a dispute the fixing loop posted has no answer from a person.
# A reply is that answer -- and a comment starts no `ci`, so without this the
# pull request stayed red until somebody re-ran a job by hand, which is the
# manual step the conveyor exists to remove (asked on #220, 2026-09-17).
#
# THE REACTION IS A RE-RUN OF THAT ONE JOB, in the head's own `pull_request`
# ci run, so `ci-green` re-evaluates in the same run and the merge box sees it
# (#131: a run under this event would never reach the merge box). Green, the
# `open` job then marks the head mergeable; red, the loop's own `ci failure`
# trigger starts the next round. Nothing here decides anything.
#
# WHO COUNTS: anybody who is not a bot. The fixing loop's own comments are
# bot-authored and never re-run anything; `/fix-accepted` is a DISPATCH and
# belongs to review-dispatch.yml, which already listens on the same events.
#
# `actions: write` IS THE RE-RUN AND NOTHING ELSE. No checkout of the pull
# request's tree, no model, no contents, no pull-requests write.
name: dispute-answered

run-name: "dispute-answered #${{ github.event.issue.number || github.event.pull_request.number }}"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

concurrency:
  group: dispute-answered-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  rerun:
    if: >-
      github.event.comment.user.type != 'Bot' &&
      !startsWith(github.event.comment.body, '/fix-accepted') &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      # THE TRUSTED COPY. The program runs from the default branch, never from
      # the pull request's tree -- a pull request may not rewrite what
      # re-evaluates its own check.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Re-run docs-task on the head's own ci run, if it failed and the loop is on
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          LABEL=$(python3 -c 'import json;print(json.load(open(".github/review-triage.json"))["approve_label"])')
          read -r sha labelled < <(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid,labels \
            --jq "\"\(.headRefOid) \([.labels[].name] | index(\"$LABEL\") != null)\"")
          if [ "$labelled" != "true" ]; then
            echo "#$PR does not carry \`$LABEL\`; the loop is not driving it, nothing to re-evaluate"
            exit 0
          fi
          python3 .github/scripts/rerun-ci-job.py \
            --repo "$GITHUB_REPOSITORY" --sha "$sha" --pr "$PR" --job docs-task

# Publishing THE CHART, and proving what it points at.
#
# Called by release.yml on a `chart-v<semver>` tag, exactly as build-image.yml is
# called on a component tag. The two are separate files because they share no
# step: an image is built and its manifest asserted, a chart is rendered and its
# REFERENCES asserted. Folding them together would produce one job wearing two
# sets of `if:`.
#
# Three properties are load-bearing here, and each replaced a rule that lived
# only in someone's memory:
#
#   1. Chart.yaml's version equals the tag. The OCI artifact's tag and its
#      embedded metadata disagreeing is invisible until somebody debugs a
#      deployment.
#   2. Every first-party image the chart renders already exists, resolved
#      ANONYMOUSLY — which doubles as the check that each package was actually
#      made public.
#   3. The chart version is checked BEFORE the push (never overwrite a
#      published version).
name: build-chart

on:
  workflow_call:
    inputs:
      version:
        description: Semver, without the leading v. Must equal chart/Chart.yaml.
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      CHARTS: oci://ghcr.io/${{ github.repository_owner }}/charts
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Assert Chart.yaml agrees with the tag
        run: |
          declared=$(grep -E '^version:' chart/Chart.yaml | awk '{print $2}')
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::tag says $VERSION, chart/Chart.yaml says $declared"
            exit 1
          fi

      # SHIPPING A CHART THAT POINTS AT IMAGES NOBODY PUSHED is the likeliest
      # release-day mistake in a multi-artifact repo, and it is cheap to
      # prevent.
      #
      # Rendered with EVERYTHING ON, because a bundle that is off by default
      # renders no image and would gate nothing — and its images are exactly the
      # ones a release forgets. Matched by image NAME rather than by the `image:`
      # key: the context sidecar and the egress proxy reach their pods as
      # manager configuration, so a key-based scan misses both.
      #
      # `signal-cron` is deliberately absent from this gate: the chart ships no
      # cron bundle, so the chart cannot point at it. CI still builds it and a
      # tag still publishes it.
      - name: Assert every first-party image the chart renders exists
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          rendered=$(helm template ci chart \
            --set global.demo.enabled=true \
            --set kubernetes.enabled=true \
            --set prometheus.enabled=true \
            --set prometheus.metrics.url=http://metrics.example:8428 \
            --set home-assistant.enabled=true \
            --set home-assistant.homeAssistant.endpoint=https://ha.example.org \
            --set home-assistant.homeAssistant.credentials.operatorToken=ci-token \
            --set telegram.enabled=true \
            --set telegram.surface.enabled=true \
            --set telegram.surface.chatId=-1001234567890 \
            --set telegram.surface.credentials.botToken=ci:token \
            --set housekeeping.enabled=true \
            --set runtime.egressMediation.enabled=true \
            --set 'runtime.contextSync.paths={.claude/projects/**}')
          # Ours by NAMESPACE, never a hardcoded vendor list — the third-party
          # set has already turned over once.
          refs=$(grep -Eo "(ghcr\.io/$owner/|kmatsebora/)agentops-[a-z0-9-]+:[A-Za-z0-9._-]+" <<<"$rendered" | sort -u)
          [ -n "$refs" ] || { echo "::error::no first-party image references found — the extraction is broken"; exit 1; }
          missing=0
          while read -r ref; do
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "ok       $ref"
            else
              echo "::error::chart references $ref, which cannot be resolved anonymously"
              echo "::error::either it was never pushed, or its package is still private"
              missing=1
            fi
          done <<< "$refs"
          exit $missing

      - name: Refuse to overwrite a published chart version
        run: |
          if helm show chart "$CHARTS/agent-ops-operator" --version "$VERSION" >/dev/null 2>&1; then
            echo "::error::agent-ops-operator $VERSION is already published — cut a new patch version."
            exit 1
          fi

      - name: Package and push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package chart --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/agent-ops-operator-$VERSION.tgz" "$CHARTS"

      - name: Verify it installs from the registry
        run: helm show chart "$CHARTS/agent-ops-operator" --version "$VERSION"

# The pr tier ON DEMAND, ON ANY BRANCH: contract conformance and the k3s
# smoke on the stub runtime. The same jobs gate every pull request through
# ci.yml and every release through release.yml; this is the way to run them
# against a branch before either.
#
#   gh workflow run e2e-smoke.yml --ref <branch>
#
# (GitHub offers a workflow for dispatch once its file is on the default
# branch; from then on --ref runs the copy on the branch you name.)
name: e2e-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    uses: ./.github/workflows/e2e.yml
    with:
      tier: pr

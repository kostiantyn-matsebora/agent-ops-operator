# TEMPORARY. Creates the per-component subprojects inside the monorepo binding
# of the project SONAR_PROJECT_KEY names. Removed before merge.
name: sonar-setup
on:
  push:
    branches: [change/sonarcloud-analysis]
    paths: [.github/workflows/sonar-setup.yml]
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          set -u
          api() { curl -s -u "$SONAR_TOKEN:" "$@"; }
          mask() { sed "s/$SONAR_ORG/ORG/g"; }
          inst="${SONAR_ORG}/agent-ops-operator|1324376362"
          projects=$(./.github/components.sh images | jq -c --arg o "$SONAR_ORG" '[.[] | {projectKey: ($o + "_agent-ops-operator_" + .component), projectName: ("agentops-" + .component)}]')
          echo "== is the repository listed / already linked"
          api "https://sonarcloud.io/api/alm_integration/list_repositories?organization=$SONAR_ORG&alm=github&ps=100" | jq -c '.repositories[] | select(.label=="agent-ops-operator")' | mask
          try() { echo "-- $1"; api -w '\nhttp %{http_code}\n' -X POST -H 'Content-Type: application/json' "https://sonarcloud.io/api/alm_integration/provision_monorepo_projects" --data "$2" | mask | head -c 1500; echo; }
          try A "$(jq -nc --arg o "$SONAR_ORG" --arg i "$inst" --argjson p "$projects" '{organization:$o, installationKey:$i, projects:$p}')"
          try B "$(jq -nc --arg o "$SONAR_ORG" --arg i "$inst" --argjson p "$projects" '{organization:$o, installationKeys:[$i], projects:($p|map({key:.projectKey,name:.projectName}))}')"
          echo "== projects now"
          api "https://sonarcloud.io/api/projects/search?organization=$SONAR_ORG&ps=100" | jq -r '.components[] | "\(.key)\t\(.name)"' | mask

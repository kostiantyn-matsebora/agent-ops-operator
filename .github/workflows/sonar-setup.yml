# TEMPORARY. Creates the per-component subprojects inside the monorepo binding
# of the project SONAR_PROJECT_KEY names. Removed before merge.
name: sonar-setup
on:
  push:
    branches: [change/sonarcloud-analysis]
    paths: [.github/workflows/sonar-setup.yml]
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          set -u
          api() { curl -s -u "$SONAR_TOKEN:" "$@"; }
          echo "== projects now"
          api "https://sonarcloud.io/api/projects/search?organization=$SONAR_ORG&ps=100" | jq -r '.components[] | "\(.lastAnalysisDate // "never")\t\(.key | sub("^[^_]+_"; "ORG_"))\t\(.name | sub("^[^_]+_"; "ORG_"))"'
          echo "== create error body"
          api -X POST "https://sonarcloud.io/api/projects/create" --data-urlencode "organization=$SONAR_ORG" --data-urlencode "project=${SONAR_ORG}_agent-ops-operator_probe" --data-urlencode "name=probe" | sed "s/$SONAR_ORG/ORG/g" | head -c 600; echo
          api -X POST "https://sonarcloud.io/api/projects/delete" --data-urlencode "project=${SONAR_ORG}_agent-ops-operator_probe" -o /dev/null -w 'probe delete %{http_code}\n'
          echo "== web services mentioning alm / monorepo / provision"
          api "https://sonarcloud.io/api/webservices/list" | jq -r '.webServices[] | .path as $p | .actions[] | "\($p)/\(.key)\t\((.params // []) | map(.key) | join(","))"' | grep -iE "alm|monorepo|provision|projects/create|navigation/component" 
          echo "== monorepo project navigation"
          api "https://sonarcloud.io/api/navigation/component?component=$SONAR_PROJECT_KEY" | jq -c '{key: (.key|sub("^[^_]+_"; "ORG_")), alm: .alm, almRepository: .almRepository, isMonorepo: .isMonorepo, monorepo: .monorepo, qualifier: .qualifier}' 2>/dev/null | sed "s/$SONAR_ORG/ORG/g"

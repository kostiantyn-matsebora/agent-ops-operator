# TEMPORARY. Creates the per-component subprojects inside the monorepo binding
# of the project SONAR_PROJECT_KEY names. Removed before merge.
name: sonar-setup
on:
  push:
    branches: [change/sonarcloud-analysis]
    paths: [.github/workflows/sonar-setup.yml]
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          set -u
          api() { curl -s -u "$SONAR_TOKEN:" "$@"; }
          for c in manager runtime-claude; do
            key="${SONAR_ORG}_agent-ops-operator_$c"
            echo "== $c: background tasks"
            api "https://sonarcloud.io/api/ce/activity?component=$key&ps=3" | jq -c '.tasks[] | {status, pullRequest, branch, errorMessage, warningCount, executedAt}' | sed "s/$SONAR_ORG/ORG/g"
            echo "== $c: pull requests known to the project"
            api "https://sonarcloud.io/api/project_pull_requests/list?project=$key" | jq -c '.pullRequests[]? | {key, title, status, analysisDate}' | sed "s/$SONAR_ORG/ORG/g"
            echo "== $c: task warnings"
            tid=$(api "https://sonarcloud.io/api/ce/activity?component=$key&ps=1" | jq -r '.tasks[0].id')
            api "https://sonarcloud.io/api/ce/task?id=$tid&additionalFields=warnings" | jq -c '.task | {status, warnings, errorMessage}' | sed "s/$SONAR_ORG/ORG/g"
          done

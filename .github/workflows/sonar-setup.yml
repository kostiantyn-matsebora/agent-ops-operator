# TEMPORARY. Creates the per-component subprojects inside the monorepo binding
# of the project SONAR_PROJECT_KEY names. Removed before merge.
name: sonar-setup
on:
  push:
    branches: [change/sonarcloud-analysis]
    paths: [.github/workflows/sonar-setup.yml]
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          set -u
          api() { curl -s -u "$SONAR_TOKEN:" "$@"; }
          F='[.component.measures[]? | .metric + "=" + (.value // .period.value // "-")] | join(",")'
          echo "== monorepo membership and PR 127 measures"
          keys="$SONAR_PROJECT_KEY $(./.github/components.sh images | jq -r --arg o "$SONAR_ORG" '.[] | $o + "_agent-ops-operator_" + .component' | tr '\n' ' ')"
          for key in $keys; do
            bound=$(api "https://sonarcloud.io/api/alm_integration/is_bound_to_monorepo?project=$key" | jq -r '.isBoundToMonorepo')
            m=$(api "https://sonarcloud.io/api/measures/component?component=$key&pullRequest=127&metricKeys=new_coverage,bugs,vulnerabilities,code_smells,security_hotspots,new_lines" | jq -r "$F")
            echo "$bound $key $m" | sed "s/$SONAR_ORG/ORG/g"
          done

# TEMPORARY. Creates the per-component subprojects inside the monorepo binding
# of the project SONAR_PROJECT_KEY names. Removed before merge.
name: sonar-setup
on:
  push:
    branches: [change/sonarcloud-analysis]
    paths: [.github/workflows/sonar-setup.yml]
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          set -u
          api() { curl -s -u "$SONAR_TOKEN:" "$@"; }
          mask() { sed "s/$SONAR_ORG/ORG/g"; }
          inst="${SONAR_ORG}/agent-ops-operator|1324376362"
          echo "== bound to monorepo?"
          api "https://sonarcloud.io/api/alm_integration/is_bound_to_monorepo?project=$SONAR_PROJECT_KEY" | mask; echo
          body=$(./.github/components.sh images | jq -c --arg o "$SONAR_ORG" --arg i "$inst" '{addAsFavorite:false, newCodeDefinitionType:"NUMBER_OF_DAYS", newCodeDefinitionValue:"30", organization:$o,
            projects:[.[] | {installationKey:$i, projectKey:($o + "_agent-ops-operator_" + .component), projectName:("agentops-" + .component)}]}')
          echo "== provision"
          api -w '\nhttp %{http_code}\n' -X POST -H 'Content-Type: application/json' "https://sonarcloud.io/api/alm_integration/provision_monorepo_projects" --data "$body" | mask | head -c 2000; echo
          echo "== projects now"
          api "https://sonarcloud.io/api/projects/search?organization=$SONAR_ORG&ps=100" | jq -r '.components[] | "\(.key)\t\(.name)"' | mask

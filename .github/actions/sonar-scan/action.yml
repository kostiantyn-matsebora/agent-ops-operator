name: sonar-scan
description: >-
  Analyse one component on SonarCloud, from the job that just built and tested
  it — the checkout, the coverage profile and the toolchain are already there,
  so nothing is uploaded, downloaded or renamed.
inputs:
  dir:
    description: The component directory — the analysis base directory, and what names the component
    required: true
  token:
    description: SONAR_TOKEN
    required: true
  organization:
    description: SONAR_ORG
    required: true
  # A UNIT THAT PUBLISHES NO IMAGE NAMES ITSELF. components.sh answers "what
  # publishes", and the one thing analysed here that does not — the workflow's
  # own scripts — must not be taught to it: a directory it lists is a
  # directory the release tags. So the exception is stated at the call site,
  # and the lookup below is skipped only where a name was given.
  name:
    description: Project name for a unit components.sh does not list; leave unset for a component
    required: false
    default: ""
  sources:
    description: sonar.sources, relative to dir
    required: false
    default: "."
  tests:
    description: sonar.tests, relative to dir
    required: false
    default: "."
  test-inclusions:
    description: sonar.test.inclusions — what inside the test directories is a test
    required: false
    default: "**/*_test.go,**/*.test.ts,**/*.test.tsx,**/*.test.js"
runs:
  using: composite
  steps:
    # THE COMPONENT NAME IS DERIVED FROM THE DIRECTORY, by the one program that
    # names images — never typed at a call site. A directory components.sh does
    # not list is a failure here, not an analysis under a made-up name.
    - id: component
      shell: bash
      env:
        NAMED: ${{ inputs.name }}
      run: |
        if [ -n "$NAMED" ]; then
          echo "name=$NAMED" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        name=$("$GITHUB_WORKSPACE"/.github/components.sh images | jq -r --arg c "./${{ inputs.dir }}" '.[] | select(.context == $c) | .component')
        [ -n "$name" ] || { echo "::error::${{ inputs.dir }} is not a component components.sh lists"; exit 1; }
        echo "name=$name" >> "$GITHUB_OUTPUT"
    # A MISSING PROJECT IS CREATED INSIDE THE MONOREPO BINDING, NEVER BY THE
    # SCANNER. Left to itself the scanner auto-provisions any key it cannot
    # find, and a project created that way is bound to no repository — no
    # pull request decoration, no monorepo membership — while looking exactly
    # like one that was set up. Fifteen of those were created, deleted, and
    # created again by the next push before this step existed. So the project
    # is looked up first, and when absent it is provisioned through
    # .github/scripts/sonar-provision.sh — the monorepo wizard's own call,
    # with this job's token — and looked up again before the scan runs.
    - name: The SonarCloud project exists
      shell: bash
      env:
        SONAR_TOKEN: ${{ inputs.token }}
        SONAR_ORG: ${{ inputs.organization }}
        NAME: ${{ steps.component.outputs.name }}
      run: |
        set -euo pipefail
        exists() {
          n=$(curl -sf -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/projects/search?organization=$SONAR_ORG&projects=${SONAR_ORG}_agent-ops-operator_$NAME" | jq '.components | length')
          [ "$n" = "1" ]
        }
        if ! exists; then
          echo "::notice::no SonarCloud project for $NAME yet; provisioning it inside the monorepo binding"
          "$GITHUB_WORKSPACE"/.github/scripts/sonar-provision.sh "$NAME"
          exists || { echo "::error::provisioning $NAME reported success and the project is still absent — run .github/scripts/sonar-provision.sh by hand (CONTRIBUTING.md, Code analysis)"; exit 1; }
        fi
    # PROPERTIES ARE ARGUMENTS, NOT FIFTEEN PROPERTIES FILES. Test files are
    # DECLARED as tests rather than excluded, so test rules apply and test code
    # is not counted as uncovered source; a component takes the defaults, and
    # the scripts unit narrows sources to the scripts and names its shell tests.
    # Coverage paths name every shape a unit can produce — Go profile,
    # node --test lcov, the console UI's lcov, the scripts' Cobertura XML —
    # and a report that is not there is a scanner INFO, never an error.
    # The QUALITY GATE is deliberately not waited on: this step fails on
    # submission only; the verdict is SonarCloud's own check on the pull
    # request. Measure first, gate in a later change.
    - uses: SonarSource/sonarqube-scan-action@v8.2.1
      env:
        SONAR_TOKEN: ${{ inputs.token }}
      with:
        projectBaseDir: ${{ inputs.dir }}
        args: >-
          -Dsonar.organization=${{ inputs.organization }}
          -Dsonar.projectKey=${{ inputs.organization }}_agent-ops-operator_${{ steps.component.outputs.name }}
          -Dsonar.projectName=agentops-${{ steps.component.outputs.name }}
          -Dsonar.sources=${{ inputs.sources }}
          -Dsonar.exclusions=**/zz_generated.deepcopy.go,**/node_modules/**,**/dist/**,**/coverage/**,ui/e2e/**,ui/screenshots/**,ui/demo/**
          -Dsonar.tests=${{ inputs.tests }}
          -Dsonar.test.inclusions=${{ inputs.test-inclusions }}
          -Dsonar.go.coverage.reportPaths=coverage.out
          -Dsonar.python.coverage.reportPaths=coverage.xml
          -Dsonar.javascript.lcov.reportPaths=coverage.lcov,ui/coverage/lcov.info
          -Dsonar.typescript.lcov.reportPaths=ui/coverage/lcov.info

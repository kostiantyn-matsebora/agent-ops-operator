# Site navigation: groups of entries, each a title and a site-root-relative
# path. The sidebar include renders this and nothing else, so publishing a page
# is one line here — not a second navigation written by hand.
#
# Only site deliverables belong in this list. The remaining reference pages
# under docs/ are built by the branch deploy but carry no front matter, so they
# have no entry until the change that publishes them adds one — which is what
# the Integrations group is: four pages that were reference material until they
# were rewritten for an adopter. An entry pointing at a page that does not
# exist is a defect, not a placeholder.
#
# Specifications is the same promotion applied to the per-extension-point
# contracts: AgentRuntime, ChannelAdapter and SignalAdapter all now carry
# the same versioned-spec standard, each rewritten from narrative reference
# material in its own change.
#
# THERE IS NO INDEX PAGE, and the group is the index. A page listing four
# entries the sidebar already lists is a second navigation written by hand,
# which is the thing this file exists to stop.
groups:
  - title: Start here
    entries:
      - title: Overview
        url: /
      - title: Introduction
        url: /introduction/
      - title: Getting started
        url: /getting-started/
      - title: The console
        url: /console/
      - title: Security
        url: /security/
      - title: Installation
        url: /installation/
  # An entry may name an icon — the mark beside the title, from
  # assets/img/logos/, named here exactly as a page names one. A themed pair
  # is named by its -light file and assets/js/themed.js resolves the variant.
  - title: Integrations
    entries:
      - title: Kubernetes
        url: /integrations/kubernetes/
        icon: /assets/img/logos/kubernetes.svg
      - title: Prometheus
        url: /integrations/prometheus/

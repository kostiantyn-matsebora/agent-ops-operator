<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="agent-ops">
  <!--
    The masthead mark as a STANDALONE file, for use in an <img>.

    _includes/logo.svg cannot be used here: it is drawn from the theme's brand
    and surface custom properties, and an <img> is its own document that
    inherits none of the page's. So this copy states its colours, and states
    them once: the glyph sits on the brand circle rather than on the page, so
    one file reads on either ground and no theme variant is needed.

    Note for whoever edits this comment: XML forbids a double hyphen inside a
    comment, so the property names are spelled out above rather than written
    with their leading dashes. An SVG in an <img> is parsed strictly, and the
    whole mark silently fails to render.
  -->
  <circle cx="16" cy="16" r="15" fill="#0d7d76"/>
  <path d="M7 16 h5 M20 16 h5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <path d="M16 9 l4 3.5 v7 L16 23 l-4-3.5 v-7 z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="16" cy="16" r="2" fill="#ffffff"/>
</svg>

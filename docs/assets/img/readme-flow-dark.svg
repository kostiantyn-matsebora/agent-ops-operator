<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" width="800" height="392" role="img" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5c666d"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#43c9bd"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a996f5"/></marker></defs>
<text x="18" y="30" fill="#a5b0b7" font-size="10.5" font-weight="700" text-anchor="start" letter-spacing="1.4">SOMETHING HAPPENS</text>
<rect x="16" y="44" width="196" height="46" rx="10" fill="#23282c" stroke="#3a4247" stroke-width="1"/>
<g transform="translate(30,59)" fill="none" stroke="#a5b0b7" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.2a3.2 3.2 0 0 0-3.2 3.2v2.8L3.2 10.4h9.6L11.2 8.2V5.4A3.2 3.2 0 0 0 8 2.2z M6.4 12.2a1.7 1.7 0 0 0 3.2 0"/></g>
<text x="56" y="65" fill="#e8ecee" font-size="13" font-weight="600" text-anchor="start">an alert fires</text>
<text x="56" y="80" fill="#a5b0b7" font-size="10.5" font-weight="400" text-anchor="start">Alertmanager</text>
<path d="M212 67 H236" stroke="#5c666d" stroke-width="1.3" fill="none"/>
<rect x="16" y="100" width="196" height="46" rx="10" fill="#23282c" stroke="#3a4247" stroke-width="1"/>
<g transform="translate(30,115)" fill="none" stroke="#a5b0b7" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.9 13.7 4.8v6.4L8 14.1 2.3 11.2V4.8z M2.3 4.8 8 7.7l5.7-2.9 M8 7.7v6.4"/></g>
<text x="56" y="121" fill="#e8ecee" font-size="13" font-weight="600" text-anchor="start">a pod crashloops</text>
<text x="56" y="136" fill="#a5b0b7" font-size="10.5" font-weight="400" text-anchor="start">cluster events</text>
<path d="M212 123 H236" stroke="#5c666d" stroke-width="1.3" fill="none"/>
<rect x="16" y="156" width="196" height="46" rx="10" fill="#23282c" stroke="#3a4247" stroke-width="1"/>
<g transform="translate(30,171)" fill="none" stroke="#a5b0b7" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.4a5.6 5.6 0 1 0 0 11.2 5.6 5.6 0 0 0 0-11.2z M8 5.2V8l2.2 1.3"/></g>
<text x="56" y="177" fill="#e8ecee" font-size="13" font-weight="600" text-anchor="start">a schedule comes due</text>
<text x="56" y="192" fill="#a5b0b7" font-size="10.5" font-weight="400" text-anchor="start">cron</text>
<path d="M212 179 H236" stroke="#5c666d" stroke-width="1.3" fill="none"/>
<rect x="16" y="212" width="196" height="46" rx="10" fill="#23282c" stroke="#3a4247" stroke-width="1"/>
<g transform="translate(30,227)" fill="none" stroke="#a5b0b7" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M2.4 3.6h11.2v7.2H7.6l-3.4 2.8v-2.8H2.4z"/></g>
<text x="56" y="233" fill="#e8ecee" font-size="13" font-weight="600" text-anchor="start">someone asks</text>
<text x="56" y="248" fill="#a5b0b7" font-size="10.5" font-weight="400" text-anchor="start">chat</text>
<path d="M212 235 H236" stroke="#5c666d" stroke-width="1.3" fill="none"/>
<path d="M236 67 V235" stroke="#5c666d" stroke-width="1.3" fill="none"/>
<path d="M236 151 H242" stroke="#5c666d" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="252" y="30" fill="#a5b0b7" font-size="10.5" font-weight="700" text-anchor="start" letter-spacing="1.4">YOU DECLARE IT — ONE PIPELINE</text>
<rect x="252" y="44" width="252" height="214" rx="12" fill="#123b39" stroke="#43c9bd" stroke-width="1.6"/>
<text x="270" y="72" fill="#7fded5" font-size="15" font-weight="700" text-anchor="start">Pipeline</text>
<text x="270" y="90" fill="#a5b0b7" font-size="10.5" font-weight="400" text-anchor="start">the only place wiring lives</text>
<circle cx="274" cy="112" r="2.6" fill="#43c9bd"/>
<text x="286" y="116" fill="#e8ecee" font-size="12" font-weight="600" text-anchor="start">what starts it</text>
<text x="286" y="130" fill="#a5b0b7" font-size="10" font-weight="400" text-anchor="start">signalSourceRefs</text>
<circle cx="274" cy="147" r="2.6" fill="#43c9bd"/>
<text x="286" y="151" fill="#e8ecee" font-size="12" font-weight="600" text-anchor="start">what it should do</text>
<text x="286" y="165" fill="#a5b0b7" font-size="10" font-weight="400" text-anchor="start">profileRef</text>
<circle cx="274" cy="182" r="2.6" fill="#43c9bd"/>
<text x="286" y="186" fill="#e8ecee" font-size="12" font-weight="600" text-anchor="start">what it may touch</text>
<text x="286" y="200" fill="#a5b0b7" font-size="10" font-weight="400" text-anchor="start">toolsets · mcpConfigs</text>
<circle cx="274" cy="217" r="2.6" fill="#43c9bd"/>
<text x="286" y="221" fill="#e8ecee" font-size="12" font-weight="600" text-anchor="start">where it answers</text>
<text x="286" y="235" fill="#a5b0b7" font-size="10" font-weight="400" text-anchor="start">channelRefs</text>
<path d="M504 151 H542" stroke="#43c9bd" stroke-width="2" fill="none" marker-end="url(#ab)"/>
<text x="548" y="30" fill="#a5b0b7" font-size="10.5" font-weight="700" text-anchor="start" letter-spacing="1.4">THE OPERATOR RUNS IT</text>
<rect x="548" y="44" width="196" height="92" rx="12" fill="#2a2350" stroke="#a996f5" stroke-width="1.4"/>
<text x="566" y="72" fill="#e8ecee" font-size="14" font-weight="700" text-anchor="start">Conversation</text>
<text x="566" y="91" fill="#a5b0b7" font-size="10.5" font-weight="400" text-anchor="start">one per incident, resumable,</text>
<text x="566" y="105" fill="#a5b0b7" font-size="10.5" font-weight="400" text-anchor="start">its own thread</text>
<path d="M646 136 V152" stroke="#a996f5" stroke-width="1.6" fill="none" marker-end="url(#ac)"/>
<rect x="548" y="152" width="196" height="100" rx="12" fill="#23282c" stroke="#a996f5" stroke-width="1.4"/>
<text x="566" y="180" fill="#e8ecee" font-size="13" font-weight="700" text-anchor="start">its own agent pod</text>
<text x="566" y="199" fill="#a5b0b7" font-size="10.5" font-weight="400" text-anchor="start">isolated · serial · capped</text>
<text x="566" y="217" fill="#a5b0b7" font-size="10.5" font-weight="400" text-anchor="start">investigates, explains, acts</text>
<text x="566" y="231" fill="#a5b0b7" font-size="10.5" font-weight="400" text-anchor="start">ONLY where your wiring</text>
<text x="566" y="245" fill="#a5b0b7" font-size="10.5" font-weight="400" text-anchor="start">granted it</text>
<path d="M646 252 V268" stroke="#43c9bd" stroke-width="2" fill="none" marker-end="url(#ab)"/>
<rect x="548" y="268" width="196" height="88" rx="12" fill="#123b39" stroke="#43c9bd" stroke-width="1.4"/>
<text x="566" y="296" fill="#e8ecee" font-size="13" font-weight="700" text-anchor="start">your channels</text>
<text x="566" y="315" fill="#a5b0b7" font-size="10.5" font-weight="400" text-anchor="start">Telegram, the console,</text>
<text x="566" y="329" fill="#a5b0b7" font-size="10.5" font-weight="400" text-anchor="start">your own adapter</text>
<path d="M744 312 H772 V90 H748" stroke="#5c666d" stroke-width="1.3" fill="none" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text x="548" y="378" fill="#a5b0b7" font-size="10.5" font-weight="400" text-anchor="start">you reply, and the SAME conversation continues</text>
</svg>

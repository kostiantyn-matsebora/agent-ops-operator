<!-- The domain-model diagram the Introduction inlines. Glyph paths are copied
     verbatim from platform/console/ui/src/graph/shapes.tsx (the console's own
     node vocabulary): a glyph change there prompts a copy here. Geometry was
     approved in the crd-spec-pages mockup and is ported as-is. Each labelled
     ref edge carries data-field, checked by docs-generate.py against
     chart/crds/. Colours are currentColor plus the site's ao tokens, so one
     file serves both themes. -->
<svg viewBox="0 0 560 750" role="img" aria-label="All thirteen agent-ops kinds, grouped into four clusters: what starts it (SignalAdapter, SignalSource), the capability shape (AgentProfile, MCPToolset, MCPConfig, AgentRuntime, AgentCapability), the two wiring kinds Pipeline and Coordinator kept visibly apart, and what it produces (Conversation, ConversationInput, Channel, ChannelAdapter). Exactly one connector runs from each input cluster to Pipeline and one to Coordinator, and one connector runs from each wiring kind down to the output cluster. A Coordinator may also invoke another Coordinator as a nested member.">
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <g font-family="Red Hat Text, sans-serif" font-size="12" fill="currentColor">

    <!-- group brackets -->
    <rect x="20" y="16" width="350" height="78" rx="8" fill="none" stroke="currentColor" stroke-dasharray="3 3" stroke-width="1" opacity="0.55"/>
    <text x="195" y="10" text-anchor="middle" font-size="10" opacity="0.6">what starts it</text>

    <rect x="20" y="118" width="350" height="200" rx="8" fill="none" stroke="currentColor" stroke-dasharray="3 3" stroke-width="1" opacity="0.55"/>
    <text x="195" y="112" text-anchor="middle" font-size="10" opacity="0.6">the capability shape — inline, or factored out</text>

    <rect x="85" y="520" width="360" height="180" rx="8" fill="none" stroke="currentColor" stroke-dasharray="3 3" stroke-width="1" opacity="0.55"/>
    <text x="97" y="536" font-size="10" opacity="0.6">what it produces</text>

    <!-- group-to-group edges: exactly one per cluster pair -->
    <g fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.85">
      <path d="M370,55 H410 V365 H90 V380" marker-end="url(#arrow)"/>
      <path d="M370,55 H410 V365 H350 V380" marker-end="url(#arrow)"/>
      <path d="M195,318 V350 H160 V380" marker-end="url(#arrow)"/>
      <path d="M195,318 V350 H400 V380" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
      <path d="M500,415 H525 V360 H460 V380" marker-end="url(#arrow)"/>
      <path d="M125,450 V490 H245 V520" marker-end="url(#arrow)"/>
      <path d="M395,450 V490 H285 V520" marker-end="url(#arrow)"/>
    </g>

    <!-- group labels -->
    <g font-size="10" opacity="0.8">
      <text x="415" y="112" data-field="signalSourceRefs">signalSourceRefs</text>
      <text x="205" y="340" data-field="capabilityRef">capabilityRef, or inline</text>
      <text x="529" y="351" text-anchor="end" data-field="coordinatorRef">coordinatorRef — nested</text>
      <text x="130" y="505">opens</text>
      <text x="330" y="505">opens, escalates</text>
    </g>

    <!-- what starts it -->
    <a class="crd-link" href="{{ '/crds/signal-adapter/' | relative_url }}"><rect x="30" y="32" width="135" height="46" rx="5" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="4 3"/>
    <circle cx="53" cy="55" r="9" fill="currentColor" opacity="0.12"/><circle cx="53" cy="55" r="9" fill="none" stroke="currentColor" stroke-width="1"/><path d="M-4 -6 v4 M4 -6 v4 M-6 -2 h12 v2 a6 6 0 0 1 -12 0 z M0 6 v3" fill="none" stroke="currentColor" stroke-width="1.2" transform="translate(53 55) scale(0.8)"/>
    <text x="71" y="59" font-weight="700" font-size="11.5">SignalAdapter</text></a>
    <path d="M165,55 H214" fill="none" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/>
    <a class="crd-link" href="{{ '/crds/signal-source/' | relative_url }}"><rect x="215" y="32" width="135" height="46" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <circle cx="241" cy="55" r="9" fill="currentColor" opacity="0.12"/><circle cx="241" cy="55" r="9" fill="none" stroke="currentColor" stroke-width="1"/><path d="M2 -7 L-4 1 h4 l-1 6 6 -8 h-4 z" fill="none" stroke="currentColor" stroke-width="1.2" transform="translate(241 55) scale(0.8)"/>
    <text x="259" y="51" font-weight="700" font-size="11.5">SignalSource</text>
    <text x="259" y="67" font-size="9.5" opacity="0.65">an ingest lane</text></a>

    <!-- the capability shape -->
    <a class="crd-link" href="{{ '/crds/agent-profile/' | relative_url }}"><rect x="36" y="134" width="158" height="52" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <circle cx="75" cy="160" r="9" fill="currentColor" opacity="0.12"/><circle cx="75" cy="160" r="9" fill="none" stroke="currentColor" stroke-width="1"/><path d="M0 -6 a3 3 0 1 1 0 6 a3 3 0 0 1 0 -6 M-6 7 a6 6 0 0 1 12 0 z" fill="none" stroke="currentColor" stroke-width="1.2" transform="translate(75 160) scale(0.8)"/>
    <text x="93" y="164" font-weight="700" font-size="11.5">AgentProfile</text></a>

    <a class="crd-link" href="{{ '/crds/mcp-toolset/' | relative_url }}"><rect x="204" y="134" width="158" height="52" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <circle cx="244" cy="160" r="9" fill="currentColor" opacity="0.12"/><circle cx="244" cy="160" r="9" fill="none" stroke="currentColor" stroke-width="1"/><path d="M5 -5 a3 3 0 0 1 -4 4 l-5 5 -1 -1 5 -5 a3 3 0 0 1 4 -4 z" fill="none" stroke="currentColor" stroke-width="1.2" transform="translate(244 160) scale(0.8)"/>
    <text x="262" y="164" font-weight="700" font-size="11.5">MCPToolset</text></a>

    <a class="crd-link" href="{{ '/crds/mcp-config/' | relative_url }}"><rect x="36" y="194" width="158" height="52" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <circle cx="79" cy="220" r="9" fill="currentColor" opacity="0.12"/><circle cx="79" cy="220" r="9" fill="none" stroke="currentColor" stroke-width="1"/><path d="M-6 -5 h12 v4 h-12 z M-6 1 h12 v4 h-12 z" fill="none" stroke="currentColor" stroke-width="1.2" transform="translate(79 220) scale(0.8)"/>
    <text x="97" y="224" font-weight="700" font-size="11.5">MCPConfig</text></a>

    <a class="crd-link" href="{{ '/crds/agent-runtime/' | relative_url }}"><rect x="204" y="194" width="158" height="52" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <circle cx="238" cy="220" r="9" fill="currentColor" opacity="0.12"/><circle cx="238" cy="220" r="9" fill="none" stroke="currentColor" stroke-width="1"/><path d="M-5 -5 h10 v10 h-10 z M-2 -2 h4 v4 h-4 z" fill="none" stroke="currentColor" stroke-width="1.2" transform="translate(238 220) scale(0.8)"/>
    <text x="256" y="224" font-weight="700" font-size="11.5">AgentRuntime</text></a>

    <a class="crd-link" href="{{ '/crds/agent-capability/' | relative_url }}"><polygon points="105,280 145,256 245,256 285,280 245,304 145,304" fill="var(--ao-accent-soft)" stroke="var(--ao-accent)" stroke-width="1.4"/>
    <circle cx="145" cy="280" r="9" fill="var(--ao-accent)" opacity="0.18"/><circle cx="145" cy="280" r="9" fill="none" stroke="var(--ao-accent)" stroke-width="1"/><path d="M-3 -7 a2 2 0 1 0 0.01 0 M-3 -5 v9 M-3 2 h3 M-3 5 h2" fill="none" stroke="var(--ao-accent)" stroke-width="1.2" transform="translate(145 280) scale(0.8)"/>
    <text x="163" y="284" font-weight="700" font-size="11.5" fill="var(--ao-accent)">AgentCapability</text></a>

    <!-- wiring, kept visibly apart -->
    <a class="crd-link" href="{{ '/crds/pipeline/' | relative_url }}"><rect x="20" y="380" width="210" height="70" rx="35" fill="var(--ao-brand-soft)" stroke="var(--ao-brand)" stroke-width="2"/>
    <circle cx="74" cy="415" r="9" fill="var(--ao-brand-strong)" opacity="0.15"/><circle cx="74" cy="415" r="9" fill="none" stroke="var(--ao-brand-strong)" stroke-width="1"/><path d="M-8 -4 h5 a3 3 0 0 1 3 3 v2 a3 3 0 0 0 3 3 h5 M6 2 l2 2 -2 2" fill="none" stroke="var(--ao-brand-strong)" stroke-width="1.2" transform="translate(74 415) scale(0.8)"/>
    <text x="92" y="411" font-weight="700" fill="var(--ao-brand-strong)">Pipeline</text>
    <text x="92" y="427" font-size="10" fill="var(--ao-brand-strong)" opacity="0.85">the wiring, one agent</text></a>

    <a class="crd-link" href="{{ '/crds/coordinator/' | relative_url }}"><rect x="290" y="380" width="210" height="70" rx="35" fill="var(--ao-brand-soft)" stroke="var(--ao-brand)" stroke-width="2"/>
    <circle cx="343" cy="415" r="9" fill="var(--ao-brand-strong)" opacity="0.15"/><circle cx="343" cy="415" r="9" fill="none" stroke="var(--ao-brand-strong)" stroke-width="1"/><path d="M-7 0 h4 M-3 0 l5 -6 M-3 0 l5 0 M-3 0 l5 6" fill="none" stroke="var(--ao-brand-strong)" stroke-width="1.2" transform="translate(343 415) scale(0.8)"/>
    <text x="361" y="411" font-weight="700" fill="var(--ao-brand-strong)">Coordinator</text>
    <text x="361" y="427" font-size="10" fill="var(--ao-brand-strong)" opacity="0.85">wiring, a composition</text></a>

    <!-- what it produces -->
    <a class="crd-link" href="{{ '/crds/conversation/' | relative_url }}"><ellipse cx="175" cy="572" rx="80" ry="32" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <circle cx="133" cy="572" r="9" fill="currentColor" opacity="0.12"/><circle cx="133" cy="572" r="9" fill="none" stroke="currentColor" stroke-width="1"/><path d="M-5 -2 h10 M-5 2 h6" fill="none" stroke="currentColor" stroke-width="1.2" transform="translate(133 572) scale(0.8)"/>
    <text x="151" y="576" font-weight="700" font-size="11.5">Conversation</text></a>

    <a class="crd-link" href="{{ '/crds/channel/' | relative_url }}"><rect x="265" y="540" width="170" height="64" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <circle cx="318" cy="572" r="9" fill="currentColor" opacity="0.12"/><circle cx="318" cy="572" r="9" fill="none" stroke="currentColor" stroke-width="1"/><path d="M-6 -3 h12 v8 h-6 l-3 3 v-3 h-3 z" fill="none" stroke="currentColor" stroke-width="1.2" transform="translate(318 572) scale(0.8)"/>
    <text x="336" y="568" font-weight="700" font-size="11.5">Channel</text>
    <text x="336" y="584" font-size="9.5" opacity="0.65">a chat surface</text></a>

    <path d="M175,620 V605" fill="none" stroke="currentColor" stroke-width="1.1" marker-end="url(#arrow)"/>
    <a class="crd-link" href="{{ '/crds/conversation-input/' | relative_url }}"><rect x="95" y="620" width="160" height="52" rx="5" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="4 3"/>
    <circle cx="118" cy="646" r="9" fill="currentColor" opacity="0.12"/><circle cx="118" cy="646" r="9" fill="none" stroke="currentColor" stroke-width="1"/><path d="M-4 -4 h8 v8 h-8 z M-4 -1 h8" fill="none" stroke="currentColor" stroke-width="1.2" transform="translate(118 646) scale(0.8)"/>
    <text x="136" y="650" font-weight="700" font-size="11.5">ConversationInput</text></a>

    <path d="M350,604 V620" fill="none" stroke="currentColor" stroke-width="1.1"/>
    <a class="crd-link" href="{{ '/crds/channel-adapter/' | relative_url }}"><rect x="270" y="620" width="160" height="52" rx="5" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="4 3"/>
    <circle cx="300" cy="646" r="9" fill="currentColor" opacity="0.12"/><circle cx="300" cy="646" r="9" fill="none" stroke="currentColor" stroke-width="1"/><path d="M-4 -6 v4 M4 -6 v4 M-6 -2 h12 v2 a6 6 0 0 1 -12 0 z M0 6 v3" fill="none" stroke="currentColor" stroke-width="1.2" transform="translate(300 646) scale(0.8)"/>
    <text x="318" y="650" font-weight="700" font-size="11.5">ChannelAdapter</text></a>
  </g>
</svg>

<!--
  The masthead mark, copied from console/ui/src/components/Logo.tsx.

  Same paths, same theme-driven fills: it is drawn from --ao-brand and
  --ao-surface, so it follows the theme with no second asset and nothing to
  fetch. The mark is the system in miniature: a signal entering on the left, a
  pipeline claiming it, an answer leaving on the right.
-->
<svg class="ao-logo" width="26" height="26" viewBox="0 0 32 32" role="img" aria-label="agent-ops">
  <circle cx="16" cy="16" r="15" fill="var(--ao-brand)" />
  <path d="M7 16 h5 M20 16 h5" stroke="var(--ao-surface)" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  <path d="M16 9 l4 3.5 v7 L16 23 l-4-3.5 v-7 z" fill="none" stroke="var(--ao-surface)" stroke-width="2" stroke-linejoin="round" />
  <circle cx="16" cy="16" r="2" fill="var(--ao-surface)" />
</svg>

# Validation samples for the agentops.dev API group. Mirrors the current
# claude-runner setup as CRs (shadow — nothing consumes these until the manager
# is deployed and pointed at them).
apiVersion: agentops.dev/v1alpha1
kind: MCPConfig
metadata:
  name: home-observability
  namespace: agent-ops
spec:
  servers:
    victorialogs:
      type: sse
      url: http://mcp-victorialogs.agent-ops.svc/sse
    victoriametrics:
      type: sse
      url: http://mcp-victoriametrics.agent-ops.svc/sse
---
apiVersion: agentops.dev/v1alpha1
kind: AgentProfile
metadata:
  name: ha-engineer
  namespace: agent-ops
spec:
  repository:
    url: git@example.com:ops/home-lab.git
    ref: master
    auth:
      type: ssh
      secretRef:
        name: agentops-repo-key
  agent: ha-engineer
  allowedTools: "Read,Grep,Glob,Bash,Skill,mcp__victorialogs__*,mcp__victoriametrics__*,mcp__homeassistant__*"
  maxTurns: 60
  mcp:
    configRefs:
      - name: home-observability
    servers:
      homeassistant:
        type: sse
        url: http://192.0.2.3:8123/mcp_server/sse
        headers:
          - name: Authorization
            valueFrom:
              secretKeyRef:
                name: agentops-ha
                key: bearerHeader
  env:
    - name: HA_CLAUDE_TOKEN
      valueFrom:
        secretKeyRef:
          name: agentops-ha
          key: token
---
apiVersion: agentops.dev/v1alpha1
kind: Channel
metadata:
  name: home-ops
  namespace: agent-ops
spec:
  # served by the channel-telegram adapter (the bot token lives in the
  # adapter's deployment, not here — the manager reads no secrets)
  type: telegram
  defaultProfileRef:
    name: ha-engineer
  # opaque to the operator; the shape below is what channel-telegram parses
  config:
    chatId: "-1001234567890"
    feedThreadId: 2
    pollingEnabled: false   # MUST stay false while another consumer polls this bot
    # approvers: [123456789]
  # optional: have the agent post to Telegram itself instead of the default
  # "printed answer is the deliverable" flow
  # delivery:
  #   mode: agent
  #   agentInstructions: |
  #     If chat credentials are available (TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID
  #     set), send exactly ONE chat message via the Telegram Bot API (curl,
  #     parse_mode=HTML, message_thread_id=$TG_THREAD_ID unless empty).
  #     Without credentials, your final printed answer IS the deliverable.
---
apiVersion: agentops.dev/v1alpha1
kind: SignalSource
metadata:
  name: alertmanager
  namespace: agent-ops
spec:
  type: alertmanagerWebhook
  channelRef:
    name: home-ops
  profileRef:
    name: ha-engineer
  grouping:
    signatureLabels: ["alertgroup", "alertname", "namespace"]
    windowDays: 7
    cooldownHours: 6
---
apiVersion: agentops.dev/v1alpha1
kind: Conversation
metadata:
  name: sample-task
  namespace: agent-ops
spec:
  profileRef:
    name: ha-engineer
  title: "🛠 sample validation task"
  inputs:
    - id: in-1
      type: task
      payload: "Sample task input (validation only)"

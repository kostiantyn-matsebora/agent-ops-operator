# Validation samples for the agentops.dev API group. Mirrors the current
# claude-runner setup as CRs (shadow — nothing consumes these until the manager
# is deployed and pointed at them).
apiVersion: agentops.dev/v1alpha1
kind: MCPConfig
metadata:
  name: home-observability
  namespace: agent-ops
spec:
  servers:
    victorialogs:
      type: sse
      url: http://mcp-victorialogs.internal.komatoo.net/sse
    victoriametrics:
      type: sse
      url: http://mcp-victoriametrics.internal.komatoo.net/sse
---
# MCPToolset: a named tool allowlist, nothing else. Servers live in MCPConfig
# CRs; this says which tools a wiring may CALL. Pipelines bind the two together
# (spec.toolsets / spec.mcpConfigs) — the ONLY place capabilities are declared,
# since profiles carry none. Entries are opaque to the operator: MCP namespaces
# or built-in tool names alike.
apiVersion: agentops.dev/v1alpha1
kind: MCPToolset
metadata:
  name: vm-observability
  namespace: agent-ops
spec:
  tools:
    - "mcp__victorialogs__*"
    - "mcp__victoriametrics__*"
---
# Built-in tools are toolsets too — the chart ships these three (see
# global.builtinToolsets), split by risk so a route can observe without
# executing. Shown here because a hand-rolled install may want its own split.
apiVersion: agentops.dev/v1alpha1
kind: MCPToolset
metadata:
  name: agentops-observe
  namespace: agent-ops
spec:
  tools: [Read, Grep, Glob]
---
apiVersion: agentops.dev/v1alpha1
kind: MCPToolset
metadata:
  name: agentops-shell
  namespace: agent-ops
spec:
  tools: [Bash]
---
apiVersion: agentops.dev/v1alpha1
kind: AgentProfile
metadata:
  name: ha-engineer
  namespace: agent-ops
spec:
  repository:
    url: git@github.com:kostiantyn-matsebora/home-data-center.git
    ref: master
    auth:
      type: ssh
      secretRef:
        name: agentops-repo-key
  agent: ha-engineer
  # Identity only: no allowedTools, no mcp. What this agent MAY DO comes from
  # whichever Pipeline originates the conversation — the addressable one below,
  # or the per-route Pipelines further down.
  maxTurns: 60
  env:
    - name: HA_CLAUDE_TOKEN
      valueFrom:
        secretKeyRef:
          name: agentops-ha
          key: token
---
# An ADDRESSABLE Pipeline: `POST /task {"pipeline":"ha-engineer-direct",...}`
# names this one. It routes nothing (no sources, no channels) and carries no
# special meaning — it exists to be addressed, and like every Pipeline it
# declares what its conversations may do. Nothing supplies a default.
apiVersion: agentops.dev/v1alpha1
kind: Pipeline
metadata:
  name: ha-engineer-direct
  namespace: agent-ops
spec:
  profileRef:
    name: ha-engineer
  toolsets:
    refs:
      - name: agentops-observe
      - name: agentops-shell
      - name: vm-observability
  mcpConfigs:
    refs:
      - name: home-observability
---
# ChannelAdapter: plugs the "telegram" implementation in as a CR — the CR's
# NAME is the key Channels select via spec.adapter. The reconciler deploys
# and owns the adapter workload (zero-RBAC SA, derived contract token,
# projected per-channel credentials). Pure implementation: no configuration
# lives here.
apiVersion: agentops.dev/v1alpha1
kind: ChannelAdapter
metadata:
  name: telegram
  namespace: agent-ops
spec:
  image: kmatsebora/agentops-channel-telegram:0.2.0
  # singleton (default true): replicas 1 + Recreate — getUpdates allows exactly
  # one consumer per bot token
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
---
apiVersion: agentops.dev/v1alpha1
kind: Channel
metadata:
  name: home-ops
  namespace: agent-ops
spec:
  # names the ChannelAdapter serving this surface (see above); that adapter's
  # implementation is what defines and validates `config` below
  adapter: telegram
  # this surface's transport credentials (key botToken). Projected into the
  # adapter pod as env AGENTOPS_CRED_HOME_OPS_<key> by the kubelet — nothing
  # reads the Secret through the API. Several Channels may reference different
  # Secrets to run several bots through one adapter.
  credentialsSecretRef:
    name: agentops-telegram
  # NO wiring here: bare messages are answered by the profile of the Pipeline
  # referencing this channel (home-ops-pipeline below)
  # opaque to the operator; the shape below is what channel-telegram parses
  config:
    chatId: "-1004369687194"
    feedThreadId: 2
    pollingEnabled: false   # MUST stay false while another consumer polls this bot
    # approvers: [123456789]
---
# Pipeline: the wiring object — every referenced source's signals become
# conversations bound to ALL referenced channels (each channel mirrors the
# whole conversation: threads everywhere, replies fanned out by the manager,
# user messages relayed to sibling surfaces). A source belongs to at most one
# pipeline; sources/channels outside any pipeline keep their own refs.
apiVersion: agentops.dev/v1alpha1
kind: Pipeline
metadata:
  name: home-ops-pipeline
  namespace: agent-ops
spec:
  signalSourceRefs:
    - name: daily-healthcheck
  channelRefs:
    - name: home-ops
  profileRef:
    name: ha-engineer
  # Declared here or nowhere: no profile default, no inheritance. Omitting this
  # is legal and means the route's conversations get no tools at all.
  toolsets:
    refs:
      - name: agentops-observe
      - name: agentops-shell
---
# SignalAdapter: plugs the "cron" implementation in as a CR — the CR's NAME
# is the key SignalSources select via spec.adapter. The reconciler deploys
# and owns the adapter workload. No spec.port: cron has no inbound surface,
# so no Service is rendered.
apiVersion: agentops.dev/v1alpha1
kind: SignalAdapter
metadata:
  name: cron
  namespace: agent-ops
spec:
  image: kmatsebora/agentops-signal-cron:0.2.0
  # Optional config contract for SignalSources with `adapter: cron`. Declaring
  # it makes `kubectl get signaladapter cron -o yaml` answer "what do I put in
  # config?" without reading adapter source.
  configSchema:
    type: object
    properties:
      schedule:
        type: string
        description: Five-field cron expression (minute hour dom month dow).
      input:
        type: string
        description: Task text handed to the agent on each tick.
      title:
        type: string
        description: Conversation title override.
    required:
      - schedule
      - input
---
# VM Alertmanager webhook source — spec.adapter names the serving SignalAdapter
# CR (the vm-bundle subchart renders one named vm-alertmanager; its reconciler
# owns the workload AND the webhook Service). VMAlertmanager posts the
# standard Alertmanager webhook format to
#   http://agentops-signal-vm-alertmanager.<ns>.svc:8080/webhook/vm-alerts
# Open variant: no credentialsSecretRef — anonymous posts accepted
# (ClusterIP-only posture).
apiVersion: agentops.dev/v1alpha1
kind: SignalSource
metadata:
  name: vm-alerts
  namespace: agent-ops
spec:
  adapter: vm-alertmanager
  grouping:
    signatureLabels: ["alertgroup", "alertname", "namespace"]
---
# Credentialed variant: the Secret's TOKEN key is projected into the adapter
# (AGENTOPS_CRED_VM_ALERTS_SECURE_TOKEN) and webhooks must carry
# Authorization: Bearer <token>. Configure the same token in VMAlertmanager's
# webhook_configs http_config.
apiVersion: agentops.dev/v1alpha1
kind: SignalSource
metadata:
  name: vm-alerts-secure
  namespace: agent-ops
spec:
  adapter: vm-alertmanager
  credentialsSecretRef:
    name: vm-webhook-token   # Secret with key TOKEN
---
# Remember: wiring is pipeline-only — claim the source or its signals drop
# (Wired=False). Capabilities are wiring too: this pipeline is the ONLY thing
# saying what ha-engineer may do on the VM-alert route, and it replaces the
# baseline for conversations it originates rather than adding to it. Both halves
# are needed — mcpConfigs supply the servers, toolsets grant permission to call
# them. Refs are snapshotted onto each conversation at creation; the referenced
# CRs' CONTENT is re-read at every use, so fixing a server URL or extending a
# toolset heals running conversations while re-wiring the pipeline only affects
# new ones.
apiVersion: agentops.dev/v1alpha1
kind: Pipeline
metadata:
  name: vm-alerts
  namespace: agent-ops
spec:
  signalSourceRefs:
    - name: vm-alerts
    - name: vm-alerts-secure
  channelRefs:
    - name: home-ops
  profileRef:
    name: ha-engineer
  mcpConfigs:
    refs:
      - name: vm-logs
      - name: vm-metrics
  toolsets:
    refs:
      - name: vm-observability
---
# Cluster Events as a signal lane. The k8s-bundle subchart renders this trio
# (adapter + source + pipeline) for you; shown here for a hand-rolled setup.
# The adapter watches core v1 Events with its OWN ServiceAccount token —
# kubernetesAccess mounts it, and the operator grants nothing, so the events
# get/list/watch Role must be bound to agentops-signal-k8s-events out of band.
apiVersion: agentops.dev/v1alpha1
kind: SignalAdapter
metadata:
  name: k8s-events
  namespace: agent-ops
spec:
  image: kmatsebora/agentops-signal-k8s-events:0.1.0
  kubernetesAccess: true
---
apiVersion: agentops.dev/v1alpha1
kind: SignalSource
metadata:
  name: cluster-events
  namespace: agent-ops
spec:
  adapter: k8s-events
  # group by the failing OBJECT, so one crash-looping pod is one conversation
  # however many times it repeats
  grouping:
    signatureLabels: ["namespace", "kind", "name"]
  config:
    # Normal events are the cluster's background hum — watching them would bury
    # real problems and burn LLM credits.
    severities: ["Warning"]
    namespaces: []            # empty = every namespace the RBAC allows
    excludeReasons: ["Unhealthy"]
---
# Without this Pipeline the source above is inert: wiring is pipeline-only, so
# an unclaimed source reports Wired=False and DROPS every event.
#
# This route also demonstrates withholding shell: `overwrite` replaces the
# profile's allowlist entirely, so conversations from cluster events can observe
# but not run Bash — while the same ha-engineer profile keeps shell everywhere
# else. Nothing about the profile changes; only this stanza. Use `merge` (the
# default) to extend instead of replace.
apiVersion: agentops.dev/v1alpha1
kind: Pipeline
metadata:
  name: cluster-events
  namespace: agent-ops
spec:
  signalSourceRefs:
    - name: cluster-events
  channelRefs:
    - name: home-ops
  profileRef:
    name: ha-engineer
  toolsets:
    refs:
      - name: agentops-observe
---
# Adapter-served signal source: opaque config interpreted only by signal-cron.
# The grouping window makes consecutive runs land in ONE conversation, later
# ticks resuming the agent session (a recurring job that remembers).
apiVersion: agentops.dev/v1alpha1
kind: SignalSource
metadata:
  name: daily-healthcheck
  namespace: agent-ops
spec:
  adapter: cron
  config:
    schedule: "0 6 * * *"
    input: "Run the daily infrastructure health check: node pressure, failed pods, storage headroom. Report only what needs attention."
    title: "🛠 Daily health check"
---
apiVersion: agentops.dev/v1alpha1
kind: Conversation
metadata:
  name: sample-task
  namespace: agent-ops
spec:
  profileRef:
    name: ha-engineer
  title: "🛠 sample validation task"
  inputs:
    - id: in-1
      type: task
      payload: "Sample task input (validation only)"

# Validation samples for the agentops.dev API group. Mirrors the current
# claude-runner setup as CRs (shadow — nothing consumes these until the manager
# is deployed and pointed at them).
apiVersion: agentops.dev/v1alpha1
kind: MCPConfig
metadata:
  name: home-observability
  namespace: agent-ops
spec:
  servers:
    victorialogs:
      type: sse
      url: http://mcp-victorialogs.agent-ops.svc/sse
    victoriametrics:
      type: sse
      url: http://mcp-victoriametrics.agent-ops.svc/sse
---
# MCPToolset: a named tool allowlist, nothing else. Servers live in MCPConfig
# CRs; this says which tools a wiring may CALL. Pipelines bind the two together
# (spec.toolsets / spec.mcpConfigs) — the ONLY place capabilities are declared,
# since profiles carry none. Entries are opaque to the operator: MCP namespaces
# or built-in tool names alike.
apiVersion: agentops.dev/v1alpha1
kind: MCPToolset
metadata:
  name: vm-observability
  namespace: agent-ops
spec:
  tools:
    - "mcp__victorialogs__*"
    - "mcp__victoriametrics__*"
---
# The cluster itself as MCP tools — the k8s-bundle chart renders this pair
# (`k8s-bundle.mcp`), shown here for hand-rolled installs. The server key
# `kubernetes` IS the mcp__kubernetes__* namespace the toolset below grants:
# rename one without the other and the agent silently loses its tools.
#
# The endpoint is a Kubernetes MCP server run with --read-only; it authenticates
# to the API as ITS OWN pod ServiceAccount, so what these tools can reach is that
# SA's RBAC — reviewable independently of the runtime SA the agent pod runs
# under. This is the ONLY cluster path: the runtime image ships no CLI.
apiVersion: agentops.dev/v1alpha1
kind: MCPConfig
metadata:
  name: k8s-api
  namespace: agent-ops
spec:
  servers:
    kubernetes:
      type: http
      url: http://agentops-mcp-k8s.agent-ops.svc:8080/mcp
---
# Reads and mutations are SEPARATE toolsets, enumerated rather than
# mcp__kubernetes__* — a wildcard spans both halves and defeats the split.
# Bind k8s-observability alone for a route that explains but cannot touch.
apiVersion: agentops.dev/v1alpha1
kind: MCPToolset
metadata:
  name: k8s-observability
  namespace: agent-ops
spec:
  tools:
    - "mcp__kubernetes__events_list"
    - "mcp__kubernetes__namespaces_list"
    - "mcp__kubernetes__nodes_top"
    - "mcp__kubernetes__pods_list"
    - "mcp__kubernetes__pods_get"
    - "mcp__kubernetes__pods_log"
    - "mcp__kubernetes__pods_top"
    - "mcp__kubernetes__resources_list"
    - "mcp__kubernetes__resources_get"
---
apiVersion: agentops.dev/v1alpha1
kind: MCPToolset
metadata:
  name: k8s-admin
  namespace: agent-ops
spec:
  tools:
    - "mcp__kubernetes__resources_create_or_update"
    - "mcp__kubernetes__resources_delete"
    - "mcp__kubernetes__resources_scale"
    - "mcp__kubernetes__pods_delete"
    - "mcp__kubernetes__pods_exec"
    - "mcp__kubernetes__pods_run"
---
# Built-in tools are toolsets too — the chart ships these three (see
# global.builtinToolsets), split by risk so a route can observe without
# executing. Shown here because a hand-rolled install may want its own split.
apiVersion: agentops.dev/v1alpha1
kind: MCPToolset
metadata:
  name: agentops-observe
  namespace: agent-ops
spec:
  tools: [Read, Grep, Glob]
---
apiVersion: agentops.dev/v1alpha1
kind: MCPToolset
metadata:
  name: agentops-shell
  namespace: agent-ops
spec:
  tools: [Bash]
---
apiVersion: agentops.dev/v1alpha1
kind: AgentProfile
metadata:
  name: ha-engineer
  namespace: agent-ops
spec:
  repository:
    url: git@example.com:ops/home-lab.git
    ref: master
    auth:
      type: ssh
      secretRef:
        name: agentops-repo-key
  agent: ha-engineer
  # Identity only: no allowedTools, no mcp. What this agent MAY DO comes from
  # whichever Pipeline originates the conversation — the addressable one below,
  # or the per-route Pipelines further down.
  maxTurns: 60
  env:
    - name: HA_CLAUDE_TOKEN
      valueFrom:
        secretKeyRef:
          name: agentops-ha
          key: token
---
# A COMMAND-ONLY Pipeline: `/ha-engineer-direct <task>` typed on a wired chat
# surface names this one. It routes nothing (no sources, no channels) and
# carries no special meaning — nothing resolves to it, because nothing claims a
# source for it. Give it a `signalSourceRefs` entry to make it postable:
# programmatic work is a `kind: task` signal to a source, never a named
# Pipeline. Like every Pipeline it declares what its conversations may do, and
# nothing supplies a default.
apiVersion: agentops.dev/v1alpha1
kind: Pipeline
metadata:
  name: ha-engineer-direct
  namespace: agent-ops
spec:
  profileRef:
    name: ha-engineer
  toolsets:
    refs:
      - name: agentops-observe
      - name: agentops-shell
      - name: vm-observability
      # Both halves or neither: the toolset is permission to call the servers
      # the mcpConfigs below supply.
      - name: k8s-observability
  mcpConfigs:
    refs:
      - name: home-observability
      - name: k8s-api
---
# ChannelAdapter: plugs the "telegram" implementation in as a CR — the CR's
# NAME is the key Channels select via spec.adapter. The reconciler deploys
# and owns the adapter workload (zero-RBAC SA, derived contract token,
# projected per-channel credentials). Pure implementation: no configuration
# lives here.
apiVersion: agentops.dev/v1alpha1
kind: ChannelAdapter
metadata:
  name: telegram
  namespace: agent-ops
spec:
  image: kmatsebora/agentops-channel-telegram:0.5.0
  # This adapter does NOT poll. telegram-router owns the single getUpdates loop
  # and pushes topic updates here, so the reconciler owns Service
  # agentops-adapter-telegram and injects LISTEN_ADDR.
  port: 8080
  # singleton (default true): replicas 1 + Recreate
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
---
apiVersion: agentops.dev/v1alpha1
kind: Channel
metadata:
  name: home-ops
  namespace: agent-ops
spec:
  # names the ChannelAdapter serving this surface (see above); that adapter's
  # implementation is what defines and validates `config` below
  adapter: telegram
  # this surface's transport credentials (key botToken). Projected into the
  # adapter pod as env AGENTOPS_CRED_HOME_OPS_<key> by the kubelet — nothing
  # reads the Secret through the API. Several Channels may reference different
  # Secrets to run several bots through one adapter.
  credentialsSecretRef:
    name: agentops-telegram
  # NO wiring here, and no origination either: a Channel CARRIES conversations.
  # A message on this chat's general surface arrives as a chat SIGNAL from the
  # home-ops-chat source below, and the Pipeline claiming that source decides
  # who answers.
  # opaque to the operator; the shape below is what channel-telegram parses
  config:
    chatId: "-1001234567890"
    feedThreadId: 2
    # approvers: [123456789]
---
# The Telegram ingest split. One poller, two receivers:
#
#   getUpdates -> telegram-router --+-- no topic -> signal-telegram  (ORIGINATION)
#                                   +-- topic    -> channel-telegram (CONTINUATION)
#
# EXACTLY ONE process may read a bot token's stream, ever. Scale any older
# polling adapter to zero before starting the router.
apiVersion: agentops.dev/v1alpha1
kind: SignalAdapter
metadata:
  name: telegram
  namespace: agent-ops
spec:
  image: kmatsebora/agentops-signal-telegram:0.1.0
  port: 8080   # receives general-surface updates from the router
---
apiVersion: agentops.dev/v1alpha1
kind: SignalSource
metadata:
  name: home-ops-chat
  namespace: agent-ops
spec:
  adapter: telegram
  # No credentials: signal-telegram never contacts Telegram.
  config:
    chatId: "-1001234567890"
    # the Channel this chat is the general surface OF — replies go back here
    channel: home-ops
    # approvers: [123456789]
  grouping:
    # Chat defaults cooldown OFF and skips signature grouping: a person
    # repeating a request means it twice. Set signatureLabels to opt in.
    cooldownHours: 0
---
# NOTE: telegram-router has NO CR. It produces no signals, so it is not an
# adapter: the telegram-bundle chart owns its Deployment and injects
# SIGNAL_TARGET, CHANNEL_TARGET and the bot token as env. Modelling it as a
# SignalAdapter used to require a signal-free SignalSource purely to carry the
# credential, which then had to be claimed to keep it off Wired=False.
# Pipeline: the wiring object — every referenced source's signals become
# conversations bound to ALL referenced channels (each channel mirrors the
# whole conversation: threads everywhere, replies fanned out by the manager,
# user messages relayed to sibling surfaces). A source belongs to at most one
# pipeline; sources/channels outside any pipeline keep their own refs.
apiVersion: agentops.dev/v1alpha1
kind: Pipeline
metadata:
  name: home-ops-pipeline
  namespace: agent-ops
spec:
  signalSourceRefs:
    - name: daily-healthcheck
    # Chat origination: claiming this source is what declares who answers a
    # message on the chat's general surface. Without a claimant the message
    # drops (and the user is told) — there is no channel default and no
    # oldest-pipeline tiebreak.
    - name: home-ops-chat
  channelRefs:
    - name: home-ops
  profileRef:
    name: ha-engineer
  # Declared here or nowhere: no profile default, no inheritance. Omitting this
  # is legal and means the route's conversations get no tools at all.
  toolsets:
    # merge (the default) composes against the AGENT DEFINITION — the `tools:`
    # frontmatter of .claude/agents/ha-engineer.md in the profile's repo, NOT
    # the profile, which declares no capabilities. Whatever ha-engineer.md
    # declares for itself stays, and these are added on top. An agent with no
    # `tools:` (or a profile with no repo) contributes nothing, so this
    # degrades to exactly the two toolsets below.
    mode: merge
    refs:
      - name: agentops-observe
      - name: agentops-shell
---
# SignalAdapter: plugs the "cron" implementation in as a CR — the CR's NAME
# is the key SignalSources select via spec.adapter. The reconciler deploys
# and owns the adapter workload. No spec.port: cron has no inbound surface,
# so no Service is rendered.
apiVersion: agentops.dev/v1alpha1
kind: SignalAdapter
metadata:
  name: cron
  namespace: agent-ops
spec:
  image: kmatsebora/agentops-signal-cron:0.2.0
  # Optional config contract for SignalSources with `adapter: cron`. Declaring
  # it makes `kubectl get signaladapter cron -o yaml` answer "what do I put in
  # config?" without reading adapter source.
  configSchema:
    type: object
    properties:
      schedule:
        type: string
        description: Five-field cron expression (minute hour dom month dow).
      input:
        type: string
        description: Task text handed to the agent on each tick.
      title:
        type: string
        description: Conversation title override.
    required:
      - schedule
      - input
---
# VM Alertmanager webhook source — spec.adapter names the serving SignalAdapter
# CR (the prometheus-bundle subchart renders one named alertmanager; its reconciler
# owns the workload AND the webhook Service). VMAlertmanager posts the
# standard Alertmanager webhook format to
#   http://agentops-signal-vm-alertmanager.<ns>.svc:8080/webhook/vm-alerts
# Open variant: no credentialsSecretRef — anonymous posts accepted
# (ClusterIP-only posture).
apiVersion: agentops.dev/v1alpha1
kind: SignalSource
metadata:
  name: vm-alerts
  namespace: agent-ops
spec:
  adapter: vm-alertmanager
  grouping:
    signatureLabels: ["alertgroup", "alertname", "namespace"]
---
# Credentialed variant: the Secret's TOKEN key is projected into the adapter
# (AGENTOPS_CRED_VM_ALERTS_SECURE_TOKEN) and webhooks must carry
# Authorization: Bearer <token>. Configure the same token in VMAlertmanager's
# webhook_configs http_config.
apiVersion: agentops.dev/v1alpha1
kind: SignalSource
metadata:
  name: vm-alerts-secure
  namespace: agent-ops
spec:
  adapter: vm-alertmanager
  credentialsSecretRef:
    name: vm-webhook-token   # Secret with key TOKEN
---
# Remember: wiring is pipeline-only — claim the source or its signals drop
# (Wired=False). Capabilities are wiring too: this pipeline is the ONLY thing
# saying what ha-engineer may do on the VM-alert route, and it replaces the
# baseline for conversations it originates rather than adding to it. Both halves
# are needed — mcpConfigs supply the servers, toolsets grant permission to call
# them. Refs are snapshotted onto each conversation at creation; the referenced
# CRs' CONTENT is re-read at every use, so fixing a server URL or extending a
# toolset heals running conversations while re-wiring the pipeline only affects
# new ones.
apiVersion: agentops.dev/v1alpha1
kind: Pipeline
metadata:
  name: vm-alerts
  namespace: agent-ops
spec:
  signalSourceRefs:
    - name: vm-alerts
    - name: vm-alerts-secure
  channelRefs:
    - name: home-ops
  profileRef:
    name: ha-engineer
  mcpConfigs:
    # No mode here, ever: an agent definition declares no MCP SERVERS, so
    # there is nothing on the other side to merge with or overwrite.
    refs:
      - name: vm-logs
      - name: vm-metrics
  toolsets:
    # overwrite ignores what ha-engineer.md declares and grants exactly this.
    # Same profile as the chat route above, deliberately narrower: alert triage
    # gets observability and nothing else, however the agent describes itself.
    mode: overwrite
    refs:
      - name: vm-observability
---
# Cluster Events as a signal lane. The k8s-bundle subchart renders this trio
# (adapter + source + pipeline) for you; shown here for a hand-rolled setup.
# The adapter watches core v1 Events with its OWN ServiceAccount token —
# kubernetesAccess mounts it, and the operator grants nothing, so the events
# get/list/watch Role must be bound to agentops-signal-k8s-events out of band.
apiVersion: agentops.dev/v1alpha1
kind: SignalAdapter
metadata:
  name: k8s-events
  namespace: agent-ops
spec:
  image: kmatsebora/agentops-signal-k8s-events:0.1.0
  kubernetesAccess: true
---
apiVersion: agentops.dev/v1alpha1
kind: SignalSource
metadata:
  name: cluster-events
  namespace: agent-ops
spec:
  adapter: k8s-events
  # group by the failing OBJECT, so one crash-looping pod is one conversation
  # however many times it repeats
  grouping:
    signatureLabels: ["namespace", "kind", "name"]
  config:
    # Normal events are the cluster's background hum — watching them would bury
    # real problems and burn LLM credits.
    severities: ["Warning"]
    namespaces: []            # empty = every namespace the RBAC allows
    excludeReasons: ["Unhealthy"]
---
# Without this Pipeline the source above is inert: wiring is pipeline-only, so
# an unclaimed source reports Wired=False and DROPS every event.
#
# This route also demonstrates withholding shell: `overwrite` replaces the
# profile's allowlist entirely, so conversations from cluster events can observe
# but not run Bash — while the same ha-engineer profile keeps shell everywhere
# else. Nothing about the profile changes; only this stanza. Use `merge` (the
# default) to extend instead of replace.
apiVersion: agentops.dev/v1alpha1
kind: Pipeline
metadata:
  name: cluster-events
  namespace: agent-ops
spec:
  signalSourceRefs:
    - name: cluster-events
  channelRefs:
    - name: home-ops
  profileRef:
    name: ha-engineer
  toolsets:
    refs:
      - name: agentops-observe
---
# Adapter-served signal source: opaque config interpreted only by signal-cron.
# The grouping window makes consecutive runs land in ONE conversation, later
# ticks resuming the agent session (a recurring job that remembers).
apiVersion: agentops.dev/v1alpha1
kind: SignalSource
metadata:
  name: daily-healthcheck
  namespace: agent-ops
spec:
  adapter: cron
  config:
    schedule: "0 6 * * *"
    input: "Run the daily infrastructure health check: node pressure, failed pods, storage headroom. Report only what needs attention."
    title: "🛠 Daily health check"
---
apiVersion: agentops.dev/v1alpha1
kind: Conversation
metadata:
  name: sample-task
  namespace: agent-ops
spec:
  profileRef:
    name: ha-engineer
  title: "🛠 sample validation task"
  inputs:
    - id: in-1
      type: task
      payload: "Sample task input (validation only)"
